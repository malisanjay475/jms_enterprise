# JMS Enterprise VERSION 1 — use after: git clone … && cd jms_enterprise
# Copy env.vps-v1.example → .env and adjust secrets. Same services as vps-v1-hostinger (local build).
#
#   docker compose -p jms-enterprise-v1 -f docker-compose.vps-v1-isolated.yml up -d --build
#
# App: http://YOUR_VPS_IP:9091

services:
  db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-jms_v1}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-JmsV1DbAuto9x4k2m7n1q5w8r}
      POSTGRES_DB: ${DB_NAME:-jms_v1}
      # Hardcoded IST — do NOT use ${TZ:-Asia/Kolkata}: if the VPS host has TZ=UTC set
      # (Hostinger Ubuntu default) the :- fallback is SKIPPED and the container gets UTC.
      TZ: "Asia/Kolkata"
      PGTZ: "Asia/Kolkata"
    volumes:
      - jms_v1_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [jms_v1_net]

  app:
    image: ${APP_IMAGE:-ghcr.io/malisanjay475/jms-v1-app:latest}
    platform: linux/amd64
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${V1_HTTP_PORT:-9091}:3000"
    volumes:
      - ./seed:/seed:ro
      # Persist uploaded files (machine icons, operator photos, etc.) across Docker deploys.
      # Without this volume, every deploy wipes PUBLIC/uploads/ and all icons are lost.
      - jms_v1_uploads:/app/PUBLIC/uploads
    environment:
      PORT: "3000"
      # Hardcoded IST — do NOT use ${TZ:-Asia/Kolkata}: Hostinger VPS has TZ=UTC in the
      # host environment so the :- fallback is skipped and the container would get UTC.
      TZ: "Asia/Kolkata"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-jms_v1}
      DB_PASSWORD: ${DB_PASSWORD:-JmsV1DbAuto9x4k2m7n1q5w8r}
      DB_NAME: ${DB_NAME:-jms_v1}
      AUTO_IMPORT_DB_PATH: ${AUTO_IMPORT_DB_PATH:-}
      AUTO_IMPORT_DB_FORCE: ${AUTO_IMPORT_DB_FORCE:-0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_GIT_SHA: ${APP_GIT_SHA:-}
      APP_BUILD_DATE: ${APP_BUILD_DATE:-}
      SERVER_TYPE: ${SERVER_TYPE:-MAIN}
      MAIN_SERVER_URL: ${MAIN_SERVER_URL:-}
      LOCAL_FACTORY_ID: ${LOCAL_FACTORY_ID:-}
      SYNC_API_KEY: ${SYNC_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      LOCAL_SERVER_AGENT_ENABLED: ${LOCAL_SERVER_AGENT_ENABLED:-}
      LOCAL_SERVER_NODE_ID: ${LOCAL_SERVER_NODE_ID:-}
      LOCAL_SERVER_NODE_KEY: ${LOCAL_SERVER_NODE_KEY:-}
      LOCAL_SERVER_PUBLIC_IP: ${LOCAL_SERVER_PUBLIC_IP:-}
      LOCAL_SERVER_HEARTBEAT_INTERVAL_MS: ${LOCAL_SERVER_HEARTBEAT_INTERVAL_MS:-}
      NODE_ENV: production
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks: [jms_v1_net]
    # Routing for the host-level Traefik reverse proxy (project traefik-nru0).
    # Traefik runs with providers.docker + exposedbydefault=false, so the app is
    # only routed when it carries these labels. They MUST live here: every deploy
    # runs `git pull` + `docker compose up`, which recreates the container — any
    # labels added manually on the VPS are lost and the site 404s. Keep them in-repo.
    labels:
      - "traefik.enable=true"
      # Apex router — serves the app.
      - "traefik.http.routers.jms.rule=Host(`jmsocean.cloud`)"
      - "traefik.http.routers.jms.entrypoints=websecure"
      - "traefik.http.routers.jms.tls.certresolver=letsencrypt"
      - "traefik.http.services.jms.loadbalancer.server.port=3000"
      # www router — 301-redirects to the bare apex (canonical host).
      # $$ escapes docker-compose interpolation so Traefik receives a literal ${1}.
      - "traefik.http.routers.jms-www.rule=Host(`www.jmsocean.cloud`)"
      - "traefik.http.routers.jms-www.entrypoints=websecure"
      - "traefik.http.routers.jms-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.jms-www.service=jms"
      - "traefik.http.routers.jms-www.middlewares=jms-wwwtoapex"
      - "traefik.http.middlewares.jms-wwwtoapex.redirectregex.regex=^https?://www\\.jmsocean\\.cloud/(.*)"
      - "traefik.http.middlewares.jms-wwwtoapex.redirectregex.replacement=https://jmsocean.cloud/$${1}"
      - "traefik.http.middlewares.jms-wwwtoapex.redirectregex.permanent=true"

networks:
  jms_v1_net:

volumes:
  jms_v1_pg_data:
  jms_v1_uploads:
