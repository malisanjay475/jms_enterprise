name: JMS Quality (advisory)

# Advisory code-quality checks: Prettier formatting + ESLint on the modular backend.
# Intentionally NON-BLOCKING (continue-on-error) so it never blocks a merge while the
# team adopts the tooling. Promote to a required check once the codebase is clean.
# See docs/FOLDER_STRUCTURE.md and docs/CODE_REVIEW_GUIDELINES.md.

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: format-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Prettier (check only)
        continue-on-error: true
        run: npx --yes prettier@3 --check "**/*.{js,json,md,yml,yaml}"

      - name: ESLint (advisory, scoped to BACKEND/src + tests)
        continue-on-error: true
        run: npx --yes eslint@9 .
