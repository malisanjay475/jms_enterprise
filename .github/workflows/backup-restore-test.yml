name: Backup Restore Test

# Monthly (+ manual) proof that the latest backups are actually restorable.
# Runs on the VPS over SSH: restores the newest 30-min and 6-hourly dumps into
# THROWAWAY postgres containers, fails on any restore error or if tables/rows do not
# match production (read-only), then tears them down. Never writes to prod.
# Emails joyo44064@gmail.com if verification fails (when MAIL_* secrets are set).
#
# Cron UTC 03:30 on the 1st = 09:00 IST on the 1st of each month.
on:
  schedule:
    - cron: '30 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jms-backup-restore-test
  cancel-in-progress: false

jobs:
  restore-test:
    runs-on: ubuntu-latest
    # No `environment: production`: that environment needs a manual approval, so the
    # 1-Sep-2026 scheduled run sat in "waiting" for weeks and never tested anything.
    # The SSH secrets it uses are repository secrets. This job only restores into a
    # throwaway container and reads production — it never deploys or writes.
    env:
      HAS_MAIL: ${{ secrets.ALERT_EMAIL_PASSWORD != '' }}
    steps:
      - name: Verify SSH secrets
        shell: bash
        env:
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          KEY:  ${{ secrets.HOSTINGER_SSH_KEY }}
          DPATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ] || [ -z "$DPATH" ]; then
            echo "::error::Missing SSH secrets (HOSTINGER_SSH_HOST/USER/KEY, VPS_DEPLOY_PATH)."
            exit 1
          fi

      - name: Verify latest backup is restorable (on VPS, throwaway container)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          passphrase: ${{ secrets.HOSTINGER_SSH_KEY_PASSPHRASE }}
          port: 22
          command_timeout: 20m
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -eo pipefail
            # The deploy checkout is kept at the released main by every production
            # deploy (the repo is private, so an unauthenticated pull here would fail).
            cd "$DEPLOY_PATH"
            BACKUP_ROOT=/opt/jms-backups bash scripts/verify-backup-restore.sh

      - name: Email alert on failure
        if: failure() && env.HAS_MAIL == 'true'
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.ALERT_EMAIL_USER }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          subject: "🔴 JMS BACKUP RESTORE TEST FAILED — backups may be unusable"
          to: joyo44064@gmail.com
          from: JMS Backup Bot <${{ secrets.ALERT_EMAIL_USER }}>
          body: |
            The monthly JMS backup RESTORE TEST FAILED.

            This means the latest backup could NOT be restored into a clean
            database — your backups may be incomplete or corrupt.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ACTION: open the run, read the logs, and fix the backup pipeline
            BEFORE you ever need to rely on a restore.
