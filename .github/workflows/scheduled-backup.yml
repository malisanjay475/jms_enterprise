name: Scheduled Database & Offsite Backup

# Every 6 hours + manual. Runs the backup ENTIRELY on the VPS over SSH:
#   1. pg_dump the database  2. archive the uploads volume
#   3. rotate old local copies  4. rclone upload to Google Drive (if configured)
# All steps run where the files actually live (the VPS) — a GitHub runner
# cannot see the VPS filesystem, so the upload must happen on the VPS.
# Emails joyo44064@gmail.com if the backup fails (when MAIL_* secrets are set).
#
# Cron UTC 00:30/06:30/12:30/18:30 = 06:00/12:00/18:00/00:00 IST.
on:
  schedule:
    - cron: '30 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Renamed from `jms-scheduled-backup` (v2): the old group got into a stuck
  # state where every run sat in `pending` with no job assigned and never
  # released the slot, so no backup completed. A fresh group name forces a
  # clean concurrency slot. cancel-in-progress:false keeps overlapping SSH
  # backups from running at once.
  group: jms-scheduled-backup-v2
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    # NOTE: Intentionally NOT gated behind the `production` environment.
    # That environment has a required-reviewer approval rule, which made every
    # scheduled/manual backup stall in `pending` awaiting a human click and then
    # get cancelled by the next run — so unattended backups never actually ran.
    # A read-only pg_dump does not need a deployment-approval gate. All SSH/VPS
    # secrets used here are repo-level, so they still resolve without the env.
    env:
      HAS_MAIL: ${{ secrets.MAIL_PASSWORD != '' }}
    steps:
      - name: Verify SSH secrets
        shell: bash
        env:
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          KEY:  ${{ secrets.HOSTINGER_SSH_KEY }}
          DPATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ] || [ -z "$DPATH" ]; then
            echo "::error::Missing SSH secrets (HOSTINGER_SSH_HOST/USER/KEY, VPS_DEPLOY_PATH)."
            exit 1
          fi

      - name: Run backup on VPS (dump + archive + rotate + rclone to Drive)
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          passphrase: ${{ secrets.HOSTINGER_SSH_KEY_PASSPHRASE }}
          port: 22
          command_timeout: 20m
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -eo pipefail
            cd "$DEPLOY_PATH"
            # Pull the latest backup script, then run it. The script does:
            # pg_dump + uploads tar + rotation + (best-effort) rclone to Google Drive.
            git fetch --prune origin >/dev/null 2>&1 || true
            git checkout main >/dev/null 2>&1 || true
            git pull --ff-only origin main >/dev/null 2>&1 || true
            chmod +x scripts/vps-backup-to-cloud.sh
            BACKUP_ROOT=/opt/jms-backups bash scripts/vps-backup-to-cloud.sh

      - name: Email alert on failure
        if: failure() && env.HAS_MAIL == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🔴 JMS BACKUP FAILED — action required"
          to: joyo44064@gmail.com
          from: JMS Backup Bot <${{ secrets.MAIL_USERNAME }}>
          body: |
            The scheduled JMS database backup FAILED.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ACTION: open the run, read the logs, fix the cause.
            Until fixed you have NO fresh offsite backup.
