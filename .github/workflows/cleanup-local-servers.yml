name: One-off — Clean up stale local_servers rows

# MANUAL ONLY. Removes stale/duplicate local_servers registrations on MAIN,
# keeping ONLY servers that pushed within the last 24h (your live server).
# Prints the table before and after so the change is auditable.
#
# Safe: local_servers is not referenced by other tables, so deleting stale
# rows only removes dead heartbeat records — it does not touch any sync data.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect, delete stale rows, re-inspect (on VPS db container)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          passphrase: ${{ secrets.HOSTINGER_SSH_KEY_PASSPHRASE }}
          port: 22
          command_timeout: 5m
          script: |
            set -eo pipefail
            DB="$(docker ps --format '{{.Names}}' | grep -E 'jms-enterprise-v1-db' | head -1)"
            if [ -z "$DB" ]; then echo "::error::db container not found"; exit 1; fi
            run_sql() {
              docker exec "$DB" sh -eu -c "export PGPASSWORD=\"\$POSTGRES_PASSWORD\"; psql -U \"\$POSTGRES_USER\" -d \"\${POSTGRES_DB:-\$POSTGRES_USER}\" -P pager=off -c \"$1\""
            }

            echo "=================== BEFORE ==================="
            run_sql "SELECT id, node_name, status, last_push_at, last_heartbeat_at FROM local_servers ORDER BY id;"

            echo "=================== ROWS THAT WILL BE DELETED (no push in last 24h) ==================="
            run_sql "SELECT id, node_name, status, last_push_at FROM local_servers WHERE last_push_at IS NULL OR last_push_at < NOW() - INTERVAL '24 hours' ORDER BY id;"

            echo "=================== DELETING ==================="
            run_sql "DELETE FROM local_servers WHERE last_push_at IS NULL OR last_push_at < NOW() - INTERVAL '24 hours';"

            echo "=================== AFTER ==================="
            run_sql "SELECT id, node_name, status, last_push_at, last_heartbeat_at FROM local_servers ORDER BY id;"

            echo "Done. Only servers that pushed within the last 24h remain."
