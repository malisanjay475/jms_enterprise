name: Build QC Android APK

# Builds the native QC Supervisor app and publishes an installable debug APK
# as a downloadable artifact. Trigger it from the Actions tab (Run workflow)
# or on any push that touches android_qc/.
on:
  workflow_dispatch:
  push:
    paths:
      - "android_qc/**"
      - ".github/workflows/android-qc-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_qc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jms-qc-debug-apk
          path: android_qc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
