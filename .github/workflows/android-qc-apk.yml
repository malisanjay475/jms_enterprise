name: Build QC Android APK

# Builds the native QC Supervisor app. On every push/dispatch it produces a
# downloadable debug APK artifact. When the RELEASE signing secrets are set it
# also builds a signed release APK, and on push to `main` it AUTO-PUBLISHES that
# release APK to the MAIN server's update feed (/api/qc-app/publish) — from which
# every LOCAL factory server syncs it and all phones auto-update. No manual step.
on:
  workflow_dispatch:
  push:
    paths:
      - "android_qc/**"
      - ".github/workflows/android-qc-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # secrets can't be used in `if:` directly — surface presence as env flags.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      HAS_PUBLISH: ${{ secrets.QC_PUBLISH_USER != '' && secrets.QC_PUBLISH_PASS != '' }}
      # Auto versionCode: always increases with the run number, stays above the
      # local fallback of 100, so every merged build is newer → phones auto-update.
      APP_VERSION_CODE: ${{ 1000 + github.run_number }}
    defaults:
      run:
        working-directory: android_qc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jms-qc-debug-apk
          path: android_qc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ── Signed release build — only when the keystore secret is configured ──
      # Add repo secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      - name: Decode keystore
        id: keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jms-qc-release.jks"
          echo "path=$RUNNER_TEMP/jms-qc-release.jks" >> "$GITHUB_OUTPUT"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jms-qc-release-apk
          path: android_qc/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # ── Auto-publish to the fleet — only on push to main, with a signed
      #    release APK and publish credentials present. Reads versionCode /
      #    versionName from build.gradle so the feed always matches the APK.
      - name: Auto-publish release to MAIN feed
        if: ${{ github.ref == 'refs/heads/main' && env.HAS_KEYSTORE == 'true' && env.HAS_PUBLISH == 'true' }}
        run: |
          # versionCode is the CI-computed APP_VERSION_CODE (matches the built APK,
          # not the build.gradle fallback); versionName is the human label from gradle.
          VC=$APP_VERSION_CODE
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          APK=app/build/outputs/apk/release/app-release.apk
          echo "Publishing versionCode=$VC versionName=$VN"
          curl -fsS -X POST "$PUBLISH_URL/api/qc-app/publish" \
            -F "username=$QC_PUBLISH_USER" \
            -F "password=$QC_PUBLISH_PASS" \
            -F "versionCode=$VC" \
            -F "versionName=$VN" \
            -F "notes=Auto-published from CI (${GITHUB_SHA:0:7})" \
            -F "apk=@$APK"
        env:
          PUBLISH_URL: https://jmsocean.cloud
          QC_PUBLISH_USER: ${{ secrets.QC_PUBLISH_USER }}
          QC_PUBLISH_PASS: ${{ secrets.QC_PUBLISH_PASS }}
