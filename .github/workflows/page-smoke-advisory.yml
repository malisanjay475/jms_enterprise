name: JMS Page smoke (advisory)

# Opens PUBLIC/*.html against a booted backend (logged-out). LOGIN is expected;
# FAIL (JS parse errors, 4xx/5xx same-origin) fails the job but continue-on-error
# keeps it non-blocking until the suite is trusted. See BACKEND/scripts/smoke-pages.js.

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'BACKEND/PUBLIC/**'
      - 'BACKEND/scripts/smoke-pages.js'
      - '.github/workflows/page-smoke-advisory.yml'

permissions:
  contents: read

concurrency:
  group: page-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  page_smoke:
    name: smoke-pages
    # Pin 24.04: playwright-core 1.55 has no browser builds for ubuntu26.04 runners.
    runs-on: ubuntu-24.04
    continue-on-error: true
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jpsms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jpsms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: BACKEND/package-lock.json

      - name: Install backend, Playwright, boot, and smoke pages
        working-directory: BACKEND
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: jpsms
          SERVER_TYPE: STANDALONE
          LOCAL_FACTORY_ID: "1"
          SYNC_API_KEY: pr-ci
          GEMINI_API_KEY: dummy-key
          # Keep browser binaries next to the checkout so launch always finds them.
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/BACKEND/.pw-browsers
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save playwright-core@1.55.0
          PW_CORE="$(node -p "require('path').join(process.cwd(),'node_modules','playwright-core')")"
          test -d "$PW_CORE"
          export PLAYWRIGHT_CORE_PATH="$PW_CORE"
          export NODE_PATH="$(pwd)/node_modules${NODE_PATH:+:$NODE_PATH}"
          npx playwright-core install --with-deps chromium
          node -e "const p=require('playwright-core'); console.log('playwright-core ok', require.resolve('playwright-core'));"

          umask 022
          cat > .env <<'EOF'
          GEMINI_API_KEY=dummy-key
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_NAME=jpsms
          SERVER_TYPE=STANDALONE
          LOCAL_FACTORY_ID=1
          SYNC_API_KEY=pr-ci
          EOF
          sed -i 's/^[[:space:]]\+//' .env

          node scripts/wait-for-postgres.js
          node scripts/auto-import-db-if-needed.js

          node server.js > server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            echo "::group::server.log (tail)"
            tail -n 80 server.log || true
            echo "::endgroup::"
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "Waiting for /health…"
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then
              echo "healthy after ${i} attempt(s)"
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "server exited early" >&2
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/health
          echo

          echo "Probing chromium.launch…"
          node -e "
            const pw = require(process.env.PLAYWRIGHT_CORE_PATH || 'playwright-core');
            pw.chromium.launch({ headless: true }).then(async (b) => {
              console.log('chromium launch ok');
              await b.close();
            }).catch((err) => { console.error(err); process.exit(2); });
          "

          echo "Running page smoke…"
          # Logged-out: LOGIN is fine; FAIL (broken JS / same-origin 4xx-5xx) is the signal.
          set +e
          node scripts/smoke-pages.js --base http://127.0.0.1:3000 --only login,dpr,planning,supervisor,masters,npd,purchase_vendors,raw_material_jobwise,barcode_printer,dpr_daily_report,job_summary
          SMOKE_EC=$?
          set -e
          echo "smoke exit code: ${SMOKE_EC}"
          exit "${SMOKE_EC}"

      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: page-smoke-logs
          path: BACKEND/server.log
