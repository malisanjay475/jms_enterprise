name: Hourly Sync Health Check

# Every 2 hours, checks whether any LOCAL factory server has stopped pushing
# to MAIN within the staleness threshold (2h). Emails joyo44064@gmail.com when
# sync is stale — so a silently-stuck sync is caught in hours, not days.
#
# HOW: MAIN's app port is firewalled from the public internet, so we do NOT
# call it over a public URL. Instead we SSH into the VPS (same secrets the
# backup/deploy use) and query /api/sync-alert from inside the app container.
# This is firewall-proof and never depends on DNS / other sites.
#
# The remote script always exits 0 and prints machine-readable STATUS/RESP lines;
# a local "Evaluate" step parses them (capture_stdout), fails the job when
# sync is stale or MAIN is down, and builds a per-server detail block that
# goes into the alert email subject + body — so the email names the exact
# factory servers that are stale and for how long, without opening the logs.
#
# That contract only holds once SSH has CONNECTED. If the runner cannot open
# port 22 the action exits non-zero before the script runs, so both SSH steps
# are continue-on-error and Evaluate checks their outcome first: a connection
# failure is reported as "sync NOT checked", never as a stale factory sync.
# It matters — this monitor spent 11+ days red on dial timeouts while telling
# the owner to go restart a factory server that was never the problem.
#
# NOTE: v1.2.5 is required for capture_stdout / outputs.stdout — v1.0.3 (used by
# the other SSH workflows here) has no outputs section at all, so downgrading to
# match them would silently break the Evaluate step.
#
# /api/sync-alert reads the local_servers heartbeat recorded on MAIN — the
# correct "has the factory LOCAL server stopped pushing?" signal.
#
# Required repo secrets:
#   HOSTINGER_SSH_HOST / HOSTINGER_SSH_USER / HOSTINGER_SSH_KEY  (already used by deploy)
#   SYNC_API_KEY                          guards /api/sync-alert
#   ALERT_EMAIL_USER / ALERT_EMAIL_PASSWORD   Gmail + app password for alerts
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jms-sync-health
  cancel-in-progress: true

jobs:
  check-sync:
    runs-on: ubuntu-latest
    env:
      HAS_KEY:  ${{ secrets.SYNC_API_KEY != '' }}
      HAS_MAIL: ${{ secrets.ALERT_EMAIL_PASSWORD != '' }}
    steps:
      - name: Skip if not configured
        if: env.HAS_KEY != 'true'
        run: echo "::warning::SYNC_API_KEY not set — skipping sync health check."

      # The remote script lives in .github/scripts/sync-health-query.sh so the
      # attempt and the retry below share one copy and cannot drift apart.
      #
      # continue-on-error is essential: if SSH cannot CONNECT, the action exits
      # non-zero before the script runs, so the "always exit 0" contract inside
      # the script cannot help. Without this the job aborted here and the email
      # went out with no detail at all, blaming a stale factory sync for what
      # was really a connectivity fault.
      #
      # timeout is the TCP dial timeout (default 30s). Every observed failure was
      # "dial tcp ...:22: i/o timeout" at exactly 30s, so give the handshake room.
      - name: Query sync health on the VPS (SSH + docker exec)
        id: query
        if: env.HAS_KEY == 'true'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.5
        env:
          SYNC_API_KEY: ${{ secrets.SYNC_API_KEY }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          passphrase: ${{ secrets.HOSTINGER_SSH_KEY_PASSPHRASE }}
          port: 22
          timeout: 60s
          command_timeout: 5m
          envs: SYNC_API_KEY
          capture_stdout: true
          script_path: .github/scripts/sync-health-query.sh

      # One retry, because the VPS intermittently refuses the runner's dial —
      # production deploys have needed a second attempt for the same reason.
      # A single retry keeps a blip from paging someone at 2am.
      - name: Retry query if the first SSH attempt could not connect
        id: query_retry
        if: env.HAS_KEY == 'true' && steps.query.outcome != 'success'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.5
        env:
          SYNC_API_KEY: ${{ secrets.SYNC_API_KEY }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          passphrase: ${{ secrets.HOSTINGER_SSH_KEY_PASSPHRASE }}
          port: 22
          timeout: 60s
          command_timeout: 5m
          envs: SYNC_API_KEY
          capture_stdout: true
          script_path: .github/scripts/sync-health-query.sh

      - name: Evaluate sync health
        id: eval
        if: env.HAS_KEY == 'true'
        env:
          QUERY_STDOUT: ${{ steps.query.outputs.stdout || steps.query_retry.outputs.stdout }}
          QUERY_OUTCOME: ${{ steps.query.outcome }}
          RETRY_OUTCOME: ${{ steps.query_retry.outcome }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const lines = (process.env.QUERY_STDOUT || '').split('\n');
          const val = (k) => {
            const l = lines.find(l => l.startsWith(k + '='));
            return l ? l.slice(k.length + 1).trim() : '';
          };
          const out = (k, v) => fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `${k}<<__EOF__\n${v}\n__EOF__\n`);
          const fail = (subject, detail) => {
            out('subject', subject);
            out('detail', detail);
            console.error(`::error::${subject}\n${detail}`);
            process.exit(1);
          };
          const age = (min) => {
            if (min == null) return 'never';
            const d = Math.floor(min / 1440), h = Math.floor((min % 1440) / 60);
            return d > 0 ? `${d}d ${h}h ago` : h > 0 ? `${h}h ${min % 60}m ago` : `${min}m ago`;
          };

          // Could we even reach the VPS? If not, sync was never checked — say so
          // plainly rather than reporting it as a sync problem. Getting this wrong
          // sent people to the factory server to fix a connectivity fault.
          const reached = process.env.QUERY_OUTCOME === 'success'
                       || process.env.RETRY_OUTCOME === 'success';
          if (!reached) {
            fail('cannot reach the VPS over SSH — sync NOT checked',
                 'Both SSH attempts failed to connect to the VPS, so the sync status was\n' +
                 'never read. This does NOT mean a factory server stopped syncing — it means\n' +
                 'the monitor could not run. Sync may be perfectly healthy.\n\n' +
                 'Usually "dial tcp <host>:22: i/o timeout" — the GitHub runner could not\n' +
                 'open port 22 on the VPS. Check the VPS is up and reachable on SSH, and\n' +
                 'that no firewall / fail2ban rule is blocking GitHub Actions IP ranges.');
          }

          const status = val('STATUS');
          if (status !== 'RESPONDED') {
            fail('MAIN app is DOWN or unreachable',
                 val('DETAIL') || 'SSH connected but produced no STATUS line — check the run logs.');
          }
          let resp;
          try { resp = JSON.parse(val('RESP')); }
          catch { fail('sync-alert returned invalid JSON', val('RESP').slice(0, 500)); }
          if (resp.error) {
            fail('sync-alert returned an error (bad SYNC_API_KEY or DB issue)', resp.error);
          }
          const fmt = (s) =>
            `  - ${s.node_name} (factory ${s.factory_id}): ` +
            `last push ${age(s.push_age_minutes)}, last heartbeat ${age(s.heartbeat_age_minutes)}`;
          if (!resp.ok) {
            const names = resp.stale.map(s => s.node_name).join(', ');
            fail(`sync STALE: ${names}`,
                 `Stale LOCAL servers (threshold ${resp.threshold_minutes} min):\n` +
                 resp.stale.map(fmt).join('\n') +
                 `\n\nAll servers checked (${resp.checked}):\n` +
                 resp.servers.map(fmt).join('\n'));
          }
          console.log(`Sync healthy — ${resp.checked} server(s) checked:`);
          console.log(resp.servers.map(fmt).join('\n'));
          EOF

      - name: Send alert email
        if: failure() && env.HAS_KEY == 'true' && env.HAS_MAIL == 'true'
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.ALERT_EMAIL_USER }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          subject: "🟠 JMS SYNC ALERT — ${{ steps.eval.outputs.subject || 'sync stale or MAIN unreachable' }}"
          to: joyo44064@gmail.com
          from: JMS System Health Monitor <${{ secrets.ALERT_EMAIL_USER }}>
          body: |
            The 2-hourly JMS sync health check FAILED.

            ${{ steps.eval.outputs.subject || 'No summary available — see run logs.' }}

            ${{ steps.eval.outputs.detail || '' }}

            Run (full logs): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ACTION:
            - Stale sync    -> check that factory's LOCAL server is online and its
                              sync agent is running (LOCAL_SERVER_AGENT_ENABLED
                              must not be 0 in BACKEND/.env); then run
                              force-full-push from the LOCAL app.
            - App down      -> check the VPS / Docker container is running.
            - Cannot reach  -> the monitor never ran, so sync status is UNKNOWN and
              the VPS         may well be fine. Check the VPS is up and accepting
                              SSH on port 22, and that no firewall / fail2ban rule
                              is blocking GitHub Actions IP ranges. Do NOT go
                              looking at the factory LOCAL server for this one.
