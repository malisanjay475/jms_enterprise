name: Build Desktop Installer

on:
  push:
    branches: [main]
    paths:
      - 'DESKTOP_APP/**'
      - 'BACKEND/**'
      - '.github/workflows/build-desktop-installer.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.2.0) — leave blank to use package.json'
        required: false

# Least privilege: checkout, build and artifacts only; electron-builder has
# "publish": null, so the token never writes releases.
permissions:
  contents: read

concurrency:
  group: build-desktop-installer
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ env.VERSION }}
      installer_name: ${{ env.INSTALLER_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: DESKTOP_APP/package.json

      - name: Bump version if input provided
        if: github.event.inputs.version != ''
        working-directory: DESKTOP_APP
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $pkg.version = "${{ github.event.inputs.version }}"
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json
          echo "VERSION=${{ github.event.inputs.version }}" >> $env:GITHUB_ENV

      - name: Read version
        if: github.event.inputs.version == ''
        working-directory: DESKTOP_APP
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          echo "VERSION=$v" >> $env:GITHUB_ENV

      - name: Install DESKTOP_APP dependencies
        working-directory: DESKTOP_APP
        run: npm install --prefer-offline

      - name: Generate icons
        working-directory: DESKTOP_APP
        run: node scripts/generate-icons.js

      - name: Build Windows installer
        working-directory: DESKTOP_APP
        run: npm run build:ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename installer with version
        working-directory: DESKTOP_APP
        shell: pwsh
        run: |
          $src = Get-ChildItem dist\*.exe | Select-Object -First 1
          if ($src) {
            $dest = "dist\JMS-Local-Server-Setup-v${{ env.VERSION }}.exe"
            Move-Item $src.FullName $dest -Force
            echo "INSTALLER_PATH=$dest" >> $env:GITHUB_ENV
            echo "INSTALLER_NAME=JMS-Local-Server-Setup-v${{ env.VERSION }}.exe" >> $env:GITHUB_ENV
          } else {
            echo "No .exe found in dist/"
            exit 1
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: JMS-Local-Server-Setup-v${{ env.VERSION }}
          path: DESKTOP_APP/dist/*.exe
          retention-days: 30

  deploy-to-vps:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: success()

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: JMS-Local-Server-Setup-v${{ needs.build.outputs.version }}
          path: ./installer

      - name: Copy installer to VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          passphrase: ${{ secrets.HOSTINGER_SSH_KEY_PASSPHRASE }}
          port: 22
          source: installer/*.exe
          target: /var/jms-downloads/
          strip_components: 1
        continue-on-error: true

      - name: Write version metadata on VPS
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          passphrase: ${{ secrets.HOSTINGER_SSH_KEY_PASSPHRASE }}
          port: 22
          envs: VERSION,INSTALLER_NAME
          script: |
            mkdir -p /var/jms-downloads
            echo "$VERSION" > /var/jms-downloads/latest-version.txt
            echo "$INSTALLER_NAME" > /var/jms-downloads/latest-filename.txt
        env:
          VERSION: ${{ needs.build.outputs.version }}
          INSTALLER_NAME: ${{ needs.build.outputs.installer_name }}
        continue-on-error: true
