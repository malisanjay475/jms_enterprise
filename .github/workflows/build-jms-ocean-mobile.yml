name: Build JMS Ocean Mobile (APK & AAB for Play Store)

on:
  workflow_dispatch:
  push:
    branches: [develop, main, 'feat/**', 'feature/**', 'fix/**']
    paths:
      - 'MOBILE_APP/**'
      - '.github/workflows/build-jms-ocean-mobile.yml'

permissions:
  contents: read

jobs:
  build-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MOBILE_APP
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK (For direct phone testing)
        working-directory: MOBILE_APP/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release AAB (Android App Bundle for Google Play Store)
        working-directory: MOBILE_APP/android
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jms-ocean-debug-apk
          path: MOBILE_APP/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release AAB Artifact (Play Store Bundle)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jms-ocean-playstore-aab
          path: MOBILE_APP/android/app/build/outputs/bundle/release/app-release.aab
