name: Build JMS Ocean Mobile (APK & AAB for Play Store)

on:
  workflow_dispatch:
  push:
    branches: [develop, main, 'feat/**', 'feature/**', 'fix/**']
    paths:
      - 'MOBILE_APP/**'
      - '.github/workflows/build-jms-ocean-mobile.yml'

permissions:
  contents: read

jobs:
  build-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MOBILE_APP
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK (For direct phone testing)
        working-directory: MOBILE_APP/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release AAB (Android App Bundle for Google Play Store)
        working-directory: MOBILE_APP/android
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jms-ocean-debug-apk
          path: MOBILE_APP/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release AAB Artifact (Play Store Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: jms-ocean-playstore-aab
          path: MOBILE_APP/android/app/build/outputs/bundle/release/app-release.aab
