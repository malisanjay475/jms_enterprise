name: Build JMS Chat Android APK

# Builds the native JMS Chat app (android_chat/). Every push/dispatch produces a
# downloadable debug APK. With the RELEASE signing secrets set it also builds a signed
# release APK, and on push to `main` it auto-publishes it to the MAIN server's feed
# (/api/qc-app/publish with app=chat → /qc-app/chat/), so the phones auto-update.
# Same secrets as the QC and Shifting apps, plus the Firebase app ids for push
# (FCM_APP_ID, FCM_API_KEY, FCM_PROJECT_ID, FCM_SENDER_ID; empty = no push).
on:
  workflow_dispatch:
  push:
    paths:
      - "android_chat/**"
      - ".github/workflows/android-chat-apk.yml"
  pull_request:
    paths:
      - "android_chat/**"
      - ".github/workflows/android-chat-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      HAS_PUBLISH: ${{ secrets.QC_PUBLISH_USER != '' && secrets.QC_PUBLISH_PASS != '' }}
      FCM_APP_ID: ${{ secrets.FCM_APP_ID }}
      FCM_API_KEY: ${{ secrets.FCM_API_KEY }}
      FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
      FCM_SENDER_ID: ${{ secrets.FCM_SENDER_ID }}
    defaults:
      run:
        working-directory: android_chat

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "8.9"

      # versionCode = 1000 + run number: always increasing, so phones auto-update.
      - name: Compute versionCode
        run: echo "APP_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jms-chat-debug-apk
          path: android_chat/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Decode keystore
        id: keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jms-release.jks"
          echo "path=$RUNNER_TEMP/jms-release.jks" >> "$GITHUB_OUTPUT"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jms-chat-release-apk
          path: android_chat/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # A release that changes the backend and this app together deploys both at once.
      # Servers older than 1.134.0 have no app=chat feed (they would reject it), and the
      # app needs that version's endpoints (Bearer chat sign-in, FCM register), so wait
      # (up to 25 min) until MAIN runs a version that has them.
      - name: Wait for MAIN to support the Chat feed
        if: ${{ github.ref == 'refs/heads/main' && env.HAS_KEYSTORE == 'true' && env.HAS_PUBLISH == 'true' }}
        run: |
          MIN=1.134.0
          for i in $(seq 1 50); do
            V=$(curl -fsS "$PUBLISH_URL/api/version" | grep -oP '"version"\s*:\s*"\K[0-9.]+' || true)
            if [ -n "$V" ] && [ "$(printf '%s\n%s\n' "$MIN" "$V" | sort -V | head -1)" = "$MIN" ]; then
              echo "MAIN is on $V (>= $MIN)"; exit 0
            fi
            echo "MAIN is on '${V:-unknown}', waiting for >= $MIN ($i/50)"; sleep 30
          done
          echo "::error::MAIN never reached $MIN; not publishing (the chat feed is missing)"; exit 1
        env:
          PUBLISH_URL: https://jmsocean.cloud

      - name: Auto-publish release to MAIN feed
        if: ${{ github.ref == 'refs/heads/main' && env.HAS_KEYSTORE == 'true' && env.HAS_PUBLISH == 'true' }}
        run: |
          VC=$APP_VERSION_CODE
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          APK=app/build/outputs/apk/release/app-release.apk
          echo "Publishing Chat versionCode=$VC versionName=$VN"
          curl -fsS -X POST "$PUBLISH_URL/api/qc-app/publish" \
            -F "app=chat" \
            -F "username=$QC_PUBLISH_USER" \
            -F "password=$QC_PUBLISH_PASS" \
            -F "versionCode=$VC" \
            -F "versionName=$VN" \
            -F "notes=Auto-published from CI (${GITHUB_SHA:0:7})" \
            -F "apk=@$APK"
        env:
          PUBLISH_URL: https://jmsocean.cloud
          QC_PUBLISH_USER: ${{ secrets.QC_PUBLISH_USER }}
          QC_PUBLISH_PASS: ${{ secrets.QC_PUBLISH_PASS }}
