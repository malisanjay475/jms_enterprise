version: 2
updates:
  - package-ecosystem: npm
    directory: /BACKEND
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Asia/Kolkata"
    labels:
      - dependencies
