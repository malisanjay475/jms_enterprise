<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMS OCEAN - FPA</title>
    <link rel="stylesheet" href="/assets/app.css?v=12">
    <link rel="stylesheet" href="/assets/bootstrap-icons.min.css">
    <style>
        .fpa-toolbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
        .fpa-stats { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
        .fpa-stat { border:1px solid #e2e8f0; border-radius:10px; padding:10px 16px; background:#fff; min-width:120px; }
        .fpa-stat .n { font-size:1.4rem; font-weight:800; line-height:1; }
        .fpa-stat .l { font-size:11px; color:#6b7280; margin-top:4px; text-transform:uppercase; letter-spacing:.03em; }
        .s-pending .n { color:#b45309; } .s-approved .n { color:#047857; } .s-rejected .n { color:#b91c1c; }
        .fpa-card { border:1px solid #e2e8f0; border-left:4px solid #94a3b8; border-radius:10px; padding:14px 16px; background:#fff; margin-bottom:12px; }
        .fpa-card.st-Pending  { border-left-color:#f59e0b; }
        .fpa-card.st-Approved { border-left-color:#10b981; }
        .fpa-card.st-Rejected { border-left-color:#ef4444; }
        .fpa-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
        .fpa-title { font-weight:800; font-size:14px; color:#0f172a; }
        .fpa-meta { font-size:12px; color:#6b7280; margin-top:6px; display:flex; gap:14px; flex-wrap:wrap; }
        .badge { border-radius:999px; padding:3px 12px; font-size:11px; font-weight:700; white-space:nowrap; }
        .b-Pending  { background:#fffbeb; color:#b45309; border:1px solid #fcd34d; }
        .b-Approved { background:#ecfdf5; color:#047857; border:1px solid #6ee7b7; }
        .b-Rejected { background:#fef2f2; color:#b91c1c; border:1px solid #fca5a5; }
        .fpa-imgs { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
        .fpa-imgs a { display:block; }
        .fpa-imgs img { width:78px; height:78px; object-fit:cover; border-radius:8px; border:1px solid #e2e8f0; }
        .fpa-reject { margin-top:10px; background:#fef2f2; border:1px solid #fecaca; color:#991b1b; border-radius:8px; padding:8px 12px; font-size:13px; }
        .fpa-actions { display:flex; gap:8px; margin-top:12px; }
        .empty { color:var(--text-muted); padding:24px; text-align:center; }
        .fpa-lbl { font-size:13px; font-weight:600; color:var(--text-muted); }
        .fpa-search { position:relative; flex:1 1 240px; max-width:360px; }
        .fpa-search i { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:#94a3b8; pointer-events:none; }
        .fpa-search input { width:100%; padding-left:32px; }
        .fpa-quick { display:flex; gap:6px; }
        .fpa-quick button { border:1px solid #e2e8f0; background:#fff; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:600; color:#475569; cursor:pointer; }
        .fpa-quick button:hover { border-color:#94a3b8; }
        .fpa-tabs { display:flex; gap:6px; margin-bottom:14px; border-bottom:1px solid #e2e8f0; }
        .fpa-tab { border:none; background:none; padding:8px 14px; font-weight:700; font-size:13px; color:#64748b; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
        .fpa-tab.active { color:#0f172a; border-bottom-color:#2563eb; }
        .fpa-hist { margin-top:10px; font-size:12px; }
        .fpa-hist summary { cursor:pointer; font-weight:700; color:#475569; }
        .fpa-hist ol { list-style:none; margin:8px 0 0; padding:0 0 0 14px; border-left:2px solid #e2e8f0; }
        .fpa-hist li { position:relative; padding:4px 0 6px 10px; }
        .fpa-hist li::before { content:''; position:absolute; left:-20px; top:9px; width:10px; height:10px; border-radius:50%; background:#94a3b8; border:2px solid #fff; }
        .fpa-hist li.a-Rejected::before { background:#ef4444; }
        .fpa-hist li.a-Approved::before { background:#10b981; }
        .fpa-hist li.a-Submitted::before, .fpa-hist li.a-Re-submitted::before { background:#3b82f6; }
        .fpa-hist li.a-Moved::before { background:#f59e0b; }
        .fpa-hist .h-act { font-weight:700; color:#0f172a; }
        .fpa-hist .h-when { color:#6b7280; }
        .fpa-hist .h-rem { color:#334155; margin-top:2px; }
        .rh-wrap { overflow-x:auto; border:1px solid #e2e8f0; border-radius:10px; background:#fff; }
        .rh-table { width:100%; border-collapse:collapse; font-size:13px; }
        .rh-table th { text-align:left; background:#f8fafc; color:#475569; font-size:11px; text-transform:uppercase; letter-spacing:.03em; padding:9px 12px; border-bottom:1px solid #e2e8f0; white-space:nowrap; }
        .rh-table td { padding:9px 12px; border-bottom:1px solid #f1f5f9; vertical-align:top; }
        .rh-table tr:last-child td { border-bottom:none; }
        .rh-table .sub { font-size:11px; color:#6b7280; }
        .rh-reason { color:#991b1b; font-weight:600; min-width:200px; }
        mark { background:#fef08a; padding:0 1px; border-radius:2px; }
        /* Lightbox */
        .lb-mask { position:fixed; inset:0; background:rgba(15,23,42,.8); z-index:1300; display:none; align-items:center; justify-content:center; }
        .lb-mask.open { display:flex; }
        .lb-mask img { max-width:92vw; max-height:92vh; border-radius:8px; }
        /* Reject modal */
        .rj-mask { position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:1250; display:none; align-items:center; justify-content:center; }
        .rj-mask.open { display:flex; }
        .rj-box { background:#fff; border-radius:12px; padding:20px; width:min(440px,92vw); }
    </style>
</head>

<body>
    <div class="main-content">
        <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
            <div class="page-title" style="font-size:1.5rem;font-weight:700;">FPA — First Piece Approval</div>
            <button class="btn btn-outline small" onclick="reload()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
        </div>

        <div class="fpa-toolbar">
            <label class="fpa-lbl" for="f-from">From</label>
            <input type="date" id="f-from" class="form-input" style="width:160px;">
            <label class="fpa-lbl" for="f-to">To</label>
            <input type="date" id="f-to" class="form-input" style="width:160px;">
            <div class="fpa-quick">
                <button type="button" onclick="quickRange(0)">Today</button>
                <button type="button" onclick="quickRange(6)">Last 7 days</button>
                <button type="button" onclick="quickRange('month')">This month</button>
            </div>
            <label class="fpa-lbl" for="f-shift">Shift</label>
            <select id="f-shift" class="form-input" style="width:120px;">
                <option value="">All</option>
                <option value="Day">Day</option>
                <option value="Night">Night</option>
            </select>
            <label class="fpa-lbl" for="f-machine">Machine</label>
            <select id="f-machine" class="form-input" style="width:170px;">
                <option value="All Machines">All Machines</option>
            </select>
            <button class="btn btn-primary small" onclick="reload()">Apply</button>
        </div>
        <div class="fpa-toolbar">
            <div class="fpa-search">
                <i class="bi bi-search"></i>
                <input type="search" id="f-search" class="form-input" placeholder="Search machine, job card, item, mould, person, remark…" autocomplete="off">
            </div>
            <span id="f-count" style="font-size:12px;color:var(--text-muted);"></span>
            <button type="button" id="rh-export" class="btn btn-outline small" style="display:none;margin-left:auto;" onclick="exportRejects()"><i class="bi bi-file-earmark-excel"></i> Export Excel</button>
        </div>

        <div class="fpa-tabs">
            <button type="button" class="fpa-tab active" data-tab="list" onclick="switchTab('list')"><i class="bi bi-clipboard-check"></i> FPA List</button>
            <button type="button" class="fpa-tab" data-tab="rejects" onclick="switchTab('rejects')"><i class="bi bi-clock-history"></i> Reject History</button>
        </div>

        <div id="fpa-auto" style="display:none;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;background:#fff;margin-bottom:16px;font-size:13px;">
            <i class="bi bi-lightning-charge-fill" style="color:#f59e0b;"></i>
            <span id="fpa-auto-text" style="font-weight:600;"></span>
            <span style="color:var(--text-muted);">Auto-approve FPA till</span>
            <input type="date" id="fpa-auto-until" class="form-input" style="width:170px;">
            <button class="btn btn-primary small" onclick="saveAutoApprove(document.getElementById('fpa-auto-until').value)">Save</button>
            <button class="btn btn-outline small" id="fpa-auto-off" onclick="saveAutoApprove('')">Turn off</button>
        </div>

        <div class="fpa-stats" id="fpa-stats"></div>
        <div id="fpa-list"><div class="empty">Loading…</div></div>
    </div>

    <div class="lb-mask" id="lb-mask" onclick="closeLightbox()">
        <img id="lb-img" src="" alt="" style="transition:transform .15s ease">
        <div onclick="event.stopPropagation()" style="position:absolute; bottom:22px; left:50%; transform:translateX(-50%); display:flex; gap:10px; background:rgba(15,23,42,0.9); padding:8px 12px; border-radius:999px;">
            <button type="button" onclick="lbZoom(-0.25, event)" title="Zoom out" style="width:38px;height:38px;border:none;border-radius:50%;background:#334155;color:#fff;font-size:1.3rem;cursor:pointer">&minus;</button>
            <button type="button" onclick="lbZoom(0.25, event)" title="Zoom in" style="width:38px;height:38px;border:none;border-radius:50%;background:#334155;color:#fff;font-size:1.3rem;cursor:pointer">+</button>
            <button type="button" onclick="lbRotate(event)" title="Rotate" style="width:38px;height:38px;border:none;border-radius:50%;background:#334155;color:#fff;font-size:1.05rem;cursor:pointer"><i class="bi bi-arrow-clockwise"></i></button>
            <button type="button" onclick="closeLightbox()" title="Close" style="width:38px;height:38px;border:none;border-radius:50%;background:#dc2626;color:#fff;font-size:1.1rem;cursor:pointer"><i class="bi bi-x-lg"></i></button>
        </div>
    </div>

    <div class="rj-mask" id="rj-mask">
        <div class="rj-box">
            <div style="font-weight:800;font-size:15px;margin-bottom:10px;">Reject FPA</div>
            <div style="font-size:13px;color:#6b7280;margin-bottom:8px;" id="rj-sub"></div>
            <textarea id="rj-reason" class="form-input" rows="3" placeholder="Reason for rejection (the QC user will see this)…" style="width:100%;resize:vertical;"></textarea>
            <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end;">
                <button class="btn btn-outline small" onclick="closeReject()">Cancel</button>
                <button class="btn small" style="background:#ef4444;color:#fff;" onclick="confirmReject()">Reject</button>
            </div>
        </div>
    </div>

    <div class="rj-mask" id="ap-mask">
        <div class="rj-box">
            <div style="font-weight:800;font-size:15px;margin-bottom:10px;">Approve FPA</div>
            <div style="font-size:13px;color:#6b7280;margin-bottom:8px;" id="ap-sub"></div>
            <textarea id="ap-remark" class="form-input" rows="3" placeholder="Remark (optional) — shown to QC in the app and in DPR Compliance…" style="width:100%;resize:vertical;"></textarea>
            <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end;">
                <button class="btn btn-outline small" onclick="closeApprove()">Cancel</button>
                <button class="btn small" style="background:#10b981;color:#fff;" onclick="confirmApprove()">Approve</button>
            </div>
        </div>
    </div>

    <script src="/assets/app.min.js?v=1583"></script>
    <script>
        JPSMS.auth.requireAuth();
        JPSMS.renderShell('quality');

        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const user = (() => { try { return JSON.parse(localStorage.getItem('user') || '{}'); } catch (_) { return {}; } })();
        const roleCode = String(user.role_code || '').toLowerCase();
        const uname = String(user.username || '').toLowerCase();
        const APPROVER_ROLES = ['quality', 'quality_ass__manager', 'admin', 'superadmin'];
        const canApprove = APPROVER_ROLES.includes(roleCode) || uname === 'superadmin';

        const fmtDT = v => { try { return v ? new Date(v).toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : ''; } catch (_) { return ''; } };
        const parseImgs = v => { try { return Array.isArray(v) ? v : JSON.parse(v || '[]'); } catch (_) { return []; } };
        // Grid uses a small cached thumbnail; the lightbox still opens the full image.
        const thumbUrl = (u, w) => (/^\/uploads\/qc-images\//.test(u || '')) ? ('/api/qc/thumb?src=' + encodeURIComponent(u) + '&w=' + (w || 360)) : u;

        let _lbZoom = 1, _lbRot = 0;
        function lbApply() {
            const img = document.getElementById('lb-img');
            if (img) img.style.transform = `scale(${_lbZoom}) rotate(${_lbRot}deg)`;
        }
        function openLightbox(url) {
            // Only allow same-origin relative or http(s) image URLs — never javascript:/data:.
            if (!url || !(/^https?:\/\//i.test(url) || url.startsWith('/'))) return;
            _lbZoom = 1; _lbRot = 0;
            document.getElementById('lb-img').setAttribute('src', encodeURI(url));
            lbApply();
            document.getElementById('lb-mask').classList.add('open');
        }
        function closeLightbox() {
            _lbZoom = 1; _lbRot = 0; lbApply();
            document.getElementById('lb-mask').classList.remove('open');
        }
        function lbZoom(delta, ev) { if (ev) ev.stopPropagation(); _lbZoom = Math.min(5, Math.max(0.25, +(_lbZoom + delta).toFixed(2))); lbApply(); }
        function lbRotate(ev) { if (ev) ev.stopPropagation(); _lbRot = (_lbRot + 90) % 360; lbApply(); }

        // Machine dropdown
        (async function loadMachines() {
            try {
                const res = await JPSMS.api.get('/machines?process=Moulding');
                const list = (res.data || res || []).map(m => (typeof m === 'string' ? m : m.machine)).filter(Boolean)
                    .sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' }));
                const sel = document.getElementById('f-machine');
                list.forEach(m => sel.add(new Option(m, m)));
            } catch (_) { /* non-fatal */ }
        })();

        // Date range (default = today). Quick buttons fill From / To and reload.
        const el = id => document.getElementById(id);
        const todayStr = () => new Date().toLocaleDateString('en-CA');
        const shiftDays = (ymd, n) => { const d = new Date(ymd + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toLocaleDateString('en-CA'); };
        el('f-from').value = todayStr();
        el('f-to').value = todayStr();
        function quickRange(days) {
            const t = todayStr();
            el('f-to').value = t;
            el('f-from').value = days === 'month' ? t.slice(0, 8) + '01' : shiftDays(t, -days);
            reload();
        }
        function rangeQs() {
            let from = el('f-from').value || todayStr(), to = el('f-to').value || from;
            if (to < from) { [from, to] = [to, from]; el('f-from').value = from; el('f-to').value = to; }
            return `?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&shift=${encodeURIComponent(el('f-shift').value)}&machine=${encodeURIComponent(el('f-machine').value)}`;
        }
        const fmtDay = v => { try { return v ? new Date(String(v).slice(0, 10) + 'T12:00:00').toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : ''; } catch (_) { return ''; } };

        // Search: every word must appear somewhere in the row (machine, JC, item, people, remarks…).
        const searchTerms = () => el('f-search').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
        const matches = (hay, terms) => { const h = hay.toLowerCase(); return terms.every(t => h.includes(t)); };
        // Escape, then highlight the search words.
        function hl(v) {
            const s = esc(v), terms = searchTerms();
            if (!terms.length || !s) return s;
            const re = new RegExp('(' + terms.map(t => esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
            // Only highlight text, never inside an &entity;
            return s.split(/(&[a-z#0-9]+;)/i).map(p => p.startsWith('&') && p.endsWith(';') ? p : p.replace(re, '<mark>$1</mark>')).join('');
        }
        const parseHist = v => { try { const a = Array.isArray(v) ? v : JSON.parse(v || '[]'); return Array.isArray(a) ? a : []; } catch (_) { return []; } };
        function fpaHay(r) {
            const h = parseHist(r.fpa_history).map(e => [e.action, e.by, e.remark].join(' ')).join(' ');
            return [r.machine, r.line && 'Line ' + r.line, r.job_card_no, r.order_no, r.item_name, r.mould_name, r.fpa_done_by,
                r.fpa_reviewed_by, r.fpa_reject_reason, r.fpa_approve_remark, r.remarks, r.fpa_approval_status, r.shift, r.fpa_transferred_from, h].join(' ');
        }

        let TAB = 'list', LIST_ROWS = [], REJ_ROWS = [], REJ_KEY = null;
        function switchTab(tab) {
            TAB = tab;
            document.querySelectorAll('.fpa-tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === tab));
            el('fpa-stats').style.display = tab === 'list' ? '' : 'none';
            el('rh-export').style.display = tab === 'rejects' ? '' : 'none';
            if (tab === 'rejects') loadRejects(); else renderList();
        }
        function reload() { REJ_KEY = null; if (TAB === 'rejects') loadRejects(); else loadFpa(); }
        let _sTimer = null;
        el('f-search').addEventListener('input', () => { clearTimeout(_sTimer); _sTimer = setTimeout(() => (TAB === 'rejects' ? renderRejects() : renderList()), 150); });

        function historyHtml(r) {
            const hist = parseHist(r.fpa_history);
            if (!hist.length) return '';
            const rejects = hist.filter(e => e.action === 'Rejected').length;
            const items = hist.slice().reverse().map(e => `<li class="a-${esc(e.action)}">
                    <span class="h-act">${esc(e.action)}</span>${e.by ? ' by <b>' + hl(e.by) + '</b>' : ''}
                    <span class="h-when">· ${fmtDT(e.at)}</span>
                    ${e.remark ? `<div class="h-rem">${e.action === 'Rejected' ? '<b>Reason:</b> ' : '<b>Remark:</b> '}${hl(e.remark)}</div>` : ''}
                </li>`).join('');
            // Open by default when it was rejected before, so the old reasons are visible.
            return `<details class="fpa-hist"${rejects ? ' open' : ''}><summary><i class="bi bi-clock-history"></i> History (${hist.length} step${hist.length === 1 ? '' : 's'}${rejects ? ` · rejected ${rejects}×` : ''})</summary><ol>${items}</ol></details>`;
        }

        function statCard(cls, n, label) {
            return `<div class="fpa-stat ${cls}"><div class="n">${n}</div><div class="l">${label}</div></div>`;
        }

        function cardHtml(r) {
            const st = r.fpa_approval_status || 'Pending';
            const imgs = parseImgs(r.product_images);
            const formUrl = r.fpa_form_url;
            const thumbs = [];
            // Use data-* attributes + event delegation (never inline JS with interpolated
            // DB values) so a crafted machine name / URL cannot inject script.
            if (formUrl) thumbs.push(`<a href="#" class="js-zoom" data-url="${esc(formUrl)}" title="FPA form"><img src="${esc(thumbUrl(formUrl, 360))}" alt="form" loading="lazy" decoding="async"></a>`);
            imgs.forEach(u => thumbs.push(`<a href="#" class="js-zoom" data-url="${esc(u)}" title="Product"><img src="${esc(thumbUrl(u, 360))}" alt="product" loading="lazy" decoding="async"></a>`));
            const actions = (canApprove && st !== 'Approved')
                ? `<div class="fpa-actions">
                     <button class="btn small js-approve" data-id="${r.id}" data-sub="${esc((r.machine||'') + ' / ' + (r.job_card_no||''))}" style="background:#10b981;color:#fff;"><i class="bi bi-check-lg"></i> Approve</button>
                     <button class="btn small js-reject" data-id="${r.id}" data-sub="${esc((r.machine||'') + ' / ' + (r.job_card_no||''))}" style="background:#ef4444;color:#fff;"><i class="bi bi-x-lg"></i> Reject</button>
                   </div>`
                : '';
            const rejectNote = (st === 'Rejected' && r.fpa_reject_reason)
                ? `<div class="fpa-reject"><b>Rejected:</b> ${hl(r.fpa_reject_reason)}${r.fpa_reviewed_by ? ' — ' + hl(r.fpa_reviewed_by) : ''}</div>` : '';
            const reviewNote = (st === 'Approved' && r.fpa_reviewed_by)
                ? `<div style="font-size:12px;color:#047857;margin-top:8px;">Approved by ${hl(r.fpa_reviewed_by)} ${r.fpa_reviewed_at ? '· ' + fmtDT(r.fpa_reviewed_at) : ''}${r.fpa_approve_remark ? '<br><b>Remark:</b> ' + hl(r.fpa_approve_remark) : ''}</div>` : '';
            const resub = (r.fpa_resubmit_count > 0) ? ` <span style="color:#b45309;">(re-uploaded ${r.fpa_resubmit_count}×)</span>` : '';
            return `<div class="fpa-card st-${st}">
                <div class="fpa-head">
                    <div>
                        <div class="fpa-title">${hl(r.machine || '-')}${r.line ? ' · Line ' + hl(r.line) : ''} — JC ${hl(r.job_card_no || '-')}</div>
                        ${r.fpa_transferred_from ? `<div style="font-size:12px;font-weight:700;color:#b45309;margin-top:2px;"><i class="bi bi-arrow-left-right"></i> Job moved from ${esc(r.fpa_transferred_from)}. Check it on ${esc(r.machine || 'this machine')} before approving.</div>` : ''}
                        <div class="fpa-meta">
                            <span><i class="bi bi-calendar3"></i> ${esc(fmtDay(r.fpa_date || r.date))}${r.shift ? ' · ' + esc(r.shift) : ''}</span>
                            <span><i class="bi bi-box-seam"></i> ${hl(r.item_name || '-')}</span>
                            <span><i class="bi bi-hammer"></i> ${hl(r.mould_name || '-')}</span>
                            <span><i class="bi bi-person"></i> ${hl(r.fpa_done_by || '-')}</span>
                            <span><i class="bi bi-clock"></i> ${fmtDT(r.fpa_done_at)}${resub}</span>
                        </div>
                    </div>
                    <span class="badge b-${st}">${st === 'Pending' ? 'Pending Approval' : st}</span>
                </div>
                ${thumbs.length ? `<div class="fpa-imgs">${thumbs.join('')}</div>` : ''}
                ${rejectNote}${reviewNote}${historyHtml(r)}${actions}
            </div>`;
        }

        // Delegated click handling for the dynamically-rendered list (no inline JS).
        document.getElementById('fpa-list').addEventListener('click', (ev) => {
            const zoom = ev.target.closest('.js-zoom');
            if (zoom) { ev.preventDefault(); openLightbox(zoom.getAttribute('data-url')); return; }
            const ap = ev.target.closest('.js-approve');
            if (ap) { openApprove(parseInt(ap.getAttribute('data-id'), 10), ap.getAttribute('data-sub') || ''); return; }
            const rj = ev.target.closest('.js-reject');
            if (rj) { openReject(parseInt(rj.getAttribute('data-id'), 10), rj.getAttribute('data-sub') || ''); return; }
        });

        async function loadFpa() {
            const list = el('fpa-list');
            list.innerHTML = '<div class="empty">Loading…</div>';
            el('fpa-stats').innerHTML = '';
            el('f-count').textContent = '';
            try {
                const res = await JPSMS.api.get('/qc/fpa/list' + rangeQs());
                LIST_ROWS = (res.ok && Array.isArray(res.data)) ? res.data : [];
                if (TAB === 'list') renderList();
            } catch (e) {
                LIST_ROWS = [];
                list.innerHTML = '<div class="empty">Failed to load FPA list.</div>';
            }
        }
        function renderList() {
            const list = el('fpa-list');
            const terms = searchTerms();
            const rows = terms.length ? LIST_ROWS.filter(r => matches(fpaHay(r), terms)) : LIST_ROWS;
            const c = { Pending: 0, Approved: 0, Rejected: 0 };
            rows.forEach(r => { c[r.fpa_approval_status] = (c[r.fpa_approval_status] || 0) + 1; });
            el('fpa-stats').innerHTML =
                statCard('s-pending', c.Pending || 0, 'Pending Approval') +
                statCard('s-approved', c.Approved || 0, 'Approved') +
                statCard('s-rejected', c.Rejected || 0, 'Rejected');
            el('f-count').textContent = terms.length ? `${rows.length} of ${LIST_ROWS.length} FPAs match` : '';
            if (!rows.length) {
                list.innerHTML = `<div class="empty">${terms.length && LIST_ROWS.length ? 'No FPA matches this search.' : 'No FPA submissions for these dates / shift / machine.'}</div>`;
                return;
            }
            list.innerHTML = rows.map(cardHtml).join('');
        }

        // Reject History: one row per reject (an FPA rejected twice shows twice), newest first.
        async function loadRejects() {
            const qs = rangeQs();
            if (REJ_KEY === qs) return renderRejects();
            const list = el('fpa-list');
            list.innerHTML = '<div class="empty">Loading…</div>';
            el('f-count').textContent = '';
            try {
                const res = await JPSMS.api.get('/qc/fpa/reject-history' + qs);
                REJ_ROWS = (res.ok && Array.isArray(res.data)) ? res.data : [];
                REJ_KEY = qs;
                if (TAB === 'rejects') renderRejects();
            } catch (e) {
                REJ_ROWS = []; REJ_KEY = null;
                list.innerHTML = '<div class="empty">Failed to load reject history.</div>';
            }
        }
        // Rejects after the search box filter (used by the table and the Excel export).
        function filteredRejects() {
            const terms = searchTerms();
            const hay = r => [r.machine, r.line && 'Line ' + r.line, r.job_card_no, r.order_no, r.item_name, r.mould_name, r.reason, r.rejected_by, r.submitted_by, r.fpa_done_by, r.shift, r.current_status].join(' ');
            return terms.length ? REJ_ROWS.filter(r => matches(hay(r), terms)) : REJ_ROWS;
        }

        // Export Excel: exactly the rows on screen (dates, shift, machine and search applied).
        // SheetJS is ~900 KB, so it is loaded only on the first export.
        let _xlsxLoading = null;
        function loadXlsx() {
            if (window.XLSX) return Promise.resolve();
            return _xlsxLoading || (_xlsxLoading = new Promise((ok, fail) => {
                const s = document.createElement('script');
                s.src = '/assets/vendor/jsdelivr/xlsx@0.18.5/xlsx.full.min.js';
                s.onload = ok;
                s.onerror = () => { _xlsxLoading = null; fail(new Error('load')); };
                document.head.appendChild(s);
            }));
        }
        async function exportRejects() {
            const rows = filteredRejects();
            if (!rows.length) return JPSMS.toast('Nothing to export', 'error');
            const btn = el('rh-export');
            btn.disabled = true;
            try {
                await loadXlsx();
                const ist = v => { try { return v ? new Date(v).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }) : ''; } catch (_) { return ''; } };
                const nowTxt = s => s === 'Pending' ? 'Re-uploaded - Pending' : (s || '');
                const data = rows.map((r, i) => ({
                    'Sr No': i + 1,
                    'Rejected On': ist(r.rejected_at),
                    'FPA Date': fmtDay(r.fpa_date || r.date),
                    'Shift': r.shift || '',
                    'Line': r.line || '',
                    'Machine': r.machine || '',
                    'Job Card': r.job_card_no || '',
                    'Order No': r.order_no || '',
                    'Item': r.item_name || '',
                    'Mould': r.mould_name || '',
                    'Reject Reason': r.reason || '',
                    'Rejected By': r.rejected_by || '',
                    'Submitted By': r.submitted_by || r.fpa_done_by || '',
                    'Status Now': nowTxt(r.current_status)
                }));
                const ws = XLSX.utils.json_to_sheet(data);
                ws['!cols'] = [6, 17, 13, 7, 6, 10, 14, 14, 26, 18, 45, 16, 16, 20].map(w => ({ wch: w }));
                ws['!autofilter'] = { ref: ws['!ref'] };
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'FPA Reject History');
                const from = el('f-from').value, to = el('f-to').value;
                XLSX.writeFile(wb, `FPA_Reject_History_${from}${to && to !== from ? '_to_' + to : ''}.xlsx`);
                JPSMS.toast(`Exported ${rows.length} reject${rows.length === 1 ? '' : 's'}`);
            } catch (e) {
                JPSMS.toast('Excel export failed', 'error');
            } finally {
                btn.disabled = false;
            }
        }

        function renderRejects() {
            const list = el('fpa-list');
            const terms = searchTerms();
            const rows = filteredRejects();
            const fpas = new Set(rows.map(r => r.id)).size;
            el('f-count').textContent = `${rows.length} reject${rows.length === 1 ? '' : 's'} on ${fpas} FPA${fpas === 1 ? '' : 's'}${terms.length ? ` (of ${REJ_ROWS.length})` : ''}`;
            if (!rows.length) {
                list.innerHTML = `<div class="empty">${terms.length && REJ_ROWS.length ? 'No reject matches this search.' : 'No FPA was rejected on these dates. 👍'}</div>`;
                return;
            }
            const nowBadge = s => `<span class="badge b-${esc(s)}">${s === 'Pending' ? 'Re-uploaded · Pending' : esc(s)}</span>`;
            list.innerHTML = `<div class="rh-wrap"><table class="rh-table">
                <thead><tr><th>Rejected on</th><th>Machine</th><th>Job card</th><th>Item / Mould</th><th>Reason</th><th>Rejected by</th><th>Submitted by</th><th>Now</th></tr></thead>
                <tbody>${rows.map(r => `<tr>
                    <td style="white-space:nowrap">${fmtDT(r.rejected_at)}<div class="sub">FPA of ${esc(fmtDay(r.fpa_date || r.date))}${r.shift ? ' · ' + esc(r.shift) : ''}</div></td>
                    <td style="white-space:nowrap"><b>${hl(r.machine || '-')}</b>${r.line ? `<div class="sub">Line ${hl(r.line)}</div>` : ''}</td>
                    <td style="white-space:nowrap">${hl(r.job_card_no || '-')}${r.order_no ? `<div class="sub">${hl(r.order_no)}</div>` : ''}</td>
                    <td>${hl(r.item_name || '-')}<div class="sub">${hl(r.mould_name || '')}</div></td>
                    <td class="rh-reason">${hl(r.reason || '-')}</td>
                    <td style="white-space:nowrap"><i class="bi bi-person-x" style="color:#b91c1c"></i> ${hl(r.rejected_by || '-')}</td>
                    <td style="white-space:nowrap"><i class="bi bi-person"></i> ${hl(r.submitted_by || r.fpa_done_by || '-')}</td>
                    <td>${nowBadge(r.current_status)}</td>
                </tr>`).join('')}</tbody></table></div>`;
        }

        let approveId = null;
        function openApprove(id, sub) { approveId = id; document.getElementById('ap-sub').textContent = sub || ''; document.getElementById('ap-remark').value = ''; document.getElementById('ap-mask').classList.add('open'); }
        function closeApprove() { approveId = null; document.getElementById('ap-mask').classList.remove('open'); }
        async function confirmApprove() {
            const remark = document.getElementById('ap-remark').value.trim();
            try {
                const res = await JPSMS.api.post(`/qc/fpa/${approveId}/approve`, { remark });
                if (res.ok) { JPSMS.toast('FPA approved'); closeApprove(); loadFpa(); }
                else JPSMS.toast(res.error || 'Approve failed', 'error');
            } catch (e) { JPSMS.toast('Approve failed', 'error'); }
        }

        let rejectId = null;
        function openReject(id, sub) { rejectId = id; document.getElementById('rj-sub').textContent = sub || ''; document.getElementById('rj-reason').value = ''; document.getElementById('rj-mask').classList.add('open'); }
        function closeReject() { rejectId = null; document.getElementById('rj-mask').classList.remove('open'); }
        async function confirmReject() {
            const reason = document.getElementById('rj-reason').value.trim();
            if (!reason) return JPSMS.toast('Enter a reason', 'error');
            try {
                const res = await JPSMS.api.post(`/qc/fpa/${rejectId}/reject`, { reason });
                if (res.ok) { JPSMS.toast('FPA rejected'); closeReject(); loadFpa(); }
                else JPSMS.toast(res.error || 'Reject failed', 'error');
            } catch (e) { JPSMS.toast('Reject failed', 'error'); }
        }

        // Auto-approve window: while on, FPAs submitted from the QC app are Approved at once.
        function renderAutoApprove(res) {
            const box = document.getElementById('fpa-auto');
            const txt = document.getElementById('fpa-auto-text');
            const on = !!(res && res.active);
            box.style.display = 'flex';
            box.style.background = on ? '#fffbeb' : '#fff';
            txt.textContent = on ? `Approval paused — FPAs are auto-approved till ${res.until}` : 'FPA approval is ON (normal)';
            document.getElementById('fpa-auto-until').value = on ? res.until : '';
            document.getElementById('fpa-auto-off').style.display = on ? '' : 'none';
        }
        async function loadAutoApprove() {
            if (!canApprove) return;
            try { renderAutoApprove(await JPSMS.api.get('/qc/fpa/auto-approve')); } catch (_) { /* non-fatal */ }
        }
        async function saveAutoApprove(until) {
            if (until && until < new Date().toLocaleDateString('en-CA')) return JPSMS.toast('Pick today or a later date', 'error');
            try {
                const res = await JPSMS.api.post('/qc/fpa/auto-approve', { until });
                if (res.ok) { renderAutoApprove(res); JPSMS.toast(res.active ? 'FPA auto-approve on' : 'FPA approval back to normal'); }
                else JPSMS.toast(res.error || 'Save failed', 'error');
            } catch (e) { JPSMS.toast('Save failed', 'error'); }
        }

        loadAutoApprove();
        loadFpa();
    </script>
</body>

</html>
