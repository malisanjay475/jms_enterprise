<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMS OCEAN - Store Handover</title>
    <link href="/assets/vendor/fonts/g-e34670640e.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/app.css?v=12">
    <style>
        [hidden] { display: none !important; }
        .ho-main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
        .ho-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px 18px; }
        .ho-h { font-size: .8rem; font-weight: 700; color: #475569; margin: 0 0 8px; }
        .ho-slip { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
        .ho-slip b { font-size: 1.25rem; color: #0f172a; }
        .ho-slip small { display: block; color: #64748b; font-size: .82rem; }
        .ho-total { font-size: 2rem; font-weight: 800; color: #0f172a; font-variant-numeric: tabular-nums; }
        .ho-total span { font-size: .95rem; color: #64748b; font-weight: 600; }
        .ho-scan { display: flex; gap: 8px; margin-top: 12px; }
        .ho-scan input { flex: 1; font-size: 1.15rem; font-family: ui-monospace, monospace; }
        .ho-msg { margin-top: 10px; padding: 9px 12px; border-radius: 10px; font-weight: 600; font-size: .92rem; }
        .ho-msg.ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .ho-msg.bad { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .ho-lines { width: 100%; border-collapse: collapse; font-size: .88rem; margin-top: 12px; }
        .ho-lines th { text-align: left; font-size: .74rem; color: #475569; padding: 7px 6px; border-bottom: 1px solid #e2e8f0; }
        .ho-lines td { padding: 7px 6px; border-bottom: 1px solid #f1f5f9; }
        .ho-lines .n { text-align: right; font-variant-numeric: tabular-nums; }
        .ho-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .ho-actions .btn { flex: 1; min-height: 44px; }
        .ho-codes { font-family: ui-monospace, monospace; font-size: .82rem; line-height: 1.8; color: #334155; max-height: 180px; overflow: auto; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 6px 10px; margin-top: 10px; }
        .ho-wait { display: flex; flex-direction: column; gap: 8px; }
        .ho-w { border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px 10px; font-size: .86rem; }
        .ho-w.old { border-color: #fcd34d; background: #fffbeb; }
        .ho-w.rej { border-color: #fecaca; background: #fef2f2; }
        .ho-w .r { display: flex; justify-content: space-between; gap: 8px; }
        .ho-w .r span { white-space: nowrap; }
        .ho-w b { color: #1e293b; }
        .ho-w small { color: #64748b; display: block; }
        .ho-w .why { color: #991b1b; font-weight: 600; }
        .ho-recent { font-size: .84rem; }
        .ho-recent div { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid #f1f5f9; }
        .ho-recent button { border: 0; background: none; color: #1d4ed8; padding: 0; cursor: pointer; font-weight: 600; }
        .ho-empty { color: #64748b; font-size: .9rem; }
        .ho-note { color: #64748b; font-size: .82rem; margin-top: 8px; }
        #hoPrint { display: none; }
        @media print {
            @page { size: A4; margin: 14mm; }
            body > *:not(#hoPrint) { display: none !important; }
            #hoPrint { display: block !important; font-family: Arial, sans-serif; color: #000; font-size: 10.5pt; }
            #hoPrint h1 { font-size: 16pt; margin: 0 0 4mm; }
            #hoPrint table { width: 100%; border-collapse: collapse; margin-top: 4mm; }
            #hoPrint th, #hoPrint td { border: 1px solid #555; padding: 1.6mm 2mm; text-align: left; }
            #hoPrint .n { text-align: right; }
            #hoPrint .codes { font-family: monospace; font-size: 8.5pt; margin-top: 4mm; line-height: 1.5; }
            #hoPrint .sign { display: flex; justify-content: space-between; margin-top: 18mm; }
            #hoPrint .sign div { width: 45%; border-top: 1px solid #000; padding-top: 1.5mm; }
        }
        @media (max-width: 900px) { .ho-main { grid-template-columns: minmax(0, 1fr); } .ho-total { font-size: 1.5rem; } }
        .ho-tbl { overflow-x: auto; }
        .ho-main > * { min-width: 0; }
    </style>
</head>

<body>
    <div class="main-content">
        <div class="header">
            <div class="page-title">Store Handover</div>
        </div>
        <div class="ho-main">
            <div class="ho-card" id="hoSlipCard"><div class="ho-empty">Loading…</div></div>
            <div>
                <div class="ho-card">
                    <h2 class="ho-h" id="hoWaitTitle">Waiting at packing</h2>
                    <div class="ho-wait" id="hoWait"></div>
                    <div class="ho-actions"><button class="btn btn-outline" onclick="rejectLabel()"><i class="bi bi-x-octagon"></i> Reject a carton</button></div>
                </div>
                <div class="ho-card" style="margin-top:16px">
                    <h2 class="ho-h">Recent slips</h2>
                    <div class="ho-recent" id="hoRecent"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="hoPrint" aria-hidden="true"></div>

    <script src="/assets/app.min.js?v=1583"></script>
    <script>
        const $ = (id) => document.getElementById(id);
        const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const fmt = (n) => Number(n || 0).toLocaleString('en-IN');
        const api = (url, opts = {}) => JPSMS.api.request(url, { skipLoader: true, ...opts });
        const post = (url, body) => api(url, { method: 'POST', body: JSON.stringify(body || {}) });
        const S = { data: null, msg: null };
        // cartons on a line can include loose boxes (items with no carton size)
        const unitText = (units, loose) => {
            const ctn = Number(units || 0) - Number(loose || 0);
            const parts = [];
            if (ctn) parts.push(fmt(ctn));
            if (loose) parts.push(`${fmt(loose)} box${Number(loose) === 1 ? '' : 'es'}`);
            return parts.join(' + ') || '0';
        };

        document.addEventListener('DOMContentLoaded', () => {
            JPSMS.auth.requireAuth();
            JPSMS.renderShell('packing');
            load();
            setInterval(() => { if (!document.activeElement || document.activeElement.id !== 'hoScan' || !$('hoScan').value) load(true); }, 30000);
            document.addEventListener('click', e => {
                if (!e.target.closest('input, select, textarea, button, a') && $('hoScan')) $('hoScan').focus();
            });
        });

        async function load(quiet) {
            try {
                const res = await api('/packing/handover/summary');
                S.data = res.data;
                render();
            } catch (e) {
                if (!quiet) $('hoSlipCard').innerHTML = `<div class="ho-empty">${esc(e.message)}</div>`;
            }
        }

        function render() {
            const d = S.data;
            const s = d.slip;
            const msg = S.msg ? `<div class="ho-msg ${S.msg.ok ? 'ok' : 'bad'}"><i class="bi ${S.msg.ok ? 'bi-check-circle' : 'bi-x-circle'}"></i> ${esc(S.msg.text)}</div>` : '';
            if (!s) {
                $('hoSlipCard').innerHTML = `
                    <h2 class="ho-h">Handover slip</h2>
                    <p class="ho-empty">Start a slip, then scan each carton label as you take it from packing.</p>
                    ${d.other_open.length ? `<p class="ho-note">Open slips of other people: ${d.other_open.map(o => `${esc(o.slip_no)} (${esc(o.opened_by)}, ${fmt(o.cartons)} cartons)`).join(', ')}</p>` : ''}
                    <div class="ho-actions"><button class="btn btn-primary" onclick="startSlip()"><i class="bi bi-plus-lg"></i> Start slip</button></div>${msg}`;
            } else {
                $('hoSlipCard').innerHTML = `
                    <div class="ho-slip">
                        <div><b>Slip ${esc(s.slip_no)}</b><small>Open · ${esc(s.opened_by || '')} · ${esc(s.opened_local)}${s.reopen_count ? ` · reopened (${esc(s.last_reopen_reason || '')})` : ''}</small></div>
                        <div class="ho-total">${fmt(s.cartons)} <span>cartons · ${fmt(s.pcs)} pcs</span></div>
                    </div>
                    <div class="ho-scan"><input id="hoScan" class="form-control" placeholder="Scan carton label, then Enter" aria-label="Carton label" autocomplete="off"></div>
                    ${msg}
                    ${s.lines.length ? `<div class="ho-tbl"><table class="ho-lines"><thead><tr><th>Item</th><th>Party</th><th>Job card</th><th class="n">Cartons</th><th class="n">Pcs</th></tr></thead><tbody>
                        ${s.lines.map(l => `<tr><td>${esc(l.item_name)}</td><td>${esc(l.client_name)}</td><td>${esc(l.job_card_no)}</td><td class="n">${unitText(l.cartons, l.loose_boxes)}</td><td class="n">${fmt(l.pcs)}</td></tr>`).join('')}
                        </tbody></table></div>
                        <div class="ho-codes">${s.codes.map(c => `<div>${esc(c.at)} ${esc(c.code)} · ${fmt(c.qty)} pcs</div>`).join('')}</div>` : '<p class="ho-empty" style="margin-top:12px">Nothing scanned on this slip yet.</p>'}
                    <div class="ho-actions">
                        <button class="btn btn-outline" onclick="undoLast(${Number(s.id)})"><i class="bi bi-arrow-counterclockwise"></i> Undo last</button>
                        <button class="btn btn-primary" onclick="closeSlip(${Number(s.id)})"><i class="bi bi-printer"></i> Close slip and print</button>
                    </div>`;
                const input = $('hoScan');
                input.addEventListener('keydown', e => {
                    if (e.key === 'Enter') { e.preventDefault(); const v = input.value.trim(); input.value = ''; if (v) scan(s.id, v); }
                });
                input.focus();
            }
            renderWaiting();
            renderRecent();
        }

        function renderWaiting() {
            const w = S.data.waiting || [];
            const alertH = S.data.wait_alert_hours || 24;
            const total = w.reduce((t, x) => t + x.units, 0);
            $('hoWaitTitle').textContent = `Waiting at packing · ${fmt(total)}`;
            $('hoWait').innerHTML = w.length ? w.map(x => {
                const cls = x.rejected ? 'rej' : (x.oldest_h >= alertH ? 'old' : '');
                const age = x.oldest_h >= 24 ? `${Math.floor(x.oldest_h / 24)} d ${Math.round(x.oldest_h % 24)} h` : `${x.oldest_h < 1 ? '<1' : Math.round(x.oldest_h)} h`;
                return `<div class="ho-w ${cls}"><div class="r"><b>${esc(x.table_id)} · ${esc(x.item_name)}</b><span>${unitText(x.units, x.loose_boxes)} · ${age}</span></div>
                    <small>${esc(x.client_name)} · ${esc(x.job_card_no)} · ${fmt(x.pcs)} pcs</small>
                    ${x.rejected ? `<small class="why">Rejected ${fmt(x.rejected)}: ${esc(x.reject_reasons || '')}</small>` : ''}</div>`;
            }).join('') : '<div class="ho-empty">Nothing waiting. Every labelled carton has reached the store.</div>';
        }

        function renderRecent() {
            const r = S.data.recent || [];
            $('hoRecent').innerHTML = r.length ? r.map(x => `<div><span><b>${esc(x.slip_no)}</b> · ${esc(x.closed_local || '')} · ${fmt(x.cartons)} ctn · ${fmt(x.pcs)} pcs</span>
                <span><button onclick="printSlip(${Number(x.id)})">Print</button> · <button onclick="reopenSlip(${Number(x.id)}, '${esc(x.slip_no)}')">Reopen</button></span></div>`).join('')
                : '<div class="ho-empty" style="border:0">No closed slips yet.</div>';
        }

        async function startSlip() {
            try { await post('/packing/handover/slips'); S.msg = null; load(); } catch (e) { JPSMS.toast(e.message, 'error'); }
        }

        let audio = null;
        function beep(ok) {
            try {
                audio = audio || new (window.AudioContext || window.webkitAudioContext)();
                const o = audio.createOscillator(), g = audio.createGain();
                o.frequency.value = ok ? 1200 : 220; o.type = ok ? 'sine' : 'square';
                g.gain.value = 0.08; o.connect(g); g.connect(audio.destination);
                o.start(); o.stop(audio.currentTime + (ok ? 0.08 : 0.5));
            } catch (_) { /* no sound */ }
        }

        async function scan(id, code) {
            try {
                const res = await post(`/packing/handover/slips/${id}/scan`, { code });
                const r = res.data;
                S.msg = { ok: true, text: `${r.code} · ${r.item_name} · ${fmt(r.qty)} pcs${r.was_rejected ? ' (was rejected, now received)' : ''}` };
                beep(true);
            } catch (e) {
                S.msg = { ok: false, text: `${code.toUpperCase()}: ${e.message}` };
                beep(false);
            }
            load(true);
        }

        async function undoLast(id) {
            try {
                const res = await post(`/packing/handover/slips/${id}/undo`);
                S.msg = { ok: true, text: `Took ${res.data.code} off the slip` };
                load();
            } catch (e) { JPSMS.toast(e.message, 'error'); }
        }

        async function closeSlip(id) {
            const s = S.data.slip;
            if (!s.cartons) { JPSMS.toast('Scan at least one carton first.', 'error'); return; }
            if (!confirm(`Close slip ${s.slip_no} with ${fmt(s.cartons)} cartons (${fmt(s.pcs)} pcs) and print it?`)) return;
            try {
                await post(`/packing/handover/slips/${id}/close`);
                S.msg = null;
                await printSlip(id);
                load();
            } catch (e) { JPSMS.toast(e.message, 'error'); }
        }

        async function printSlip(id) {
            try {
                const res = await api(`/packing/handover/slips/${id}`);
                const s = res.data;
                $('hoPrint').innerHTML = `
                    <h1>Packing to store handover · ${esc(s.slip_no)}</h1>
                    <div>Opened ${esc(s.opened_local)} by ${esc(s.opened_by || '')}${s.closed_local ? ` · closed ${esc(s.closed_local)}` : ''}${s.reopen_count ? ` · reopened ${s.reopen_count} time(s): ${esc(s.last_reopen_reason || '')}` : ''}</div>
                    <table><thead><tr><th>Item</th><th>Code</th><th>Party</th><th>Job card</th><th class="n">Cartons</th><th class="n">Pcs</th></tr></thead><tbody>
                        ${s.lines.map(l => `<tr><td>${esc(l.item_name)}</td><td>${esc(l.item_code)}</td><td>${esc(l.client_name)}</td><td>${esc(l.job_card_no)}</td><td class="n">${unitText(l.cartons, l.loose_boxes)}</td><td class="n">${fmt(l.pcs)}</td></tr>`).join('')}
                        <tr><th colspan="4">Total</th><th class="n">${fmt(s.cartons)}</th><th class="n">${fmt(s.pcs)}</th></tr>
                    </tbody></table>
                    <div class="codes"><b>Labels:</b> ${s.codes.map(c => esc(c.code)).join(', ')}</div>
                    <div class="sign"><div>Handed over by (packing)</div><div>Received by (store)</div></div>`;
                window.print();
            } catch (e) { JPSMS.toast(e.message, 'error'); }
        }

        async function reopenSlip(id, no) {
            const reason = prompt(`Reason to reopen ${no}?`);
            if (reason === null) return;
            if (reason.trim().length < 3) { JPSMS.toast('Give a reason of a few words.', 'error'); return; }
            const pin = prompt('Supervisor PIN');
            if (pin === null) return;
            try {
                const res = await post(`/packing/handover/slips/${id}/reopen`, { reason: reason.trim(), pin: pin.trim() });
                JPSMS.toast(`${no} reopened by ${res.data ? res.data.reopened_by : 'supervisor'}`, 'success');
                load();
            } catch (e) { JPSMS.toast(e.message, 'error'); }
        }

        async function rejectLabel() {
            const code = prompt('Scan or type the carton label to reject');
            if (!code || !code.trim()) return;
            const reason = prompt('Reason (for example damaged, short count, wrong item)');
            if (reason === null) return;
            try {
                const res = await post('/packing/handover/reject', { code: code.trim(), reason: reason.trim() });
                S.msg = { ok: false, text: `Rejected ${res.data.code} · ${res.data.item_name}. It stays on packing's waiting list.` };
                load();
            } catch (e) { JPSMS.toast(e.message, 'error'); }
        }
    </script>
</body>

</html>
