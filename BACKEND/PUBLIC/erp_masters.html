<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Masters - JMS OCEAN</title>
    <link href="/assets/vendor/fonts/g-e34670640e.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/app.css?v=12">
    <style>
        :root { --bg: #f5f7fb; --card: #fff; --line: #e4e9f0; --ink: #0f172a; --mute: #64748b; }
        .erm { padding: 20px 24px 48px; background: var(--bg); min-height: 100vh; color: var(--ink); font-size: 13px; flex: 1 1 auto; min-width: 0; max-width: 100%; }
        .erm * { box-sizing: border-box; }
        .hd { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
        .hd h1 { font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 800; margin: 0; display: flex; align-items: center; gap: 10px; }
        .hd h1 .ic { width: 38px; height: 38px; border-radius: 11px; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 18px; }
        .hd .sub { color: var(--mute); font-size: 13px; margin-top: 4px; }
        .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
        .tab { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 16px; font-weight: 700; cursor: pointer; font-size: 13px; color: var(--ink); }
        .tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }
        .btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 14px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
        .btn.pri { background: #0f172a; color: #fff; border-color: #0f172a; }
        .btn:disabled { opacity: .55; cursor: default; }
        .inp { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; background: #fff; min-width: 240px; }
        .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
        .info { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; color: var(--mute); }
        .info b { color: var(--ink); }
        .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-weight: 700; font-size: 12px; }
        .chip.ok { background: #dcfce7; color: #15803d; }
        .chip.err { background: #fee2e2; color: #b91c1c; }
        .chip.never { background: #e2e8f0; color: #475569; }
        .errmsg { color: #b91c1c; font-size: 12px; margin: -4px 0 10px; word-break: break-word; }
        .wrap { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: auto; max-height: calc(100vh - 290px); }
        table.g { border-collapse: separate; border-spacing: 0; min-width: 100%; }
        table.g th { position: sticky; top: 0; background: #f8fafc; border-bottom: 1px solid var(--line); padding: 9px 10px; text-align: left; font-size: 12px; white-space: nowrap; cursor: pointer; user-select: none; z-index: 1; }
        table.g th.num, table.g td.num { text-align: right; }
        table.g th .s { color: var(--mute); font-size: 10px; margin-left: 4px; }
        table.g td { border-bottom: 1px solid #f1f5f9; padding: 7px 10px; white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
        table.g tr:hover td { background: #f8fafc; }
        .empty { padding: 36px; text-align: center; color: var(--mute); }
        .pg { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 10px; color: var(--mute); flex-wrap: wrap; }
        @media (max-width: 640px) { .erm { padding: 14px 16px 40px; } .inp { min-width: 0; flex: 1 1 100%; } .wrap { max-height: none; } }
    </style>
</head>

<body>
    <div class="erm" id="page">
        <div class="hd">
            <div>
                <h1><span class="ic"><i class="bi bi-cloud-arrow-down"></i></span> ERP Masters</h1>
                <div class="sub">Copied from Smart Ops every 5 minutes. Read-only: the ERP is the source of truth.</div>
            </div>
        </div>
        <div class="tabs" id="tabs"></div>
        <div class="bar">
            <div class="info" id="info"></div>
            <span style="flex:1"></span>
            <button class="btn pri" id="syncBtn" hidden><i class="bi bi-arrow-repeat"></i> Sync now</button>
        </div>
        <div class="errmsg" id="errMsg" hidden></div>
        <div class="bar">
            <input class="inp" id="q" type="search" placeholder="Search all columns...">
            <span style="flex:1"></span>
            <button class="btn" id="xlsBtn"><i class="bi bi-file-earmark-excel"></i> Excel</button>
        </div>
        <div class="wrap"><table class="g" id="grid"></table></div>
        <div class="pg" id="pager"></div>
    </div>

    <script src="/assets/app.min.js?v=1583"></script>
    <script>
        (function () {
            /* [column, header, type] - keep column names in sync with MASTERS in
               src/modules/erpMasters/smartopsSync.js. type: t text, n number, b yes/no */
            const DEFS = {
                item: { label: 'Item', cols: [
                    ['item_id', 'Item ID', 'n'], ['item_code', 'Item Code', 't'], ['item_name', 'Item Name', 't'], ['uom', 'UOM', 't'],
                    ['tax_rate', 'Tax %', 'n'], ['category', 'Category', 't'], ['project_id', 'Project ID', 't'], ['project_name', 'Project', 't'],
                    ['hsn_code', 'HSN', 't'], ['is_active', 'Active', 'b']] },
                variant: { label: 'Variant', cols: [
                    ['item_id', 'Item ID', 'n'], ['our_code', 'Our Code', 't'], ['our_name', 'Our Name', 't'], ['party_code', 'Party Code', 't'],
                    ['party', 'Party', 't'], ['party_item_name', 'Party Item Name', 't'], ['party_item_code', 'Party Item Code', 't'],
                    ['po_item_name', 'PO Item Name', 't'], ['party_item_barcode', 'Barcode', 't'], ['party_group', 'Party Group', 't'],
                    ['party_packing_size', 'Pack Size', 't'], ['our_party_item_code', 'Our Party Code', 't'], ['content', 'Content', 't'],
                    ['capacity', 'Capacity', 't'], ['barcode_item_name', 'Barcode Item Name', 't'], ['barcode_outer_label_item_code', 'Outer Label Code', 't'],
                    ['remarks', 'Remarks', 't'], ['gross_weight', 'Gross Weight', 'n'], ['inner_carton_qty', 'Inner Carton Qty', 'n'],
                    ['vendor_code', 'Vendor Code', 't'], ['number_of_design', 'No. of Design', 'n'], ['number_of_color', 'No. of Color', 'n'],
                    ['outer_label_category', 'Outer Label Category', 't'], ['outer_l', 'Outer L', 'n'], ['outer_w', 'Outer W', 'n'],
                    ['outer_h', 'Outer H', 'n'], ['per_pkg_cbm', 'CBM', 'n'], ['action', 'Action', 't']] },
                party: { label: 'Party', cols: [
                    ['party_id', 'Party ID', 'n'], ['party_code', 'Party Code', 't'], ['party_group', 'Party Group', 't'], ['price_group', 'Price Group', 't'],
                    ['party_name', 'Party Name', 't'], ['party_type', 'Party Type', 't'], ['gstin', 'GSTIN', 't'], ['pan', 'PAN', 't'],
                    ['is_unregistered_for_gst', 'Unreg. GST', 't'], ['payment_term', 'Payment Term', 't'], ['credit_days', 'Credit Days', 'n'],
                    ['sales_person', 'Sales Person', 't'], ['address', 'Address', 't'], ['city', 'City', 't'], ['state', 'State', 't'],
                    ['pincode', 'Pincode', 't'], ['contact_number', 'Contact', 't'], ['email', 'Email', 't'], ['is_active', 'Active', 'b'],
                    ['action', 'Action', 't']] },
                rate: { label: 'Rate', cols: [
                    ['our_code', 'Our Code', 't'], ['our_name', 'Our Name', 't'], ['party_group', 'Party Group', 't'], ['price_group', 'Price Group', 't'],
                    ['party_item_code', 'Party Item Code', 't'], ['factory', 'Factory', 't'], ['uom', 'UOM', 't'], ['mrp_price', 'MRP', 'n'],
                    ['offer_price', 'Offer', 'n'], ['rate', 'Rate', 'n'], ['effective_date', 'Effective', 't']] }
            };
            const PAGE = 25;
            const $ = id => document.getElementById(id);
            const api = (url, opt = {}) => JPSMS.api.request(url, { skipLoader: true, ...opt });
            const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            const fmt = (v, t) => v == null || v === '' ? '' : t === 'b' ? (v ? 'Yes' : 'No') : String(v);
            const when = v => v ? new Date(v).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'Never';

            const params = new URLSearchParams(location.search);
            const S = { key: DEFS[params.get('key')] ? params.get('key') : 'item', page: 1, sort: '', dir: 'asc', q: '', total: 0, state: {}, canSync: false, seq: 0 };

            function renderTabs() {
                $('tabs').innerHTML = Object.keys(DEFS).map(k =>
                    `<button class="tab${k === S.key ? ' on' : ''}" data-k="${k}">${DEFS[k].label}</button>`).join('');
            }

            function renderInfo() {
                const st = S.state[S.key] || {};
                const status = st.status === 'ok' ? '<span class="chip ok">OK</span>'
                    : st.status === 'error' ? '<span class="chip err">Error</span>'
                    : `<span class="chip never">${S.configured === false ? 'Not configured' : 'Not synced yet'}</span>`;
                $('info').innerHTML = `<span>Last synced: <b>${esc(when(st.last_success_at))}</b></span>
                    <span>Rows: <b>${Number(st.row_count || 0).toLocaleString('en-IN')}</b></span>
                    <span>Status: ${status}</span>`;
                $('errMsg').hidden = st.status !== 'error' || !st.last_error;
                $('errMsg').textContent = st.last_error ? `Last error: ${st.last_error}` : '';
                $('syncBtn').hidden = !S.canSync;
            }

            async function loadState() {
                try {
                    const res = await api('/erp-masters/sync-state');
                    S.state = {};
                    (res.data || []).forEach(r => { S.state[r.master_key] = r; });
                    S.canSync = !!res.can_sync;
                    S.configured = res.configured;
                } catch (_) { /* toast already shown */ }
                renderInfo();
            }

            function query(page, limit) {
                const qs = new URLSearchParams({ page: String(page), limit: String(limit) });
                if (S.q) qs.set('search', S.q);
                if (S.sort) { qs.set('sort', S.sort); qs.set('dir', S.dir); }
                return api(`/erp-masters/${S.key}/data?${qs}`);
            }

            async function loadRows() {
                const seq = ++S.seq;
                const cols = DEFS[S.key].cols;
                $('grid').innerHTML = `<thead><tr>${cols.map(([c, h, t]) =>
                    `<th data-c="${c}" class="${t === 'n' ? 'num' : ''}">${esc(h)}<span class="s">${S.sort === c ? (S.dir === 'asc' ? '▲' : '▼') : ''}</span></th>`).join('')}</tr></thead>
                    <tbody><tr><td class="empty" colspan="${cols.length}">Loading...</td></tr></tbody>`;
                let res;
                try { res = await query(S.page, PAGE); } catch (_) { if (seq === S.seq) $('grid').tBodies[0].innerHTML = `<tr><td class="empty" colspan="${cols.length}">Could not load rows</td></tr>`; return; }
                if (seq !== S.seq) return;
                S.total = res.total || 0;
                const rows = res.data || [];
                $('grid').tBodies[0].innerHTML = rows.length ? rows.map(r => `<tr>${cols.map(([c, , t]) => {
                    const v = fmt(r[c], t);
                    return `<td class="${t === 'n' ? 'num' : ''}" title="${esc(v)}">${esc(v)}</td>`;
                }).join('')}</tr>`).join('') : `<tr><td class="empty" colspan="${cols.length}">${S.q ? 'No rows match the search' : 'No rows yet'}</td></tr>`;
                renderPager();
            }

            function renderPager() {
                const pages = Math.max(1, Math.ceil(S.total / PAGE));
                const from = S.total ? (S.page - 1) * PAGE + 1 : 0;
                const to = Math.min(S.total, S.page * PAGE);
                $('pager').innerHTML = `<span>${from.toLocaleString('en-IN')}-${to.toLocaleString('en-IN')} of ${S.total.toLocaleString('en-IN')}</span>
                    <button class="btn" data-p="1" ${S.page <= 1 ? 'disabled' : ''}><i class="bi bi-chevron-double-left"></i></button>
                    <button class="btn" data-p="${S.page - 1}" ${S.page <= 1 ? 'disabled' : ''}><i class="bi bi-chevron-left"></i></button>
                    <span>Page ${S.page} of ${pages}</span>
                    <button class="btn" data-p="${S.page + 1}" ${S.page >= pages ? 'disabled' : ''}><i class="bi bi-chevron-right"></i></button>
                    <button class="btn" data-p="${pages}" ${S.page >= pages ? 'disabled' : ''}><i class="bi bi-chevron-double-right"></i></button>`;
            }

            function loadXlsx() {
                if (window.XLSX) return Promise.resolve();
                return new Promise((ok, fail) => {
                    const s = document.createElement('script');
                    s.src = '/assets/vendor/jsdelivr/xlsx@0.18.5/xlsx.full.min.js';
                    s.onload = ok; s.onerror = () => fail(new Error('Could not load the Excel library'));
                    document.head.appendChild(s);
                });
            }

            /* All rows matching the current search, fetched page by page from our API. */
            async function exportExcel() {
                const btn = $('xlsBtn');
                const cols = DEFS[S.key].cols;
                btn.disabled = true;
                try {
                    await loadXlsx();
                    const BIG = 5000;
                    const all = [];
                    for (let p = 1; ; p++) {
                        btn.innerHTML = `<i class="bi bi-hourglass-split"></i> ${all.length.toLocaleString('en-IN')} rows...`;
                        const res = await query(p, BIG);
                        all.push(...(res.data || []));
                        if (!res.data || res.data.length < BIG || all.length >= res.total) break;
                    }
                    const aoa = [cols.map(c => c[1])].concat(all.map(r => cols.map(([c, , t]) => {
                        const v = r[c];
                        if (v == null || v === '') return '';
                        if (t === 'b') return v ? 'Yes' : 'No';
                        if (t === 'n' && Number.isFinite(Number(v))) return Number(v);
                        return String(v);
                    })));
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), `ERP ${DEFS[S.key].label} Master`);
                    XLSX.writeFile(wb, `ERP_${DEFS[S.key].label}_Master_${new Date().toISOString().slice(0, 10)}.xlsx`);
                } catch (err) {
                    if (window.JPSMS && JPSMS.toast) JPSMS.toast(err.message || 'Export failed', 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-file-earmark-excel"></i> Excel';
                }
            }

            async function syncNow() {
                const btn = $('syncBtn');
                btn.disabled = true;
                btn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Syncing...';
                try {
                    const res = await api('/erp-masters/sync-now', { method: 'POST' }).catch(() => null);
                    if (res && res.skipped && JPSMS.toast) JPSMS.toast('A sync is already running', 'info');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Sync now';
                    await loadState();
                    loadRows();
                }
            }

            function switchTo(key) {
                S.key = key; S.page = 1; S.sort = ''; S.dir = 'asc';
                history.replaceState(null, '', `?key=${key}`);
                renderTabs(); renderInfo(); loadRows();
            }

            $('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b && b.dataset.k !== S.key) switchTo(b.dataset.k); });
            $('grid').addEventListener('click', e => {
                const th = e.target.closest('th'); if (!th) return;
                if (S.sort === th.dataset.c) S.dir = S.dir === 'asc' ? 'desc' : 'asc'; else { S.sort = th.dataset.c; S.dir = 'asc'; }
                S.page = 1; loadRows();
            });
            $('pager').addEventListener('click', e => { const b = e.target.closest('button[data-p]'); if (b && !b.disabled) { S.page = Number(b.dataset.p); loadRows(); } });
            let t;
            $('q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { S.q = $('q').value.trim(); S.page = 1; loadRows(); }, 350); });
            $('xlsBtn').addEventListener('click', exportExcel);
            $('syncBtn').addEventListener('click', syncNow);

            if (window.JPSMS && JPSMS.renderShell) JPSMS.renderShell();
            renderTabs();
            loadState();
            loadRows();
            setInterval(loadState, 60 * 1000);
        })();
    </script>
</body>

</html>
