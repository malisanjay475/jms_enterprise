            document.getElementById('dtBody').innerHTML = dt.length ? dt.map(x => `<tr><td>${esc(x[0])}</td><td class="r">${Math.round(num(x[1])).toLocaleString()}</td><td class="r">${dtTotal ? ((num(x[1]) / dtTotal) * 100).toFixed(1) : 0}%</td></tr>`).join('') : '<tr><td colspan="3" style="text-align:center;color:#94a3b8;padding:14px">No downtime</td></tr>';

            // Quality: cycle actual vs std
            const stdCT = Math.round(num((data.loss || {}).std_cycle) || num((data.info || {}).std_cycle));
            const avgCT = Math.round(num((data.info || {}).act_cycle));
            mkChart('ctChart', { type: 'bar', data: { labels: ['Actual', 'Standard'], datasets: [{ data: [avgCT, stdCT], backgroundColor: [avgCT > stdCT && stdCT > 0 ? '#ef4444' : '#3b82f6', '#10b981'], barThickness: 64, borderRadius: 8 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => c.parsed.y + ' sec' } } }, scales: { y: { beginAtZero: true, title: { display: true, text: 'seconds' } }, x: { grid: { display: false } } } } });
        }

        /* =========================================
           ORDER LIFECYCLE + LOSS
           ========================================= */
        function esc(v) {
            return String(v == null ? '' : v)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function fmtDate(d) { return d ? new Date(d).toLocaleDateString() : '—'; }
        function gapChip(days) {
            if (days == null) return '';
            const c = days <= 1 ? '#10b981' : days <= 3 ? '#f59e0b' : '#ef4444';
            return `<div style="font-size:0.7rem; color:${c}; font-weight:700; margin-top:2px">+${days}d</div>`;
        }
        function renderLifecycle(lc) {
            const el = document.getElementById('lifecycleStepper');
            if (!el) return;
            const g = lc.gaps || {};
            const steps = [
                { label: 'OR Date', date: lc.or_date, icon: 'file-earmark-text', gap: null },
                { label: 'JC Converted', date: lc.jc_date, icon: 'card-checklist', gap: g.or_to_jc },
                { label: 'Planned', date: lc.plan_date, icon: 'calendar2-check', gap: g.jc_to_plan },
                { label: 'Production Start', date: lc.prod_start, icon: 'play-circle', gap: g.plan_to_prod },
                { label: (lc.status || 'Latest'), date: lc.prod_last, icon: 'flag', gap: g.prod_span }
            ];
            el.innerHTML = steps.map((s, i) => `
                <div style="flex:1; min-width:120px; text-align:center; position:relative">
                    ${i > 0 ? `<div style="position:absolute; left:-50%; top:18px; width:100%; height:2px; background:#e2e8f0; z-index:0"></div>` : ''}
                    <div style="position:relative; z-index:1; width:38px; height:38px; margin:0 auto; border-radius:50%; background:${s.date ? 'linear-gradient(135deg,#024c81,#01a8dd)' : '#e2e8f0'}; color:#fff; display:flex; align-items:center; justify-content:center">
                        <i class="bi bi-${s.icon}"></i>
                    </div>
                    <div style="font-size:0.78rem; font-weight:700; color:#334155; margin-top:8px">${s.label}</div>
                    <div style="font-size:0.75rem; color:#64748b">${fmtDate(s.date)}</div>
                    ${gapChip(s.gap)}
                </div>`).join('');
        }

        function lossCard(label, value, sub, color) {
            return `<div style="background:#f8fafc; border-radius:10px; padding:12px 14px; border-left:3px solid ${color}">
                <div style="font-size:0.72rem; color:#64748b; font-weight:600">${label}</div>
                <div style="font-size:1.3rem; font-weight:800; color:#1e293b">${value}</div>
                ${sub ? `<div style="font-size:0.72rem; color:#94a3b8">${sub}</div>` : ''}
            </div>`;
        }
        function renderLoss(loss) {
            const el = document.getElementById('lossCards');
            if (!el) return;
            const money = loss.money_loss_per_shift != null ? `₹${Number(loss.money_loss_per_shift).toLocaleString()}`
                : loss.money_loss_per_machine_hour != null ? `₹${Number(loss.money_loss_per_machine_hour).toLocaleString()}`
                    : 'Set ₹ rate';
            el.innerHTML = [
                lossCard('STD Time', `${loss.std_hours || 0} h`, `${loss.std_shifts || 0} shifts`, '#10b981'),
                lossCard('Actual Time', `${loss.actual_hours || 0} h`, `${loss.actual_shifts || 0} shifts`, '#3b82f6'),
                lossCard('Shift Loss', `${loss.shift_loss || 0}`, `${loss.total_loss_hours || 0} h lost`, '#f59e0b'),
                lossCard('Factory Loss', money, loss.rate_per_shift ? `@ ₹${loss.rate_per_shift}/shift` : (loss.rate_per_machine_hour ? `@ ₹${loss.rate_per_machine_hour}/mc-hr` : 'enter a rate'), '#ef4444')
            ].join('');

            // Waterfall: STD -> +downtime -> +cycle slip -> +reject -> Actual
            const cvs = document.getElementById('lossWaterfall');
            if (!cvs) return;
            if (orderCharts['lossWaterfall']) orderCharts['lossWaterfall'].destroy();
            const std = loss.std_hours || 0;
            const dt = loss.downtime_hours || 0;
            const cyc = loss.cycle_loss_hours || 0;
            const rej = loss.reject_loss_hours || 0;
            orderCharts['lossWaterfall'] = new Chart(cvs, {
                type: 'bar',
                data: {
                    labels: ['STD', 'Downtime', 'Slow Cycle', 'Rejects', 'Actual'],
                    datasets: [{
                        label: 'Hours',
                        data: [std, dt, cyc, rej, loss.actual_hours || 0],
                        backgroundColor: ['#10b981', '#f59e0b', '#8b5cf6', '#ef4444', '#3b82f6'],
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false }, title: { display: true, text: 'Time Loss Waterfall (hours)', font: { size: 11 } } },
                    scales: { y: { beginAtZero: true } }
                }
            });
        }
        function onLossRateChange() {
            AnalyzeFilters.lossPerShift = parseFloat(document.getElementById('rateShift').value) || 0;
            AnalyzeFilters.lossPerMachineHour = parseFloat(document.getElementById('rateMcHr').value) || 0;
            // Re-fetch current order with new rates (loss is computed server-side)
            if (currentOrderData && currentOrderData.info) {
                const on = currentOrderData.info.order_no || document.getElementById('modalTitle').textContent;
                if (on) loadOrderDetails(on);
            }
        }

        /* =========================================
           MOULD LOGIC
           ========================================= */
        let mouldCharts = {};

        async function searchMould() {
            const code = document.getElementById('mouldSearchInput').value.trim();
            if (!code) return JPSMS.toast('Enter Mould Name/Code', 'warning');

            const dashboard = document.getElementById('mouldDashboard');
            const errorDiv = document.getElementById('mouldError');
            dashboard.style.display = 'none';
            errorDiv.style.display = 'none';

            JPSMS.toast('Analyzing Mould Data...', 'info');

            const url = `/analyze/mould/${encodeURIComponent(code)}` + filterQS();

            try {
                const res = await JPSMS.api.get(url);
                if (res.ok) {
                    renderMouldDashboard(res.data);
                    dashboard.style.display = 'block';
                } else {
                    errorDiv.textContent = res.error || 'No data found';
                    errorDiv.style.display = 'block';
                }
            } catch (e) {
                errorDiv.textContent = e.message;
                errorDiv.style.display = 'block';
            }
        }

        function switchMouldTab(tab) {
            const isDetail = tab === 'detail';
            document.getElementById('mouldSummary').style.display = isDetail ? 'none' : 'block';
            document.getElementById('mouldDetail').style.display = isDetail ? 'block' : 'none';
            document.getElementById('mTabSummary').classList.toggle('active', !isDetail);
            document.getElementById('mTabDetail').classList.toggle('active', isDetail);
        }

        // Populate mould autocomplete from master and quick chips
        async function loadMouldOptions() {
            const dl = document.getElementById('mouldOptions');
            const chipsEl = document.getElementById('mouldQuickChips');
            if (!dl) return;
            try {
                const res = await JPSMS.api.get('/masters/moulds');
                const rows = (res && (res.data || res)) || [];
                if (Array.isArray(rows) && rows.length) {
                    dl.innerHTML = rows.slice(0, 500).map(m =>
                        `<option value="${(m.mould_number || m.mould_name || '').replace(/"/g, '&quot;')}">${m.mould_name || ''}</option>`).join('');

                    if (chipsEl) {
                        chipsEl.innerHTML = `<span style="font-size:0.75rem; color:#64748b; font-weight:600; margin-right:4px">Quick suggestions:</span>` +
                            rows.slice(0, 8).map(m => {
                                const code = (m.mould_number || m.mould_name || '').trim();
                                if (!code) return '';
                                return `<button type="button" class="btn btn-sm btn-outline-secondary" style="border-radius:20px; font-size:0.75rem; padding:2px 10px; background:#fff" onclick="pickQuickMould('${code.replace(/'/g, "\\'")}')">${esc(code)}</button>`;
                            }).join('');
                    }
                }
            } catch (e) { /* optional */ }
        }

        function pickQuickMould(code) {
            const inp = document.getElementById('mouldSearchInput');
            if (inp) {
                inp.value = code;
                searchMould();
            }
        }

        function renderMouldDashboard(data) {
            const { mould, kpi, rejections, downtime, trend } = data;
            const detail = data.detail || { machines: [], orders: [] };

            // Title
            document.getElementById('mTitle').textContent = mould.mould_name || mould.mould_number || '-';
            document.getElementById('mSub').textContent =
                `${mould.mould_number || ''}${mould.no_of_cav ? ' · ' + mould.no_of_cav + ' cav' : ''}${mould.cycle_time ? ' · STD ' + mould.cycle_time + 's' : ''}`;

            // Modern KPI Cards
            const mkpisEl = document.getElementById('mouldKpis');
            if (mkpisEl) {
                mkpisEl.innerHTML = [
                    supKpiCard('Total Output', fmtNum(kpi.totalOutput), `${kpi.totalRunHours || 0} run hrs`, '#10b981', 'box-seam'),
                    supKpiCard('Rejection Rate', `${kpi.rejRate}%`, `${fmtNum(kpi.totalReject)} scrap pcs`, kpi.rejRate > 5 ? '#ef4444' : '#f59e0b', 'x-octagon'),
                    supKpiCard('Avg Cycle Time', `${kpi.avgCycleTime}s`, `Std: ${kpi.stdCycle || mould.cycle_time || '-'}s`, '#3b82f6', 'stopwatch'),
                    supKpiCard('Total Downtime', dtFmtMin(kpi.totalDowntime || 0), 'loss duration', '#f59e0b', 'hourglass-split'),
                    supKpiCard('Mould OEE', `${kpi.oee}%`, `A${kpi.availability} P${kpi.performance} Q${kpi.quality}`, oeeColor(kpi.oee), 'speedometer2')
                ].join('');
            }

            // Detail tables
            const rowFor = (r) => `<tr><td style="font-weight:600">${esc(r.key)}</td><td class="text-end" style="font-weight:700">${fmtNum(r.good || 0)}</td><td class="text-end" style="color:${r.reject > 0 ? '#ef4444' : '#94a3b8'}">${fmtNum(r.reject || 0)}</td><td class="text-end">${dtFmtMin(r.downtime || 0)}</td></tr>`;
            document.getElementById('mDetailMachines').innerHTML = detail.machines.length ? detail.machines.map(rowFor).join('') : '<tr><td colspan="4" class="text-center p-3 text-muted">No machine data</td></tr>';
            document.getElementById('mDetailOrders').innerHTML = detail.orders.length ? detail.orders.map(rowFor).join('') : '<tr><td colspan="4" class="text-center p-3 text-muted">No order data</td></tr>';

            // Reset to Summary tab on each search
            switchMouldTab('summary');

            // --- CHARTS ---
            if (mouldCharts.rej) mouldCharts.rej.destroy();
            if (mouldCharts.down) mouldCharts.down.destroy();
            if (mouldCharts.trend) mouldCharts.trend.destroy();

            // 1. Rejection Pareto (Bar)
            const rejLabels = rejections.slice(0, 10).map(r => r.reason);
            const rejData = rejections.slice(0, 10).map(r => r.qty);

            mouldCharts.rej = new Chart(document.getElementById('mouldRejChart'), {
                type: 'bar',
                data: {
                    labels: rejLabels,
                    datasets: [{
                        label: 'Reject Qty',
                        data: rejData,
                        backgroundColor: '#ef4444',
                        borderRadius: 4,
                        maxBarThickness: 22
                    }]
                },
                options: {
                    indexAxis: 'y', // Horizontal Bar for better readable labels
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { beginAtZero: true, grid: { color: '#f1f5f9' } }, y: { grid: { display: false } } }
                }
            });

            // 2. Downtime (Doughnut)
            let dtLabels = [];
            let dtData = [];
            let otherSum = 0;
            downtime.forEach((d, i) => {
                if (i < 5) {
                    dtLabels.push(d.reason);
                    dtData.push(d.min);
                } else {
                    otherSum += d.min;
                }
            });
            if (otherSum > 0) {
                dtLabels.push('Others');
                dtData.push(otherSum);
            }

            mouldCharts.down = new Chart(document.getElementById('mouldDownChart'), {
                type: 'doughnut',
                data: {
                    labels: dtLabels,
                    datasets: [{
                        data: dtData,
                        backgroundColor: dtLabels.map((_, i) => dtReasonColor(i)),
                        borderColor: '#fff', borderWidth: 2, hoverOffset: 6
                    }]
                },
                options: { cutout: '65%', responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11 } } }, tooltip: { callbacks: { label: c => `${c.label}: ${dtFmtMin(c.parsed)}` } } } }
            });

            // 3. Trend (Line)
            mouldCharts.trend = new Chart(document.getElementById('mouldTrendChart'), {
                type: 'line',
                data: {
                    labels: trend.map(t => new Date(t.date).toLocaleDateString()),
                    datasets: [
                        {
                            label: 'Good Qty',
                            data: trend.map(t => t.good),
                            borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.12)',
                            tension: 0.3, fill: true
                        },
                        {
                            label: 'Reject Qty',
                            data: trend.map(t => t.reject),
                            borderColor: '#ef4444',
                            tension: 0.3, fill: false
                        }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { position: 'bottom' } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true, grid: { color: '#f1f5f9' } } } }
            });
        }

        /* =========================================
           SUPERVISOR LOGIC
           ========================================= */
        let supChartInstance = null;
        let allSupervisorsData = [];

        const KPI_ICONS = {
            'machines': 'cpu', 'machine': 'cpu', 'total output': 'box-seam', 'output': 'box-seam',
            'total good': 'check-circle', 'good': 'check-circle', 'total reject': 'x-octagon',
            'reject': 'x-octagon', 'downtime': 'hourglass-split',
            'total downtime': 'hourglass-split', 'downtime events': 'exclamation-triangle',
            'supervisors': 'person-badge', 'worst machine': 'cpu', 'top reason': 'flag',
            'rejection rate': 'x-octagon', 'oee': 'speedometer2', 'avg cycle time': 'stopwatch'
        };

        function supKpiCard(label, value, sub, color, icon) {
            const ic = icon || KPI_ICONS[String(label || '').toLowerCase()] || 'graph-up';
            return `<div class="kpi-card" style="--kpi-accent:${color}">
                <div class="kpi-top">
                    <span class="kpi-label">${label}</span>
                    <span class="kpi-ic"><i class="bi bi-${ic}"></i></span>
                </div>
                <div class="kpi-value">${value}</div>
                ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}
            </div>`;
        }

        function getSupGrade(s) {
            const rej = Number(s.rejRate) || 0;
            if (rej <= 2.0) return '<span class="table-badge badge-green">A+</span>';
            if (rej <= 4.0) return '<span class="table-badge badge-green">A</span>';
            if (rej <= 7.0) return '<span class="table-badge badge-amber">B</span>';
            return '<span class="table-badge badge-red">C</span>';
        }

        function renderSupervisorsTable(sups) {
            const body = document.getElementById('supTableBody');
            if (!body) return;
            if (!sups.length) {
                body.innerHTML = '<tr><td colspan="11" class="text-center p-4" style="color:#94a3b8">No matching supervisors found</td></tr>';
                return;
            }
            body.innerHTML = sups.map(s => `
                <tr>
                    <td style="font-weight:700; color:#1e293b">${esc(s.name)}${s.matched ? '' : ' <span style="font-size:0.7rem; color:#f59e0b" title="No matching user account">(unmatched)</span>'}</td>
                    <td style="color:#64748b">${esc(s.role || '-')}</td>
                    <td>${getSupGrade(s)}</td>
                    <td class="text-end" style="font-weight:700">${fmtNum(s.good)}</td>
                    <td class="text-end" style="color:${s.reject > 0 ? '#ef4444' : '#94a3b8'}">${fmtNum(s.reject)}</td>
                    <td class="text-end" style="color:${s.rejRate > 5 ? '#ef4444' : '#64748b'}; font-weight:600">${s.rejRate}%</td>
                    <td class="text-end">${dtFmtMin(s.downtime)}</td>
                    <td class="text-end">${s.shifts}</td>
                    <td class="text-end">${s.entries}</td>
                    <td class="text-end">${s.machines}</td>
                    <td class="text-end" style="font-weight:600">${fmtNum(s.avgPerShift)}</td>
                </tr>`).join('');
        }

        function filterSupervisorsLocal() {
            const q = (document.getElementById('supSearchInput')?.value || '').toLowerCase().trim();
            const filtered = allSupervisorsData.filter(s => {
                if (!q) return true;
                return (s.name || '').toLowerCase().includes(q) || (s.role || '').toLowerCase().includes(q);
            });
            renderSupervisorsTable(filtered);
        }

        async function loadSupervisorAnalysis() {
            const body = document.getElementById('supTableBody');
            try {
                const res = await JPSMS.api.get('/analyze/supervisor' + filterQS());
                if (!res.ok) {
                    if (body) body.innerHTML = `<tr><td colspan="11" class="text-center p-4 text-danger">${res.error || 'No data'}</td></tr>`;
                    return;
                }
                const sups = res.data.supervisors || [];
                allSupervisorsData = sups;
                const t = res.data.totals || {};

                const kpisEl = document.getElementById('supKpis');
                if (kpisEl) {
                    kpisEl.innerHTML = [
                        supKpiCard('Supervisors', t.supervisors || 0, `${t.entries || 0} shift logs`, '#3b82f6', 'person-badge'),
                        supKpiCard('Total Good Output', fmtNum(t.good || 0), 'pcs produced', '#10b981', 'check-circle'),
                        supKpiCard('Total Rejections', fmtNum(t.reject || 0), `${t.rejRate || 0}% overall rate`, '#ef4444', 'x-octagon'),
                        supKpiCard('Total Downtime', dtFmtMin(t.downtime || 0), 'owned across shifts', '#f59e0b', 'hourglass-split')
                    ].join('');
                }

                // Top 3 Podium Cards
                const podiumEl = document.getElementById('supPodium');
                if (podiumEl) {
                    if (sups.length >= 2) {
                        podiumEl.style.display = 'flex';
                        const p1 = sups[0];
                        const p2 = sups[1];
                        const p3 = sups[2] || null;

                        const renderPodCard = (s, placeClass, rankLabel, medal) => `
                            <div class="podium-card ${placeClass}">
                                <div class="podium-rank-badge">${medal} ${rankLabel}</div>
                                <div class="podium-avatar"><i class="bi bi-person-fill"></i></div>
                                <div class="podium-name" title="${esc(s.name)}">${esc(s.name)}</div>
                                <div class="podium-role">${esc(s.role || 'Shift Supervisor')}</div>
                                <div class="podium-stat">
                                    <div class="stat-val" style="color:#10b981">${fmtNum(s.good)}</div>
                                    <div class="stat-lbl">Good Pcs Produced</div>
                                </div>
                                <div style="display:flex; justify-content:space-around; width:100%; margin-top:12px; font-size:0.75rem; color:#64748b; border-top:1px dashed #cbd5e1; padding-top:8px">
                                    <span>Rej: <b style="color:${s.rejRate > 5 ? '#ef4444' : '#64748b'}">${s.rejRate}%</b></span>
                                    <span>DT: <b>${dtFmtMin(s.downtime)}</b></span>
                                </div>
                            </div>
                        `;

                        let podiumHtml = '';
                        if (p2) podiumHtml += renderPodCard(p2, 'silver', '#2 Performer', '🥈');
                        if (p1) podiumHtml += renderPodCard(p1, 'gold', '#1 Top Producer', '🥇');
                        if (p3) podiumHtml += renderPodCard(p3, 'bronze', '#3 Performer', '🥉');
                        podiumEl.innerHTML = podiumHtml;
                    } else {
                        podiumEl.style.display = 'none';
                    }
                }

                renderSupervisorsTable(sups);

                if (!sups.length) return;

                // Leaderboard chart (top 12 by good, good vs reject stacked)
                const top = sups.slice(0, 12);
                const ctx = document.getElementById('supChart');
                if (supChartInstance) supChartInstance.destroy();
                if (ctx) {
                    supChartInstance = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: top.map(s => s.name),
                            datasets: [
                                { label: 'Good Output', data: top.map(s => s.good), backgroundColor: '#10b981', borderRadius: 4 },
                                { label: 'Rejection Scrap', data: top.map(s => s.reject), backgroundColor: '#ef4444', borderRadius: 4 }
                            ]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            plugins: { legend: { position: 'bottom' } },
                            scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true } }
                        }
                    });
                }
            } catch (e) {
                if (body) body.innerHTML = `<tr><td colspan="11" class="text-center p-4 text-danger">${e.message}</td></tr>`;
            }
        }

        /* =========================================
           PLANT LOGIC
           ========================================= */
        let plantCharts = {};
        let plantDateWiseData = [];
        let currentPlantTrendMetric = 'all';

        function oeeColor(v) { return v >= 85 ? '#10b981' : v >= 60 ? '#f59e0b' : '#ef4444'; }

        function setPlantTrendMetric(metric, btn) {
            currentPlantTrendMetric = metric;
            const container = document.getElementById('plantTrendToggles');
            if (container) {
                container.querySelectorAll('.chart-toggle').forEach(b => {
                    const oc = b.getAttribute('onclick') || '';
                    b.classList.toggle('active', oc.includes(`'${metric}'`));
                });
            }
            renderPlantTrendChart();
        }

        function renderPlantTrendChart() {
            const canvas = document.getElementById('plantTrend');
            if (!canvas) return;
            if (plantCharts.trend) {
                plantCharts.trend.destroy();
                plantCharts.trend = null;
            }

            const bdAll = plantDateWiseData || [];
            const MAX_POINTS = 90;
            const bd = bdAll.length > MAX_POINTS ? bdAll.slice(-MAX_POINTS) : bdAll;
            const dense = bd.length > 45;
            const trendNote = document.getElementById('plantTrendNote');
            if (trendNote) {
                trendNote.textContent = bdAll.length > MAX_POINTS
                    ? `showing last ${MAX_POINTS} of ${bdAll.length} days`
                    : `${bd.length} days recorded`;
            }

            const labels = bd.map(d => new Date(d.key).toLocaleDateString());
            const datasets = [];

            // Target benchmark dashed line at 85%
            datasets.push({
                label: 'World-Class Target (85%)',
                data: bd.map(() => 85),
                borderColor: '#10b981',
                borderDash: [6, 4],
                borderWidth: 1.5,
                pointRadius: 0,
                fill: false
            });

            const m = currentPlantTrendMetric;
            if (m === 'all') {
                datasets.push({
                    label: 'OEE',
                    data: bd.map(d => d.oee),
                    borderColor: '#024c81',
                    backgroundColor: 'rgba(1,168,221,0.12)',
                    fill: true,
                    tension: 0.25,
                    borderWidth: 2.5,
                    pointRadius: dense ? 0 : 2
                });
                datasets.push(
                    { label: 'Availability', data: bd.map(d => d.availability), borderColor: '#3b82f6', tension: 0.25, fill: false, pointRadius: 0, borderWidth: 1.5 },
                    { label: 'Performance', data: bd.map(d => d.performance), borderColor: '#8b5cf6', tension: 0.25, fill: false, pointRadius: 0, borderWidth: 1.5 },
                    { label: 'Quality', data: bd.map(d => d.quality), borderColor: '#f59e0b', tension: 0.25, fill: false, pointRadius: 0, borderWidth: 1.5 }
                );
            } else if (m === 'oee') {
                datasets.push({
                    label: 'OEE',
                    data: bd.map(d => d.oee),
                    borderColor: '#024c81',
                    backgroundColor: 'rgba(1,168,221,0.18)',
                    fill: true,
                    tension: 0.25,
                    borderWidth: 2.5,
                    pointRadius: dense ? 0 : 3
                });
            } else if (m === 'avail') {
                datasets.push({
                    label: 'Availability',
                    data: bd.map(d => d.availability),
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59,130,246,0.15)',
                    fill: true,
                    tension: 0.25,
                    borderWidth: 2,
                    pointRadius: dense ? 0 : 3
                });
            } else if (m === 'perf') {
                datasets.push({
                    label: 'Performance',
                    data: bd.map(d => d.performance),
                    borderColor: '#8b5cf6',
                    backgroundColor: 'rgba(139,92,246,0.15)',
                    fill: true,
                    tension: 0.25,
                    borderWidth: 2,
                    pointRadius: dense ? 0 : 3
                });
            } else if (m === 'qual') {
                datasets.push({
                    label: 'Quality',
                    data: bd.map(d => d.quality),
                    borderColor: '#f59e0b',
                    backgroundColor: 'rgba(245,158,11,0.15)',
                    fill: true,
                    tension: 0.25,
                    borderWidth: 2,
                    pointRadius: dense ? 0 : 3
                });
            }

            plantCharts.trend = new Chart(canvas, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 10 } },
                        tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${c.parsed.y}%` } }
                    },
                    scales: {
                        x: { grid: { display: false }, ticks: { maxTicksLimit: 12, autoSkip: true, maxRotation: 0 } },
                        y: { beginAtZero: true, max: 100, grid: { color: '#f1f5f9' }, ticks: { callback: v => v + '%' } }
                    }
                }
            });
        }

        async function loadPlantAnalysis() {
            const kpis = document.getElementById('plantKpis');
            if (kpis) kpis.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:30px; color:#94a3b8"><div class="spinner-border spinner-border-sm text-primary"></div> Loading…</div>';
            let data;
            try {
                const res = await JPSMS.api.get('/analyze/plant' + filterQS());
                if (!res.ok) {
                    if (kpis) kpis.innerHTML = `<div style="grid-column:1/-1; color:#ef4444; text-align:center; padding:20px">${res.error || 'No data'}</div>`;
                    return;
                }
                data = res.data;
            } catch (e) {
                if (kpis) kpis.innerHTML = `<div style="grid-column:1/-1; color:#ef4444; text-align:center; padding:20px">${e.message}</div>`;
                return;
            }

            const o = data.overall || {};
            if (kpis) {
                kpis.innerHTML = [
                    supKpiCard('Overall Plant OEE', `${o.oee || 0}%`, 'Availability × Perf × Quality', oeeColor(o.oee || 0), 'speedometer2'),
                    supKpiCard('Availability', `${o.availability || 0}%`, `${o.runHours || 0} run hours`, '#3b82f6', 'hourglass-split'),
                    supKpiCard('Performance', `${o.performance || 0}%`, 'vs STD capacity', '#8b5cf6', 'lightning-charge'),
                    supKpiCard('Quality', `${o.quality || 0}%`, `${fmtNum(o.reject || 0)} scrap pcs`, '#ef4444', 'x-octagon'),
                    supKpiCard('Total Output', fmtNum(o.output || 0), `${dtFmtMin(o.downtime || 0)} downtime`, '#10b981', 'box-seam')
                ].join('');
            }

            // Update OEE Status Badge
            const badgeEl = document.getElementById('plantOeeStatusBadge');
            if (badgeEl) {
                const v = o.oee || 0;
                badgeEl.className = 'kpi-badge ' + (v >= 85 ? 'optimal' : v >= 60 ? 'warning' : 'danger');
                badgeEl.textContent = (v >= 85 ? 'World Class (85%+)' : v >= 60 ? 'Acceptable (60-84%)' : 'Below Target (<60%)');
            }

            Object.values(plantCharts).forEach(c => c && c.destroy());
            plantCharts = {};

            // OEE gauge (doughnut with target text)
            const gaugeCanvas = document.getElementById('plantOeeGauge');
            if (gaugeCanvas) {
                const oeeVal = o.oee || 0;
                plantCharts.gauge = new Chart(gaugeCanvas, {
                    type: 'doughnut',
                    data: {
                        labels: ['OEE', 'Remaining'],
                        datasets: [{
                            data: [oeeVal, Math.max(0, 100 - oeeVal)],
                            backgroundColor: [oeeColor(oeeVal), '#e2e8f0'],
                            borderWidth: 0,
                            borderRadius: [6, 0]
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '74%',
                        plugins: { legend: { display: false }, tooltip: { enabled: false } }
                    },
                    plugins: [{
                        id: 'oeeText',
                        afterDraw: (ch) => {
                            const { ctx, chartArea } = ch;
                            const x = (chartArea.left + chartArea.right) / 2;
                            const y = (chartArea.top + chartArea.bottom) / 2;
                            ctx.save();
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.font = 'bold 30px system-ui, sans-serif';
                            ctx.fillStyle = oeeColor(oeeVal);
                            ctx.fillText(`${oeeVal}%`, x, y - 7);
                            ctx.font = '600 11px system-ui, sans-serif';
                            ctx.fillStyle = '#64748b';
                            ctx.fillText('Target: 85%', x, y + 15);
                            ctx.restore();
                        }
                    }]
                });
            }

            // Date-wise OEE trend
            plantDateWiseData = data.byDate || [];
            renderPlantTrendChart();

            // Line-wise OEE bar
            const bl = data.byLine || [];
            const linesCanvas = document.getElementById('plantLines');
            if (linesCanvas) {
                plantCharts.lines = new Chart(linesCanvas, {
                    type: 'bar',
                    data: {
                        labels: bl.map(l => l.key),
                        datasets: [{ label: 'OEE %', data: bl.map(l => l.oee), backgroundColor: bl.map(l => oeeColor(l.oee)), borderRadius: 4, maxBarThickness: 46 }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `OEE: ${c.parsed.y}%` } } },
                        scales: { x: { grid: { display: false } }, y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } } }
                    }
                });
            }

            // Loss Pareto
            const lr = (data.lossReasons || []).slice(0, 10);
            const lossCanvas = document.getElementById('plantLoss');
            if (lossCanvas) {
                plantCharts.loss = new Chart(lossCanvas, {
                    type: 'bar',
                    data: {
                        labels: lr.map(r => r.reason),
                        datasets: [{ label: 'Downtime', data: lr.map(r => r.min), backgroundColor: '#f59e0b', borderRadius: 4, maxBarThickness: 22 }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `Downtime: ${dtFmtMin(c.parsed.x)}` } } },
                        scales: { y: { grid: { display: false } }, x: { beginAtZero: true } }
                    }
                });
            }
        }

        /* =========================================
           MACHINE LOGIC
           ========================================= */
        let machineCharts = {};
        let allMachinesData = [];

        function renderMachinesTable(machines) {
            const body = document.getElementById('mcTableBody');
            if (!body) return;
            if (!machines.length) {
                body.innerHTML = '<tr><td colspan="11" class="text-center p-4" style="color:#94a3b8">No matching machines found</td></tr>';
                return;
            }
            body.innerHTML = machines.map((m) => `
                <tr style="cursor:pointer" data-mc-name="${esc(m.key)}">
                    <td style="font-weight:700; color:#1e293b">${esc(m.key)}</td>
                    <td style="color:#64748b">${esc(m.line || '-')}</td>
                    <td class="text-end">
                        <div class="table-bar" style="justify-content:flex-end">
                            <span style="font-weight:700; width:36px; text-align:right">${m.utilization}%</span>
                            <div class="table-bar-track" style="width:55px">
                                <div class="table-bar-fill" style="width:${Math.min(100, m.utilization)}%; background:${m.utilization >= 75 ? '#10b981' : m.utilization >= 50 ? '#3b82f6' : '#f59e0b'}"></div>
                            </div>
                        </div>
                    </td>
                    <td class="text-end" style="color:${oeeColor(m.oee)}; font-weight:800">${m.oee}%</td>
                    <td class="text-end">${m.performance}%</td>
                    <td class="text-end">${m.quality}%</td>
                    <td class="text-end" style="font-weight:700">${fmtNum(m.good)}</td>
                    <td class="text-end" style="color:${m.reject > 0 ? '#ef4444' : '#94a3b8'}">${fmtNum(m.reject)}</td>
                    <td class="text-end">${dtFmtMin(m.downtime)}</td>
                    <td class="text-end">${fmtNum(m.runHours)}</td>
                    <td class="text-end" style="font-weight:600">${m.mouldCount || 0}</td>
                </tr>`).join('');

            body.onclick = (ev) => {
                const tr = ev.target.closest('tr[data-mc-name]');
                if (!tr) return;
                const name = tr.getAttribute('data-mc-name');
                if (name) drillMachine(name);
            };
        }

        function filterMachinesLocal() {
            const q = (document.getElementById('mcSearchInput')?.value || '').toLowerCase().trim();
            const filtered = allMachinesData.filter(m => {
                if (!q) return true;
                return (m.key || '').toLowerCase().includes(q) || (m.line || '').toLowerCase().includes(q);
            });
            renderMachinesTable(filtered);
        }

        async function loadMachineAnalysis() {
            const body = document.getElementById('mcTableBody');
            let data;
            try {
                const res = await JPSMS.api.get('/analyze/machine' + filterQS());
                if (!res.ok) {
                    if (body) body.innerHTML = `<tr><td colspan="11" class="text-center p-4 text-danger">${res.error || 'No data'}</td></tr>`;
                    return;
                }
                data = res.data;
            } catch (e) {
                if (body) body.innerHTML = `<tr><td colspan="11" class="text-center p-4 text-danger">${e.message}</td></tr>`;
                return;
            }

            const machines = data.machines || [];
            allMachinesData = machines;
            const t = data.totals || {};

            const mcKpisEl = document.getElementById('mcKpis');
            if (mcKpisEl) {
                mcKpisEl.innerHTML = [
                    supKpiCard('Total Machines', t.machines || 0, 'in active fleet', '#3b82f6', 'cpu'),
                    supKpiCard('Total Fleet Output', fmtNum(t.output || 0), 'pcs manufactured', '#10b981', 'box-seam'),
                    supKpiCard('Total Fleet Scrap', fmtNum(t.reject || 0), `${t.output > 0 ? ((t.reject / t.output) * 100).toFixed(1) : 0}% rej rate`, '#ef4444', 'x-octagon'),
                    supKpiCard('Fleet Downtime', dtFmtMin(t.downtime || 0), 'across machines', '#f59e0b', 'hourglass-split')
                ].join('');
            }

            renderMachinesTable(machines);

            Object.values(machineCharts).forEach(c => c && c.destroy());
            machineCharts = {};
            const top = machines.slice(0, 14);

            const oeeCanvas = document.getElementById('mcOeeChart');
            if (oeeCanvas) {
                machineCharts.oee = new Chart(oeeCanvas, {
                    type: 'bar',
                    data: {
                        labels: top.map(m => m.key),
                        datasets: [{ label: 'OEE %', data: top.map(m => m.oee), backgroundColor: top.map(m => oeeColor(m.oee)), borderRadius: 4, maxBarThickness: 22 }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `OEE: ${c.parsed.x}%` } } },
                        scales: { x: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } }, y: { grid: { display: false } } }
                    }
                });
            }

            const utilCanvas = document.getElementById('mcUtilChart');
            if (utilCanvas) {
                machineCharts.util = new Chart(utilCanvas, {
                    type: 'bar',
                    data: {
                        labels: top.map(m => m.key),
                        datasets: [{ label: 'Utilization %', data: top.map(m => m.utilization), backgroundColor: '#3b82f6', borderRadius: 4, maxBarThickness: 36 }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `Utilization: ${c.parsed.y}%` } } },
                        scales: { x: { grid: { display: false } }, y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } } }
                    }
                });
            }
        }

        async function drillMachine(machine) {
            const wrap = document.getElementById('mcDrill');
            document.getElementById('mcDrillTitle').textContent = `Downtime Breakdown — ${machine}`;
            wrap.style.display = 'block';
            wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            try {
                const res = await JPSMS.api.get('/analyze/machine' + filterQS({ machine }));
                if (!res.ok || !res.data.drill) return;
                const d = res.data.drill;

                ['down', 'trend'].forEach(k => { if (machineCharts['drill_' + k]) machineCharts['drill_' + k].destroy(); });

                const dr = d.downtimeReasons.slice(0, 8);
                machineCharts.drill_down = new Chart(document.getElementById('mcDrillDown'), {
                    type: 'doughnut',
                    data: { labels: dr.length ? dr.map(r => r.reason) : ['No downtime'], datasets: [{ data: dr.length ? dr.map(r => r.min) : [1], backgroundColor: dr.length ? dr.map((_, i) => dtReasonColor(i)) : ['#e2e8f0'], borderColor: '#fff', borderWidth: 2, hoverOffset: 6 }] },
                    options: { responsive: true, maintainAspectRatio: false, cutout: '62%', plugins: { legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11 } } }, tooltip: { callbacks: { label: c => dr.length ? `${c.label}: ${dtFmtMin(c.parsed)}` : 'No downtime' } } } }
                });
                machineCharts.drill_trend = new Chart(document.getElementById('mcDrillTrend'), {
                    type: 'line',
                    data: {
                        labels: d.byDate.map(x => new Date(x.date).toLocaleDateString()),
                        datasets: [
                            { label: 'Good', data: d.byDate.map(x => x.good), borderColor: '#10b981', tension: 0.3, fill: false },
                            { label: 'Reject', data: d.byDate.map(x => x.reject), borderColor: '#ef4444', tension: 0.3, fill: false }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true } } }
                });
            } catch (e) { JPSMS.toast(e.message, 'error'); }
        }

        /* =========================================
           DOWNTIME ANALYZE LOGIC
           ========================================= */
        const REASON_COLORS = ['#ef4444', '#f59e0b', '#3b82f6', '#8b5cf6', '#10b981', '#6366f1', '#0ea5e9', '#e11d48', '#a16207', '#713f12', '#db2777', '#0d9488', '#94a3b8'];
        function dtReasonColor(i) { return REASON_COLORS[i % REASON_COLORS.length]; }
        // Minutes -> compact "Xh Ym" (or "Ym"); used across KPIs, tooltips, tables.
        function dtFmtMin(min) {
            const m = Math.round(min || 0);
            if (m < 60) return m + 'm';
            const h = Math.floor(m / 60), r = m % 60;
            return r ? `${h}h ${r}m` : `${h}h`;
        }
        // Heatmap cell background: pale -> deep red scaled by value/peak.
        function dtHeat(val, peak) {
            if (!val || !peak) return 'transparent';
            const t = Math.min(1, val / peak);
            // interpolate #fff -> #ef4444 (soft) with alpha ramp for readability
            const a = 0.10 + t * 0.78;
            return `rgba(239,68,68,${a.toFixed(2)})`;
        }
        function dtHeatText(val, peak) {
            const t = peak ? Math.min(1, val / peak) : 0;
            return t > 0.55 ? '#fff' : '#7f1d1d';
        }
        const dtTooltipMin = { callbacks: { label: (c) => `${c.dataset.label}: ${dtFmtMin(c.parsed.y != null ? c.parsed.y : c.parsed.x)}` } };
        let dtCharts = {};
        const dtState = { pivot: 'machine', data: null, daily: null, plant: null, reasonKeys: [] };

        function dtYmd(d) { return d.toISOString().slice(0, 10); }
        function dtSetRange(range, btn) {
            document.querySelectorAll('.dt-range').forEach(b => { b.classList.remove('btn-primary'); b.classList.add('btn-outline'); });
            if (btn) { btn.classList.add('btn-primary'); btn.classList.remove('btn-outline'); }
            if (range === 'custom') {
                JPSMS.toast('Pick From / To dates in filter bar, then Apply');
                const fi = document.getElementById('fromDate');
                if (fi) fi.focus();
                return;
            }
            setPreset(range, false);
            loadDowntimeAnalysis();
        }
        function dtSetPivot(pivot) {
            dtState.pivot = pivot;
            document.getElementById('dtPivotMachine').classList.toggle('active', pivot === 'machine');
            document.getElementById('dtPivotDate').classList.toggle('active', pivot === 'date');
            document.getElementById('dtPivotReason').classList.toggle('active', pivot === 'reason');
            if (dtState.data) dtRenderPivot();
        }

        async function loadDowntimeAnalysis() {
            // Default to Last 7 Days if no dates chosen yet
            const from = document.getElementById('fromDate'), to = document.getElementById('toDate');
            if (!from.value && !to.value) { setPreset('7d', false); }
            const body = document.getElementById('dtMatrixBody');
            body.innerHTML = '<tr><td class="text-center p-3"><div class="spinner-border spinner-border-sm text-primary"></div> Loading…</td></tr>';
            try {
                const [main, daily, plant] = await Promise.all([
                    JPSMS.api.get('/analyze/downtime' + filterQS()),
                    JPSMS.api.get('/analyze/downtime/daily' + filterQS()),
                    JPSMS.api.get('/analyze/downtime/plant' + filterQS())
                ]);
                if (!main.ok) { body.innerHTML = `<tr><td class="text-center p-3 text-danger">${main.error || 'No data'}</td></tr>`; return; }
                dtState.data = main.data;
                dtState.daily = daily.ok ? daily.data : { days: [], reasonKeys: [] };
                dtState.plant = plant.ok ? plant.data : { factories: [], gated: true };
                dtRenderKpis();
                dtRenderInsight();
                dtRenderPareto();
                dtRenderDaily();
                dtRenderPlant();
                dtRenderPivot();
            } catch (e) {
                body.innerHTML = `<tr><td class="text-center p-3 text-danger">${e.message}</td></tr>`;
            }
        }

        function dtKpiCard(label, value, sub, accent, icon, clamp) {
            return `<div class="dt-kpi" style="--dt-accent:${accent}">
                <div class="dt-kpi-top">
                    <span class="dt-kpi-label">${label}</span>
                    <span class="dt-kpi-ic"><i class="bi bi-${icon}"></i></span>
                </div>
                <div class="dt-kpi-value${clamp ? ' clamp' : ''}" title="${String(value).replace(/"/g, '')}">${value}</div>
                ${sub ? `<div class="dt-kpi-sub">${sub}</div>` : ''}
            </div>`;
        }
        function dtRenderKpis() {
            const t = dtState.data.totals || {};
            const totalMin = t.totalDowntimeMin || 0;
            const events = t.totalEvents || 0;
            const mttr = events ? Math.round(totalMin / events) : 0;   // avg minutes per downtime event
            document.getElementById('dtKpis').innerHTML = [
                dtKpiCard('Total Downtime', dtFmtMin(totalMin), `${totalMin.toLocaleString()} min lost`, '#ef4444', 'hourglass-bottom'),
                dtKpiCard('Avg per Event', `${mttr}<span style="font-size:.9rem; font-weight:700; color:#94a3b8"> min</span>`, `across ${events.toLocaleString()} events`, '#f59e0b', 'stopwatch'),
                dtKpiCard('Worst Machine', esc(t.worstMachine || '—'), 'highest downtime', '#8b5cf6', 'cpu', true),
                dtKpiCard('Top Loss Reason', esc(t.worstReason || '—'), 'biggest contributor', '#3b82f6', 'exclamation-triangle', true),
                dtKpiCard('Machines Affected', (t.machineCount || 0), `avg ${dtFmtMin(t.avgDowntimePerMachine || 0)} each`, '#10b981', 'diagram-3')
            ].join('');
        }
        // Pareto "vital few" headline — how many reasons make up ~80% of losses.
        function dtRenderInsight() {
            const el = document.getElementById('dtInsight'), txt = document.getElementById('dtInsightTxt');
            if (!el) return;
            const reasons = dtState.data.reasons || [];
            const total = dtState.data.totals && dtState.data.totals.totalDowntimeMin || 0;
            if (!reasons.length || !total) { el.style.display = 'none'; return; }
            let n = 0;
            for (const r of reasons) { n++; if (r.cumulative >= 80) break; }
            const share = reasons[n - 1] ? reasons[n - 1].cumulative : 0;
            const names = reasons.slice(0, n).map(r => r.reason).join(', ');
            el.style.display = 'flex';
            txt.innerHTML = n >= reasons.length
                ? `Downtime is spread across <b>${reasons.length}</b> reasons — no single dominant cause. Top reason: <b>${esc(reasons[0].reason)}</b> (${reasons[0].share}%).`
                : `Just <b>${n}</b> of ${reasons.length} reasons drive <b>${Math.round(share)}%</b> of all downtime — <b>${esc(names)}</b>. Tackle these first for the biggest gain.`;
        }

        function dtRenderPareto() {
            const reasons = (dtState.data.reasons || []).slice(0, 12);
            if (dtCharts.pareto) dtCharts.pareto.destroy();
            dtCharts.pareto = new Chart(document.getElementById('dtParetoChart'), {
                data: {
                    labels: reasons.map(r => r.reason),
                    datasets: [
                        { type: 'bar', label: 'Minutes', data: reasons.map(r => r.min), backgroundColor: reasons.map((_, i) => dtReasonColor(i)), borderRadius: 4, yAxisID: 'y', order: 2 },
                        { type: 'line', label: 'Cumulative %', data: reasons.map(r => r.cumulative), borderColor: '#0f172a', backgroundColor: '#0f172a', tension: 0.2, yAxisID: 'y1', order: 1, pointRadius: 3 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 12, usePointStyle: true } },
                        tooltip: { callbacks: { label: (c) => c.dataset.type === 'line' ? `Cumulative: ${c.parsed.y}%` : `Downtime: ${dtFmtMin(c.parsed.y)}` } }
                    },
                    scales: {
                        x: { grid: { display: false }, ticks: { maxRotation: 40, minRotation: 0, autoSkip: false, font: { size: 10 } } },
                        y: { beginAtZero: true, grid: { color: '#f1f5f9' }, title: { display: true, text: 'Minutes' } },
                        y1: { beginAtZero: true, max: 100, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'Cumulative %' }, ticks: { callback: v => v + '%' } }
                    }
                }
            });
        }

        function dtRenderPivot() {
            const pivot = dtState.pivot;
            document.getElementById('dtRankTitle').textContent = pivot === 'date' ? 'Date-wise Downtime' : pivot === 'reason' ? 'Reason-wise Downtime' : 'Machine-wise Downtime';
            document.getElementById('dtMatrixTitle').textContent =
                pivot === 'date' ? 'Date × Reason — click a row to drill into detail'
                    : pivot === 'reason' ? 'Reason totals — click a row to drill into detail'
                        : 'Machine × Reason — click a row to drill into detail';
            if (pivot === 'machine') dtRenderMachinePivot();
            else if (pivot === 'date') dtRenderDatePivot();
            else dtRenderReasonPivot();
        }

        // Rank (right) chart + matrix table for MACHINE pivot
        function dtRenderMachinePivot() {
            const machines = dtState.data.machines || [];
            const reasonKeys = (dtState.data.reasons || []).map(r => r.reason);
            if (dtCharts.rank) dtCharts.rank.destroy();
            const top = machines.slice(0, 14);
            dtCharts.rank = new Chart(document.getElementById('dtRankChart'), {
                type: 'bar',
                data: { labels: top.map(m => m.machine), datasets: [{ label: 'Downtime', data: top.map(m => m.totalDowntimeMin), backgroundColor: '#ef4444', borderRadius: 5, maxBarThickness: 22 }] },
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: dtTooltipMin }, scales: { x: { beginAtZero: true, grid: { color: '#f1f5f9' } }, y: { grid: { display: false } } } }
            });
            const keys = reasonKeys.slice(0, 8);
            // Peak cell value across the shown matrix → heat scale reference.
            let peak = 0, maxTotal = 0;
            machines.forEach(m => { keys.forEach(k => { if ((m.byReason[k] || 0) > peak) peak = m.byReason[k]; }); if (m.totalDowntimeMin > maxTotal) maxTotal = m.totalDowntimeMin; });
            document.getElementById('dtMatrixHead').innerHTML = `<tr><th>Machine</th><th>Line</th>${keys.map(k => `<th class="text-end">${esc(k)}</th>`).join('')}<th class="text-end">Total</th><th class="text-end">DT %</th><th class="text-end">Events</th></tr>`;
            document.getElementById('dtMatrixBody').innerHTML = machines.length ? machines.map((m) => `
                <tr data-dt-machine="${esc(m.machine)}">
                    <td class="mc">${esc(m.machine)}</td>
                    <td class="ln">${esc(m.line)}</td>
                    ${keys.map(k => { const v = m.byReason[k] || 0; return `<td class="cell-heat" style="background:${dtHeat(v, peak)}; color:${v ? dtHeatText(v, peak) : '#cbd5e1'}">${v ? dtFmtMin(v) : '·'}</td>`; }).join('')}
                    <td class="text-end"><div class="dt-bar"><span class="num">${dtFmtMin(m.totalDowntimeMin)}</span><div class="track"><div class="fill" style="width:${maxTotal ? Math.round(m.totalDowntimeMin / maxTotal * 100) : 0}%"></div></div></div></td>
                    <td class="text-end"><span class="dt-chip" style="background:${m.downtimePct >= 15 ? 'rgba(239,68,68,.12)' : m.downtimePct >= 7 ? 'rgba(245,158,11,.14)' : 'rgba(16,185,129,.12)'}; color:${m.downtimePct >= 15 ? '#dc2626' : m.downtimePct >= 7 ? '#b45309' : '#059669'}">${m.downtimePct}%</span></td>
                    <td class="text-end" style="color:#64748b; font-weight:600">${m.events}</td>
                </tr>`).join('') : `<tr><td colspan="${keys.length + 5}" class="text-center p-3" style="color:#94a3b8">No downtime in range</td></tr>`;
            document.getElementById('dtMatrixBody').onclick = (ev) => {
                const tr = ev.target.closest('tr[data-dt-machine]'); if (!tr) return;
                dtDrill({ machine: tr.getAttribute('data-dt-machine') });
            };
        }

        function dtRenderDatePivot() {
            const days = dtState.daily.days || [];
            const keys = (dtState.daily.reasonKeys || []).slice(0, 8);
            if (dtCharts.rank) dtCharts.rank.destroy();
            dtCharts.rank = new Chart(document.getElementById('dtRankChart'), {
                type: 'bar',
                data: { labels: days.map(d => new Date(d.date).toLocaleDateString()), datasets: [{ label: 'Downtime', data: days.map(d => d.totalMin), backgroundColor: '#f59e0b', borderRadius: 5, maxBarThickness: 34 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: dtTooltipMin }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true, grid: { color: '#f1f5f9' } } } }
            });
            let peak = 0, maxTotal = 0;
            days.forEach(d => { keys.forEach(k => { if ((d.byReason[k] || 0) > peak) peak = d.byReason[k]; }); if (d.totalMin > maxTotal) maxTotal = d.totalMin; });
            document.getElementById('dtMatrixHead').innerHTML = `<tr><th>Date</th>${keys.map(k => `<th class="text-end">${esc(k)}</th>`).join('')}<th class="text-end">Day</th><th class="text-end">Night</th><th class="text-end">Total</th></tr>`;
            document.getElementById('dtMatrixBody').innerHTML = days.length ? days.map(d => `
                <tr data-dt-date="${d.date}">
                    <td class="mc">${new Date(d.date).toLocaleDateString()}</td>
                    ${keys.map(k => { const v = d.byReason[k] || 0; return `<td class="cell-heat" style="background:${dtHeat(v, peak)}; color:${v ? dtHeatText(v, peak) : '#cbd5e1'}">${v ? dtFmtMin(v) : '·'}</td>`; }).join('')}
                    <td class="text-end" style="color:#64748b">${dtFmtMin(d.Day)}</td>
                    <td class="text-end" style="color:#64748b">${dtFmtMin(d.Night)}</td>
                    <td class="text-end"><div class="dt-bar"><span class="num">${dtFmtMin(d.totalMin)}</span><div class="track"><div class="fill" style="width:${maxTotal ? Math.round(d.totalMin / maxTotal * 100) : 0}%"></div></div></div></td>
                </tr>`).join('') : `<tr><td colspan="${keys.length + 4}" class="text-center p-3" style="color:#94a3b8">No downtime in range</td></tr>`;
            document.getElementById('dtMatrixBody').onclick = (ev) => {
                const tr = ev.target.closest('tr[data-dt-date]'); if (!tr) return;
                dtDrill({ date: tr.getAttribute('data-dt-date') });
            };
        }

        function dtRenderReasonPivot() {
            const reasons = dtState.data.reasons || [];
            if (dtCharts.rank) dtCharts.rank.destroy();
            const top = reasons.slice(0, 14);
            dtCharts.rank = new Chart(document.getElementById('dtRankChart'), {
                type: 'bar',
                data: { labels: top.map(r => r.reason), datasets: [{ label: 'Downtime', data: top.map(r => r.min), backgroundColor: top.map((_, i) => dtReasonColor(i)), borderRadius: 5, maxBarThickness: 22 }] },
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: dtTooltipMin }, scales: { x: { beginAtZero: true, grid: { color: '#f1f5f9' } }, y: { grid: { display: false } } } }
            });
            const maxMin = reasons.length ? reasons[0].min : 0;
            document.getElementById('dtMatrixHead').innerHTML = `<tr><th>Reason</th><th class="text-end">Downtime</th><th class="text-end">Share</th><th class="text-end">Cumulative</th></tr>`;
            document.getElementById('dtMatrixBody').innerHTML = reasons.length ? reasons.map((r, i) => `
                <tr data-dt-reason="${esc(r.reason)}">
                    <td class="mc"><span style="display:inline-block; width:11px; height:11px; border-radius:3px; background:${dtReasonColor(i)}; margin-right:8px; vertical-align:-1px"></span>${esc(r.reason)}</td>
                    <td class="text-end"><div class="dt-bar"><span class="num">${dtFmtMin(r.min)}</span><div class="track"><div class="fill" style="width:${maxMin ? Math.round(r.min / maxMin * 100) : 0}%"></div></div></div></td>
                    <td class="text-end" style="font-weight:700; color:#334155">${r.share}%</td>
                    <td class="text-end" style="color:#64748b">${r.cumulative}%</td>
                </tr>`).join('') : '<tr><td colspan="4" class="text-center p-3" style="color:#94a3b8">No downtime in range</td></tr>';
            document.getElementById('dtMatrixBody').onclick = (ev) => {
                const tr = ev.target.closest('tr[data-dt-reason]'); if (!tr) return;
                dtDrill({ reason: tr.getAttribute('data-dt-reason') });
            };
        }

        function dtRenderDaily() {
            const days = dtState.daily.days || [];
            const keys = (dtState.daily.reasonKeys || []).slice(0, 8);
            if (dtCharts.daily) dtCharts.daily.destroy();
            dtCharts.daily = new Chart(document.getElementById('dtDailyChart'), {
                type: 'bar',
                data: {
                    labels: days.map(d => new Date(d.date).toLocaleDateString()),
                    datasets: keys.map((k, i) => ({ label: k, data: days.map(d => d.byReason[k] || 0), backgroundColor: dtReasonColor(i), stack: 'dt', borderRadius: 3, maxBarThickness: 44 }))
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, usePointStyle: true, font: { size: 11 } } }, tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${dtFmtMin(c.parsed.y)}` } } }, scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true, grid: { color: '#f1f5f9' }, title: { display: true, text: 'Minutes' } } } }
            });
        }

        function dtRenderPlant() {
            const panel = document.getElementById('dtPlantPanel');
            const plant = dtState.plant || {};
            const facs = plant.factories || [];
            // Only show when the user has cross-factory access AND is viewing all factories
            if (plant.gated || !facs.length || AnalyzeFilters.factoryId) { panel.style.display = 'none'; if (dtCharts.plant) { dtCharts.plant.destroy(); dtCharts.plant = null; } return; }
            panel.style.display = 'block';
            const reasonSet = [];
            facs.forEach(f => Object.keys(f.byReason || {}).forEach(k => { if (!reasonSet.includes(k)) reasonSet.push(k); }));
            const keys = reasonSet.slice(0, 8);
            if (dtCharts.plant) dtCharts.plant.destroy();
            dtCharts.plant = new Chart(document.getElementById('dtPlantChart'), {
                type: 'bar',
                data: { labels: facs.map(f => f.name), datasets: keys.map((k, i) => ({ label: k, data: facs.map(f => f.byReason[k] || 0), backgroundColor: dtReasonColor(i), stack: 'dt', borderRadius: 3, maxBarThickness: 60 })) },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, usePointStyle: true, font: { size: 11 } } }, tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${dtFmtMin(c.parsed.y)}` } } }, scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true, grid: { color: '#f1f5f9' }, title: { display: true, text: 'Minutes' } } } }
            });
            document.getElementById('dtPlantBody').innerHTML = facs.map(f => `
                <tr>
                    <td style="font-weight:700; color:#334155">${esc(f.name)}</td>
                    <td class="text-end" style="font-weight:700; color:#ef4444">${f.totalDowntimeHrs} h</td>
                    <td class="text-end">${f.events}</td>
                    <td>${esc(f.topReason || '-')}</td>
                    <td class="text-end">${f.downtimePct}%</td>
                </tr>`).join('');
        }

        async function dtDrill(filters) {
            const wrap = document.getElementById('dtDrill');
            const label = filters.machine ? `Machine ${filters.machine}` : filters.date ? `Date ${new Date(filters.date).toLocaleDateString()}` : `Reason ${filters.reason}`;
            document.getElementById('dtDrillTitle').textContent = `Downtime Detail — ${label}`;
            const body = document.getElementById('dtDrillBody');
            body.innerHTML = '<tr><td colspan="12" class="text-center p-3"><div class="spinner-border spinner-border-sm text-primary"></div> Loading…</td></tr>';
            wrap.style.display = 'block';
            wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            try {
                const res = await JPSMS.api.get('/analyze/downtime/detail' + filterQS(filters));
                if (!res.ok) { body.innerHTML = `<tr><td colspan="12" class="text-center p-3 text-danger">${res.error || 'No data'}</td></tr>`; return; }
                const rows = res.data.rows || [];
                dtState.drillRows = rows;
                body.innerHTML = rows.length ? rows.map(r => `
                    <tr>
                        <td>${r.date ? new Date(r.date).toLocaleDateString() : '-'}</td>
                        <td>${esc(r.shift || '-')}</td><td>${esc(r.hour || '-')}</td>
                        <td style="font-weight:600">${esc(r.machine || '-')}</td>
                        <td>${esc(r.mould || '-')}</td><td>${esc(r.order || '-')}</td><td>${esc(r.colour || '-')}</td>
                        <td>${esc(r.reason || '-')}</td>
                        <td class="text-end" style="font-weight:700; color:#ef4444">${r.minutes}</td>
                        <td class="text-end">${(r.good || 0).toLocaleString()}</td>
                        <td class="text-end" style="color:${r.reject > 0 ? '#ef4444' : '#94a3b8'}">${(r.reject || 0).toLocaleString()}</td>
                        <td>${esc(r.enteredBy || '-')}</td>
                    </tr>`).join('') : '<tr><td colspan="12" class="text-center p-3">No detail rows</td></tr>';
            } catch (e) { body.innerHTML = `<tr><td colspan="12" class="text-center p-3 text-danger">${e.message}</td></tr>`; }
        }

        /* ---- Exports ---- */
        function dtExportRows() {
            // Build a flat machine × reason matrix for export
            const machines = (dtState.data && dtState.data.machines) || [];
            const keys = (dtState.data && dtState.data.reasons || []).map(r => r.reason);
            const header = ['Machine', 'Line', ...keys, 'Total (min)', 'Downtime %', 'Events'];
            const rows = machines.map(m => [m.machine, m.line, ...keys.map(k => m.byReason[k] || 0), m.totalDowntimeMin, m.downtimePct, m.events]);
            return { header, rows };
        }
        function dtRangeLabel() {
            const f = document.getElementById('fromDate').value || '', t = document.getElementById('toDate').value || '';
            return `${f}_to_${t}`;
        }
        function dtExportCSV() {
            if (!dtState.data) { JPSMS.toast('Nothing to export yet'); return; }
            const { header, rows } = dtExportRows();
            const esc2 = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
            const csv = [header.map(esc2).join(','), ...rows.map(r => r.map(esc2).join(','))].join('\r\n');
            const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = `downtime_${dtRangeLabel()}.csv`;
            document.body.appendChild(a); a.click(); a.remove();
        }
        function dtExportExcel() {
            if (!dtState.data) { JPSMS.toast('Nothing to export yet'); return; }
            const { header, rows } = dtExportRows();
            // Lightweight SpreadsheetML (opens natively in Excel) — no external lib needed
            const cell = v => `<td>${String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;')}</td>`;
            const html = `<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body><table border="1">`
                + `<tr>${header.map(h => `<th>${h}</th>`).join('')}</tr>`
                + rows.map(r => `<tr>${r.map(cell).join('')}</tr>`).join('')
                + `</table></body></html>`;
            const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = `downtime_${dtRangeLabel()}.xls`;
            document.body.appendChild(a); a.click(); a.remove();
        }
    </script>
    <script src="/assets/ai-chat.js"></script>
</body>
