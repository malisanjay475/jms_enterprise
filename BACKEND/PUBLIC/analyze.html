        function syncFilterState() {
            AnalyzeFilters.from = (document.getElementById('fromDate') || {}).value || null;
            AnalyzeFilters.to = (document.getElementById('toDate') || {}).value || null;
            const cmp = document.getElementById('factoryCompareSelect');
            if (cmp && AnalyzeFilters.compare) {
                AnalyzeFilters.compareIds = Array.from(cmp.selectedOptions).map(o => Number(o.value));
            }
        }

        // Build a query string from shared filters
        function filterQS(extra) {
            syncFilterState();
            const p = new URLSearchParams();
            if (AnalyzeFilters.factoryId) p.set('factory', AnalyzeFilters.factoryId);
            if (AnalyzeFilters.from) p.set('from', AnalyzeFilters.from);
            if (AnalyzeFilters.to) p.set('to', AnalyzeFilters.to);
            if (AnalyzeFilters.lossPerShift) p.set('lossPerShift', AnalyzeFilters.lossPerShift);
            if (AnalyzeFilters.lossPerMachineHour) p.set('lossPerMachineHour', AnalyzeFilters.lossPerMachineHour);
            Object.entries(extra || {}).forEach(([k, v]) => { if (v != null && v !== '') p.set(k, v); });
            const s = p.toString();
            return s ? ('?' + s) : '';
        }

        function loadData() {
            syncFilterState();
            const view = AnalyzeFilters.view;
            if (view === 'order') return fetchOrderList();
            // other views re-render on refresh
            renderView(view);
            JPSMS.toast('Refreshed');
        }

        let orderCharts = {};

        /* =========================================
           ORDER ANALYSIS - SIDEBAR LOGIC
           ========================================= */
        let allOrdersData = [];
        let currentOrderFilter = 'RUNNING';

        async function fetchOrderList() {
            const listEl = document.getElementById('orderListContainer');
            // If removed from DOM by view switch, return
            if (!listEl) return;

            listEl.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8"><div class="spinner-border spinner-border-sm text-primary" role="status"></div> Loading...</div>';

            try {
                const res = await JPSMS.api.get('/analyze/orders' + filterQS());
                allOrdersData = [];

                if (res.ok && Array.isArray(res.data)) {
                    res.data.forEach(p => {
                        allOrdersData.push({
                            orderNo: p.order_no,
                            factoryId: p.factory_id,
                            client: p.client_name || '-',
                            item: p.item_name || '-',
                            status: p.view_status || 'RUNNING',
                            date: p.start_date || p.job_card_date || p.or_jr_date || p.created_at || new Date().toISOString(),
                            mould: p.mould_name || '-',
                            planQty: p.plan_qty || 0,
                            balQty: p.bal_qty || 0,
                            jcNo: p.job_card_no || null
                        });
                    });
                }

                allOrdersData.sort((a, b) => new Date(b.date) - new Date(a.date));
                renderOrderList();
            } catch (e) {
                console.error(e);
                if (listEl) listEl.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#ef4444; padding:20px">Error loading orders</div>`;
            }
        }

        function filterOrderList(status, tabEl) {
            currentOrderFilter = status;

            // Update Tabs
            if (tabEl) {
                document.querySelectorAll('.analysis-tab').forEach(t => t.classList.remove('active'));
                tabEl.classList.add('active');
            }

            renderOrderList();
        }

        function filterOrdersLocal() {
            renderOrderList();
        }

        function renderOrderList() {
            const search = (document.getElementById('orderSearch').value || '').toLowerCase();
            const listEl = document.getElementById('orderListContainer');
            if (!listEl) return;

            const filtered = allOrdersData.filter(o => {
                if (currentOrderFilter !== 'ALL' && o.status !== currentOrderFilter) return false;
                if (search) {
                    const txt = (o.orderNo + ' ' + o.client + ' ' + o.item + ' ' + o.mould).toLowerCase();
                    return txt.includes(search);
                }
                return true;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8; font-size:1rem; background:#f8fafc; border-radius:16px; border:1px dashed #cbd5e1">No orders found matching your criteria.</div>';
                return;
            }

            listEl.innerHTML = filtered.map(o => {
                const cls = statusClass(o.status);
                const plan = o.planQty || 0;
                const done = Math.max(0, plan - (o.balQty || 0));
                const pct = plan > 0 ? Math.min(100, Math.round((done / plan) * 100)) : 0;
                return `
                <div class="oa-card ${cls}" data-ono="${esc(o.orderNo)}">
                    <div class="oa-card-top">
                        <div class="oa-ono">${esc(o.orderNo)}</div>
                        <span class="oa-badge ${cls}">${esc(o.status || '—')}</span>
                    </div>
                    <div class="oa-mould"><i class="bi bi-tools"></i> ${esc(o.mould)}</div>
                    <div class="oa-item">${esc(o.item)}</div>
                    <div class="oa-prog"><span style="width:${pct}%"></span></div>
                    <div style="display:flex; justify-content:space-between; font-size:.72rem; color:#94a3b8; margin-bottom:10px">
                        <span>${done.toLocaleString()} / ${plan.toLocaleString()} pcs</span><span>${pct}%</span>
                    </div>
                    <div class="oa-foot" style="border-top:1px solid #f1f5f9; padding-top:10px">
                        <div>
                            <div class="oa-client">${esc(o.client)}</div>
                            <div style="font-size:.72rem; color:#94a3b8; margin-top:2px">${o.jcNo ? 'JC ' + esc(o.jcNo) + ' · ' : ''}${o.date ? new Date(o.date).toLocaleDateString() : ''}</div>
                        </div>
                        <i class="bi bi-arrow-right-circle" style="font-size:1.3rem; color:#cbd5e1"></i>
                    </div>
                </div>`;
            }).join('');

            listEl.onclick = (ev) => {
                const card = ev.target.closest('.oa-card[data-ono]');
                if (card) clickOrder(card.getAttribute('data-ono'));
            };
        }

        function clickOrder(orderNo) {
            const modal = document.getElementById('orderDetailModal');
            modal.classList.add('active');
            document.getElementById('modalTitle').textContent = orderNo;
            document.getElementById('modalSubtitle').textContent = 'Loading details…';
            loadOrderDetails(orderNo);
        }

        async function loadOrderDetails(orderNo) {
            const dashboard = document.getElementById('modalDashboard');
            const loading = document.getElementById('modalLoading');

            dashboard.style.display = 'none';
            loading.style.display = 'block';

            JPSMS.toast('Loading Order: ' + orderNo, 'info');

            try {
                const res = await JPSMS.api.get('/analyze/order/' + encodeURIComponent(orderNo) + filterQS());
                if (res.ok) {
                    renderOrderDashboard(res.data);
                    loading.style.display = 'none';
                    dashboard.style.display = 'block';
                    document.getElementById('modalSubtitle').textContent = 'Analysis Dashboard';
                } else {
                    JPSMS.toast(res.error || 'Failed to load order', 'error');
                    loading.innerHTML = '<div class="text-danger">Failed to load data</div>';
                }
            } catch (e) {
                JPSMS.toast('Error: ' + e.message, 'error');
                loading.innerHTML = `<div class="text-danger">Error: ${e.message}</div>`;
            }
        }

        let currentOrderData = null;
        const OA_PALETTE = ['#024c81', '#01a8dd', '#10b981', '#f59e0b', '#8b5cf6', '#ef4444', '#0ea5e9', '#14b8a6', '#f43f5e', '#6366f1'];
        function statusClass(s) {
            const u = String(s || '').toUpperCase();
            if (u.includes('COMPLETE') || u === 'DONE') return 'completed';
            if (u.includes('REJECT') || u === 'DROPPED') return 'closed';
            return 'running';
        }
        function cssColour(name) {
            const n = String(name || '').trim().toLowerCase();
            const known = { white: '#e5e7eb', black: '#1f2937', red: '#ef4444', blue: '#3b82f6', green: '#10b981', yellow: '#facc15', orange: '#f97316', grey: '#9ca3af', gray: '#9ca3af', natural: '#f5f5dc', transparent: '#dbeafe' };
            for (const k in known) if (n.includes(k)) return known[k];
            let hash = 0; for (let i = 0; i < n.length; i++) hash = n.charCodeAt(i) + ((hash << 5) - hash);
            return OA_PALETTE[Math.abs(hash) % OA_PALETTE.length];
        }
        function specNum(v) {
            if (v == null || v === '') return null;
            const n = Number(v);
            return Number.isFinite(n) ? n : null;
        }
        function specRow(label, std, act, unit) {
            const s = specNum(std);
            const a = specNum(act);
            if (s == null && a == null) return ''; // no standard/actual → let caller show fallback
            const diff = (s != null && a != null) ? (a - s) : null;
            const dTxt = diff == null ? '—' : `${diff > 0 ? '+' : ''}${(Math.round(diff * 100) / 100)}`;
            const dCol = diff == null ? '#94a3b8' : (Math.abs(diff) < 1e-9 ? '#10b981' : (diff > 0 ? '#ef4444' : '#f59e0b'));
            const fmt = v => v == null ? '—' : `${Math.round(v * 100) / 100}${unit || ''}`;
            return `<tr><td>${label}</td><td>${fmt(s)}</td><td>${fmt(a)}</td><td style="color:${dCol}; font-weight:700">${dTxt}</td></tr>`;
        }

        function renderOrderDashboard(data) {
            currentOrderData = data;
            const { info, logs } = data;
            const totals = data.totals || {};
            const loss = data.loss || {};
            const cls = statusClass(info.status);

            // Header badge + subtitle
            const badge = document.getElementById('oaHeadBadge');
            badge.textContent = info.status || 'Unknown';
            const subEl = document.getElementById('modalSubtitle');
            if (subEl) subEl.textContent = [info.client_name, info.mould_name || info.mould_number].filter(Boolean).join(' · ') || 'Analysis';

            // Order details
            const setT = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
            const itemTxt = info.item_name || info.itemName || info.product_name || '-';
            setT('dClient', info.client_name || '-');
            setT('dItem', info.product_name && info.product_name !== itemTxt ? `${itemTxt} · ${info.product_name}` : itemTxt);
            setT('dMould', info.mould_name || info.mould_number || '-');
            setT('dMachine', loss.machine || info.machine || 'Multiple');
            setT('dJc', info.job_card_no || '-');
            setT('dPriority', info.priority || '-');
            setT('dPlant', [info.plant, info.line].filter(Boolean).join(' / ') || '-');
            setT('dStatusText', info.status || 'Unknown');

            // Totals
            const totalGood = Math.round(totals.good || 0);
            const totalReject = Math.round(totals.rej || 0);
            const output = totalGood + totalReject;
            const plan = Math.round(totals.plan || info.plan_qty || 0);
            const bal = Math.max(0, plan - totalGood);
            const donePct = plan > 0 ? Math.min(100, Math.round((totalGood / plan) * 100)) : 0;
            const rejRate = output > 0 ? ((totalReject / output) * 100).toFixed(1) : '0.0';

            // Progress
            document.getElementById('dProgBar').style.width = donePct + '%';
            setT('dProgLabel', `${totalGood.toLocaleString()} / ${plan.toLocaleString()} pcs (${donePct}%)`);

            // Efficiency + OEE (from loss)
            const pph = loss.pcs_per_hour_std || 0;
            const runHours = loss.actual_hours || 0;
            const downHours = loss.downtime_hours || 0;
            const productiveHours = Math.max(0, runHours - downHours);
            const theoretical = pph > 0 ? pph * productiveHours : 0;
            const eff = theoretical > 0 ? Math.round((totalGood / theoretical) * 100) : 0;
            const availability = runHours > 0 ? productiveHours / runHours : 0;
            const performance = theoretical > 0 ? Math.min(1, output / theoretical) : 0;
            const quality = output > 0 ? totalGood / output : 0;
            const oee = Math.round(availability * performance * quality * 100);

            setT('kpiPlan', plan.toLocaleString());
            setT('kpiGood', totalGood.toLocaleString());
            setT('kpiGoodSub', `${donePct}% of plan`);
            setT('kpiBal', bal.toLocaleString());
            setT('kpiReject', totalReject.toLocaleString());
            setT('kpiRejSub', `${rejRate}% reject rate`);
            setT('kpiEff', eff + '%');
            setT('kpiOee', oee + '%');
            setT('kpiOeeSub', `A${Math.round(availability * 100)} P${Math.round(performance * 100)} Q${Math.round(quality * 100)}`);
            setT('kpiDown', Math.round(totals.dt || 0).toLocaleString());

            // Lifecycle + Loss
            renderLifecycle(data.lifecycle || {});
            renderLoss(loss);

            // STD vs Actual specs
            document.getElementById('oaSpecBody').innerHTML = [
                specRow('Weight (kg)', info.std_weight, info.act_weight, ''),
                specRow('Cavity', info.std_cavity, info.act_cavity, ''),
                specRow('Cycle Time (s)', info.std_cycle, info.act_cycle, '')
            ].join('') || '<tr><td colspan="4" class="text-center p-3">No standard set</td></tr>';

            // Colour-wise progress
            const colourWrap = document.getElementById('oaColourWrap');
            const cstats = data.colour_stats || {};
            const cKeys = Object.keys(cstats);
            if (cKeys.length) {
                colourWrap.innerHTML = cKeys.map(c => {
                    const cs = cstats[c];
                    const cp = Math.round(cs.plan_qty || 0), cg = Math.round(cs.good_qty || 0);
                    const pct = cp > 0 ? Math.min(100, Math.round((cg / cp) * 100)) : 0;
                    return `<div class="oa-colour-row">
                        <span class="oa-swatch" style="background:${cssColour(c)}"></span>
                        <div style="flex:1; min-width:0">
                            <div style="display:flex; justify-content:space-between; font-size:.82rem"><span style="font-weight:600; color:#334155">${esc(c)}</span><span style="color:#64748b">${cg.toLocaleString()} / ${cp.toLocaleString()}</span></div>
                            <div class="oa-cbar" style="margin-top:5px"><span style="width:${pct}%"></span></div>
                        </div>
                        <span style="font-size:.8rem; font-weight:700; color:#475569; width:38px; text-align:right">${pct}%</span>
                    </div>`;
                }).join('');
            } else {
                colourWrap.innerHTML = '<div style="color:#94a3b8; padding:20px; text-align:center">No colour breakdown</div>';
            }

            // Insights (data-driven)
            const insights = [];
            const ins = (icon, col, text) => insights.push(`<div style="display:flex; gap:10px; align-items:flex-start; background:#f8fafc; border:1px solid #eef2f7; border-radius:12px; padding:12px 14px"><i class="bi ${icon}" style="color:${col}; font-size:1.1rem"></i><div style="font-size:.85rem; color:#475569; line-height:1.4">${text}</div></div>`);
            if (eff >= 80) ins('bi-check-circle-fill', '#10b981', `Efficiency healthy at <strong>${eff}%</strong> (good vs STD-achievable).`);
            else ins('bi-exclamation-triangle-fill', '#f59e0b', `Efficiency below target: <strong>${eff}%</strong> vs 80%.`);
            if (loss.shift_loss > 0) ins('bi-hourglass-split', '#ef4444', `<strong>${loss.shift_loss}</strong> shift(s) lost — ${loss.total_loss_hours || 0}h over STD.`);
            const topRej = Object.entries(data.rejection_stats || {}).sort((a, b) => b[1] - a[1])[0];
            if (topRej && topRej[1] > 0) ins('bi-x-octagon', '#ef4444', `Top rejection cause: <strong>${esc(topRej[0])}</strong> (${Math.round(topRej[1])} pcs).`);
            const topDt = Object.entries(data.downtime_stats || {}).sort((a, b) => b[1] - a[1])[0];
            if (topDt && topDt[1] > 0) ins('bi-cone-striped', '#f59e0b', `Biggest downtime: <strong>${esc(topDt[0])}</strong> (${Math.round(topDt[1])} min).`);
            if (bal === 0 && plan > 0) ins('bi-flag-fill', '#10b981', `Plan quantity fully achieved.`);
            else if (plan > 0) ins('bi-bullseye', '#3b82f6', `<strong>${bal.toLocaleString()}</strong> pcs balance to complete the plan.`);
            document.getElementById('insightList').innerHTML = insights.join('');

            // Production log
            const tbody = document.getElementById('logTableBody');
            if (logs && logs.length > 0) {
                tbody.innerHTML = logs.map((l) => {
                    const dt = Math.round(parseFloat(l.downtime_min) || 0);
                    const enteredBy = esc(l.userName || l.created_by || '-');
                    const role = l.userRole ? ` <span style="font-size:.7rem; color:#94a3b8">(${esc(l.userRole)})</span>` : '';
                    return `<tr>
                        <td style="padding:11px 20px; color:#334155">${l.date ? new Date(l.date).toLocaleDateString() : '-'}</td>
                        <td style="color:#64748b">${esc(l.shift || '-')}</td>
                        <td style="color:#64748b">${esc(l.hour_slot || '-')}</td>
                        <td style="color:#64748b">${esc(l.machine || '-')}${l.colour ? ' · ' + esc(l.colour) : ''}</td>
                        <td class="text-end" style="font-weight:700; color:#334155">${(parseInt(l.good_qty) || 0).toLocaleString()}</td>
                        <td class="text-center" style="color:${l.reject_qty > 0 ? '#ef4444' : '#94a3b8'}">${parseInt(l.reject_qty) || 0}</td>
                        <td>${dt > 0 ? `<span style="color:#f59e0b; font-weight:600">${dt} min</span>` : '<span style="color:#10b981">—</span>'}</td>
                        <td style="color:#475569; font-weight:600">${enteredBy}${role}</td>
                    </tr>`;
                }).join('');
            } else {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center p-3">No activity logs found</td></tr>';
            }

            renderOrderCharts(data);
        }

        function renderOrderCharts(data) {
            const logs = data.logs || [];

            ['timelineChart', 'ctChart', 'downtimeChart', 'rejectChart'].forEach(id => {
                if (orderCharts[id]) { orderCharts[id].destroy(); delete orderCharts[id]; }
            });

            // --- Chart 1: Production vs Plan (cumulative, grouped by day) ---
            const timelineCtx = document.getElementById('timelineChart');
            if (timelineCtx) {
                const byDay = {};
                logs.forEach(l => {
                    const d = l.date || 'NA';
                    byDay[d] = (byDay[d] || 0) + (parseInt(l.good_qty) || 0);
                });
                const days = Object.keys(byDay).sort();
                let acc = 0;
                const cum = days.map(d => (acc += byDay[d]));
                const plan = Math.round((data.totals && data.totals.plan) || data.info.plan_qty || 0);
                const step = plan / Math.max(days.length, 1);
                const target = days.map((_, i) => Math.round((i + 1) * step));
                orderCharts['timelineChart'] = new Chart(timelineCtx, {
                    type: 'line',
                    data: {
                        labels: days.map(d => d === 'NA' ? '—' : new Date(d).toLocaleDateString()),
                        datasets: [
                            { label: 'Produced (cum.)', data: cum, borderColor: '#024c81', backgroundColor: 'rgba(1,168,221,.12)', fill: true, tension: 0.35, pointRadius: 3, pointBackgroundColor: '#fff', pointBorderColor: '#024c81', pointBorderWidth: 2 },
                            { label: 'Plan Target', data: target, borderColor: '#10b981', borderDash: [6, 5], tension: 0.1, pointRadius: 0, fill: false }
                        ]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }, tooltip: { mode: 'index', intersect: false } },
                        scales: { y: { beginAtZero: true }, x: { grid: { display: false }, ticks: { maxTicksLimit: 8 } } }
                    }
                });
            }

            // --- Chart 2: Cycle time — Actual vs STD ---
            const ctCtx = document.getElementById('ctChart');
            if (ctCtx) {
                const stdCT = Math.round((data.loss && data.loss.std_cycle) || data.info.std_cycle || 0);
                const avgCT = Math.round(parseFloat(data.info.act_cycle) || 0);
                orderCharts['ctChart'] = new Chart(ctCtx, {
                    type: 'bar',
                    data: { labels: ['Actual', 'Standard'], datasets: [{ data: [avgCT, stdCT], backgroundColor: [avgCT > stdCT && stdCT > 0 ? '#ef4444' : '#3b82f6', '#10b981'], barThickness: 64, borderRadius: 8 }] },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: { callbacks: { label: c => c.parsed.y + ' sec' } }
                        },
                        scales: { y: { beginAtZero: true, title: { display: true, text: 'seconds' } }, x: { grid: { display: false } } }
                    }
                });
            }

            // --- Chart 3: Downtime breakdown (doughnut) ---
            const dtCtx = document.getElementById('downtimeChart');
            if (dtCtx) {
                const e = Object.entries(data.downtime_stats || {}).filter(([, v]) => (parseFloat(v) || 0) > 0).sort((a, b) => b[1] - a[1]);
                const labels = e.length ? e.map(x => x[0]) : ['No downtime'];
                const vals = e.length ? e.map(x => Math.round(parseFloat(x[1]))) : [1];
                orderCharts['downtimeChart'] = new Chart(dtCtx, {
                    type: 'doughnut',
                    data: { labels, datasets: [{ data: vals, backgroundColor: OA_PALETTE, borderWidth: 2, borderColor: '#fff' }] },
                    options: { responsive: true, maintainAspectRatio: false, cutout: '62%', plugins: { legend: { position: 'right', labels: { boxWidth: 12, usePointStyle: true, font: { size: 11 } } } } }
                });
            }

            // --- Chart 4: Rejection Pareto ---
            const rjCtx = document.getElementById('rejectChart');
            if (rjCtx) {
                const e = Object.entries(data.rejection_stats || {}).filter(([, v]) => (parseFloat(v) || 0) > 0).sort((a, b) => b[1] - a[1]).slice(0, 10);
                if (e.length) {
                    orderCharts['rejectChart'] = new Chart(rjCtx, {
                        type: 'bar',
                        data: { labels: e.map(x => x[0]), datasets: [{ label: 'Reject Qty', data: e.map(x => Math.round(parseFloat(x[1]))), backgroundColor: '#ef4444', borderRadius: 5 }] },
                        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true } } }
                    });
                } else {
                    const rect = rjCtx.getBoundingClientRect();
                    const w = rect.width || rjCtx.clientWidth || 300;
                    const h = rect.height || rjCtx.clientHeight || 200;
                    const c = rjCtx.getContext('2d'); c.clearRect(0, 0, rjCtx.width, rjCtx.height);
                    c.fillStyle = '#94a3b8'; c.font = '14px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
                    c.fillText('No rejections recorded', w / 2, h / 2);
                }
            }
        }

        /* =========================================
           ORDER LIFECYCLE + LOSS
           ========================================= */
        function esc(v) {
            return String(v == null ? '' : v)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function fmtDate(d) { return d ? new Date(d).toLocaleDateString() : '—'; }
        function gapChip(days) {
            if (days == null) return '';
            const c = days <= 1 ? '#10b981' : days <= 3 ? '#f59e0b' : '#ef4444';
            return `<div style="font-size:0.7rem; color:${c}; font-weight:700; margin-top:2px">+${days}d</div>`;
        }
        function renderLifecycle(lc) {
            const el = document.getElementById('lifecycleStepper');
            if (!el) return;
            const g = lc.gaps || {};
            const steps = [
                { label: 'OR Date', date: lc.or_date, icon: 'file-earmark-text', gap: null },
                { label: 'JC Converted', date: lc.jc_date, icon: 'card-checklist', gap: g.or_to_jc },
                { label: 'Planned', date: lc.plan_date, icon: 'calendar2-check', gap: g.jc_to_plan },
                { label: 'Production Start', date: lc.prod_start, icon: 'play-circle', gap: g.plan_to_prod },
                { label: (lc.status || 'Latest'), date: lc.prod_last, icon: 'flag', gap: g.prod_span }
            ];
            el.innerHTML = steps.map((s, i) => `
                <div style="flex:1; min-width:120px; text-align:center; position:relative">
                    ${i > 0 ? `<div style="position:absolute; left:-50%; top:18px; width:100%; height:2px; background:#e2e8f0; z-index:0"></div>` : ''}
                    <div style="position:relative; z-index:1; width:38px; height:38px; margin:0 auto; border-radius:50%; background:${s.date ? 'linear-gradient(135deg,#024c81,#01a8dd)' : '#e2e8f0'}; color:#fff; display:flex; align-items:center; justify-content:center">
                        <i class="bi bi-${s.icon}"></i>
                    </div>
                    <div style="font-size:0.78rem; font-weight:700; color:#334155; margin-top:8px">${s.label}</div>
                    <div style="font-size:0.75rem; color:#64748b">${fmtDate(s.date)}</div>
                    ${gapChip(s.gap)}
                </div>`).join('');
        }

        function lossCard(label, value, sub, color) {
            return `<div style="background:#f8fafc; border-radius:10px; padding:12px 14px; border-left:3px solid ${color}">
                <div style="font-size:0.72rem; color:#64748b; font-weight:600">${label}</div>
                <div style="font-size:1.3rem; font-weight:800; color:#1e293b">${value}</div>
                ${sub ? `<div style="font-size:0.72rem; color:#94a3b8">${sub}</div>` : ''}
            </div>`;
        }
        function renderLoss(loss) {
            const el = document.getElementById('lossCards');
            if (!el) return;
            const money = loss.money_loss_per_shift != null ? `₹${Number(loss.money_loss_per_shift).toLocaleString()}`
                : loss.money_loss_per_machine_hour != null ? `₹${Number(loss.money_loss_per_machine_hour).toLocaleString()}`
                    : 'Set ₹ rate';
            el.innerHTML = [
                lossCard('STD Time', `${loss.std_hours || 0} h`, `${loss.std_shifts || 0} shifts`, '#10b981'),
                lossCard('Actual Time', `${loss.actual_hours || 0} h`, `${loss.actual_shifts || 0} shifts`, '#3b82f6'),
                lossCard('Shift Loss', `${loss.shift_loss || 0}`, `${loss.total_loss_hours || 0} h lost`, '#f59e0b'),
                lossCard('Factory Loss', money, loss.rate_per_shift ? `@ ₹${loss.rate_per_shift}/shift` : (loss.rate_per_machine_hour ? `@ ₹${loss.rate_per_machine_hour}/mc-hr` : 'enter a rate'), '#ef4444')
            ].join('');

            // Waterfall: STD -> +downtime -> +cycle slip -> +reject -> Actual
            const cvs = document.getElementById('lossWaterfall');
            if (!cvs) return;
            if (orderCharts['lossWaterfall']) orderCharts['lossWaterfall'].destroy();
            const std = loss.std_hours || 0;
            const dt = loss.downtime_hours || 0;
            const cyc = loss.cycle_loss_hours || 0;
            const rej = loss.reject_loss_hours || 0;
            orderCharts['lossWaterfall'] = new Chart(cvs, {
                type: 'bar',
                data: {
                    labels: ['STD', 'Downtime', 'Slow Cycle', 'Rejects', 'Actual'],
                    datasets: [{
                        label: 'Hours',
                        data: [std, dt, cyc, rej, loss.actual_hours || 0],
                        backgroundColor: ['#10b981', '#f59e0b', '#8b5cf6', '#ef4444', '#3b82f6'],
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false }, title: { display: true, text: 'Time Loss Waterfall (hours)', font: { size: 11 } } },
                    scales: { y: { beginAtZero: true } }
                }
            });
        }
        function onLossRateChange() {
            AnalyzeFilters.lossPerShift = parseFloat(document.getElementById('rateShift').value) || 0;
            AnalyzeFilters.lossPerMachineHour = parseFloat(document.getElementById('rateMcHr').value) || 0;
            // Re-fetch current order with new rates (loss is computed server-side)
            if (currentOrderData && currentOrderData.info) {
                const on = currentOrderData.info.order_no || document.getElementById('modalTitle').textContent;
                if (on) loadOrderDetails(on);
            }
        }

        /* =========================================
           MOULD LOGIC
           ========================================= */
        let mouldCharts = {};

        async function searchMould() {
            const code = document.getElementById('mouldSearchInput').value.trim();
            if (!code) return JPSMS.toast('Enter Mould Name/Code', 'warning');

            const dashboard = document.getElementById('mouldDashboard');
            const errorDiv = document.getElementById('mouldError');
            dashboard.style.display = 'none';
            errorDiv.style.display = 'none';

            JPSMS.toast('Analyzing Mould Data...', 'info');

            const url = `/analyze/mould/${encodeURIComponent(code)}` + filterQS();

            try {
                const res = await JPSMS.api.get(url);
                if (res.ok) {
                    renderMouldDashboard(res.data);
                    dashboard.style.display = 'block';
                } else {
                    errorDiv.textContent = res.error || 'No data found';
                    errorDiv.style.display = 'block';
                }
            } catch (e) {
                errorDiv.textContent = e.message;
                errorDiv.style.display = 'block';
            }
        }

        function switchMouldTab(tab) {
            const isDetail = tab === 'detail';
            document.getElementById('mouldSummary').style.display = isDetail ? 'none' : 'block';
            document.getElementById('mouldDetail').style.display = isDetail ? 'block' : 'none';
            document.getElementById('mTabSummary').classList.toggle('active', !isDetail);
            document.getElementById('mTabDetail').classList.toggle('active', isDetail);
        }

        // Populate mould autocomplete from master (best-effort)
        async function loadMouldOptions() {
            const dl = document.getElementById('mouldOptions');
            if (!dl) return;
            try {
                const res = await JPSMS.api.get('/masters/moulds');
                const rows = (res && (res.data || res)) || [];
                if (Array.isArray(rows)) {
                    dl.innerHTML = rows.slice(0, 500).map(m =>
                        `<option value="${(m.mould_number || m.mould_name || '').replace(/"/g, '&quot;')}">${m.mould_name || ''}</option>`).join('');
                }
            } catch (e) { /* optional */ }
        }

        function renderMouldDashboard(data) {
            const { mould, kpi, rejections, downtime, trend } = data;
            const detail = data.detail || { machines: [], orders: [] };

            // Title
            document.getElementById('mTitle').textContent = mould.mould_name || mould.mould_number || '-';
            document.getElementById('mSub').textContent =
                `${mould.mould_number || ''}${mould.no_of_cav ? ' · ' + mould.no_of_cav + ' cav' : ''}${mould.cycle_time ? ' · STD ' + mould.cycle_time + 's' : ''}`;

            // KPIs
            const totalOut = kpi.totalOutput;
            document.getElementById('mkpiOutput').textContent = totalOut.toLocaleString();
            document.getElementById('mkpiRunHrs').textContent = `Run Hrs: ${kpi.totalRunHours}`;
            document.getElementById('mkpiRejRate').textContent = `${kpi.rejRate}%`;
            document.getElementById('mkpiRejQty').textContent = `Qty: ${kpi.totalReject}`;
            document.getElementById('mkpiDown').textContent = `${kpi.totalDowntime} min`;
            document.getElementById('mkpiCT').textContent = `${kpi.avgCycleTime}s`;
            document.getElementById('mkpiStdCT').textContent = `Std: ${kpi.stdCycle || mould.cycle_time || '-'}s`;
            document.getElementById('mkpiOEE').textContent = `${kpi.oee}%`;
            document.getElementById('mkpiOEEbreak').textContent = `A${kpi.availability} P${kpi.performance} Q${kpi.quality}`;

            // Detail tables
            const rowFor = (r) => `<tr><td style="font-weight:600">${r.key}</td><td class="text-end">${(r.good || 0).toLocaleString()}</td><td class="text-end" style="color:${r.reject > 0 ? '#ef4444' : '#94a3b8'}">${(r.reject || 0).toLocaleString()}</td><td class="text-end">${Math.round(r.downtime || 0)} min</td></tr>`;
            document.getElementById('mDetailMachines').innerHTML = detail.machines.length ? detail.machines.map(rowFor).join('') : '<tr><td colspan="4" class="text-center p-3">No data</td></tr>';
            document.getElementById('mDetailOrders').innerHTML = detail.orders.length ? detail.orders.map(rowFor).join('') : '<tr><td colspan="4" class="text-center p-3">No data</td></tr>';

            // Reset to Summary tab on each search
            switchMouldTab('summary');

            // --- CHARTS ---
            if (mouldCharts.rej) mouldCharts.rej.destroy();
            if (mouldCharts.down) mouldCharts.down.destroy();
            if (mouldCharts.trend) mouldCharts.trend.destroy();

            // 1. Rejection Pareto (Bar)
            const rejLabels = rejections.slice(0, 10).map(r => r.reason);
            const rejData = rejections.slice(0, 10).map(r => r.qty);

            mouldCharts.rej = new Chart(document.getElementById('mouldRejChart'), {
                type: 'bar',
                data: {
                    labels: rejLabels,
                    datasets: [{
                        label: 'Reject Qty',
                        data: rejData,
                        backgroundColor: '#ef4444',
                        borderRadius: 4
                    }]
                },
                options: {
                    indexAxis: 'y', // Horizontal Bar for better readable labels
                    maintainAspectRatio: false
                }
            });

            // 2. Downtime (Doughnut)
            // Group small items into "Others"
            let dtLabels = [];
            let dtData = [];
            let otherSum = 0;
            downtime.forEach((d, i) => {
                if (i < 5) {
                    dtLabels.push(d.reason);
                    dtData.push(d.min);
                } else {
                    otherSum += d.min;
                }
            });
            if (otherSum > 0) {
                dtLabels.push('Others');
                dtData.push(otherSum);
            }

            mouldCharts.down = new Chart(document.getElementById('mouldDownChart'), {
                type: 'doughnut',
                data: {
                    labels: dtLabels,
                    datasets: [{
                        data: dtData,
                        backgroundColor: ['#f59e0b', '#3b82f6', '#10b981', '#6366f1', '#8b5cf6', '#94a3b8'],
                        borderWidth: 0
                    }]
                },
                options: { cutout: '60%', maintainAspectRatio: false }
            });

            // 3. Trend (Line)
            mouldCharts.trend = new Chart(document.getElementById('mouldTrendChart'), {
                type: 'line',
                data: {
                    labels: trend.map(t => new Date(t.date).toLocaleDateString()),
                    datasets: [
                        {
                            label: 'Good Qty',
                            data: trend.map(t => t.good),
                            borderColor: '#10b981',
                            tension: 0.3,
                            fill: false
                        },
                        {
                            label: 'Reject Qty',
                            data: trend.map(t => t.reject),
                            borderColor: '#ef4444',
                            tension: 0.3,
                            fill: false
                        }
                    ]
                },
                options: { maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
            });
        }

        /* =========================================
           SUPERVISOR LOGIC
           ========================================= */
        let supChartInstance = null;
        function supKpiCard(label, value, sub, color) {
            return `<div class="card" style="padding:15px; border-left:4px solid ${color}">
                <small style="color:#64748b">${label}</small>
                <div style="font-weight:bold; font-size:1.4em">${value}</div>
                ${sub ? `<small class="text-muted" style="font-size:0.8em">${sub}</small>` : ''}
            </div>`;
        }
        async function loadSupervisorAnalysis() {
            const body = document.getElementById('supTableBody');
            try {
                const res = await JPSMS.api.get('/analyze/supervisor' + filterQS());
                if (!res.ok) { body.innerHTML = `<tr><td colspan="10" class="text-center p-3 text-danger">${res.error || 'No data'}</td></tr>`; return; }
                const sups = res.data.supervisors || [];
                const t = res.data.totals || {};

                document.getElementById('supKpis').innerHTML = [
                    supKpiCard('Supervisors', t.supervisors || 0, `${t.entries || 0} entries`, '#3b82f6'),
                    supKpiCard('Total Good', (t.good || 0).toLocaleString(), 'pcs', '#10b981'),
                    supKpiCard('Total Reject', (t.reject || 0).toLocaleString(), `${t.rejRate || 0}% rate`, '#ef4444'),
                    supKpiCard('Downtime', `${t.downtime || 0} min`, 'owned across shifts', '#f59e0b')
                ].join('');

                if (!sups.length) { body.innerHTML = '<tr><td colspan="10" class="text-center p-3">No entries in range</td></tr>'; return; }

                body.innerHTML = sups.map(s => `
                    <tr>
                        <td style="font-weight:700; color:#334155">${s.name}${s.matched ? '' : ' <span style="font-size:0.7rem; color:#f59e0b" title="No matching user account">(unmatched)</span>'}</td>
                        <td style="color:#64748b">${s.role || '-'}</td>
                        <td class="text-end">${s.good.toLocaleString()}</td>
                        <td class="text-end" style="color:${s.reject > 0 ? '#ef4444' : '#94a3b8'}">${s.reject.toLocaleString()}</td>
                        <td class="text-end" style="color:${s.rejRate > 5 ? '#ef4444' : '#64748b'}">${s.rejRate}%</td>
                        <td class="text-end">${s.downtime} min</td>
                        <td class="text-end">${s.shifts}</td>
                        <td class="text-end">${s.entries}</td>
                        <td class="text-end">${s.machines}</td>
                        <td class="text-end" style="font-weight:600">${s.avgPerShift.toLocaleString()}</td>
                    </tr>`).join('');

                // Leaderboard chart (top 12 by good, good vs reject stacked)
                const top = sups.slice(0, 12);
                const ctx = document.getElementById('supChart');
                if (supChartInstance) supChartInstance.destroy();
                supChartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: top.map(s => s.name),
                        datasets: [
                            { label: 'Good', data: top.map(s => s.good), backgroundColor: '#10b981', borderRadius: 4 },
                            { label: 'Reject', data: top.map(s => s.reject), backgroundColor: '#ef4444', borderRadius: 4 }
                        ]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { position: 'bottom' } },
                        scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true } }
                    }
                });
            } catch (e) {
                body.innerHTML = `<tr><td colspan="10" class="text-center p-3 text-danger">${e.message}</td></tr>`;
            }
        }

        /* =========================================
           PLANT LOGIC
           ========================================= */
        let plantCharts = {};
        function oeeColor(v) { return v >= 85 ? '#10b981' : v >= 60 ? '#f59e0b' : '#ef4444'; }
        async function loadPlantAnalysis() {
            const kpis = document.getElementById('plantKpis');
            kpis.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:30px; color:#94a3b8"><div class="spinner-border spinner-border-sm text-primary"></div> Loading…</div>';
            let data;
            try {
                const res = await JPSMS.api.get('/analyze/plant' + filterQS());
                if (!res.ok) { kpis.innerHTML = `<div style="grid-column:1/-1; color:#ef4444; text-align:center; padding:20px">${res.error || 'No data'}</div>`; return; }
                data = res.data;
            } catch (e) {
                kpis.innerHTML = `<div style="grid-column:1/-1; color:#ef4444; text-align:center; padding:20px">${e.message}</div>`; return;
            }

            const o = data.overall || {};
            kpis.innerHTML = [
                supKpiCard('OEE', `${o.oee || 0}%`, 'Availability × Perf × Quality', oeeColor(o.oee || 0)),
                supKpiCard('Availability', `${o.availability || 0}%`, `${o.runHours || 0} run hrs`, '#3b82f6'),
                supKpiCard('Performance', `${o.performance || 0}%`, 'vs STD capacity', '#8b5cf6'),
                supKpiCard('Quality', `${o.quality || 0}%`, `${(o.reject || 0).toLocaleString()} rej`, '#ef4444'),
                supKpiCard('Output', `${(o.output || 0).toLocaleString()}`, `${o.downtime || 0} min down`, '#10b981')
            ].join('');

            Object.values(plantCharts).forEach(c => c && c.destroy());
            plantCharts = {};

            // OEE gauge (doughnut)
            plantCharts.gauge = new Chart(document.getElementById('plantOeeGauge'), {
                type: 'doughnut',
                data: { labels: ['OEE', ''], datasets: [{ data: [o.oee || 0, 100 - (o.oee || 0)], backgroundColor: [oeeColor(o.oee || 0), '#e2e8f0'], borderWidth: 0 }] },
                options: {
                    responsive: true, maintainAspectRatio: false, cutout: '72%',
                    plugins: { legend: { display: false }, tooltip: { enabled: false } }
                },
                plugins: [{
                    id: 'oeeText', afterDraw: (ch) => {
                        const { ctx, chartArea } = ch; const x = (chartArea.left + chartArea.right) / 2; const y = (chartArea.top + chartArea.bottom) / 2;
                        ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.font = 'bold 28px sans-serif'; ctx.fillStyle = oeeColor(o.oee || 0); ctx.fillText(`${o.oee || 0}%`, x, y);
                        ctx.restore();
                    }
                }]
            });

            // Date-wise OEE trend
            const bd = data.byDate || [];
            plantCharts.trend = new Chart(document.getElementById('plantTrend'), {
                type: 'line',
                data: {
                    labels: bd.map(d => new Date(d.key).toLocaleDateString()),
                    datasets: [
                        { label: 'OEE', data: bd.map(d => d.oee), borderColor: '#024c81', backgroundColor: 'rgba(1,168,221,0.12)', fill: true, tension: 0.3 },
                        { label: 'Availability', data: bd.map(d => d.availability), borderColor: '#3b82f6', tension: 0.3, fill: false, pointRadius: 0 },
                        { label: 'Performance', data: bd.map(d => d.performance), borderColor: '#8b5cf6', tension: 0.3, fill: false, pointRadius: 0 },
                        { label: 'Quality', data: bd.map(d => d.quality), borderColor: '#10b981', tension: 0.3, fill: false, pointRadius: 0 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true, max: 100 } } }
            });

            // Line-wise OEE bar
            const bl = data.byLine || [];
            plantCharts.lines = new Chart(document.getElementById('plantLines'), {
                type: 'bar',
                data: { labels: bl.map(l => l.key), datasets: [{ label: 'OEE %', data: bl.map(l => l.oee), backgroundColor: bl.map(l => oeeColor(l.oee)), borderRadius: 4 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100 } } }
            });

            // Loss Pareto
            const lr = (data.lossReasons || []).slice(0, 10);
            plantCharts.loss = new Chart(document.getElementById('plantLoss'), {
                type: 'bar',
                data: { labels: lr.map(r => r.reason), datasets: [{ label: 'Downtime (min)', data: lr.map(r => r.min), backgroundColor: '#f59e0b', borderRadius: 4 }] },
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        /* =========================================
           MACHINE LOGIC
           ========================================= */
        let machineCharts = {};
        async function loadMachineAnalysis() {
            const body = document.getElementById('mcTableBody');
            let data;
            try {
                const res = await JPSMS.api.get('/analyze/machine' + filterQS());
                if (!res.ok) { body.innerHTML = `<tr><td colspan="11" class="text-center p-3 text-danger">${res.error || 'No data'}</td></tr>`; return; }
                data = res.data;
            } catch (e) { body.innerHTML = `<tr><td colspan="11" class="text-center p-3 text-danger">${e.message}</td></tr>`; return; }

            const machines = data.machines || [];
            const t = data.totals || {};
            document.getElementById('mcKpis').innerHTML = [
                supKpiCard('Machines', t.machines || 0, 'in range', '#3b82f6'),
                supKpiCard('Total Output', (t.output || 0).toLocaleString(), 'pcs', '#10b981'),
                supKpiCard('Total Reject', (t.reject || 0).toLocaleString(), '', '#ef4444'),
                supKpiCard('Downtime', `${t.downtime || 0} min`, 'across machines', '#f59e0b')
            ].join('');

            if (!machines.length) { body.innerHTML = '<tr><td colspan="11" class="text-center p-3">No entries in range</td></tr>'; return; }

            body.innerHTML = machines.map((m, i) => `
                <tr style="cursor:pointer" data-mc-idx="${i}">
                    <td style="font-weight:700; color:#334155">${esc(m.key)}</td>
                    <td style="color:#64748b">${esc(m.line)}</td>
                    <td class="text-end" style="font-weight:600">${m.utilization}%</td>
                    <td class="text-end" style="color:${oeeColor(m.oee)}; font-weight:700">${m.oee}%</td>
                    <td class="text-end">${m.performance}%</td>
                    <td class="text-end">${m.quality}%</td>
                    <td class="text-end">${m.good.toLocaleString()}</td>
                    <td class="text-end" style="color:${m.reject > 0 ? '#ef4444' : '#94a3b8'}">${m.reject.toLocaleString()}</td>
                    <td class="text-end">${m.downtime} min</td>
                    <td class="text-end">${m.runHours}</td>
                    <td class="text-end">${m.mouldCount}</td>
                </tr>`).join('');
            // Delegated click — avoids interpolating machine names into inline JS
            body.onclick = (ev) => {
                const tr = ev.target.closest('tr[data-mc-idx]');
                if (!tr) return;
                const m = machines[Number(tr.getAttribute('data-mc-idx'))];
                if (m) drillMachine(m.key);
            };

            Object.values(machineCharts).forEach(c => c && c.destroy());
            machineCharts = {};
            const top = machines.slice(0, 14);
            machineCharts.oee = new Chart(document.getElementById('mcOeeChart'), {
                type: 'bar',
                data: { labels: top.map(m => m.key), datasets: [{ label: 'OEE %', data: top.map(m => m.oee), backgroundColor: top.map(m => oeeColor(m.oee)), borderRadius: 4 }] },
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, max: 100 } } }
            });
            machineCharts.util = new Chart(document.getElementById('mcUtilChart'), {
                type: 'bar',
                data: { labels: top.map(m => m.key), datasets: [{ label: 'Utilization %', data: top.map(m => m.utilization), backgroundColor: '#3b82f6', borderRadius: 4 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100 } } }
            });
        }

        async function drillMachine(machine) {
            const wrap = document.getElementById('mcDrill');
            document.getElementById('mcDrillTitle').textContent = `Downtime Breakdown — ${machine}`;
            wrap.style.display = 'block';
            wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            try {
                const res = await JPSMS.api.get('/analyze/machine' + filterQS({ machine }));
                if (!res.ok || !res.data.drill) return;
                const d = res.data.drill;

                ['down', 'trend'].forEach(k => { if (machineCharts['drill_' + k]) machineCharts['drill_' + k].destroy(); });

                const dr = d.downtimeReasons.slice(0, 8);
                machineCharts.drill_down = new Chart(document.getElementById('mcDrillDown'), {
                    type: 'doughnut',
                    data: { labels: dr.length ? dr.map(r => r.reason) : ['No downtime'], datasets: [{ data: dr.length ? dr.map(r => r.min) : [1], backgroundColor: ['#ef4444', '#f59e0b', '#3b82f6', '#8b5cf6', '#10b981', '#6366f1', '#94a3b8', '#0ea5e9'], borderWidth: 0 }] },
                    options: { responsive: true, maintainAspectRatio: false, cutout: '60%', plugins: { legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11 } } } } }
                });
                machineCharts.drill_trend = new Chart(document.getElementById('mcDrillTrend'), {
                    type: 'line',
                    data: {
                        labels: d.byDate.map(x => new Date(x.date).toLocaleDateString()),
                        datasets: [
                            { label: 'Good', data: d.byDate.map(x => x.good), borderColor: '#10b981', tension: 0.3, fill: false },
                            { label: 'Reject', data: d.byDate.map(x => x.reject), borderColor: '#ef4444', tension: 0.3, fill: false }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true } } }
                });
            } catch (e) { JPSMS.toast(e.message, 'error'); }
        }
    </script>
    <script src="/assets/ai-chat.js"></script>
</body>

</html>
