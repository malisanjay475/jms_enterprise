<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JMS OCEAN - Analysis</title>
    <!-- PWA Meta -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e293b">
    <link rel="stylesheet" href="/assets/app.css?v=11">
    <link rel="stylesheet" href="/assets/bootstrap-icons.min.css">
    <script src="/assets/vendor/jsdelivr/chart.js"></script>
    <style>
        .analysis-header {
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .analysis-heading {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }

        .analysis-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid rgba(1, 168, 221, 0.18);
            background: linear-gradient(135deg, rgba(1, 168, 221, 0.12), rgba(2, 76, 129, 0.08));
            color: var(--primary);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .analysis-subtitle {
            max-width: 860px;
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
        }

        .analysis-header-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .analysis-view-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 16px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.72);
            box-shadow: var(--shadow-sm);
            color: var(--text-main);
            font-size: 0.92rem;
            font-weight: 700;
        }

        .filter-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 20px 22px;
            margin-bottom: 24px;
            border-radius: 28px;
            border: 1px solid var(--border);
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.94), rgba(248, 252, 255, 0.94)),
                radial-gradient(circle at top right, rgba(1, 168, 221, 0.08), transparent 34%);
            box-shadow: var(--shadow-sm);
        }

        .filter-bar label,
        .filter-bar span {
            color: var(--text-muted);
            font-weight: 700;
        }

        .filter-bar .form-control {
            width: auto;
            min-width: 190px;
            background: rgba(255, 255, 255, 0.96);
        }

        #contentArea {
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-bottom: 20px;
        }

        .analysis-empty-state {
            text-align: center;
            padding: 48px 32px;
            border-radius: 28px;
            border: 1px solid rgba(239, 68, 68, 0.16);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(255, 247, 247, 0.96));
            box-shadow: var(--shadow-sm);
        }

        .chart-container {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(247, 252, 255, 0.98)),
                radial-gradient(circle at top right, rgba(1, 168, 221, 0.08), transparent 32%);
            padding: 24px 26px;
            border-radius: 28px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            margin-bottom: 0;
            min-height: 400px;
            height: 400px;
        }

        .chart-container::before {
            content: '';
            position: absolute;
            top: -72px;
            right: -42px;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(1, 168, 221, 0.16), transparent 68%);
            pointer-events: none;
        }

        .chart-container h3 {
            position: relative;
            margin: 0 0 18px 0;
            color: var(--text-main);
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .analysis-split-view {
            display: flex;
            gap: 20px;
            height: calc(100vh - 140px);
            overflow: hidden;
        }

        .analysis-split-sidebar {
            width: 320px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .analysis-panel-header {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
            background: #f8fafc;
        }

        .analysis-panel-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .analysis-order-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .analysis-order-item:hover {
            background: #f1f5f9;
        }

        .analysis-order-item.active {
            background: #eff6ff;
            border-color: #3b82f6;
        }

        .analysis-main-view {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        .analysis-tabs {
            display: flex;
            background: rgba(2, 76, 129, 0.08);
            padding: 4px;
            margin-bottom: 10px;
            border-radius: 999px;
            border: 1px solid rgba(2, 76, 129, 0.08);
        }

        .analysis-tab {
            flex: 1;
            text-align: center;
            padding: 8px 14px;
            font-size: 0.85rem;
            border-radius: 999px;
            cursor: pointer;
            color: #64748b;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .analysis-tab.active {
            background: linear-gradient(135deg, rgba(2, 76, 129, 0.96), rgba(1, 168, 221, 0.9));
            color: #fff;
            box-shadow: 0 8px 18px rgba(2, 76, 129, 0.2);
        }

        @media (max-width: 980px) {
            .analysis-header-actions {
                width: 100%;
                margin-left: 0;
            }

            .filter-bar {
                border-radius: 22px;
                padding: 18px;
            }

            .filter-bar .form-control {
                min-width: 0;
                width: 100% !important;
                flex: 1 1 200px;
            }
        }

        @media (max-width: 720px) {
            .analysis-kicker {
                font-size: 0.72rem;
                letter-spacing: 0.06em;
            }

            .analysis-subtitle {
                font-size: 0.92rem;
            }

            .chart-container {
                min-height: 340px;
                height: 340px;
                padding: 20px 18px;
                border-radius: 22px;
            }
        }
    </style>
</head>

<body>
    <div class="main-content">
        <div class="header analysis-header">
            <div class="analysis-heading">
                <div class="analysis-kicker">
                    <i class="bi bi-graph-up-arrow"></i>
                    JMS Ocean Analytics
                </div>
                <div class="page-title" id="pageTitle">Analysis</div>
                <div class="analysis-subtitle" id="pageSubtitle">
                    Track production, orders, moulds, supervisors, and plant trends in one clean JMS OCEAN analysis workspace.
                </div>
            </div>
            <div class="analysis-header-actions">
                <div class="analysis-view-chip" id="analysisViewChip">
                    <i class="bi bi-bar-chart-line"></i>
                    <span>Analytics Workspace</span>
                </div>
                <button class="btn btn-outline" onclick="loadData()">Refresh Data</button>
            </div>
        </div>

        <div class="filter-bar">
            <label>Factory:</label>
            <select id="factorySelect" class="form-control" style="width:auto" onchange="onFactoryChange()"></select>
            <label id="compareLabel" style="display:none; align-items:center; gap:6px; cursor:pointer">
                <input type="checkbox" id="compareToggle" onchange="onCompareToggle()" style="width:auto; margin:0"> Compare
            </label>
            <select id="factoryCompareSelect" class="form-control" multiple size="1"
                style="width:auto; min-width:200px; display:none" title="Pick factories to compare"
                onchange="loadCompare()"></select>
            <span style="width:1px; height:24px; background:var(--border)"></span>
            <label>Date:</label>
            <input type="date" id="fromDate" class="form-control" style="width:auto">
            <span>to</span>
            <input type="date" id="toDate" class="form-control" style="width:auto">
            <button class="btn btn-primary" onclick="loadData()">Apply</button>
        </div>

        <div id="contentArea">
            <!-- Dynamic Content -->
        </div>
    </div>

    <script src="/assets/app.min.js"></script>
    <script>
        // Shared analyze filter state (factory access, date range, compare)
        const AnalyzeFilters = {
            view: 'plant',
            factories: [],        // accessible factories [{id,name,code}]
            canAll: false,
            factoryId: null,      // selected single factory (null = all accessible)
            compare: false,
            compareIds: [],       // factory ids to compare
            from: null,
            to: null,
            lossPerShift: 0,
            lossPerMachineHour: 0
        };

        async function loadFactories() {
            try {
                const res = await JPSMS.api.get('/factories');
                if (res.ok && Array.isArray(res.data)) {
                    AnalyzeFilters.factories = res.data;
                    AnalyzeFilters.canAll = !!res.can_select_all_factories;
                }
            } catch (e) { console.warn('factory load failed', e); }

            const sel = document.getElementById('factorySelect');
            const cmp = document.getElementById('factoryCompareSelect');
            const cmpLabel = document.getElementById('compareLabel');
            if (!sel) return;

            const opts = [];
            if (AnalyzeFilters.canAll || AnalyzeFilters.factories.length > 1) {
                opts.push('<option value="">All My Factories</option>');
            }
            AnalyzeFilters.factories.forEach(f => {
                opts.push(`<option value="${f.id}">${f.name || f.code || ('Factory ' + f.id)}</option>`);
            });
            sel.innerHTML = opts.join('');

            // Default: single-factory users are locked to their factory
            if (AnalyzeFilters.factories.length === 1 && !AnalyzeFilters.canAll) {
                AnalyzeFilters.factoryId = AnalyzeFilters.factories[0].id;
                sel.value = String(AnalyzeFilters.factoryId);
                sel.disabled = true;
            }

            // Compare is available to anyone who can see >1 factory
            if ((AnalyzeFilters.canAll || AnalyzeFilters.factories.length > 1)) {
                cmpLabel.style.display = 'inline-flex';
                cmp.innerHTML = AnalyzeFilters.factories
                    .map(f => `<option value="${f.id}">${f.name || f.code || ('Factory ' + f.id)}</option>`).join('');
            }
        }

        function onFactoryChange() {
            const v = document.getElementById('factorySelect').value;
            AnalyzeFilters.factoryId = v ? Number(v) : null;
            loadData();
        }
        function onCompareToggle() {
            AnalyzeFilters.compare = document.getElementById('compareToggle').checked;
            const cmp = document.getElementById('factoryCompareSelect');
            cmp.style.display = AnalyzeFilters.compare ? 'inline-block' : 'none';
            cmp.size = AnalyzeFilters.compare ? Math.min(4, AnalyzeFilters.factories.length) : 1;
            const panel = document.getElementById('comparePanel');
            if (!AnalyzeFilters.compare) {
                AnalyzeFilters.compareIds = [];
                if (panel) panel.remove();
            } else {
                loadCompare();
            }
        }

        let compareChart = null;
        async function loadCompare() {
            syncFilterState();
            const ids = AnalyzeFilters.compareIds;
            let panel = document.getElementById('comparePanel');
            if (!ids.length) { if (panel) panel.remove(); return; }

            if (!panel) {
                panel = document.createElement('div');
                panel.id = 'comparePanel';
                panel.className = 'card';
                panel.style.cssText = 'padding:0; overflow:hidden; margin-bottom:24px';
                const ca = document.getElementById('contentArea');
                ca.parentNode.insertBefore(panel, ca);
            }
            panel.innerHTML = '<div style="padding:20px; text-align:center; color:#94a3b8"><div class="spinner-border spinner-border-sm text-primary"></div> Comparing factories…</div>';

            try {
                const res = await JPSMS.api.get('/analyze/compare' + filterQS({ factories: ids.join(',') }));
                if (!res.ok) { panel.innerHTML = `<div style="padding:20px; color:#ef4444">${res.error || 'Compare failed'}</div>`; return; }
                const facs = res.data.factories || [];
                if (!facs.length) { panel.innerHTML = '<div style="padding:20px; color:#64748b">No data for selected factories</div>'; return; }

                const metric = (label, val, color) => `<span style="color:${color}; font-weight:700">${val}</span> <span style="font-size:0.72rem; color:#94a3b8">${label}</span>`;
                panel.innerHTML = `
                    <div style="padding:12px 16px; font-weight:700; color:#1e293b; background:#f8fafc; border-bottom:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center">
                        <span><i class="bi bi-bar-chart-steps"></i> Factory Comparison</span>
                        <button class="btn icon ghost" onclick="document.getElementById('compareToggle').checked=false; onCompareToggle()"><i class="bi bi-x-lg"></i></button>
                    </div>
                    <div style="display:grid; grid-template-columns: 1.2fr 1fr; gap:20px; padding:16px">
                        <div style="overflow-x:auto">
                            <table class="table" style="margin:0; font-size:0.85rem">
                                <thead><tr><th>Factory</th><th class="text-end">OEE</th><th class="text-end">Avail</th><th class="text-end">Perf</th><th class="text-end">Qual</th><th class="text-end">Output</th><th class="text-end">Rej %</th><th class="text-end">Downtime</th></tr></thead>
                                <tbody>${facs.map(f => `<tr>
                                    <td style="font-weight:700">${f.name}</td>
                                    <td class="text-end" style="color:${oeeColor(f.oee)}; font-weight:700">${f.oee}%</td>
                                    <td class="text-end">${f.availability}%</td>
                                    <td class="text-end">${f.performance}%</td>
                                    <td class="text-end">${f.quality}%</td>
                                    <td class="text-end">${f.output.toLocaleString()}</td>
                                    <td class="text-end" style="color:${f.rejRate > 5 ? '#ef4444' : '#64748b'}">${f.rejRate}%</td>
                                    <td class="text-end">${f.downtime} min</td>
                                </tr>`).join('')}</tbody>
                            </table>
                        </div>
                        <div style="min-height:220px; position:relative"><canvas id="compareChart"></canvas></div>
                    </div>`;

                if (compareChart) compareChart.destroy();
                compareChart = new Chart(document.getElementById('compareChart'), {
                    type: 'bar',
                    data: {
                        labels: facs.map(f => f.name),
                        datasets: [
                            { label: 'OEE', data: facs.map(f => f.oee), backgroundColor: '#024c81', borderRadius: 4 },
                            { label: 'Quality', data: facs.map(f => f.quality), backgroundColor: '#10b981', borderRadius: 4 },
                            { label: 'Rej %', data: facs.map(f => f.rejRate), backgroundColor: '#ef4444', borderRadius: 4 }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true } } }
                });
            } catch (e) {
                panel.innerHTML = `<div style="padding:20px; color:#ef4444">${e.message}</div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            JPSMS.auth.requireAuth();
            JPSMS.renderShell('analyze');

            const params = new URLSearchParams(window.location.search);
            const view = params.get('view') || 'plant';
            AnalyzeFilters.view = view;
            await loadFactories();

            // Permission Check
            const permMap = {
                'order': 'ana_order',
                'mould': 'ana_mould',
                'supervisor': 'ana_sup',
                'plant': 'ana_plant',
                'machine': 'ana_machine'
            };

            const requiredPerm = permMap[view];
            if (requiredPerm && !JPSMS.auth.can(requiredPerm)) {
                JPSMS.toast('Access Denied: ' + view, 'error');
                document.getElementById('contentArea').innerHTML = `
                    <div class="analysis-empty-state" style="color:#b91c1c">
                        <h2>Access Denied</h2>
                        <p>You do not have permission to view ${view} analysis.</p>
                    </div>
                 `;
                return;
            }

            // Set Title
            const titles = {
                'order': 'Order Analysis',
                'mould': 'Mould Performance Analysis',
                'supervisor': 'Supervisor Efficiency',
                'plant': 'Overall Plant Analysis',
                'machine': 'Machine Utilization',
            };
            const subtitles = {
                'order': 'Review running and completed orders with a cleaner JMS OCEAN analysis workspace built for quick traceability.',
                'mould': 'Track mould-level performance, rejection patterns, downtime, and daily output in the same premium layout as the rest of the system.',
                'supervisor': 'Compare shift output and supervisor-led production activity with a more readable analysis screen.',
                'plant': 'See plant-level OEE and high-level production trends in a branded workspace that matches Dashboard and Planning.',
                'machine': 'Monitor machine utilization and output behavior in the same polished JMS OCEAN design language.',
            };
            const chipIcons = {
                'order': 'cart-check',
                'mould': 'diagram-3',
                'supervisor': 'person-badge',
                'plant': 'building',
                'machine': 'cpu'
            };
            const chipLabels = {
                'order': 'Order View',
                'mould': 'Mould View',
                'supervisor': 'Supervisor View',
                'plant': 'Plant View',
                'machine': 'Machine View'
            };
            document.getElementById('pageTitle').textContent = titles[view] || 'Analysis';
            document.getElementById('pageSubtitle').textContent = subtitles[view] || subtitles.plant;
            const viewChip = document.getElementById('analysisViewChip');
            if (viewChip) {
                viewChip.innerHTML = `<i class="bi bi-${chipIcons[view] || 'bar-chart-line'}"></i><span>${chipLabels[view] || 'Analytics Workspace'}</span>`;
            }

            // Render Placeholder Content
            renderView(view);
        });

        function renderView(view) {
            const container = document.getElementById('contentArea');

            if (view === 'order') {
                container.innerHTML = `
                    <style>
                        .oa-toolbar { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
                        .oa-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px; padding-bottom:40px; }
                        .oa-card { background:#fff; border:1px solid var(--border,#e2e8f0); border-radius:16px; padding:18px 20px; cursor:pointer; position:relative; overflow:hidden; transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
                        .oa-card:hover { transform:translateY(-3px); box-shadow:0 12px 24px -12px rgba(2,76,129,.35); border-color:#bfdbfe; }
                        .oa-card::before { content:''; position:absolute; inset:0 auto 0 0; width:5px; background:#e2e8f0; }
                        .oa-card.running::before { background:linear-gradient(#3b82f6,#01a8dd); }
                        .oa-card.completed::before { background:#10b981; }
                        .oa-card.closed::before { background:#ef4444; }
                        .oa-card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px; }
                        .oa-ono { font-weight:800; color:#0f172a; font-size:1.1rem; letter-spacing:-.01em; }
                        .oa-badge { font-size:.68rem; font-weight:800; letter-spacing:.04em; padding:4px 10px; border-radius:999px; text-transform:uppercase; }
                        .oa-badge.running { background:rgba(59,130,246,.12); color:#2563eb; }
                        .oa-badge.completed { background:rgba(16,185,129,.14); color:#059669; }
                        .oa-badge.closed { background:rgba(239,68,68,.12); color:#dc2626; }
                        .oa-mould { color:#334155; font-size:.9rem; font-weight:600; display:flex; align-items:center; gap:6px; margin-bottom:4px; }
                        .oa-item { font-size:.84rem; color:#64748b; margin-bottom:14px; min-height:38px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
                        .oa-prog { height:7px; border-radius:999px; background:#eef2f7; overflow:hidden; margin-bottom:6px; }
                        .oa-prog > span { display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#024c81,#01a8dd); }
                        .oa-foot { display:flex; justify-content:space-between; align-items:flex-end; }
                        .oa-client { font-size:.72rem; color:#94a3b8; text-transform:uppercase; letter-spacing:.05em; font-weight:700; }

                        .oa-modal-body { flex:1; overflow-y:auto; padding:22px; background:#eef2f7; }
                        .oa-section { background:#fff; border:1px solid #e8edf3; border-radius:16px; padding:18px 20px; margin-bottom:18px; box-shadow:0 1px 2px rgba(16,24,40,.04); }
                        .oa-section h4 { margin:0 0 14px; font-size:.82rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#64748b; display:flex; align-items:center; gap:8px; }
                        .oa-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
                        .oa-kpi { border:1px solid #eef2f7; border-radius:14px; padding:14px 16px; background:linear-gradient(180deg,#fff,#fafcff); }
                        .oa-kpi .lab { font-size:.72rem; font-weight:700; color:#64748b; display:flex; align-items:center; gap:6px; }
                        .oa-kpi .val { font-size:1.55rem; font-weight:800; color:#0f172a; margin-top:4px; line-height:1.1; }
                        .oa-kpi .sub { font-size:.72rem; color:#94a3b8; margin-top:2px; }
                        .oa-kpi.accent-b { border-top:3px solid #3b82f6; } .oa-kpi.accent-g { border-top:3px solid #10b981; }
                        .oa-kpi.accent-s { border-top:3px solid #64748b; } .oa-kpi.accent-r { border-top:3px solid #ef4444; }
                        .oa-kpi.accent-p { border-top:3px solid #8b5cf6; } .oa-kpi.accent-a { border-top:3px solid #f59e0b; }
                        .oa-kpi.accent-t { border-top:3px solid #0ea5e9; }
                        .oa-meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px 22px; }
                        .oa-meta .lab { font-size:.7rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:#94a3b8; }
                        .oa-meta .v { font-size:.98rem; font-weight:700; color:#1e293b; margin-top:2px; }
                        .oa-chart-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
                        .oa-chart { background:#fff; border:1px solid #e8edf3; border-radius:16px; padding:16px 18px; }
                        .oa-chart h4 { margin:0 0 12px; font-size:.82rem; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:#64748b; }
                        .oa-chart .cwrap { position:relative; height:230px; }
                        .oa-spec { width:100%; border-collapse:collapse; font-size:.9rem; }
                        .oa-spec th, .oa-spec td { padding:10px 12px; text-align:right; border-bottom:1px solid #f1f5f9; }
                        .oa-spec th:first-child, .oa-spec td:first-child { text-align:left; color:#475569; font-weight:600; }
                        .oa-spec thead th { font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:#94a3b8; }
                        .oa-colour-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #f1f5f9; }
                        .oa-swatch { width:16px; height:16px; border-radius:5px; border:1px solid rgba(0,0,0,.1); flex:none; }

            }
        }

        // Build a query string from shared filters
