<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JMS OCEAN - Analysis</title>
    <!-- PWA Meta -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e293b">
    <link rel="stylesheet" href="/assets/app.css?v=11">
    <link rel="stylesheet" href="/assets/bootstrap-icons.min.css">
    <script src="/assets/vendor/jsdelivr/chart.js"></script>
    <style>
        .analysis-header {
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .analysis-heading {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }

        .analysis-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid rgba(1, 168, 221, 0.18);
            background: linear-gradient(135deg, rgba(1, 168, 221, 0.12), rgba(2, 76, 129, 0.08));
            color: var(--primary);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .analysis-subtitle {
            max-width: 860px;
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
        }

        .analysis-header-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .analysis-view-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 16px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.72);
            box-shadow: var(--shadow-sm);
            color: var(--text-main);
            font-size: 0.92rem;
            font-weight: 700;
        }

        .filter-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 20px 22px;
            margin-bottom: 24px;
            border-radius: 28px;
            border: 1px solid var(--border);
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.94), rgba(248, 252, 255, 0.94)),
                radial-gradient(circle at top right, rgba(1, 168, 221, 0.08), transparent 34%);
            box-shadow: var(--shadow-sm);
        }

        .filter-bar label,
        .filter-bar span {
            color: var(--text-muted);
            font-weight: 700;
        }

        .filter-bar .form-control {
            width: auto;
            min-width: 190px;
            background: rgba(255, 255, 255, 0.96);
        }

        #contentArea {
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-bottom: 20px;
        }

        .analysis-empty-state {
            text-align: center;
            padding: 48px 32px;
            border-radius: 28px;
            border: 1px solid rgba(239, 68, 68, 0.16);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(255, 247, 247, 0.96));
            box-shadow: var(--shadow-sm);
        }

        .chart-container {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(247, 252, 255, 0.98)),
                radial-gradient(circle at top right, rgba(1, 168, 221, 0.08), transparent 32%);
            padding: 24px 26px;
            border-radius: 28px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            margin-bottom: 0;
            min-height: 400px;
            height: 400px;
        }

        .chart-container::before {
            content: '';
            position: absolute;
            top: -72px;
            right: -42px;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(1, 168, 221, 0.16), transparent 68%);
            pointer-events: none;
        }

        .chart-container h3 {
            position: relative;
            margin: 0 0 18px 0;
            color: var(--text-main);
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .analysis-split-view {
            display: flex;
            gap: 20px;
            height: calc(100vh - 140px);
            overflow: hidden;
        }

        .analysis-split-sidebar {
            width: 320px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .analysis-panel-header {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
            background: #f8fafc;
        }

        .analysis-panel-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .analysis-order-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .analysis-order-item:hover {
            background: #f1f5f9;
        }

        .analysis-order-item.active {
            background: #eff6ff;
            border-color: #3b82f6;
        }

        .analysis-main-view {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        .analysis-tabs {
            display: flex;
            background: rgba(2, 76, 129, 0.08);
            padding: 4px;
            margin-bottom: 10px;
            border-radius: 999px;
            border: 1px solid rgba(2, 76, 129, 0.08);
        }

        .analysis-tab {
            flex: 1;
            text-align: center;
            padding: 8px 14px;
            font-size: 0.85rem;
            border-radius: 999px;
            cursor: pointer;
            color: #64748b;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .analysis-tab.active {
            background: linear-gradient(135deg, rgba(2, 76, 129, 0.96), rgba(1, 168, 221, 0.9));
            color: #fff;
            box-shadow: 0 8px 18px rgba(2, 76, 129, 0.2);
        }

        @media (max-width: 980px) {
            .analysis-header-actions {
                width: 100%;
                margin-left: 0;
            }

            .filter-bar {
                border-radius: 22px;
                padding: 18px;
            }

            .filter-bar .form-control {
                min-width: 0;
                width: 100% !important;
                flex: 1 1 200px;
            }
        }

        @media (max-width: 720px) {
            .analysis-kicker {
                font-size: 0.72rem;
                letter-spacing: 0.06em;
            }

            .analysis-subtitle {
                font-size: 0.92rem;
            }

            .chart-container {
                min-height: 340px;
                height: 340px;
                padding: 20px 18px;
                border-radius: 22px;
            }
        }
    </style>
</head>

<body>
    <div class="main-content">
        <div class="header analysis-header">
            <div class="analysis-heading">
                <div class="analysis-kicker">
                    <i class="bi bi-graph-up-arrow"></i>
                    JMS Ocean Analytics
                </div>
                <div class="page-title" id="pageTitle">Analysis</div>
                <div class="analysis-subtitle" id="pageSubtitle">
                    Track production, orders, moulds, supervisors, and plant trends in one clean JMS OCEAN analysis workspace.
                </div>
            </div>
            <div class="analysis-header-actions">
                <div class="analysis-view-chip" id="analysisViewChip">
                    <i class="bi bi-bar-chart-line"></i>
                    <span>Analytics Workspace</span>
                </div>
                <button class="btn btn-outline" onclick="loadData()">Refresh Data</button>
            </div>
        </div>

        <div class="filter-bar">
            <label>Factory:</label>
            <select id="factorySelect" class="form-control" style="width:auto" onchange="onFactoryChange()"></select>
            <label id="compareLabel" style="display:none; align-items:center; gap:6px; cursor:pointer">
                <input type="checkbox" id="compareToggle" onchange="onCompareToggle()" style="width:auto; margin:0"> Compare
            </label>
            <select id="factoryCompareSelect" class="form-control" multiple size="1"
                style="width:auto; min-width:200px; display:none" title="Pick factories to compare"></select>
            <span style="width:1px; height:24px; background:var(--border)"></span>
            <label>Date:</label>
            <input type="date" id="fromDate" class="form-control" style="width:auto">
            <span>to</span>
            <input type="date" id="toDate" class="form-control" style="width:auto">
            <button class="btn btn-primary" onclick="loadData()">Apply</button>
        </div>

        <div id="contentArea">
            <!-- Dynamic Content -->
        </div>
    </div>

    <script src="/assets/app.min.js"></script>
    <script>
        // Shared analyze filter state (factory access, date range, compare)
        const AnalyzeFilters = {
            view: 'plant',
            factories: [],        // accessible factories [{id,name,code}]
            canAll: false,
            factoryId: null,      // selected single factory (null = all accessible)
            compare: false,
            compareIds: [],       // factory ids to compare
            from: null,
            to: null,
            lossPerShift: 0,
            lossPerMachineHour: 0
        };

        async function loadFactories() {
            try {
                const res = await JPSMS.api.get('/factories');
                if (res.ok && Array.isArray(res.data)) {
                    AnalyzeFilters.factories = res.data;
                    AnalyzeFilters.canAll = !!res.can_select_all_factories;
                }
            } catch (e) { console.warn('factory load failed', e); }

            const sel = document.getElementById('factorySelect');
            const cmp = document.getElementById('factoryCompareSelect');
            const cmpLabel = document.getElementById('compareLabel');
            if (!sel) return;

            const opts = [];
            if (AnalyzeFilters.canAll || AnalyzeFilters.factories.length > 1) {
                opts.push('<option value="">All My Factories</option>');
            }
            AnalyzeFilters.factories.forEach(f => {
                opts.push(`<option value="${f.id}">${f.name || f.code || ('Factory ' + f.id)}</option>`);
            });
            sel.innerHTML = opts.join('');

            // Default: single-factory users are locked to their factory
            if (AnalyzeFilters.factories.length === 1 && !AnalyzeFilters.canAll) {
                AnalyzeFilters.factoryId = AnalyzeFilters.factories[0].id;
                sel.value = String(AnalyzeFilters.factoryId);
                sel.disabled = true;
            }

            // Compare is available to anyone who can see >1 factory
            if ((AnalyzeFilters.canAll || AnalyzeFilters.factories.length > 1)) {
                cmpLabel.style.display = 'inline-flex';
                cmp.innerHTML = AnalyzeFilters.factories
                    .map(f => `<option value="${f.id}">${f.name || f.code || ('Factory ' + f.id)}</option>`).join('');
            }
        }

        function onFactoryChange() {
            const v = document.getElementById('factorySelect').value;
            AnalyzeFilters.factoryId = v ? Number(v) : null;
            loadData();
        }
        function onCompareToggle() {
            AnalyzeFilters.compare = document.getElementById('compareToggle').checked;
            const cmp = document.getElementById('factoryCompareSelect');
            cmp.style.display = AnalyzeFilters.compare ? 'inline-block' : 'none';
            cmp.size = AnalyzeFilters.compare ? Math.min(4, AnalyzeFilters.factories.length) : 1;
            if (!AnalyzeFilters.compare) { AnalyzeFilters.compareIds = []; loadData(); }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            JPSMS.auth.requireAuth();
            JPSMS.renderShell('analyze');

            const params = new URLSearchParams(window.location.search);
            const view = params.get('view') || 'plant';
            AnalyzeFilters.view = view;
            await loadFactories();

            // Permission Check
            const permMap = {
                'order': 'ana_order',
                'mould': 'ana_mould',
                'supervisor': 'ana_sup',
                'plant': 'ana_plant',
                'machine': 'ana_machine'
            };

            const requiredPerm = permMap[view];
            if (requiredPerm && !JPSMS.auth.can(requiredPerm)) {
                JPSMS.toast('Access Denied: ' + view, 'error');
                document.getElementById('contentArea').innerHTML = `
                    <div class="analysis-empty-state" style="color:#b91c1c">
                        <h2>Access Denied</h2>
                        <p>You do not have permission to view ${view} analysis.</p>
                    </div>
                 `;
                return;
            }

            // Set Title
            const titles = {
                'order': 'Order Analysis',
                'mould': 'Mould Performance Analysis',
                'supervisor': 'Supervisor Efficiency',
                'plant': 'Overall Plant Analysis',
                'machine': 'Machine Utilization',
            };
            const subtitles = {
                'order': 'Review running and completed orders with a cleaner JMS OCEAN analysis workspace built for quick traceability.',
                'mould': 'Track mould-level performance, rejection patterns, downtime, and daily output in the same premium layout as the rest of the system.',
                'supervisor': 'Compare shift output and supervisor-led production activity with a more readable analysis screen.',
                'plant': 'See plant-level OEE and high-level production trends in a branded workspace that matches Dashboard and Planning.',
                'machine': 'Monitor machine utilization and output behavior in the same polished JMS OCEAN design language.',
            };
            const chipIcons = {
                'order': 'cart-check',
                'mould': 'diagram-3',
                'supervisor': 'person-badge',
                'plant': 'building',
                'machine': 'cpu'
            };
            const chipLabels = {
                'order': 'Order View',
                'mould': 'Mould View',
                'supervisor': 'Supervisor View',
                'plant': 'Plant View',
                'machine': 'Machine View'
            };
            document.getElementById('pageTitle').textContent = titles[view] || 'Analysis';
            document.getElementById('pageSubtitle').textContent = subtitles[view] || subtitles.plant;
            const viewChip = document.getElementById('analysisViewChip');
            if (viewChip) {
                viewChip.innerHTML = `<i class="bi bi-${chipIcons[view] || 'bar-chart-line'}"></i><span>${chipLabels[view] || 'Analytics Workspace'}</span>`;
            }

            // Render Placeholder Content
            renderView(view);
        });

        function renderView(view) {
            const container = document.getElementById('contentArea');

            if (view === 'order') {
                container.innerHTML = `
                    <style>
                        .order-grid {
                            display: grid;
                            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                            gap: 20px;
                            padding-bottom: 40px;
                        }
                        .order-card {
                            background: white;
                            border: 1px solid #e2e8f0;
                            border-radius: 12px;
                            padding: 20px;
                            cursor: pointer;
                            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
                            position: relative;
                            overflow: hidden;
                        }
                        .order-card:hover {
                            transform: translateY(-4px);
                            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
                            border-color: #cbd5e1;
                        }
                        .order-card::before {
                            content: '';
                            position: absolute;
                            top: 0;
                            left: 0;
                            width: 100%;
                            height: 4px;
                            background: #e2e8f0;
                        }
                        .order-card.running::before { background: #3b82f6; }
                        .order-card.completed::before { background: #10b981; }
                        
                        .oc-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
                        .oc-title { font-weight: 700; color: #1e293b; font-size: 1.1rem; }
                        .oc-mould { color: #64748b; font-size: 0.9rem; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
                        .oc-client { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
                    </style>

                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px">
                        <div class="analysis-tabs" style="margin:0; width:auto;">
                            <div class="analysis-tab active" onclick="filterOrderList('RUNNING', this)">Running</div>
                            <div class="analysis-tab" onclick="filterOrderList('COMPLETED', this)">Completed</div>
                        </div>
                        <div style="width:300px">
                             <input type="text" id="orderSearch" class="form-control" placeholder="Search orders..." onkeyup="filterOrdersLocal()">
                        </div>
                    </div>

                    <div id="orderListContainer" class="order-grid">
                        <div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8">
                            <div class="spinner-border text-primary" role="status"></div>
                            <div style="margin-top:10px">Loading Orders...</div>
                        </div>
                    </div>

                    <!-- ORDER DETAIL MODAL -->
                    <div id="orderDetailModal" class="modal-overlay" style="z-index: 1050;">
                        <div class="modal-content" style="width: 1200px; max-width: 95vw; height: 90vh; display:flex; flex-direction:column; padding:0; overflow:hidden">
                            
                            <!-- Modal Header -->
                            <div style="padding: 20px 24px; border-bottom: 1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center; background:#f8fafc">
                                <div>
                                    <h2 style="margin:0; font-size:1.5rem; color:#0f172a" id="modalTitle">Order Details</h2>
                                    <div style="font-size:0.9rem; color:#64748b; margin-top:4px" id="modalSubtitle">-</div>
                                </div>
                                <button class="btn icon ghost" onclick="document.getElementById('orderDetailModal').classList.remove('active')">
                                    <i class="bi bi-x-lg" style="font-size:1.2rem"></i>
                                </button>
                            </div>

                            <!-- Modal Body -->
                            <div id="orderDetailContent" style="flex:1; overflow-y:auto; padding:24px; background:#f1f5f9; display:flex; flex-direction:column; gap:24px">
                                
                                <div id="modalLoading" style="text-align:center; padding:50px">
                                    <div class="spinner-border text-primary" role="status"></div>
                                </div>

                                <div id="modalDashboard" style="display:none; width:100%">
                                    
                                    <!-- 1. Header Strip (White) -->
                                    <div style="background:white; padding:12px 20px; border-radius:8px; border:1px solid #e2e8f0; display:flex; align-items:center; gap:20px; flex-wrap:wrap; box-shadow: 0 1px 2px rgba(0,0,0,0.05)">
                                        <div style="flex:1; display:flex; align-items:center; gap:10px; min-width:200px">
                                            <i class="bi bi-box-seam" style="font-size:1.2rem; color:#475569"></i>
                                            <div>
                                                <div style="font-size:0.75rem; color:#64748b; font-weight:600">ITEM NAME</div>
                                                <div id="dItem" style="font-weight:700; color:#1e293b; font-size:1rem">-</div>
                                            </div>
                                        </div>
                                        <div style="width:1px; height:30px; background:#e2e8f0"></div>
                                        <div style="flex:1; display:flex; align-items:center; gap:10px; min-width:180px">
                                            <i class="bi bi-cpu" style="font-size:1.2rem; color:#475569"></i>
                                            <div>
                                                <div style="font-size:0.75rem; color:#64748b; font-weight:600">MACHINE</div>
                                                <div id="dMachine" style="font-weight:700; color:#1e293b; font-size:1rem">-</div>
                                            </div>
                                        </div>
                                        <div style="width:1px; height:30px; background:#e2e8f0"></div>
                                        <div style="flex:1; display:flex; align-items:center; gap:10px; min-width:180px">
                                            <i class="bi bi-tools" style="font-size:1.2rem; color:#475569"></i>
                                            <div>
                                                <div style="font-size:0.75rem; color:#64748b; font-weight:600">MOULD</div>
                                                <div id="dMould" style="font-weight:700; color:#1e293b; font-size:1rem">-</div>
                                            </div>
                                        </div>
                                        <div style="width:1px; height:30px; background:#e2e8f0"></div>
                                        <div style="flex:1; display:flex; align-items:center; gap:10px; min-width:150px">
                                            <i class="bi bi-activity" style="font-size:1.2rem; color:#475569"></i>
                                            <div>
                                                <div style="font-size:0.75rem; color:#64748b; font-weight:600">STATUS</div>
                                                <div id="dStatus" style="font-weight:700; color:#1e293b; font-size:1rem; display:flex; align-items:center; gap:6px">
                                                    <span id="dStatusDot" style="width:10px; height:10px; border-radius:50%; background:#cbd5e1"></span>
                                                    <span id="dStatusText">-</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- 1b. Order Lifecycle Timeline (OR -> JC -> Plan -> Production -> Complete) -->
                                    <div class="card" style="margin:24px 0 0 0; padding:18px 22px">
                                        <h4 style="margin:0 0 16px 0; font-size:0.95rem; color:#1e293b; font-weight:700">Order Lifecycle</h4>
                                        <div id="lifecycleStepper" style="display:flex; align-items:flex-start; gap:0; overflow-x:auto"></div>
                                    </div>

                                    <!-- 1c. STD vs Actual — Shift & Factory Loss -->
                                    <div class="card" style="margin:24px 0 0 0; padding:18px 22px">
                                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px">
                                            <h4 style="margin:0; font-size:0.95rem; color:#1e293b; font-weight:700">STD vs Actual — Loss Analysis</h4>
                                            <div style="display:flex; gap:8px; align-items:center; font-size:0.8rem; color:#64748b">
                                                <span>₹/shift</span>
                                                <input type="number" id="rateShift" class="form-control" style="width:90px; padding:4px 8px" placeholder="0" oninput="onLossRateChange()">
                                                <span>₹/machine-hr</span>
                                                <input type="number" id="rateMcHr" class="form-control" style="width:90px; padding:4px 8px" placeholder="0" oninput="onLossRateChange()">
                                            </div>
                                        </div>
                                        <div style="display:grid; grid-template-columns: 1fr 1.4fr; gap:20px; align-items:center">
                                            <div id="lossCards" style="display:grid; grid-template-columns:1fr 1fr; gap:12px"></div>
                                            <div style="min-height:220px; position:relative"><canvas id="lossWaterfall"></canvas></div>
                                        </div>
                                    </div>

                                    <!-- 2. KPI Cards (6 Cards) -->
                                    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:16px; margin-top:24px">
                                        <!-- Plan -->
                                        <div class="card" style="margin:0; padding:16px; border-left:4px solid #3b82f6; display:flex; flex-direction:column; justify-content:center">
                                            <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px">
                                                <i class="bi bi-calendar-check text-primary"></i> <span style="font-size:0.8rem; font-weight:600; color:#64748b">Planned Qty</span>
                                            </div>
                                            <div id="kpiPlan" style="font-size:1.6rem; font-weight:800; color:#1e293b">-</div>
                                        </div>
                                        <!-- Actual -->
                                        <div class="card" style="margin:0; padding:16px; border-left:4px solid #10b981; position:relative">
                                            <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px">
                                                <i class="bi bi-check-circle text-success"></i> <span style="font-size:0.8rem; font-weight:600; color:#64748b">Actual Qty</span>
                                            </div>
                                            <div id="kpiGood" style="font-size:1.6rem; font-weight:800; color:#1e293b">-</div>
                                            <small id="kpiGoodToday" style="font-size:0.75rem; color:#10b981; font-weight:600; position:absolute; top:18px; right:16px"></small>
                                        </div>
                                        <!-- Balance -->
                                        <div class="card" style="margin:0; padding:16px; border-left:4px solid #64748b">
                                            <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px">
                                                 <i class="bi bi-hourglass-split text-secondary"></i> <span style="font-size:0.8rem; font-weight:600; color:#64748b">Balance Qty</span>
                                            </div>
                                            <div id="kpiBal" style="font-size:1.6rem; font-weight:800; color:#1e293b">-</div>
                                        </div>

        function initChart(type, label) {

                        ],
                        borderColor: [
                            'rgba(255, 99, 132, 1)',

                            'rgba(255, 206, 86, 1)',
                            'rgba(75, 192, 192, 1)',
                            'rgba(153, 102, 255, 1)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        function syncFilterState() {
            AnalyzeFilters.from = (document.getElementById('fromDate') || {}).value || null;
            AnalyzeFilters.to = (document.getElementById('toDate') || {}).value || null;
            const cmp = document.getElementById('factoryCompareSelect');
            if (cmp && AnalyzeFilters.compare) {
                AnalyzeFilters.compareIds = Array.from(cmp.selectedOptions).map(o => Number(o.value));
            }
        }

        // Build a query string from shared filters
        function filterQS(extra) {
            syncFilterState();
            const p = new URLSearchParams();
            if (AnalyzeFilters.factoryId) p.set('factory', AnalyzeFilters.factoryId);
            if (AnalyzeFilters.from) p.set('from', AnalyzeFilters.from);
            if (AnalyzeFilters.to) p.set('to', AnalyzeFilters.to);
            if (AnalyzeFilters.lossPerShift) p.set('lossPerShift', AnalyzeFilters.lossPerShift);
            if (AnalyzeFilters.lossPerMachineHour) p.set('lossPerMachineHour', AnalyzeFilters.lossPerMachineHour);
            Object.entries(extra || {}).forEach(([k, v]) => { if (v != null && v !== '') p.set(k, v); });
            const s = p.toString();
            return s ? ('?' + s) : '';
        }

        function loadData() {
            syncFilterState();
            const view = AnalyzeFilters.view;
            if (view === 'order') return fetchOrderList();
            // other views re-render on refresh
            renderView(view);
            JPSMS.toast('Refreshed');
        }

        let orderCharts = {};

        /* =========================================
           ORDER ANALYSIS - SIDEBAR LOGIC
           ========================================= */
        let allOrdersData = [];
        let currentOrderFilter = 'RUNNING';

        async function fetchOrderList() {
            const listEl = document.getElementById('orderListContainer');
            // If removed from DOM by view switch, return
            if (!listEl) return;

            listEl.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8"><div class="spinner-border spinner-border-sm text-primary" role="status"></div> Loading...</div>';

            try {
                const res = await JPSMS.api.get('/analyze/orders' + filterQS());
                allOrdersData = [];

                if (res.ok && Array.isArray(res.data)) {
                    res.data.forEach(p => {
                        allOrdersData.push({
                            orderNo: p.order_no,
                            factoryId: p.factory_id,
                            client: p.client_name || '-',
                            item: p.item_name || '-',
                            status: p.view_status || 'RUNNING',
                            date: p.start_date || p.job_card_date || p.or_jr_date || p.created_at || new Date().toISOString(),
                            mould: p.mould_name || '-',
                            planQty: p.plan_qty || 0,
                            balQty: p.bal_qty || 0,
                            jcNo: p.job_card_no || null
                        });
                    });
                }

                allOrdersData.sort((a, b) => new Date(b.date) - new Date(a.date));
                renderOrderList();
            } catch (e) {
                console.error(e);
                if (listEl) listEl.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#ef4444; padding:20px">Error loading orders</div>`;
            }
        }

        function filterOrderList(status, tabEl) {
            currentOrderFilter = status;

            // Update Tabs
            if (tabEl) {
                document.querySelectorAll('.analysis-tab').forEach(t => t.classList.remove('active'));
                tabEl.classList.add('active');
            }

            renderOrderList();
        }

        function filterOrdersLocal() {
            renderOrderList();
        }

        function renderOrderList() {
            const search = (document.getElementById('orderSearch').value || '').toLowerCase();
            const listEl = document.getElementById('orderListContainer');
            if (!listEl) return;

            const filtered = allOrdersData.filter(o => {
                if (currentOrderFilter !== 'ALL' && o.status !== currentOrderFilter) return false;
                if (search) {
                    const txt = (o.orderNo + ' ' + o.client + ' ' + o.item + ' ' + o.mould).toLowerCase();
                    return txt.includes(search);
                }
                return true;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8; font-size:1rem; background:#f8fafc; border-radius:12px; border:1px dashed #cbd5e1">No orders found matching your criteria.</div>';
                return;
            }

            listEl.innerHTML = filtered.map(o => `
                <div class="order-card ${o.status.toLowerCase()}" onclick="clickOrder('${o.orderNo}')">
                    <div class="oc-header">
                        <div class="oc-title">${o.orderNo}</div>
                        <div class="tag ${o.status === 'RUNNING' ? 'o' : 'g'}">${o.status}</div>
                    </div>
                    <div class="oc-mould"><i class="bi bi-box-seam"></i> ${o.mould}</div>
                    <div style="font-size:0.9rem; color:#475569; margin-bottom:12px; height:40px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical">${o.item}</div>
                    
                    <div style="border-top:1px solid #f1f5f9; padding-top:10px; display:flex; justify-content:space-between; align-items:flex-end">
                        <div>
                             <div class="oc-client">${o.client}</div>
                             <div style="font-size:0.75rem; color:#94a3b8; margin-top:2px">${new Date(o.date).toLocaleDateString()}</div>
                        </div>
                        <div style="text-align:right">
                            <span style="font-size:0.75rem; color:#64748b">Qty</span>
                            <div style="font-weight:700; color:#334155">${(o.planQty || 0).toLocaleString()}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function clickOrder(orderNo) {
            // Open Modal
            const modal = document.getElementById('orderDetailModal');
            modal.classList.add('active'); // Use .active class from app.css

            document.getElementById('modalTitle').textContent = orderNo;
            document.getElementById('modalSubtitle').textContent = 'Loading details...';

            loadOrderDetails(orderNo);
        }

        async function loadOrderDetails(orderNo) {
            const dashboard = document.getElementById('modalDashboard');
            const loading = document.getElementById('modalLoading');

            dashboard.style.display = 'none';
            loading.style.display = 'block';

            JPSMS.toast('Loading Order: ' + orderNo, 'info');

            try {
                const res = await JPSMS.api.get('/analyze/order/' + encodeURIComponent(orderNo) + filterQS());
                if (res.ok) {
                    renderOrderDashboard(res.data);
                    loading.style.display = 'none';
                    dashboard.style.display = 'block';
                    document.getElementById('modalSubtitle').textContent = 'Analysis Dashboard';
                } else {
                    JPSMS.toast(res.error || 'Failed to load order', 'error');
                    loading.innerHTML = '<div class="text-danger">Failed to load data</div>';
                }
            } catch (e) {
                JPSMS.toast('Error: ' + e.message, 'error');
                loading.innerHTML = `<div class="text-danger">Error: ${e.message}</div>`;
            }
        }

        let currentOrderData = null;
        function renderOrderDashboard(data) {
            currentOrderData = data;
            const { info, logs } = data;
            const totals = data.totals || {};
            const loss = data.loss || {};

            // 1. Header (Strip)
            document.getElementById('dItem').textContent = info.item_name || info.itemName || '-';
            document.getElementById('dMachine').textContent = loss.machine || info.machine || 'Multiple';
            document.getElementById('dMould').textContent = info.mould_name || info.mouldName || info.mould_number || '-';

            // Lifecycle + Loss sections
            renderLifecycle(data.lifecycle || {});
            renderLoss(loss);

            const stEl = document.getElementById('dStatusText');
            const dotEl = document.getElementById('dStatusDot');
            stEl.textContent = info.status || 'Unknown';
            dotEl.style.background = (info.status === 'RUNNING') ? '#3b82f6' : ((info.status === 'COMPLETED') ? '#10b981' : '#cbd5e1');

            // 2. KPIs
            // Calculate totals manually from logs to ensure accuracy and avoid string concatenation issues
            let totalGood = 0;
            let totalReject = 0;

            if (logs && Array.isArray(logs)) {
                logs.forEach(l => {
                    totalGood += (parseInt(l.good_qty) || 0);
                    totalReject += (parseInt(l.reject_qty) || 0);
                });
            }

            const plan = info.plan_qty || 0;
            const bal = Math.max(0, plan - totalGood);

            // Efficiency = good produced vs STD-achievable output in the productive time (from server loss calc)
            const pph = loss.pcs_per_hour_std || 0;
            const productiveHours = Math.max(0, (loss.actual_hours || 0) - (loss.downtime_hours || 0));
            const theoreticalOutput = pph > 0 ? pph * productiveHours : 0;
            const calculatedEff = theoreticalOutput > 0 ? Math.round((totalGood / theoreticalOutput) * 100) : 0;

            const eff = calculatedEff + '%';

            document.getElementById('kpiPlan').textContent = plan.toLocaleString();
            document.getElementById('kpiGood').textContent = totalGood.toLocaleString();
            document.getElementById('kpiGoodToday').textContent = totalGood > 0 ? `+${Math.floor(totalGood * 0.1)} Today` : '';
            document.getElementById('kpiBal').textContent = bal.toLocaleString();
            document.getElementById('kpiEff').textContent = eff;
            document.getElementById('alertEffVal').textContent = eff;

            document.getElementById('kpiReject').textContent = totalReject.toLocaleString();

            // Total downtime (real, from backend totals)
            const totalDownMins = Math.round(totals.dt || 0);
            document.getElementById('kpiDown').textContent = totalDownMins;


            // 3. Populate Insights (Mock based on data)
            const insightList = document.getElementById('insightList');
            insightList.innerHTML = '';

            // Insight: Eff
            if (parseInt(eff) < 80) {
                insightList.innerHTML += `
                    <div style="background:white; padding:12px; border-radius:6px; border:1px solid #e2e8f0; display:flex; gap:10px; align-items:start">
                        <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size:1.1rem"></i>
                        <div style="font-size:0.85rem; color:#475569; line-height:1.4">Efficiency is below target (80%). Current: ${eff}</div>
                    </div>`;
            } else {
                insightList.innerHTML += `
                    <div style="background:white; padding:12px; border-radius:6px; border:1px solid #e2e8f0; display:flex; gap:10px; align-items:start">
                        <i class="bi bi-check-circle-fill text-success" style="font-size:1.1rem"></i>
                        <div style="font-size:0.85rem; color:#475569; line-height:1.4">Efficiency is optimum at ${eff}</div>
                    </div>`;
            }

            // Insight: Mould Change
            if (info.mouldName) {
                insightList.innerHTML += `
                    <div style="background:white; padding:12px; border-radius:6px; border:1px solid #e2e8f0; display:flex; gap:10px; align-items:start">
                        <i class="bi bi-tools text-primary" style="font-size:1.1rem"></i>
                        <div style="font-size:0.85rem; color:#475569; line-height:1.4">Mould active: <strong>${info.mouldName}</strong></div>
                    </div>`;
            }


            // 4. Logs Table
            const tbody = document.getElementById('logTableBody');
            if (logs && logs.length > 0) {
                tbody.innerHTML = logs.map((l) => {
                    const dt = Math.round(parseFloat(l.downtime_min) || 0);
                    const enteredBy = l.userName || l.created_by || '-';
                    const role = l.userRole ? ` <span style="font-size:0.7rem; color:#94a3b8">(${l.userRole})</span>` : '';
                    return `
                    <tr>
                        <td style="padding:12px 20px; color:#334155">${l.date ? new Date(l.date).toLocaleDateString() : '-'}</td>
                        <td style="color:#64748b">${l.shift || '-'}</td>
                        <td style="color:#64748b">${l.hour_slot || '-'}</td>
                        <td style="color:#64748b">${l.machine || '-'}${l.colour ? ` · ${l.colour}` : ''}</td>
                        <td class="text-end" style="font-weight:700; color:#334155">${(parseInt(l.good_qty) || 0).toLocaleString()}</td>
                        <td class="text-center" style="color:${l.reject_qty > 0 ? '#ef4444' : '#94a3b8'}">${parseInt(l.reject_qty) || 0}</td>
                        <td>${dt > 0 ? `<span style="color:#f59e0b; font-weight:600">${dt} min</span>` : '<span style="color:#10b981">—</span>'}</td>
                        <td style="color:#475569; font-weight:600">${enteredBy}${role}</td>
                    </tr>`;
                }).join('');
            } else {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center p-3">No activity logs found</td></tr>';
            }


            // 5. Render Charts
            renderOrderCharts(data);
        }

        function renderOrderCharts(data) {
            const { logs } = data;

            // Clean up old instances
            ['timelineChart', 'ctChart', 'downtimeChart', 'qualityChart'].forEach(id => {
                const cvs = document.getElementById(id);
                if (cvs && orderCharts[id]) {
                    orderCharts[id].destroy();
                }
            });


            // --- Chart 1: Production Timeline (Area/Line) ---
            const timelineCtx = document.getElementById('timelineChart');
            if (timelineCtx) {
                // Group logs roughly or use individual points (Reversing to show chronological)
                const sortedLogs = [...logs].reverse();
                const labels = sortedLogs.map(l => new Date(l.date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));

                // Cumulative Output Calculation
                let acc = 0;
                const accData = sortedLogs.map(l => { acc += l.good_qty; return acc; });

                // Construct Target Line (Linear projection)
                const planQty = data.info.plan_qty || 0;
                const targetStep = planQty / (Math.max(sortedLogs.length, 1));
                const targetData = sortedLogs.map((_, i) => Math.floor((i + 1) * targetStep));

                orderCharts['timelineChart'] = new Chart(timelineCtx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Cumulative Output',
                            data: accData,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: 3,
                            pointBackgroundColor: '#fff',
                            pointBorderColor: '#3b82f6',
                            pointBorderWidth: 2
                        }, {
                            label: 'Plan Target',
                            data: targetData,
                            borderColor: '#10b981',
                            borderDash: [5, 5],
                            tension: 0.1,
                            pointRadius: 0,
                            fill: false
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
                        scales: {
                            y: { beginAtZero: true, grid: { borderDash: [2, 4] } },
                            x: { grid: { display: false }, ticks: { maxTicksLimit: 6 } }
                        },
                        interaction: {
                            mode: 'nearest',
                            axis: 'x',
                            intersect: false
                        }
                    }
                });
            }

            // --- Chart 2: Cycle Time (Bar - Avg vs Target) ---
            const ctCtx = document.getElementById('ctChart');
            if (ctCtx) {
                // Std vs Actual cycle time (real)
                const stdCT = Math.round((data.loss && data.loss.std_cycle) || data.info.std_cycle || 0);
                const avgCT = Math.round(parseFloat(data.info.act_cycle) || stdCT || 0);

                orderCharts['ctChart'] = new Chart(ctCtx, {
                    type: 'bar',
                    data: {
                        labels: ['Avg Cycle Time', 'Target Cycle Time'],
                        datasets: [{
                            data: [avgCT, stdCT],
                            backgroundColor: ['#3b82f6', '#10b981'],
                            barThickness: 60,
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { display: false, max: Math.max(avgCT, stdCT) * 1.2 },
                            x: { grid: { display: false } }
                        }
                    },
                    plugins: [{
                        id: 'ctLabels',
                        afterDraw: (chart) => {
                            const ctx = chart.ctx;
                            chart.data.datasets.forEach((dataset, i) => {
                                const meta = chart.getDatasetMeta(i);
                                meta.data.forEach((bar, index) => {
                                    const val = dataset.data[index] + ' sec';
                                    ctx.fillStyle = '#1e293b';
                                    ctx.font = 'bold 12px sans-serif';
                                    ctx.textAlign = 'center';
                                    ctx.fillText(val, bar.x, bar.y - 10);
                                });
                            });
                        }
                    }]
                });
            }

            // --- Chart 3: Downtime (Doughnut) ---
            const dtCtx = document.getElementById('downtimeChart');
            if (dtCtx) {
                // Real downtime breakdown from downtime_stats {reason: minutes}
                const dtEntries = Object.entries(data.downtime_stats || {})
                    .filter(([, v]) => (parseFloat(v) || 0) > 0)
                    .sort((a, b) => b[1] - a[1]);
                let downtimeLabels = dtEntries.map(e => e[0]);
                let downtimeData = dtEntries.map(e => Math.round(parseFloat(e[1]) || 0));
                if (!downtimeData.length) { downtimeLabels = ['No downtime']; downtimeData = [1]; }

                orderCharts['downtimeChart'] = new Chart(dtCtx, {
                    type: 'doughnut',
                    data: {
                        labels: downtimeLabels,
                        datasets: [{
                            data: downtimeData,
                            backgroundColor: ['#ef4444', '#f59e0b', '#3b82f6', '#94a3b8'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '65%',
                        plugins: {
                            legend: { position: 'right', labels: { boxWidth: 12, usePointStyle: true, font: { size: 11 } } }
                        }
                    }
                });
            }

            // --- Chart 4: Quality (Horizontal Bar) ---
            const qCtx = document.getElementById('qualityChart');
            if (qCtx) {
                const good = (data.totals && data.totals.good) || 0;
                const rej = (data.totals && data.totals.rej) || 0;

                orderCharts['qualityChart'] = new Chart(qCtx, {
                    type: 'bar',
                    data: {
                        labels: ['Production'],
                        datasets: [{
                            label: 'Good',
                            data: [good],
                            backgroundColor: '#10b981',
                            barThickness: 40,
                            borderRadius: 4
                        }, {
                            label: 'Rejected',
                            data: [rej],
                            backgroundColor: '#ef4444',
                            barThickness: 40,
                            borderRadius: 4
                        }]
                    },
                    options: {
                        indexAxis: 'y', // Horizontal
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { position: 'bottom' } },
                        scales: {
                            x: { stacked: true, grid: { display: false } },
                            y: { stacked: true, display: false }
                        }
                    }
                });
            }

        }

        /* =========================================
           ORDER LIFECYCLE + LOSS
           ========================================= */
        function fmtDate(d) { return d ? new Date(d).toLocaleDateString() : '—'; }
        function gapChip(days) {
            if (days == null) return '';
            const c = days <= 1 ? '#10b981' : days <= 3 ? '#f59e0b' : '#ef4444';
            return `<div style="font-size:0.7rem; color:${c}; font-weight:700; margin-top:2px">+${days}d</div>`;
        }
        function renderLifecycle(lc) {
            const el = document.getElementById('lifecycleStepper');
            if (!el) return;
            const g = lc.gaps || {};
            const steps = [
                { label: 'OR Date', date: lc.or_date, icon: 'file-earmark-text', gap: null },
                { label: 'JC Converted', date: lc.jc_date, icon: 'card-checklist', gap: g.or_to_jc },
                { label: 'Planned', date: lc.plan_date, icon: 'calendar2-check', gap: g.jc_to_plan },
                { label: 'Production Start', date: lc.prod_start, icon: 'play-circle', gap: g.plan_to_prod },
                { label: (lc.status || 'Latest'), date: lc.prod_last, icon: 'flag', gap: g.prod_span }
            ];
            el.innerHTML = steps.map((s, i) => `
                <div style="flex:1; min-width:120px; text-align:center; position:relative">
                    ${i > 0 ? `<div style="position:absolute; left:-50%; top:18px; width:100%; height:2px; background:#e2e8f0; z-index:0"></div>` : ''}
                    <div style="position:relative; z-index:1; width:38px; height:38px; margin:0 auto; border-radius:50%; background:${s.date ? 'linear-gradient(135deg,#024c81,#01a8dd)' : '#e2e8f0'}; color:#fff; display:flex; align-items:center; justify-content:center">
                        <i class="bi bi-${s.icon}"></i>
                    </div>
                    <div style="font-size:0.78rem; font-weight:700; color:#334155; margin-top:8px">${s.label}</div>
                    <div style="font-size:0.75rem; color:#64748b">${fmtDate(s.date)}</div>
                    ${gapChip(s.gap)}
                </div>`).join('');
        }

        function lossCard(label, value, sub, color) {
            return `<div style="background:#f8fafc; border-radius:10px; padding:12px 14px; border-left:3px solid ${color}">
                <div style="font-size:0.72rem; color:#64748b; font-weight:600">${label}</div>
                <div style="font-size:1.3rem; font-weight:800; color:#1e293b">${value}</div>
                ${sub ? `<div style="font-size:0.72rem; color:#94a3b8">${sub}</div>` : ''}
            </div>`;
        }
        function renderLoss(loss) {
            const el = document.getElementById('lossCards');
            if (!el) return;
            const money = loss.money_loss_per_shift != null ? `₹${Number(loss.money_loss_per_shift).toLocaleString()}`
                : loss.money_loss_per_machine_hour != null ? `₹${Number(loss.money_loss_per_machine_hour).toLocaleString()}`
                    : 'Set ₹ rate';
            el.innerHTML = [
                lossCard('STD Time', `${loss.std_hours || 0} h`, `${loss.std_shifts || 0} shifts`, '#10b981'),
                lossCard('Actual Time', `${loss.actual_hours || 0} h`, `${loss.actual_shifts || 0} shifts`, '#3b82f6'),
                lossCard('Shift Loss', `${loss.shift_loss || 0}`, `${loss.total_loss_hours || 0} h lost`, '#f59e0b'),
                lossCard('Factory Loss', money, loss.rate_per_shift ? `@ ₹${loss.rate_per_shift}/shift` : (loss.rate_per_machine_hour ? `@ ₹${loss.rate_per_machine_hour}/mc-hr` : 'enter a rate'), '#ef4444')
            ].join('');

            // Waterfall: STD -> +downtime -> +cycle slip -> +reject -> Actual
            const cvs = document.getElementById('lossWaterfall');
            if (!cvs) return;
            if (orderCharts['lossWaterfall']) orderCharts['lossWaterfall'].destroy();
            const std = loss.std_hours || 0;
            const dt = loss.downtime_hours || 0;
            const cyc = loss.cycle_loss_hours || 0;
            const rej = loss.reject_loss_hours || 0;
            orderCharts['lossWaterfall'] = new Chart(cvs, {
                type: 'bar',
                data: {
                    labels: ['STD', 'Downtime', 'Slow Cycle', 'Rejects', 'Actual'],
                    datasets: [{
                        label: 'Hours',
                        data: [std, dt, cyc, rej, loss.actual_hours || 0],
                        backgroundColor: ['#10b981', '#f59e0b', '#8b5cf6', '#ef4444', '#3b82f6'],
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false }, title: { display: true, text: 'Time Loss Waterfall (hours)', font: { size: 11 } } },
                    scales: { y: { beginAtZero: true } }
                }
            });
        }
        function onLossRateChange() {
            AnalyzeFilters.lossPerShift = parseFloat(document.getElementById('rateShift').value) || 0;
            AnalyzeFilters.lossPerMachineHour = parseFloat(document.getElementById('rateMcHr').value) || 0;
            // Re-fetch current order with new rates (loss is computed server-side)
            if (currentOrderData && currentOrderData.info) {
                const on = currentOrderData.info.order_no || document.getElementById('modalTitle').textContent;
                if (on) loadOrderDetails(on);
            }
        }

        /* =========================================
           MOULD LOGIC
           ========================================= */
        let mouldCharts = {};

        async function searchMould() {
            const code = document.getElementById('mouldSearchInput').value.trim();
            if (!code) return JPSMS.toast('Enter Mould Name/Code', 'warning');

            const dashboard = document.getElementById('mouldDashboard');
            const errorDiv = document.getElementById('mouldError');
            dashboard.style.display = 'none';
            errorDiv.style.display = 'none';

            JPSMS.toast('Analyzing Mould Data...', 'info');

            const url = `/analyze/mould/${encodeURIComponent(code)}` + filterQS();

            try {
                const res = await JPSMS.api.get(url);
                if (res.ok) {
                    renderMouldDashboard(res.data);
                    dashboard.style.display = 'block';
                } else {
                    errorDiv.textContent = res.error || 'No data found';
                    errorDiv.style.display = 'block';
                }
            } catch (e) {
                errorDiv.textContent = e.message;
                errorDiv.style.display = 'block';
            }
        }

        function switchMouldTab(tab) {
            const isDetail = tab === 'detail';
            document.getElementById('mouldSummary').style.display = isDetail ? 'none' : 'block';
            document.getElementById('mouldDetail').style.display = isDetail ? 'block' : 'none';
            document.getElementById('mTabSummary').classList.toggle('active', !isDetail);
            document.getElementById('mTabDetail').classList.toggle('active', isDetail);
        }

        // Populate mould autocomplete from master (best-effort)
        async function loadMouldOptions() {
            const dl = document.getElementById('mouldOptions');
            if (!dl) return;
            try {
                const res = await JPSMS.api.get('/masters/moulds');
                const rows = (res && (res.data || res)) || [];
                if (Array.isArray(rows)) {
                    dl.innerHTML = rows.slice(0, 500).map(m =>
                        `<option value="${(m.mould_number || m.mould_name || '').replace(/"/g, '&quot;')}">${m.mould_name || ''}</option>`).join('');
                }
            } catch (e) { /* optional */ }
        }

        function renderMouldDashboard(data) {
            const { mould, kpi, rejections, downtime, trend } = data;
            const detail = data.detail || { machines: [], orders: [] };

            // Title
            document.getElementById('mTitle').textContent = mould.mould_name || mould.mould_number || '-';
            document.getElementById('mSub').textContent =
                `${mould.mould_number || ''}${mould.no_of_cav ? ' · ' + mould.no_of_cav + ' cav' : ''}${mould.cycle_time ? ' · STD ' + mould.cycle_time + 's' : ''}`;

            // KPIs
            const totalOut = kpi.totalOutput;
            document.getElementById('mkpiOutput').textContent = totalOut.toLocaleString();
            document.getElementById('mkpiRunHrs').textContent = `Run Hrs: ${kpi.totalRunHours}`;
            document.getElementById('mkpiRejRate').textContent = `${kpi.rejRate}%`;
            document.getElementById('mkpiRejQty').textContent = `Qty: ${kpi.totalReject}`;
            document.getElementById('mkpiDown').textContent = `${kpi.totalDowntime} min`;
            document.getElementById('mkpiCT').textContent = `${kpi.avgCycleTime}s`;
            document.getElementById('mkpiStdCT').textContent = `Std: ${kpi.stdCycle || mould.cycle_time || '-'}s`;
            document.getElementById('mkpiOEE').textContent = `${kpi.oee}%`;
            document.getElementById('mkpiOEEbreak').textContent = `A${kpi.availability} P${kpi.performance} Q${kpi.quality}`;

            // Detail tables
            const rowFor = (r) => `<tr><td style="font-weight:600">${r.key}</td><td class="text-end">${(r.good || 0).toLocaleString()}</td><td class="text-end" style="color:${r.reject > 0 ? '#ef4444' : '#94a3b8'}">${(r.reject || 0).toLocaleString()}</td><td class="text-end">${Math.round(r.downtime || 0)} min</td></tr>`;
            document.getElementById('mDetailMachines').innerHTML = detail.machines.length ? detail.machines.map(rowFor).join('') : '<tr><td colspan="4" class="text-center p-3">No data</td></tr>';
            document.getElementById('mDetailOrders').innerHTML = detail.orders.length ? detail.orders.map(rowFor).join('') : '<tr><td colspan="4" class="text-center p-3">No data</td></tr>';

            // Reset to Summary tab on each search
            switchMouldTab('summary');

            // --- CHARTS ---
            if (mouldCharts.rej) mouldCharts.rej.destroy();
            if (mouldCharts.down) mouldCharts.down.destroy();
            if (mouldCharts.trend) mouldCharts.trend.destroy();

            // 1. Rejection Pareto (Bar)
            const rejLabels = rejections.slice(0, 10).map(r => r.reason);
            const rejData = rejections.slice(0, 10).map(r => r.qty);

            mouldCharts.rej = new Chart(document.getElementById('mouldRejChart'), {
                type: 'bar',
                data: {
                    labels: rejLabels,
                    datasets: [{
                        label: 'Reject Qty',
                        data: rejData,
                        backgroundColor: '#ef4444',
                        borderRadius: 4
                    }]
                },
                options: {
                    indexAxis: 'y', // Horizontal Bar for better readable labels
                    maintainAspectRatio: false
                }
            });

            // 2. Downtime (Doughnut)
            // Group small items into "Others"
            let dtLabels = [];
            let dtData = [];
            let otherSum = 0;
            downtime.forEach((d, i) => {
                if (i < 5) {
                    dtLabels.push(d.reason);
                    dtData.push(d.min);
                } else {
                    otherSum += d.min;
                }
            });
            if (otherSum > 0) {
                dtLabels.push('Others');
                dtData.push(otherSum);
            }

            mouldCharts.down = new Chart(document.getElementById('mouldDownChart'), {
                type: 'doughnut',
                data: {
                    labels: dtLabels,
                    datasets: [{
                        data: dtData,
                        backgroundColor: ['#f59e0b', '#3b82f6', '#10b981', '#6366f1', '#8b5cf6', '#94a3b8'],
                        borderWidth: 0
                    }]
                },
                options: { cutout: '60%', maintainAspectRatio: false }
            });

            // 3. Trend (Line)
            mouldCharts.trend = new Chart(document.getElementById('mouldTrendChart'), {
                type: 'line',
                data: {
                    labels: trend.map(t => new Date(t.date).toLocaleDateString()),
                    datasets: [
                        {
                            label: 'Good Qty',
                            data: trend.map(t => t.good),
                            borderColor: '#10b981',
                            tension: 0.3,
                            fill: false
                        },
                        {
                            label: 'Reject Qty',
                            data: trend.map(t => t.reject),
                            borderColor: '#ef4444',
                            tension: 0.3,
                            fill: false
                        }
                    ]
                },
                options: { maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
            });
        }

        /* =========================================
           SUPERVISOR LOGIC
           ========================================= */
        let supChartInstance = null;
        function supKpiCard(label, value, sub, color) {
            return `<div class="card" style="padding:15px; border-left:4px solid ${color}">
                <small style="color:#64748b">${label}</small>
                <div style="font-weight:bold; font-size:1.4em">${value}</div>
                ${sub ? `<small class="text-muted" style="font-size:0.8em">${sub}</small>` : ''}
            </div>`;
        }
        async function loadSupervisorAnalysis() {
            const body = document.getElementById('supTableBody');
            try {
                const res = await JPSMS.api.get('/analyze/supervisor' + filterQS());
                if (!res.ok) { body.innerHTML = `<tr><td colspan="10" class="text-center p-3 text-danger">${res.error || 'No data'}</td></tr>`; return; }
                const sups = res.data.supervisors || [];
                const t = res.data.totals || {};

                document.getElementById('supKpis').innerHTML = [
                    supKpiCard('Supervisors', t.supervisors || 0, `${t.entries || 0} entries`, '#3b82f6'),
                    supKpiCard('Total Good', (t.good || 0).toLocaleString(), 'pcs', '#10b981'),
                    supKpiCard('Total Reject', (t.reject || 0).toLocaleString(), `${t.rejRate || 0}% rate`, '#ef4444'),
                    supKpiCard('Downtime', `${t.downtime || 0} min`, 'owned across shifts', '#f59e0b')
                ].join('');

                if (!sups.length) { body.innerHTML = '<tr><td colspan="10" class="text-center p-3">No entries in range</td></tr>'; return; }

                body.innerHTML = sups.map(s => `
                    <tr>
                        <td style="font-weight:700; color:#334155">${s.name}${s.matched ? '' : ' <span style="font-size:0.7rem; color:#f59e0b" title="No matching user account">(unmatched)</span>'}</td>
                        <td style="color:#64748b">${s.role || '-'}</td>
                        <td class="text-end">${s.good.toLocaleString()}</td>
                        <td class="text-end" style="color:${s.reject > 0 ? '#ef4444' : '#94a3b8'}">${s.reject.toLocaleString()}</td>
                        <td class="text-end" style="color:${s.rejRate > 5 ? '#ef4444' : '#64748b'}">${s.rejRate}%</td>
                        <td class="text-end">${s.downtime} min</td>
                        <td class="text-end">${s.shifts}</td>
                        <td class="text-end">${s.entries}</td>
                        <td class="text-end">${s.machines}</td>
                        <td class="text-end" style="font-weight:600">${s.avgPerShift.toLocaleString()}</td>
                    </tr>`).join('');

                // Leaderboard chart (top 12 by good, good vs reject stacked)
                const top = sups.slice(0, 12);
                const ctx = document.getElementById('supChart');
                if (supChartInstance) supChartInstance.destroy();
                supChartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: top.map(s => s.name),
                        datasets: [
                            { label: 'Good', data: top.map(s => s.good), backgroundColor: '#10b981', borderRadius: 4 },
                            { label: 'Reject', data: top.map(s => s.reject), backgroundColor: '#ef4444', borderRadius: 4 }
                        ]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { position: 'bottom' } },
                        scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true } }
                    }
                });
            } catch (e) {
                body.innerHTML = `<tr><td colspan="10" class="text-center p-3 text-danger">${e.message}</td></tr>`;
            }
        }

        /* =========================================
           PLANT LOGIC
           ========================================= */
        let plantCharts = {};
        function oeeColor(v) { return v >= 85 ? '#10b981' : v >= 60 ? '#f59e0b' : '#ef4444'; }
        async function loadPlantAnalysis() {
            const kpis = document.getElementById('plantKpis');
            kpis.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:30px; color:#94a3b8"><div class="spinner-border spinner-border-sm text-primary"></div> Loading…</div>';
            let data;
            try {
                const res = await JPSMS.api.get('/analyze/plant' + filterQS());
                if (!res.ok) { kpis.innerHTML = `<div style="grid-column:1/-1; color:#ef4444; text-align:center; padding:20px">${res.error || 'No data'}</div>`; return; }
                data = res.data;
            } catch (e) {
                kpis.innerHTML = `<div style="grid-column:1/-1; color:#ef4444; text-align:center; padding:20px">${e.message}</div>`; return;
            }

            const o = data.overall || {};
            kpis.innerHTML = [
                supKpiCard('OEE', `${o.oee || 0}%`, 'Availability × Perf × Quality', oeeColor(o.oee || 0)),
                supKpiCard('Availability', `${o.availability || 0}%`, `${o.runHours || 0} run hrs`, '#3b82f6'),
                supKpiCard('Performance', `${o.performance || 0}%`, 'vs STD capacity', '#8b5cf6'),
                supKpiCard('Quality', `${o.quality || 0}%`, `${(o.reject || 0).toLocaleString()} rej`, '#ef4444'),
                supKpiCard('Output', `${(o.output || 0).toLocaleString()}`, `${o.downtime || 0} min down`, '#10b981')
            ].join('');

            Object.values(plantCharts).forEach(c => c && c.destroy());
            plantCharts = {};

            // OEE gauge (doughnut)
            plantCharts.gauge = new Chart(document.getElementById('plantOeeGauge'), {
                type: 'doughnut',
                data: { labels: ['OEE', ''], datasets: [{ data: [o.oee || 0, 100 - (o.oee || 0)], backgroundColor: [oeeColor(o.oee || 0), '#e2e8f0'], borderWidth: 0 }] },
                options: {
                    responsive: true, maintainAspectRatio: false, cutout: '72%',
                    plugins: { legend: { display: false }, tooltip: { enabled: false } }
                },
                plugins: [{
                    id: 'oeeText', afterDraw: (ch) => {
                        const { ctx, chartArea } = ch; const x = (chartArea.left + chartArea.right) / 2; const y = (chartArea.top + chartArea.bottom) / 2;
                        ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.font = 'bold 28px sans-serif'; ctx.fillStyle = oeeColor(o.oee || 0); ctx.fillText(`${o.oee || 0}%`, x, y);
                        ctx.restore();
                    }
                }]
            });

            // Date-wise OEE trend
            const bd = data.byDate || [];
            plantCharts.trend = new Chart(document.getElementById('plantTrend'), {
                type: 'line',
                data: {
                    labels: bd.map(d => new Date(d.key).toLocaleDateString()),
                    datasets: [
                        { label: 'OEE', data: bd.map(d => d.oee), borderColor: '#024c81', backgroundColor: 'rgba(1,168,221,0.12)', fill: true, tension: 0.3 },
                        { label: 'Availability', data: bd.map(d => d.availability), borderColor: '#3b82f6', tension: 0.3, fill: false, pointRadius: 0 },
                        { label: 'Performance', data: bd.map(d => d.performance), borderColor: '#8b5cf6', tension: 0.3, fill: false, pointRadius: 0 },
                        { label: 'Quality', data: bd.map(d => d.quality), borderColor: '#10b981', tension: 0.3, fill: false, pointRadius: 0 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true, max: 100 } } }
            });

            // Line-wise OEE bar
            const bl = data.byLine || [];
            plantCharts.lines = new Chart(document.getElementById('plantLines'), {
                type: 'bar',
                data: { labels: bl.map(l => l.key), datasets: [{ label: 'OEE %', data: bl.map(l => l.oee), backgroundColor: bl.map(l => oeeColor(l.oee)), borderRadius: 4 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100 } } }
            });

            // Loss Pareto
            const lr = (data.lossReasons || []).slice(0, 10);
            plantCharts.loss = new Chart(document.getElementById('plantLoss'), {
                type: 'bar',
                data: { labels: lr.map(r => r.reason), datasets: [{ label: 'Downtime (min)', data: lr.map(r => r.min), backgroundColor: '#f59e0b', borderRadius: 4 }] },
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }
    </script>
    <script src="/assets/ai-chat.js"></script>
</body>

</html>
