<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMS OCEAN - Scanning List</title>
    <link rel="stylesheet" href="/assets/app.css?v=12">
    <link rel="stylesheet" href="/assets/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/packing-scan.css?v=1">
</head>

<body>
    <div class="main-content">
        <div class="sc-page">
            <div class="header sc-head">
                <div class="page-title">Scanning List</div>
                <span class="sc-upd" id="scUpdated" role="status"></span>
                <div class="sc-acts">
                    <nav class="sc-views" aria-label="Scanning views"><a href="scanning.html">Cards</a><a href="scanning_list.html" aria-current="page">List</a><a href="scanning_dashboard.html">Dashboard</a></nav>
                    <button type="button" class="btn btn-outline" id="scRefresh"><i class="bi bi-arrow-clockwise"></i>Refresh</button>
                </div>
            </div>
            <div class="sc-figs" id="scFigures"></div>
            <div class="sc-bar1"><span>Assembly</span><div class="sc-chips" id="scAssembly" role="group" aria-label="Assembly station"></div></div>
            <div class="sc-stations list" id="scStations"><div class="sc-skel"></div><div class="sc-skel"></div><div class="sc-skel"></div></div>
        </div>
    </div>

    <script src="/assets/app.min.js?v=1583"></script>
    <script src="/js/production_scanning.js?v=2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => PackScan.start('list'));
    </script>
</body>

</html>
