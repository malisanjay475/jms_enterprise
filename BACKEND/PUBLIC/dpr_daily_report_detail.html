<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Report (Detailed) · JMS OCEAN</title>
    <link href="/assets/vendor/fonts/g-5710dd5f5b.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/app.css?v=12">

    <!--
      Daily Report (Detailed). Sits next to the older dpr_daily_report.html, which is unchanged.
      Same live APIs as that page (summary-matrix Day + Night, masters/machines, change-counts,
      shift team-range) plus masters/moulds as the std fallback when an hour has no DPR setup.
      Every Kg is worked out per mould run: std pcs/hr = 3600 / std cycle x std cavities,
      piece weight = Mould Master std (or setup actual, by option). On today's date only
      finished hours (and hours already entered) count toward the target.
    -->
    <style>
.ddr{
  --bg:#f1f5f9; --card:#ffffff; --ink:#17384c; --muted:#5d778a; --line:#d9e6ee; --soft:#f4f8fb;
  --primary:#024c81; --teal:#00929e; --gold:#e09a12;
  --good:#0f9d6b; --warn:#d98a06; --bad:#d6453d; --idle:#9aaebb;
  --good-bg:#e3f5ee; --warn-bg:#fdf1dc; --bad-bg:#fbe7e5; --idle-bg:#eef2f5;
  --day:#e7a31a; --night:#4f5fc9;
  --display:'Inter',system-ui,sans-serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
/* Single light theme on purpose: it must look exactly like the JMS app, which has no dark mode. */
.ddr,.ddr *{box-sizing:border-box}
.ddr{color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
.wrap{max-width:1600px;margin:0 auto;padding:4px 0 60px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.45rem} h2{font-size:1.05rem} h3{font-size:.92rem}
.muted{color:var(--muted)} .small{font-size:.8rem}
.lbl{font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:12px}
.pad{padding:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:.82rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* top bar */
.top{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end}
.top .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.chip b{color:var(--ink)}
/* decisions */
.dec{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.dec .q{font-size:.8rem;font-weight:700;margin-bottom:6px}
.dec .seg{width:100%} .dec .seg button{flex:1}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpi{padding:12px 14px;display:flex;flex-direction:column;gap:3px;border-left:4px solid var(--line)}
.kpi .v{font-family:var(--display);font-size:1.55rem;font-weight:700;line-height:1.1}
.kpi .v small{font-size:.75rem;color:var(--muted);font-weight:600}
.kpi .s{font-size:.74rem;color:var(--muted)}
.kpi.good{border-left-color:var(--good)} .kpi.warn{border-left-color:var(--warn)} .kpi.bad{border-left-color:var(--bad)} .kpi.info{border-left-color:var(--primary)}
/* pills */
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.72rem;font-weight:700;white-space:nowrap}
.pill.g{background:var(--good-bg);color:var(--good)} .pill.a{background:var(--warn-bg);color:var(--warn)} .pill.r{background:var(--bad-bg);color:var(--bad)} .pill.z{background:var(--idle-bg);color:var(--idle)}
.tg{color:var(--good)} .ta{color:var(--warn)} .tr{color:var(--bad)}
/* waterfall */
.wf{display:flex;flex-direction:column;gap:3px}
.wf .r{display:grid;grid-template-columns:minmax(150px,240px) minmax(0,1fr) 92px 64px;gap:10px;align-items:center;padding:3px 6px;border-radius:6px;font-size:.82rem}
.wf .r.tot{font-weight:700;background:var(--soft)}
.wf .r[data-k]{cursor:pointer} .wf .r[data-k]:hover{background:var(--soft)}
.wf .track{position:relative;height:16px}
.wf .bar{position:absolute;top:2px;bottom:2px;border-radius:3px}
.wf .num{text-align:right;font-weight:600} .wf .pc{text-align:right;color:var(--muted);font-size:.75rem}
.b-tot{background:var(--primary)} .b-good{background:var(--good)} .b-ex{background:var(--idle);opacity:.55} .b-loss{background:var(--bad);opacity:.8} .b-plan{background:var(--teal)} .b-co{background:var(--gold)} .b-gain{background:var(--good);opacity:.5}
/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.8rem}
.t th{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;text-align:right;padding:8px 8px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--card);position:sticky;top:0}
.t td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.t .l{text-align:left}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:var(--soft)}
.t tr.sub td{background:var(--soft);font-size:.76rem}
.t tr.tot td{font-weight:800;background:var(--soft);border-top:2px solid var(--line)}
.t tr.grp td{background:var(--soft);font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left}
.ebar{display:inline-block;width:70px;height:6px;border-radius:99px;background:var(--idle-bg);vertical-align:middle;margin-left:6px;overflow:hidden}
.ebar i{display:block;height:100%}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
/* pareto */
.par{display:flex;flex-direction:column;gap:6px}
.par .r{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 62px;gap:8px;align-items:center;font-size:.8rem}
.par .r .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.par .tr2{height:12px;background:var(--idle-bg);border-radius:3px;overflow:hidden}
.par .tr2 i{display:block;height:100%;background:var(--bad);opacity:.75}
.par .r.np .tr2 i{background:var(--idle)}
/* matrix */
.mx th.dd{color:var(--day)} .mx th.nn{color:var(--night)}
.mx td:first-child,.mx th:first-child{position:sticky;left:0;background:var(--card);text-align:left;z-index:1;min-width:210px;white-space:normal}
.mx tr.grp td:first-child{background:var(--soft)}
.mx td.f{background:color-mix(in srgb,var(--primary) 6%,var(--card));font-weight:700}
.mx tr.k td:first-child{cursor:pointer;text-decoration:underline dotted var(--muted)}
/* board */
.lines{display:flex;flex-direction:column;gap:14px}
.lsec .lh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:12px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--card);text-align:left}
.tile:hover{border-color:var(--primary)}
.tile .nm{font-weight:700;font-size:.82rem}
.tile .mo{font-size:.74rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip{display:grid;grid-template-columns:repeat(24,1fr);gap:1px}
.strip i{height:14px;border-radius:2px;background:var(--idle-bg)}
.strip i.sep{box-shadow:-2px 0 0 var(--muted)}
.tile .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:.72rem}
.tile .nums b{display:block;font-size:.85rem}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.74rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(5,20,30,.55);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(980px,100%);height:100%;overflow-y:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px 18px;display:flex;flex-direction:column;gap:14px}
.x{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;font-weight:700}
.formula{font-size:.8rem;line-height:1.6}
.formula code{font-family:ui-monospace,Consolas,monospace;font-size:.78rem;background:var(--soft);padding:1px 5px;border-radius:4px}
.note{font-size:.78rem;color:var(--muted);border-left:3px solid var(--gold);padding:6px 10px;background:var(--card);border-radius:0 8px 8px 0}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.calc .dcard{padding:12px}
.calc .v{font-family:var(--display);font-weight:700;font-size:1.1rem}
/* ===== JMS look: gradient hero, stripe KPI cards, icon chips ===== */
.dhero{background:linear-gradient(135deg,#024c81 0%,#0f8ea8 100%);border-radius:18px;padding:16px 20px;color:#fff;box-shadow:0 12px 30px -14px rgba(2,76,129,.55);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.dhero::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.dhero>*{position:relative;z-index:1}
.dhero .t1{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dhero .ttl{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.2rem;font-weight:700}
.dhero .ttl svg{width:22px;height:22px}
.dhero .sub{font-size:.74rem;font-weight:600;opacity:.85;margin-top:2px}
.dhero .fl label{display:block;font-size:.58rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-bottom:3px}
.dhero .date{background:#fff;color:#17384c;border-radius:10px;padding:7px 10px;font-weight:800;font-size:.84rem}
.hb{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;font-weight:800;font-size:.8rem;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.15);color:#fff}
.hb.solid{background:#fff;color:#024c81;border-color:#fff}
.hb svg{width:14px;height:14px}
.hpills{display:flex;gap:6px;flex-wrap:wrap}
.hpill{padding:5px 14px;border-radius:20px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;font-size:.78rem;font-weight:800}
.hpill[aria-pressed="true"]{background:#fff;color:#024c81;border-color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:600;opacity:.9}
.live i{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.kpis{gap:12px}
.kpi{border:1px solid var(--line);border-left:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px -14px rgba(15,23,42,.2);transition:transform .15s}
.kpi:hover{transform:translateY(-2px)}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--ac,var(--line))}
.kpi .kh{display:flex;justify-content:space-between;align-items:center}
.kpi .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--ac);color:#fff}
.kpi .ic svg{width:16px;height:16px}
.kpi.good{--ac:linear-gradient(90deg,#22c55e,#16a34a)} .kpi.warn{--ac:linear-gradient(90deg,#fbbf24,#f59e0b)} .kpi.bad{--ac:linear-gradient(90deg,#f87171,#ef4444)} .kpi.info{--ac:linear-gradient(90deg,#60a5fa,#3b82f6)} .kpi.vio{--ac:linear-gradient(90deg,#a78bfa,#8b5cf6)}
.kpi .v{font-size:1.6rem;font-weight:800}
.kpi.good,.kpi.warn,.kpi.bad,.kpi.info,.kpi.vio{border-left-color:var(--line)}
.kpi.vio .v{font-size:1.15rem;line-height:1.3}
.ins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.chipc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px -16px rgba(15,23,42,.25);min-width:0}
.chipc .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex-shrink:0}
.chipc .ic svg{width:17px;height:17px}
.chipc .v{font-weight:800;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chipc .v span{font-size:.72rem;color:var(--muted);font-weight:700}
.dcard{border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px -14px rgba(15,23,42,.18)}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.ph h2{display:flex;align-items:center;gap:8px;font-size:.95rem}
.ph h2 svg{width:17px;height:17px;color:var(--teal)}
.dcard.pad>.ph{margin:-16px -16px 14px}
.mx th.dd{background:#fffbeb;color:#92400e;border-bottom:2px solid #f59e0b}
.mx th.nn{background:#eef2ff;color:#3730a3;border-bottom:2px solid #6366f1}
/* ===== Design D ===== */
.dk{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.dk .kpi{gap:4px}
.dk .vr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ring{--p:0;--c:var(--good);width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--idle-bg) 0);display:grid;place-items:center;flex-shrink:0}
.ring b{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:.66rem;font-weight:800}
.pb{height:6px;border-radius:99px;background:var(--idle-bg);overflow:hidden;display:flex;margin-top:4px}
.pb i{display:block;height:100%}
.dn{display:grid;grid-template-columns:auto 1fr auto;gap:2px 6px;align-items:center;font-size:.68rem;color:var(--muted);margin-top:2px}
.dn .pb{margin:0;height:5px}
.charts{display:grid;gap:12px}
.charts.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.charts.c21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.cc{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cc .ct{font-size:.8rem;font-weight:800;display:flex;align-items:center;gap:6px}
.cc .ct svg{width:15px;height:15px;color:var(--teal)}
.cc .cs{font-size:.72rem;color:var(--muted)}
.cbox{position:relative;height:250px}
.cbox.tall{height:300px}
.stk{display:flex;height:10px;border-radius:99px;overflow:hidden;min-width:120px;background:var(--idle-bg)}
.stk i{display:block;height:100%}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:.7rem;color:var(--muted)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;box-shadow:0 8px 20px -16px rgba(15,23,42,.35)}
.tabs button{border:0;background:transparent;padding:9px 14px;border-radius:10px;font-weight:700;font-size:.82rem;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tabs button svg{width:15px;height:15px}
.tabs button[aria-selected="true"]{background:linear-gradient(135deg,#024c81,#0f8ea8);color:#fff}
.tabs .cnt{font-size:.66rem;background:var(--bad);color:#fff;border-radius:99px;padding:0 6px}
.hs{display:grid;grid-template-columns:repeat(24,minmax(9px,1fr));gap:1px;min-width:230px}
.hs i{height:16px;border-radius:2px;display:block}
.hs i.mid{box-shadow:-2px 0 0 #334155}
.h-g{background:#22c55e}.h-a{background:#fbbf24}.h-r{background:#f87171}.h-d{background:#b91c1c}.h-n{background:#cbd5e1}.h-m{background:#fff;outline:1px dashed #94a3b8;outline-offset:-1px}
.lcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.lc{padding:14px 16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--card)}
.lc:hover{border-color:var(--teal)}
.lc .top2{display:flex;gap:12px;align-items:center}
.lc .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:.72rem;color:var(--muted)}
.lc .g3 b{display:block;font-size:.92rem;color:var(--ink)}
.dfilters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dfilters select,.dfilters input{font:inherit;font-size:.8rem;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.fchip{border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:4px 11px;font-size:.75rem;font-weight:700;color:var(--muted)}
.fchip[aria-pressed="true"]{background:#024c81;color:#fff;border-color:#024c81}
.hm td.c{font-weight:700}
.chk{display:flex;flex-direction:column;gap:10px}
.chk details{border:1px solid var(--line);border-radius:12px;background:var(--card)}
.chk summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 14px}
.chk summary::-webkit-details-marker{display:none}
.chk .n{min-width:52px;text-align:center;font-family:var(--display);font-weight:700;font-size:1.15rem;border-radius:10px;padding:4px 6px}
.chk .body{padding:0 14px 14px}
.seqs{display:flex;flex-direction:column;gap:6px;font-size:.78rem}
.seqs .s1{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px}
.seqs .mo{background:var(--soft);border-radius:6px;padding:2px 8px}
@media (max-width:1200px){.dk{grid-template-columns:repeat(3,minmax(0,1fr))}.charts.c3{grid-template-columns:repeat(2,minmax(0,1fr))}.charts.c21{grid-template-columns:1fr}}
@media (max-width:700px){.dk{grid-template-columns:repeat(2,minmax(0,1fr))}.charts.c3{grid-template-columns:1fr}}
@media (max-width:1100px){.ins{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.ins{grid-template-columns:1fr}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.dec{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.picker,.dec{grid-template-columns:1fr}.top{grid-template-columns:1fr}.wf .r{grid-template-columns:minmax(0,1fr) 80px;}.wf .track,.wf .pc{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.dhero .date{border:0;font:inherit;font-weight:800}
.dhero .hb{cursor:pointer}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:12px 16px}
.opts .q{font-size:.78rem;font-weight:700;margin-bottom:6px}
.opts .seg{width:100%} .opts .seg button{flex:1}
details.dopt>summary{list-style:none;cursor:pointer;padding:10px 16px;font-weight:700;font-size:.82rem;display:flex;gap:8px;align-items:center}
details.dopt>summary::-webkit-details-marker{display:none}
details.dopt>summary svg{width:15px;height:15px;color:var(--teal)}
.h-f{background:#f1f5f9}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.livebar{font-size:.74rem;font-weight:700;background:rgba(255,255,255,.18);border-radius:8px;padding:4px 10px}

<body>
<div class="main-content">
<div class="ddr wrap">
  <header class="dhero">
    <div class="t1">
      <div><div class="ttl"><i class="bi bi-clipboard2-data-fill"></i> Daily Report (Detailed)</div><div class="sub" id="heroSub">Select a date</div></div>
      <span class="sp"></span>
      <div class="fl no-print"><label for="repDate">Report date</label><input type="date" id="repDate" class="date"></div>
      <div class="row no-print" style="gap:8px;align-self:flex-end">
        <button class="hb solid" id="btnGen" type="button"><i class="bi bi-arrow-repeat"></i> Generate</button>
        <button class="hb" id="btnCsv" type="button"><i class="bi bi-filetype-csv"></i> Export</button>

      </div>

      <div class="hpills" id="shiftSeg" role="group" aria-label="Shift" style="margin-left:6px"><button class="hpill" data-v="all">24 hours</button><button class="hpill" data-v="0">Day 07–19</button><button class="hpill" data-v="1">Night 19–07</button></div>

    </div>

  <details class="dcard dopt no-print">
    <summary><i class="bi bi-sliders"></i> Report options <span class="muted small" style="font-weight:500">How the target and efficiency are counted · saved on this device</span></summary>
    <div class="opts">
      <div><div class="q">No Plan hours (code 13)</div><div class="seg" id="d-np"><button data-v="exclude">Not a loss</button><button data-v="loss">Count as loss</button></div></div>
      <div><div class="q">Piece weight for Kg</div><div class="seg" id="d-wt"><button data-v="std">Std (Mould Master)</button><button data-v="act">Actual (setup)</button></div></div>
      <div><div class="q">5% achievable allowance</div><div class="seg" id="d-buf"><button data-v="off">Off</button><button data-v="on">On</button></div></div>
      <div><div class="q">Efficiency is Good ÷</div><div class="seg" id="d-eff"><button data-v="ach">Achievable target</button><button data-v="full">Full capacity</button></div></div>
    </div>
  </details>

  <div id="view"><section class="dcard empty">Loading…</section></div>

  <section class="dcard pad" id="how" hidden></section>
  <div id="drawerHost"></div>

<script src="/assets/app.min.js?v=1583"></script>
<script>
const DT_NAMES={'1':'Manpower shortage','2':'Mould change-over','3':'Accessories shortage','4':'Material shortage','5':'Machine maintenance (water/oil/air leak)','6':'Nozzle block / change','7':'Mould problem','8':'Power failure / pre-heating','9':'Colour change','10':'Process setting','11':'Mould trial','12':'Crane / HRTC','13':'No plan','O':'Other (typed by supervisor)'};
const REJ_NAMES={A:'Short moulding',B:'Shrinkage mark',C:'Silver streak / colour variation',D:'Flow mark / weld line',E:'Fitment issue',F:'Dent mark / air bubble',G:'Warpage',H:'Black / water marks',I:'Start-up / colour-change pcs',J:'Bottom bulging',K:'Scratch',L:'Over lapping',M:'Punching hole issue'};
const SLOTS=['07','08','09','10','11','12','01','02','03','04','05','06'];
const HL=(s,i)=>String(s?(19+i)%24:7+i).padStart(2,'0');   // 24-hour clock: Day 07–18, Night 19–06
const state={design:'D',shift:'all',np:'exclude',wt:'std',buf:'off',eff:'ach',dview:'line',tab:'overview',mline:'',mfilt:'all',q:''};
try{const s=JSON.parse(localStorage.getItem('jms-daily-detail')||'{}');['shift','np','wt','buf','eff','tab'].forEach(k=>{if(s[k]!=null)state[k]=s[k];});}catch(e){}
state.design='D';
const save=()=>{try{const o={};['shift','np','wt','buf','eff','tab'].forEach(k=>o[k]=state[k]);localStorage.setItem('jms-daily-detail',JSON.stringify(o));}catch(e){}};

const fmt=(v,d=0)=>(v==null||!isFinite(v))?'—':Number(v).toLocaleString('en-IN',{maximumFractionDigits:d,minimumFractionDigits:d});
const pct=(v,d=1)=>(v==null||!isFinite(v))?'—':fmt(v*100,d)+'%';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const band=e=>!(e>0)?'z':e>=.85?'g':e>=.65?'a':'r';
const bandVar=e=>({g:'var(--good)',a:'var(--warn)',r:'var(--bad)',z:'var(--idle)'})[band(e)];
const rejBand=x=>!(x>0)?'z':x>.05?'r':x>.02?'a':'g';

/* ---------- data ---------- */
let P=null,HRS={},HUS={},DONE=[12,12],MACH=[],RUNS=[],byMS={},LINES=[],lineOf,lineCmp,machCmp,teamFor;
function buildIndex(){
MACH=P.machines.map(([name,line,lu,ton],i)=>({i,name,line:String(line).replace(/\s+/g,' ').trim(),lu:+lu||0,ton,no:+((String(name).match(/(\d+)\s*$/)||[0,0])[1])}));
lineOf=l=>{const m=String(l).match(/^([A-Z])\s*-?\s*L-?\s*(\d+)/i);return m?[m[1].toUpperCase(),+m[2]]:[l,0];};
lineCmp=(a,b)=>{const x=lineOf(a),y=lineOf(b);return x[0]<y[0]?-1:x[0]>y[0]?1:x[1]-y[1];};
machCmp=(a,b)=>lineCmp(a.line,b.line)||a.no-b.no||a.name.localeCompare(b.name);
RUNS=P.runs.map(r=>({m:r[0],s:r[1],mould:P.moulds[r[2]],plan:r[3],stdWt:+r[4]||0,actWt:+r[5]||0,ct:+r[6]||0,cav:+r[7]||0,acav:+r[8]||0,pcshr:+r[9]||0,actCt:+r[10]||0,client:r[11],jc:r[12],order:r[13],h:+r[14]||0,g:+r[15]||0,rj:+r[16]||0,dt:r[17]||{},rej:r[18]||{},unm:+r[19]||0,slots:String(r[20]||'').split('.').filter(x=>x!=='').map(Number),src:r[21]||'setup'}));
byMS={};RUNS.forEach(r=>{(byMS[r.m+'|'+r.s]=byMS[r.m+'|'+r.s]||[]).push(r);});
LINES=[...new Set(MACH.map(m=>m.line))].sort(lineCmp);
}
teamFor=(line,s)=>{const k=Object.keys(P.team||{}).find(t=>t.replace(/[\s-]/g,'').toUpperCase()===line.replace(/[\s-]/g,'').toUpperCase());return k?(P.team[k][s]||''):'';};

/* ---------- maths ---------- */
const NUM=['full','noPlan','missing','planned','stdCO','buffer','ach','overrun','down','npLoss','speed','gross','good','rej','goodPcs','rejPcs','fullH','npH','missH','stdCOH','actCOH','downH','runH','mc','cc','jc','actCOkg','machines','qv','hold','nEnt','unmatched'];
function rateOf(r){const cav=r.cav||r.acav||1;if(r.ct>0)return {v:3600/r.ct*cav,src:'std cycle '+r.ct+' s × '+cav+' cav'};if(r.pcshr>0)return {v:r.pcshr,src:'setup pcs/hr (no std cycle)'};return {v:0,src:'no rate'};}
function wtOf(r){const g=state.wt==='std'?(r.stdWt||r.actWt):(r.actWt||r.stdWt);return g/1000;}
function calcMS([m,s,miss,mc,cc,jc]){
  const runs=byMS[m+'|'+s]||[];const lu=MACH[m].lu;
  let main=runs[0];runs.forEach(r=>{if(r.h>main.h)main=r;});
  const o={m,s,runs:[],downBy:{},rejBy:{}};NUM.forEach(k=>o[k]=0);
  o.mc=mc;o.cc=cc;o.jc=jc;o.machines=1;o.missH=miss;o.fullH=Math.max(DONE[s],runs.reduce((a,r)=>a+r.h,0));
  runs.forEach(r=>{
    const rate=rateOf(r),wt=wtOf(r),R=rate.v*wt;
    const np=(+r.dt['13']||0)/60,co=(+r.dt['2']||0)/60;let dn=0;
    Object.entries(r.dt).forEach(([c,v])=>{if(c==='13'||c==='2')return;const h=(+v||0)/60;dn+=h;o.downBy[c]=(o.downBy[c]||0)+h;});
    Object.entries(r.rej).forEach(([c,v])=>{o.rejBy[c]=(o.rejBy[c]||0)+(+v||0);});
    const rr={...r,rate:rate.v,rateSrc:rate.src,wt,R,np,co,dn,full:R*r.h,gross:(r.g+r.rj)*wt,good:r.g*wt,rejKg:r.rj*wt};
    rr.runH=Math.max(0,r.h-np-co-dn);rr.speedPct=rr.runH>0&&rate.v>0?(r.g+r.rj)/(rate.v*rr.runH):0;
    o.runs.push(rr);
    o.full+=R*r.h;o.noPlan+=R*np;o.npH+=np;o.actCOkg+=R*co;o.actCOH+=co;o.down+=R*dn;o.downH+=dn;
    o.gross+=rr.gross;o.good+=rr.good;o.rej+=rr.rejKg;o.goodPcs+=r.g;o.rejPcs+=r.rj;o.runH+=rr.runH;
  });
  const Rm=main?rateOf(main).v*wtOf(main):0;
  o.missing=Rm*miss;o.full+=o.missing;
  o.stdCOH=mc*lu/60;o.stdCO=Math.min(Rm*o.stdCOH,Math.max(0,o.full-o.missing-o.noPlan));
  o.planned=o.full-o.missing-(state.np==='exclude'?o.noPlan:0);
  o.npLoss=state.np==='loss'?o.noPlan:0;
  o.buffer=state.buf==='on'?0.05*Math.max(0,o.planned-o.stdCO):0;
  o.ach=Math.max(0,o.planned-o.stdCO-o.buffer);
  o.overrun=Math.max(0,o.actCOkg-o.stdCO);
  o.speed=o.ach-o.overrun-o.down-o.npLoss-o.gross;
  o.unmatched=runs.reduce((a,r)=>a+r.unm,0);
  o.hr=HRS[MACH[m].name+'|'+s]||[];
  o.hr.forEach(x=>{if(x){o.qv+=x[5];o.hold+=x[6];o.nEnt+=x[7];}});
  o.users=HUS[MACH[m].name+'|'+s]||[];
  // per-hour detail: owner runs of each hour give its rate and piece weight
  o.slots=[];for(let i=0;i<12;i++){const x=o.hr[i];const own=o.runs.filter(r=>r.slots.includes(i));const k=own.length||1;
    const R=own.reduce((a,r)=>a+r.R,0)/k,rate=own.reduce((a,r)=>a+r.rate,0)/k,wt=own.reduce((a,r)=>a+r.wt,0)/k;
    if(!x){o.slots.push(i<DONE[s]?{miss:1,R,rate,wt,mould:own[0]?own[0].mould:''}:{fut:1,R,rate,wt,mould:''});continue;}
    const [g,r,dt,np,co,qv,hold,n]=x;const useMin=Math.max(0,60-np);
    o.slots.push({g,r,dt,np,co,qv,hold,n,R,rate,wt,gk:g*wt,rk:r*wt,plan:R*(state.np==='exclude'?useMin/60:1),eff:rate>0&&useMin>0?(g+r)/(rate*useMin/60):0,mould:own.map(r=>r.mould).join(' + ')});}
  return o;
}
function sum(list){const o={downBy:{},rejBy:{}};NUM.forEach(k=>o[k]=0);list.forEach(x=>{NUM.forEach(k=>o[k]+=x[k]||0);Object.entries(x.downBy).forEach(([c,v])=>o.downBy[c]=(o.downBy[c]||0)+v);Object.entries(x.rejBy).forEach(([c,v])=>o.rejBy[c]=(o.rejBy[c]||0)+v);});return derive(o);}
function derive(o){
  o.eff=(state.eff==='ach'?o.ach:o.full)>0?o.good/(state.eff==='ach'?o.ach:o.full):0;
  o.rejPct=o.gross>0?o.rej/o.gross:0;
  // OEE is measured against the Planned target, so change-over time counts as an availability loss.
  o.runKg=o.ach-o.overrun-o.down-o.npLoss;
  o.avail=o.planned>0?Math.max(0,o.runKg/o.planned):0;o.perf=o.runKg>0?o.gross/o.runKg:0;o.qual=o.gross>0?o.good/o.gross:0;
  o.oee=o.planned>0?o.good/o.planned:0;
  o.coLoss=o.stdCO+o.buffer+o.overrun;o.dtLoss=o.down+o.npLoss;o.totalLoss=o.planned-o.good;
  o.gap=o.good-o.ach;
  return o;
}
let MS=[],R={};
function recompute(){
  MS=P.ms.map(calcMS).map(derive);
  const inShift=x=>state.shift==='all'||x.s===+state.shift;
  const sel=MS.filter(inShift);
  R={sel,fac:sum(sel),day:sum(MS.filter(x=>x.s===0)),night:sum(MS.filter(x=>x.s===1)),lines:{},machines:[]};
  LINES.forEach(l=>{R.lines[l]={all:sum(sel.filter(x=>MACH[x.m].line===l)),d:sum(MS.filter(x=>x.s===0&&MACH[x.m].line===l)),n:sum(MS.filter(x=>x.s===1&&MACH[x.m].line===l))};});
  const seen=new Set(MS.map(x=>x.m));
  R.idle=MACH.filter(m=>!seen.has(m.i)).sort(machCmp);
  R.machines=MACH.filter(m=>seen.has(m.i)).sort(machCmp).map(m=>({m,all:sum(sel.filter(x=>x.m===m.i)),d:MS.find(x=>x.m===m.i&&x.s===0),n:MS.find(x=>x.m===m.i&&x.s===1)}));
  R.running=new Set(sel.filter(x=>x.gross>0).map(x=>x.m)).size;
}

/* ---------- shared pieces ---------- */
const shiftLabel=()=>state.shift==='all'?'24 hours':state.shift==='0'?'Day shift':'Night shift';
function steps(o){
  const S=[];
  S.push({k:'full',t:'Full capacity at std rate',v:o.full,c:'b-tot',tot:1,h:'All reported machines × 12 h per shift × std pcs/hr × piece weight'});
  if(state.np==='exclude')S.push({k:'np',t:'− No plan (not counted)',v:-o.noPlan,c:'b-ex',h:fmt(o.npH,1)+' h with no plan'});
  S.push({k:'miss',t:'− DPR not filled',v:-o.missing,c:'b-loss',h:fmt(o.missH,0)+' machine-hours with no entry'});
  S.push({k:'planned',t:'= Planned target',v:o.planned,c:'b-plan',tot:1});
  S.push({k:'stdco',t:'− Std mould change time',v:-o.stdCO,c:'b-co',h:o.mc+' mould changes × load + unload'});
  if(state.buf==='on')S.push({k:'buf',t:'− 5% allowance',v:-o.buffer,c:'b-co'});
  S.push({k:'ach',t:'= Achievable target',v:o.ach,c:'b-plan',tot:1});
  S.push({k:'over',t:'− Change-over overrun',v:-o.overrun,c:'b-loss',h:fmt(Math.max(0,o.actCOH-o.stdCOH),1)+' h over std'});
  if(state.np==='loss')S.push({k:'np',t:'− No plan',v:-o.npLoss,c:'b-loss',h:fmt(o.npH,1)+' h'});
  S.push({k:'down',t:'− Downtime (all other reasons)',v:-o.down,c:'b-loss',h:fmt(o.downH,1)+' h'});
  S.push({k:'speed',t:o.speed>=0?'− Speed loss (slower than std)':'+ Ran faster than std',v:-o.speed,c:o.speed>=0?'b-loss':'b-gain'});
  S.push({k:'gross',t:'= Gross moulded',v:o.gross,c:'b-tot',tot:1});
  S.push({k:'rej',t:'− Rejection',v:-o.rej,c:'b-loss',h:fmt(o.rejPcs)+' pcs'});
  S.push({k:'good',t:'= Good production',v:o.good,c:'b-good',tot:1});
  return S;
}
function waterfall(o){
  const S=steps(o);const max=Math.max(o.full,o.gross+Math.max(0,-o.speed),1);let run=0;
  return '<div class="wf">'+S.map(s=>{let a,b;if(s.tot){a=0;b=s.v;run=s.v;}else{b=run;a=run+s.v;if(a>b)[a,b]=[b,a];run=run+s.v;}
    const L=Math.max(0,a)/max*100,W=Math.max(.3,(b-a)/max*100);
    return `<div class="r ${s.tot?'tot':''}" data-k="${s.k}" title="${esc(s.h||'')}"><span>${s.t}${s.h?`<div class="muted" style="font-size:.7rem;font-weight:500">${esc(s.h)}</div>`:''}</span><div class="track"><div class="bar ${s.c}" style="left:${L}%;width:${W}%"></div></div><span class="num">${s.v<0?'−':''}${fmt(Math.abs(s.v))} kg</span><span class="pc">${o.full>0?fmt(Math.abs(s.v)/o.full*100,1)+'%':''}</span></div>`;}).join('')+'</div>';
}
const IC={
 clip:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/>',
 sync:'<path d="M20 11a8 8 0 0 0-14-4L4 9M4 4v5h5M4 13a8 8 0 0 0 14 4l2-2M20 20v-5h-5"/>',
 dl:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>', print:'<path d="M7 9V4h10v5M7 17H5v-6h14v6h-2M7 14h10v6H7z"/>',
 target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/>',
 box:'<path d="M4 8l8-4 8 4v8l-8 4-8-4zM4 8l8 4 8-4M12 12v8"/>', gauge:'<path d="M4 16a8 8 0 1 1 16 0M12 16l4-5"/><circle cx="12" cy="16" r="1.2"/>',
 alert:'<path d="M12 4l9 16H3zM12 10v4M12 17v.5"/>', cpu:'<rect x="7" y="7" width="10" height="10" rx="1"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/>',
 clock:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>', repeat:'<path d="M17 3l3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"/>',
 trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"/>', down:'<path d="M4 6l6 6 4-4 6 6M20 10v4h-4"/>',
 hour:'<path d="M7 4h10M7 20h10M8 4c0 5 8 5 8 8s-8 3-8 8M16 4c0 5-8 5-8 8"/>', table:'<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 10h16M4 15h16M10 5v14"/>',
 layers:'<path d="M12 4l8 4-8 4-8-4zM4 12l8 4 8-4M4 16l8 4 8-4"/>', list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>', cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'
};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`;
const ph=(icon,title,sub,extra='')=>`<div class="ph"><h2>${ic(icon)}${title}</h2>${sub?`<span class="muted small">${sub}</span>`:''}<span class="sp"></span>${extra}</div>`;
function insights(){
  const ls=LINES.map(l=>({l,o:R.lines[l].all})).filter(x=>x.o.ach>0);
  const best=ls.slice().sort((a,b)=>b.o.eff-a.o.eff)[0],worst=ls.slice().sort((a,b)=>a.o.eff-b.o.eff)[0],hr=ls.slice().sort((a,b)=>b.o.rejPct-a.o.rejPct)[0];
  const f=R.fac;const dt=Object.entries(f.downBy).sort((a,b)=>b[1]-a[1])[0];
  const c=(bg,i,l,v,s)=>`<div class="chipc"><span class="ic" style="background:${bg}">${ic(i)}</span><div style="min-width:0"><div class="lbl">${l}</div><div class="v">${esc(v)} <span>${s}</span></div></div></div>`;
  return `<div class="ins">${[
    best?c('linear-gradient(135deg,#22c55e,#16a34a)','trophy','Best line',best.l,pct(best.o.eff)+' eff'):'',
    worst?c('linear-gradient(135deg,#f87171,#ef4444)','down','Needs attention',worst.l,pct(worst.o.eff)+' eff · '+biggestLossText(worst.o)):'',
    hr?c('linear-gradient(135deg,#fb923c,#ea580c)','alert','Highest rejection',hr.l,pct(hr.o.rejPct)+' · '+fmt(hr.o.rej)+' kg'):'',
    dt?c('linear-gradient(135deg,#a78bfa,#7c3aed)','hour','Top downtime',DT_NAMES[dt[0]]||dt[0],fmt(dt[1],1)+' h'):''
  ].join('')}</div>`;
}
function kpis(o){
  const effB=band(o.eff),rejB=rejBand(o.rejPct);
  const icons={'Good production':'box','Efficiency':'gauge','Rejection':'alert','Downtime':'clock','Machines running':'cpu','Changes':'repeat'};
  const k=(cls,lbl,v,s)=>`<div class="dcard kpi ${cls}"><div class="kh"><span class="lbl">${lbl}</span><span class="ic">${ic(icons[lbl])}</span></div><span class="v">${v}</span><span class="s">${s}</span></div>`;
  return '<div class="kpis">'+[
    k('good','Good production',fmt(o.good)+' <small>kg</small>',fmt(o.goodPcs)+' pcs · '+(o.gap>=0?'<span class="tg">+':'<span class="tr">−')+fmt(Math.abs(o.gap))+' kg</span> vs achievable'),
    k(effB==='g'?'good':effB==='a'?'warn':'bad','Efficiency',pct(o.eff),'Good ÷ '+(state.eff==='ach'?'achievable '+fmt(o.ach):'full capacity '+fmt(o.full))+' kg'),

  } else if(state.tab==='quality'){

      <div class="dcard kpi good"><div class="kh"><span class="lbl">QC verified hours</span><span class="ic">${ic('box')}</span></div><span class="v">${pct(f.nEnt?f.qv/f.nEnt:0,0)}</span><span class="s">${fmt(f.qv)} of ${fmt(f.nEnt)} hourly entries</span></div>
      <div class="dcard kpi warn"><div class="kh"><span class="lbl">QC holds</span><span class="ic">${ic('alert')}</span></div><span class="v">${f.hold}</span><span class="s">Active holds on hourly entries</span></div>
      <div class="dcard kpi vio"><div class="kh"><span class="lbl">Weight vs std</span><span class="ic">${ic('gauge')}</span></div><span class="v">${extra>=0?'+':'−'}${fmt(Math.abs(extra),1)} <small>kg</small></span><span class="s">Material used vs std weight (setup actual weight)</span></div></div>
    <div class="charts c3">${cb('cRr','alert','Rejection reasons (pcs)','From the reject breakup entered each hour')}${cb('cRej','alert','Line rejection · kg and %','Bars = kg Day / Night, line = %')}${cb('cRm','alert','Highest rejection % machines','At least 200 pcs moulded')}</div>
    ${cb('cRh','clock','Rejection % hour by hour','Factory, each hour of the day')}

      return `<div class="s1" data-m="${ms.m}" style="cursor:pointer"><b style="min-width:150px">${esc(MACH[ms.m].name)}</b><span class="pill ${ms.s?'z':'a'}">${ms.s?'Night':'Day'}</span>${rs.map((r,i)=>`${i?'<span class="muted">→</span>':''}<span class="mo">${esc(r.mould)} <span class="muted">${r.slots.length?HL(ms.s,r.slots[0])+':00–'+HL(ms.s,r.slots[r.slots.length-1]+1)+':00':''}</span></span>`).join('')}<span class="sp"></span><span class="muted">M ${ms.mc} · C ${ms.cc} · J ${ms.jc} · std ${fmt(ms.stdCOH,1)} h · actual ${fmt(ms.actCOH,1)} h</span></div>`;}).join('');

      <div class="body tw">${c.rows.length?`<table class="t"><thead><tr>${c.head.map((h,i)=>`<th class="${i<3?'l':''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>${c.rows.slice(0,200).map(r=>`<tr>${r.map((v,i)=>`<td class="${i<3?'l':''}" style="${i===2?'white-space:normal':''}">${String(v).startsWith('<b>')?v:esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<span class="muted small">Nothing to fix.</span>'}</div></details>`).join('')}</div>`;
  }
  return head+tabs+body;
}

    lab.push(HL(s,i)+':00');gk.push(Math.round(a.gk));rk.push(Math.round(a.rk));pl.push(Math.round(a.pl));dtm.push(a.dt);npm.push(a.np);com.push(a.co);rp.push(a.g+a.r?+(a.r/(a.g+a.r)*100).toFixed(2):0);sh.push(s);}});
  mk('cHr',{type:'bar',data:{labels:lab,datasets:[{label:'Good kg',data:gk,backgroundColor:sh.map(s=>s?CL.night:CL.day),borderRadius:3,stack:'a'},{label:'Rejected kg',data:rk,backgroundColor:CL.bad,borderRadius:3,stack:'a'},{type:'line',label:'Planned kg',data:pl,borderColor:CL.teal,backgroundColor:CL.teal,pointRadius:2,tension:.25}]},

  mk('cDh',{type:'bar',data:{labels:lab,datasets:[{label:'Downtime min',data:dtm,backgroundColor:CL.bad,stack:'a'},{label:'Mould change min',data:com,backgroundColor:CL.warn,stack:'a'},{label:'No plan min',data:npm,backgroundColor:'#cbd5e1',stack:'a'}]},
    options:{...base({plugins:{tooltip:{mode:'index',intersect:false,callbacks:{label:c=>c.dataset.label+': '+fmt(c.raw)+' min ('+fmt(c.raw/60,1)+' h)'}}}}),scales:{x:{stacked:true,grid:{display:false},ticks:{autoSkip:false,maxRotation:60,font:{size:9}}},y:{stacked:true,beginAtZero:true,grid}}}});
  mk('cRh',{type:'line',data:{labels:lab,datasets:[{label:'Rejection %',data:rp,borderColor:CL.bad,backgroundColor:'rgba(239,68,68,.12)',fill:true,tension:.3,pointRadius:2},{label:'5% limit',data:lab.map(()=>5),borderColor:CL.warn,borderDash:[5,4],pointRadius:0,borderWidth:1.5}]},

  // downtime Day vs Night by reason
  const dd=R.day,nn=R.night;const codes=[...new Set([...Object.keys(dd.downBy),...Object.keys(nn.downBy)])].sort((a,b)=>((dd.downBy[b]||0)+(nn.downBy[b]||0))-((dd.downBy[a]||0)+(nn.downBy[a]||0)));

    options:{...base({plugins:{datalabels:{display:c=>c.raw>0,anchor:'end',align:'end',color:css('--ink'),font:{size:9,weight:'bold'}}}}),scales:{x:{grid:{display:false}},y:{beginAtZero:true,grid,grace:'10%',ticks:{precision:0}}}}});
}

function openMachine(i){

    <div class="tw"><table class="t"><thead><tr><th class="l">Mould run</th><th>Hours</th><th>Std cycle × cav</th><th>Weight</th><th>Capacity kg</th><th>Good pcs</th><th>Rej pcs</th><th>Good kg</th><th>Speed vs std</th><th class="l">Downtime</th></tr></thead><tbody>${runs}</tbody></table></div>
    <div class="ph" style="border-top:1px solid var(--line)"><h2>${ic('clock')}Hour by hour</h2><span class="muted small">Entered by ${esc((ms.users||[]).join(', ')||'—')}</span></div>

/* ---------- formulas ---------- */
const FORM={
  full:o=>`<b>Full capacity</b> = Σ over each mould run of <code>std pcs/hr × piece weight × hours</code>, with hours that have no DPR entry valued at the machine's main mould. Std pcs/hr = <code>3600 ÷ std cycle × std cavities</code> (Mould Master). Factory: <b>${fmt(o.full)} kg</b>.`,
  np:o=>`<b>No plan</b> = code-13 minutes × that mould's kg/hr. ${fmt(o.npH,1)} h = <b>${fmt(o.noPlan)} kg</b>. ${state.np==='exclude'?'Taken out of the target, so it does not lower efficiency.':'Counted as a loss after the achievable target.'}`,
  miss:o=>`<b>DPR not filled</b> = hours of a shift with no entry at all × the machine's main-mould kg/hr. ${fmt(o.missH,0)} machine-hours = <b>${fmt(o.missing)} kg</b>. Always a loss, so missing entries are visible.`,
  planned:o=>`<b>Planned target</b> = Full capacity − DPR not filled${state.np==='exclude'?' − No plan':''} = <b>${fmt(o.planned)} kg</b>.`,
  stdco:o=>`<b>Std mould change</b> = mould changes × (load + unload minutes from Machine Master) × kg/hr. ${o.mc} changes, ${fmt(o.stdCOH,1)} h = <b>${fmt(o.stdCO)} kg</b>.`,
  buf:o=>`<b>5% allowance</b> = 5% × (Planned − Std mould change) = <b>${fmt(o.buffer)} kg</b>.`,
  ach:o=>`<b>Achievable target</b> = Planned − Std mould change${state.buf==='on'?' − 5%':''} = <b>${fmt(o.ach)} kg</b>. This is what the shift should have made.`,
  over:o=>`<b>Change-over overrun</b> = max(0, actual mould-change time (code 2) × kg/hr − Std mould change). Actual ${fmt(o.actCOH,1)} h vs std ${fmt(o.stdCOH,1)} h = <b>${fmt(o.overrun)} kg</b>.`,
  down:o=>`<b>Downtime</b> = every downtime minute except mould change (2) and no plan (13), × that mould's kg/hr. ${fmt(o.downH,1)} h = <b>${fmt(o.down)} kg</b>.`,
  speed:o=>`<b>Speed loss</b> = Achievable − overrun − downtime${state.np==='loss'?' − no plan':''} − Gross. It is what is left when the machine ran slower than its std cycle. Negative means it ran faster. <b>${fmt(o.speed)} kg</b>.`,
  gross:o=>`<b>Gross</b> = (good + reject pcs) × piece weight of the mould actually running that hour = <b>${fmt(o.gross)} kg</b> (${fmt(o.goodPcs+o.rejPcs)} pcs).`,
  rej:o=>`<b>Rejection</b> = reject pcs × piece weight = <b>${fmt(o.rej)} kg</b>; Rejection % = reject kg ÷ gross kg = <b>${pct(o.rejPct)}</b>.`,
  good:o=>`<b>Good</b> = good pcs × piece weight = <b>${fmt(o.good)} kg</b>. Efficiency = Good ÷ ${state.eff==='ach'?'Achievable':'Full capacity'} = <b>${pct(o.eff)}</b>.`
};
function showFormula(k){const fn=FORM[k];if(!fn)return;const o=R.fac;
  document.getElementById('drawerHost').innerHTML=`<div class="ov" id="ov"><div class="drawer" style="width:min(560px,100%)" role="dialog" aria-modal="true" aria-label="Formula"><div class="row"><h2>How this number is worked out</h2><span class="sp"></span><button class="x" id="closeD">Close</button></div><section class="dcard pad formula">${fn(o)}</section><section class="dcard pad">${waterfall(o)}</section></div></div>`;
  document.getElementById('closeD').focus();}
function how(){
  const o=R.fac;
  return `${ph('target','How every number is worked out',shiftLabel()+' · factory · live with your decisions')}
  <div class="calc">${Object.keys(FORM).filter(k=>k!=='buf'||state.buf==='on').map(k=>`<div class="dcard formula">${FORM[k](o)}</div>`).join('')}</div>
  <div class="note" style="margin-top:12px">${MS.reduce((a,x)=>a+x.unmatched,0)} hourly entries carry a plan that has no DPR setup for that shift (valued at the plan mould's std from Mould Master where found). ${RUNS.filter(r=>!(r.ct>0)).length} mould runs have no std cycle. ${isLive()?'This is a live day: the target counts only hours that have finished (Day '+DONE[0]+' of 12 h, Night '+DONE[1]+' of 12 h) plus any hour already entered.':'Every hour of both shifts is counted.'} See the Data checks tab for the full list.</div>`;
}

/* ---------- render & events ---------- */
function render(){
  if(!P){return;}
  recompute();
  const has=MS.length>0;
  document.getElementById('heroSub').textContent=dateLabel()+' · '+state.process+' · '+shiftLabel();
  document.getElementById('heroMeta').textContent=MACH.length+' machines · '+R.machines.length+' with DPR entries'+(LOADED_AT?' · generated '+LOADED_AT:'');
  const lb=document.getElementById('liveBar');lb.hidden=!isLive();lb.textContent=isLive()?'Live · Day '+DONE[0]+'/12 h · Night '+DONE[1]+'/12 h done':'';
  document.getElementById('view').innerHTML=has?designD2():'<section class="dcard empty">No DPR entries for '+esc(dateLabel())+' ('+esc(state.process)+').</section>';
  document.getElementById('how').innerHTML=has?how():'';
  document.getElementById('how').hidden=!has;
  if(has)drawD2();
  [['shiftSeg','shift'],['d-np','np'],['d-wt','wt'],['d-buf','buf'],['d-eff','eff'],['procSeg','process']].forEach(([id,k])=>document.querySelectorAll('#'+id+' button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===String(state[k])))));
}
[['shiftSeg','shift'],['d-np','np'],['d-wt','wt'],['d-buf','buf'],['d-eff','eff']].forEach(([id,k])=>document.getElementById(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state[k]=b.dataset.v;save();render();}));
document.addEventListener('click',e=>{
  if(e.target.id==='ov'||e.target.id==='closeD'){document.getElementById('drawerHost').innerHTML='';return;}
  if(e.target.closest('.drawer'))return;
  const dv=e.target.closest('[data-dv]');if(dv){state.dview=dv.dataset.dv;save();render();return;}
  const tb=e.target.closest('[data-tab]');if(tb){state.tab=tb.dataset.tab;save();render();return;}
  const mf=e.target.closest('[data-mf]');if(mf){state.mfilt=mf.dataset.mf;save();document.querySelectorAll('[data-mf]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mf===state.mfilt)));document.getElementById('mtbl').innerHTML=machinesTable2();return;}
  if(state.design==='D'){const l2=e.target.closest('[data-line]');if(l2){state.mline=l2.dataset.line;state.tab='machines';state.mfilt='all';save();render();window.scrollTo({top:document.querySelector('.tabs').offsetTop-8,behavior:'smooth'});return;}}
  const m=e.target.closest('[data-m]');if(m){openMachine(m.dataset.m);return;}
  const ln=e.target.closest('[data-line]');if(ln){openLine=ln.dataset.line;render();setTimeout(()=>{const t=document.querySelectorAll('.t')[1];if(t)t.scrollIntoView({behavior:'smooth',block:'start'});},30);return;}
  if(e.target.id==='clearLine'){openLine=null;render();return;}
  const k=e.target.closest('[data-k]');if(k){showFormula(k.dataset.k);}
});
document.addEventListener('change',e=>{if(e.target.id==='fLine'){state.mline=e.target.value;save();document.getElementById('mtbl').innerHTML=machinesTable2();}});
document.addEventListener('input',e=>{if(e.target.id==='fQ'){state.q=e.target.value;document.getElementById('mtbl').innerHTML=machinesTable2();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('drawerHost').innerHTML='';});
/* ---------- live data ---------- */
// Hour slots as the DPR stores them (the same 12 labels for Day and Night).
const DPR_SLOTS=['07-08','08-09','09-10','10-11','11-12','12-01','01-02','02-03','03-04','04-05','05-06','06-07'];
state.process=(()=>{try{return localStorage.getItem('jpsms_dpr_process')||'Moulding';}catch(e){return 'Moulding';}})();
let REP_DATE='',LOADED_AT='',MOULDS=null,LOAD_SEQ=0;
const dateLabel=()=>REP_DATE?new Date(REP_DATE+'T00:00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';
const isLive=()=>DONE[0]<12||DONE[1]<12;
// Hours of a shift that have finished by now. Day = 07:00-19:00 on the date, Night = 19:00 to 07:00 next day.
function hoursDone(date,s){const start=new Date(date+'T07:00:00');start.setHours(start.getHours()+12*s);return Math.max(0,Math.min(12,Math.floor((Date.now()-start.getTime())/3600000)));}
const normName=s=>String(s||'').trim().replace(/\s+/g,' ').toUpperCase();
function mouldIndex(list){const byNo={},byName={};(list||[]).forEach(m=>{if(!(+m.cycle_time>0)&&!(+m.std_wt_kg>0))return;const no=String(m.mould_number||'').trim();if(no&&!byNo[no])byNo[no]=m;const nm=normName(m.mould_name);if(nm&&!byName[nm])byName[nm]=m;});return {byNo,byName};}
function mouldStd(e){if(!MOULDS||!e)return null;const no=String(e.mould_no||'').trim();return (no&&MOULDS.byNo[no])||MOULDS.byName[normName(e.mould_name)]||null;}

// Turns the API responses into the run / hour tables the report works from.
function buildPack(D,day,night,mm,cc,td,tn){
  const mList=((mm&&mm.data)||[]).filter(m=>m.is_active!==false);
  const mIdx={};const machines=mList.map((m,i)=>{mIdx[m.machine]=i;return [m.machine,m.line||m.building||'General',(+m.mould_load_time||0)+(+m.mould_unload_time||0),m.tonnage||''];});
  const moulds=[],mouldIdx={};const mi=n=>{n=n||'?';if(!(n in mouldIdx)){mouldIdx[n]=moulds.length;moulds.push(n);}return mouldIdx[n];};
  const runs=[],ms=[],others={},rejCodes={},hours={},users={};
  [[day,0],[night,1]].forEach(([res,s])=>{
    const dd=(((res&&res.data)||{}).dates||{})[D]||{};const setups=dd.setups||[];
    for(const [m,slots] of Object.entries(dd.entries||{})){
      if(!(m in mIdx))continue;
      const su=setups.filter(x=>x.machine===m);const runMap={};
      const runFor=e=>{
        let st=e&&e.plan_id?su.find(x=>String(x.plan_id)===String(e.plan_id)):null;const matched=!!st;let mst=null;
        if(!st){mst=mouldStd(e);if(!mst)st=su[0]||null;}
        const key=st?('S'+st.id):mst?('M'+mst.id+'|'+((e&&e.plan_id)||'')):('N'+((e&&e.mould_name)||'?'));
        if(!runMap[key]){
          let r;
          if(st)r={m:mIdx[m],s,mould:mi(st.mould_name||(e&&e.mould_name)),plan:st.plan_id,
            stdWt:Math.round((+st.std_weight||0)*10000)/10,actWt:Math.round(((+st.article_act>=10?st.article_act/1000:+st.article_act)||0)*10000)/10,
            ct:+st.std_cycle_time||0,cav:+st.std_cavity||0,acav:+st.act_cavity||0,pcshr:+st.pcshr_act||0,actCt:+st.cycle_act||0,
            client:st.client_name||'',jc:st.job_card_no||'',order:st.order_no||'',src:matched?'setup':'first-setup'};
          else if(mst)r={m:mIdx[m],s,mould:mi(e.mould_name||mst.mould_name),plan:e.plan_id||'',
            stdWt:Math.round((+mst.std_wt_kg||0)*10000)/10,actWt:0,ct:+mst.cycle_time||0,cav:+mst.no_of_cav||0,acav:0,pcshr:0,actCt:0,
            client:e.client_name||'',jc:e.job_card_no||'',order:e.order_no||'',src:'master'};
          else r={m:mIdx[m],s,mould:mi(e&&e.mould_name),plan:(e&&e.plan_id)||'',stdWt:0,actWt:0,ct:0,cav:0,acav:0,pcshr:0,actCt:0,
            client:(e&&e.client_name)||'',jc:(e&&e.job_card_no)||'',order:(e&&e.order_no)||'',src:'none'};
          Object.assign(r,{h:0,g:0,r:0,dt:{},rej:{},unm:0,slots:[]});runMap[key]=r;
        }
        if(e&&e.plan_id&&!matched)runMap[key].unm++;
        return runMap[key];
      };
      let miss=0;const hr=[];const us={};
      DPR_SLOTS.forEach((sl,si)=>{
        let arr=slots[sl];arr=arr?(Array.isArray(arr)?arr:[arr]).filter(Boolean):[];
        if(!arr.length){if(si<DONE[s])miss++;hr.push(0);return;}
        const rs=arr.map(runFor);const uniq=[...new Set(rs)];uniq.forEach(r=>{r.h+=1/uniq.length;r.slots.push(si);});
        let g=0,rj=0,dt=0,np=0,co=0,qv=0,hold=0;
        arr.forEach((e,k)=>{const r=rs[k];const eg=+e.good_qty||0,er=+e.reject_qty||0;r.g+=eg;r.r+=er;g+=eg;rj+=er;
          if(e.qc_verified)qv++;if(e.qc_hold)hold++;if(e.user_name)us[e.user_name]=1;
          if(e.downtime_breakup&&typeof e.downtime_breakup==='object')for(const [c,v] of Object.entries(e.downtime_breakup)){const mins=+v||0;let key=c;
            if(!/^\d+$/.test(c)){const t=c.replace(/^OTHER_/,'').trim()||'Other';key='O';others[t]=(others[t]||0)+mins;}
            r.dt[key]=(r.dt[key]||0)+mins;if(key==='13')np+=mins;else if(key==='2')co+=mins;else dt+=mins;}
          if(e.reject_breakup&&typeof e.reject_breakup==='object')for(const [c,v] of Object.entries(e.reject_breakup)){r.rej[c]=(r.rej[c]||0)+(+v||0);rejCodes[c]=1;}
        });
        hr.push([g,rj,dt,np,co,qv,hold,arr.length]);
      });
      Object.values(runMap).forEach(r=>{r.h=Math.round(r.h*100)/100;runs.push([r.m,r.s,r.mould,r.plan,r.stdWt,r.actWt,r.ct,r.cav,r.acav,r.pcshr,r.actCt,r.client,r.jc,r.order,r.h,r.g,r.r,r.dt,r.rej,r.unm,r.slots.join('.'),r.src]);});
      const c=(((cc&&cc.machines)||{})[m]||{})[s?'Night':'Day']||{};
      ms.push([mIdx[m],s,miss,+c.mc||0,+c.cc||0,+c.jc||0]);
      hours[m+'|'+s]=hr;users[m+'|'+s]=Object.keys(us);
    }
  });
  const team={};[[td,0],[tn,1]].forEach(([res,s])=>(((res&&res.data)||{})[D]||[]).forEach(t=>{(team[t.line]=team[t.line]||[null,null])[s]=t.prod_supervisor||t.entry_person||'';}));
  return {pack:{date:D,machines,moulds,runs,ms,team,others:Object.entries(others).sort((a,b)=>b[1]-a[1]),rejCodes:Object.keys(rejCodes)},hours:{hours,users}};
}

async function loadReport(){
  const date=document.getElementById('repDate').value;
  if(!date){if(window.JPSMS&&JPSMS.toast)JPSMS.toast('Please select a date','error');return;}
  const seq=++LOAD_SEQ;const proc=state.process;
  if(window.JPSMS&&JPSMS.toggleLoader)JPSMS.toggleLoader(true);
  try{
    const g=u=>JPSMS.api.get(u);const pq='&process='+encodeURIComponent(proc);
    const [day,night,mm,cc,td,tn,mo]=await Promise.all([
      g(`/dpr/summary-matrix?fromDate=${date}&toDate=${date}&shift=Day${pq}`),
      g(`/dpr/summary-matrix?fromDate=${date}&toDate=${date}&shift=Night${pq}`),
      g(`/masters/machines?process=${encodeURIComponent(proc)}`),
      g(`/dpr/change-counts?date=${date}`).catch(()=>null),
      g(`/shift/team-range?fromDate=${date}&toDate=${date}&shift=Day`).catch(()=>null),
      g(`/shift/team-range?fromDate=${date}&toDate=${date}&shift=Night`).catch(()=>null),
      MOULDS?Promise.resolve(null):g('/masters/moulds').catch(()=>null)
    ]);
    if(seq!==LOAD_SEQ)return;   // a newer request has started
    if(mo)MOULDS=mouldIndex(mo.data||mo);
    REP_DATE=date;DONE=[hoursDone(date,0),hoursDone(date,1)];
    const b=buildPack(date,day,night,mm,cc,td,tn);
    P=b.pack;HRS=b.hours.hours;HUS=b.hours.users;
    buildIndex();
    LOADED_AT=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false});
    render();
  }catch(e){
    console.error('daily report detail:',e);
    if(window.JPSMS&&JPSMS.toast)JPSMS.toast('Error: '+(e&&e.message||e),'error');
    document.getElementById('view').innerHTML='<section class="dcard empty">Could not load the report. '+esc(e&&e.message||e)+'</section>';
  }finally{if(window.JPSMS&&JPSMS.toggleLoader)JPSMS.toggleLoader(false);}
}

function exportCSV(){
  if(!P||!MS.length){if(window.JPSMS&&JPSMS.toast)JPSMS.toast('Generate a report first','warning');return;}
  const q=v=>{const s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const n=(v,d=1)=>(v==null||!isFinite(v))?'':(+v).toFixed(d);
  const head=['Date','Line','Machine','Shift','Supervisor','Moulds','Full capacity kg','No plan kg','DPR missing kg','Planned kg','Std mould change kg','Achievable kg','Gross kg','Good kg','Reject kg','Good pcs','Reject pcs','Efficiency %','OEE %','Rejection %','Change-over overrun kg','Downtime kg','Speed loss kg','Downtime h','No plan h','Mould change h','DPR missing h','Mould/Colour/Job changes','QC verified entries','Hourly entries'];
  const rows=[head];
  MS.filter(x=>state.shift==='all'||x.s===+state.shift).slice().sort((a,b)=>machCmp(MACH[a.m],MACH[b.m])||a.s-b.s).forEach(x=>{const m=MACH[x.m];
    rows.push([REP_DATE,m.line,m.name,x.s?'Night':'Day',teamFor(m.line,x.s),[...new Set(x.runs.map(r=>r.mould))].join(' + '),n(x.full),n(x.noPlan),n(x.missing),n(x.planned),n(x.stdCO),n(x.ach),n(x.gross),n(x.good),n(x.rej),x.goodPcs,x.rejPcs,n(x.eff*100),n(x.oee*100),n(x.rejPct*100,2),n(x.overrun),n(x.down),n(x.speed),n(x.downH,2),n(x.npH,2),n(x.actCOH,2),x.missH,x.mc+'/'+x.cc+'/'+x.jc,x.qv,x.nEnt]);});
  const f=R.fac;rows.push([REP_DATE,'FACTORY','',shiftLabel(),'','',n(f.full),n(f.noPlan),n(f.missing),n(f.planned),n(f.stdCO),n(f.ach),n(f.gross),n(f.good),n(f.rej),f.goodPcs,f.rejPcs,n(f.eff*100),n(f.oee*100),n(f.rejPct*100,2),n(f.overrun),n(f.down),n(f.speed),n(f.downH,2),n(f.npH,2),n(f.actCOH,2),f.missH,f.mc+'/'+f.cc+'/'+f.jc,f.qv,f.nEnt]);
  const blob=new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Daily_Report_Detailed_${REP_DATE}_${state.process}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  if(window.JPSMS&&JPSMS.toast)JPSMS.toast('CSV exported','success');
}

function initPage(){
  try{if(window.JPSMS&&JPSMS.auth)JPSMS.auth.requireAuth();}catch(e){console.error('requireAuth:',e);}
  try{if(window.JPSMS&&JPSMS.renderShell)JPSMS.renderShell('dpr');}catch(e){console.error('renderShell:',e);}
  // Before 08:00 the useful report is still yesterday's (Night shift ends 07:00).
  const t=new Date();if(t.getHours()<8)t.setDate(t.getDate()-1);
  const pad=v=>String(v).padStart(2,'0');
  document.getElementById('repDate').value=`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
  document.getElementById('btnGen').addEventListener('click',loadReport);
  document.getElementById('repDate').addEventListener('change',loadReport);
  document.getElementById('btnCsv').addEventListener('click',exportCSV);
  document.getElementById('btnPrint').addEventListener('click',()=>window.print());
  document.getElementById('procSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.process=b.dataset.v;try{localStorage.setItem('jpsms_dpr_process',state.process);}catch(_){}
    document.querySelectorAll('#procSeg button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===state.process)));loadReport();});
  [['shiftSeg','shift'],['d-np','np'],['d-wt','wt'],['d-buf','buf'],['d-eff','eff'],['procSeg','process']].forEach(([id,k])=>document.querySelectorAll('#'+id+' button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===String(state[k])))));
  loadReport();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initPage);else initPage();
