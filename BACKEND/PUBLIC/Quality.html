<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMS OCEAN - Quality</title>
    <link rel="stylesheet" href="/assets/app.css?v=12">
    <link rel="stylesheet" href="/assets/bootstrap-icons.min.css">
    <script src="/assets/vendor/jsdelivr/chart.js"></script>
    <style>
        :root {
            --q-ok: #16a34a;      --q-ok-bg: #dcfce7;
            --q-bad: #dc2626;     --q-bad-bg: #fee2e2;
            --q-due: #d97706;     --q-due-bg: #fef3c7;
            --q-miss: #b91c1c;    --q-miss-bg: #fff1f2;
            --q-future-bg: #f8fafc;
            --q-line: #e2e8f0;
        }
        .hidden { display: none !important; }
        .q-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .q-title { font-size: 1.45rem; font-weight: 700; color: var(--primary-dark); }
        .q-sub { font-size: .85rem; color: var(--text-muted); margin-top: 2px; }

        .q-filters { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; padding: 14px 16px; margin-bottom: 14px; }
        .q-filters label { display: flex; flex-direction: column; gap: 4px; font-size: .75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .4px; }
        .q-filters .form-input { width: auto; min-width: 130px; }

        .q-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
        .q-tab { background: none; border: 0; padding: 10px 14px; font-weight: 600; font-size: .9rem; color: var(--text-muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; display: flex; align-items: center; gap: 6px; }
        .q-tab:hover { color: var(--primary); }
        .q-tab.active { color: var(--primary); border-bottom-color: var(--accent-cyan); }
        .q-badge { background: var(--q-bad); color: #fff; border-radius: 999px; font-size: .7rem; padding: 1px 7px; font-weight: 700; }

        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 18px; }
        .kpi { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; border-top: 4px solid var(--accent-cyan); }
        .kpi .l { font-size: .72rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: .4px; }
        .kpi .v { font-size: 1.9rem; font-weight: 800; margin: 6px 0 2px; color: var(--primary-dark); }
        .kpi .s { font-size: .8rem; color: var(--text-muted); }
        .kpi.ok { border-top-color: var(--q-ok); } .kpi.ok .v { color: var(--q-ok); }
        .kpi.bad { border-top-color: var(--q-bad); } .kpi.bad .v { color: var(--q-bad); }
        .kpi.due { border-top-color: var(--q-due); } .kpi.due .v { color: var(--q-due); }

        .q-grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; margin-bottom: 16px; }
        .q-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
        .q-card h3 { margin: 0 0 12px; font-size: 1rem; color: var(--primary-dark); }
        .q-chart { position: relative; height: 280px; }
        .q-empty { text-align: center; padding: 28px; color: var(--text-muted); font-size: .9rem; }

        .q-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
        .q-table th { background: #f1f5f9; color: #475569; font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .3px; padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--q-line); position: sticky; top: 0; z-index: 1; }
        .q-table td { padding: 8px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
        .q-table tr.line-row td { background: #e0f2fe; color: #075985; font-weight: 800; font-size: .8rem; padding: 6px 10px; }
        .q-scroll { overflow: auto; max-height: calc(100vh - 290px); border: 1px solid var(--border); border-radius: 12px; background: var(--bg-card); }

        .mc { font-weight: 700; color: var(--primary-dark); white-space: nowrap; }
        .mc-sub { font-size: .75rem; color: var(--text-muted); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cell { text-align: center; min-width: 74px; }
        .pill { display: inline-flex; align-items: center; justify-content: center; gap: 3px; min-width: 56px; padding: 4px 8px; border-radius: 8px; font-size: .75rem; font-weight: 700; cursor: default; }
        .pill.ok { background: var(--q-ok-bg); color: var(--q-ok); }
        .pill.bad { background: var(--q-bad-bg); color: var(--q-bad); cursor: pointer; }
        .pill.due { background: var(--q-due-bg); color: var(--q-due); }
        .pill.miss { background: var(--q-miss-bg); color: var(--q-miss); border: 1px dashed #fca5a5; }
        .pill.future { background: var(--q-future-bg); color: #94a3b8; }
        .pill.done-ok { cursor: pointer; }
        .tag { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: .7rem; font-weight: 700; }
        .tag.ok { background: var(--q-ok-bg); color: var(--q-ok); }
        .tag.bad { background: var(--q-bad-bg); color: var(--q-bad); }
        .tag.due { background: var(--q-due-bg); color: var(--q-due); }
        .tag.grey { background: #f1f5f9; color: #64748b; }

        .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .78rem; color: var(--text-muted); margin-bottom: 10px; align-items: center; }
        .legend .pill { min-width: 0; }

        .qc-st { font-weight: 700; }
        .qc-st.ok { color: var(--q-ok); } .qc-st.bad { color: var(--q-bad); } .qc-st.na { color: #94a3b8; }
        .qc-prob { font-size: .75rem; color: #7f1d1d; }

        .switch { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; font-weight: 600; color: var(--text-muted); cursor: pointer; }

        .q-modal { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 16px; }
        .q-modal-box { background: #fff; border-radius: 14px; width: min(560px, 100%); max-height: 85vh; overflow: auto; padding: 18px; }
        .q-modal-box h3 { margin: 0 0 10px; }
        .kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 10px; font-size: .88rem; }
        .kv b { color: var(--text-muted); font-weight: 600; }

        @media (max-width: 700px) {
            .q-grid2 { grid-template-columns: 1fr; }
            .q-filters .form-input { min-width: 0; width: 100%; }
            .q-filters label { flex: 1 1 45%; }
        }
    </style>
</head>

<body>
    <div class="main-content">
        <div class="q-head">
            <div>
                <div class="q-title" id="page-title">Quality Dashboard</div>
                <div class="q-sub" id="page-sub">Live from the QC app — slot checks, FPA, memos and holds</div>
            </div>
            <button class="btn btn-outline small" onclick="loadView(true)"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
        </div>

        <!-- Filters -->
        <div class="card q-filters">
            <label>Date <input type="date" id="filter-date" class="form-input"></label>
            <label>Shift
                <select id="filter-shift" class="form-input">
                    <option>Day</option>
                    <option>Night</option>
                </select>
            </label>
            <label>Line
                <select id="filter-line" class="form-input"><option value="">All Lines</option></select>
            </label>
            <label>Machine
                <select id="filter-machine" class="form-input" style="min-width:200px">
                    <option value="All Machines">All Machines</option>
                </select>
            </label>
            <button class="btn btn-primary" onclick="applyFilters()">Apply</button>
        </div>

        <!-- Tabs -->
        <div class="q-tabs" role="tablist">
            <button class="q-tab" data-view="dashboard" onclick="switchView('dashboard')"><i class="bi bi-grid-1x2"></i> Dashboard</button>
            <button class="q-tab" data-view="compliance" onclick="switchView('compliance')"><i class="bi bi-table"></i> Compliance (2-hourly)</button>
            <button class="q-tab" data-view="onlineqc" onclick="switchView('onlineqc')"><i class="bi bi-ui-checks-grid"></i> Online QC Report</button>
            <button class="q-tab" data-view="holds" onclick="switchView('holds')"><i class="bi bi-sign-stop"></i> Hold <span id="hold-badge" class="q-badge hidden">0</span></button>
            <button class="q-tab" data-view="hourly" onclick="switchView('hourly')"><i class="bi bi-clock-history"></i> Hourly</button>
        </div>

        <!-- DASHBOARD -->
        <div id="view-dashboard" class="hidden">
            <div class="kpi-grid" id="kpis"></div>
            <div class="q-grid2">
                <div class="q-card"><h3>Not OK checks by machine</h3><div class="q-chart"><canvas id="ch-machine"></canvas></div></div>
                <div class="q-card"><h3>Defect analysis (Pareto)</h3><div class="q-chart"><canvas id="ch-defect"></canvas></div></div>
            </div>
            <div class="q-grid2">
                <div class="q-card"><h3>Checks per 2-hour slot</h3><div class="q-chart"><canvas id="ch-slot"></canvas></div></div>
                <div class="q-card"><h3>Not OK checks by mould</h3><div class="q-chart"><canvas id="ch-mould"></canvas></div></div>
            </div>
            <div class="q-card">
                <h3>Latest Not OK findings</h3>
                <div id="dash-notok"></div>
            </div>
        </div>

        <!-- COMPLIANCE -->
        <div id="view-compliance" class="hidden">
            <div class="legend">
                <span class="pill ok"><i class="bi bi-check-lg"></i> OK</span>
                <span class="pill bad"><i class="bi bi-x-lg"></i> Not OK</span>
                <span class="pill due">Due now</span>
                <span class="pill miss">Missed</span>
                <span class="pill future">Upcoming</span>
                <span style="margin-left:auto" id="comp-summary"></span>
            </div>
            <div id="compliance-container"></div>
        </div>

        <!-- ONLINE QC REPORT -->
        <div id="view-onlineqc" class="hidden">
            <div class="legend">
                <label class="switch"><input type="checkbox" id="only-notok" onchange="renderOnlineQC()"> Only Not OK</label>
                <span style="margin-left:auto" id="oqc-summary"></span>
            </div>
            <div id="onlineqc-container"></div>
        </div>

        <!-- HOLDS -->
        <div id="view-holds" class="hidden">
            <div id="holds-container"></div>
        </div>

        <!-- HOURLY (legacy hourly QC reports) -->
        <div id="view-hourly" class="hidden">
            <div id="hourly-container"></div>
        </div>
    </div>

    <div id="q-modal" class="q-modal hidden" onclick="if(event.target===this)closeModal()">
        <div class="q-modal-box" id="q-modal-box"></div>
    </div>

    <script src="/assets/app.min.js?v=1576"></script>
    <script>
        /* ================= State ================= */
        const VIEWS = {
            dashboard: ['Quality Dashboard', 'Live from the QC app — slot checks, FPA, memos and holds'],
            compliance: ['QC Compliance Summary', '2-hourly QC app checks per machine, grouped by line'],
            onlineqc: ['Online QC Report', 'Visual · Colour · Function/Fitment checks from the QC app, slot by slot'],
            holds: ['QC Hold', 'Jobs put on hold by QC — active first'],
            hourly: ['Quality Hourly', 'Hourly QC reports (web entry)']
        };
        let currentView = 'dashboard';
        let OV = null;           // last /qc/overview payload
        let OV_KEY = '';
        const charts = {};

        const $ = id => document.getElementById(id);
        const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        /* ============ Date / shift (same rule as supervisor.html) ============ */
        function istParts(d = new Date()) {
            const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(d);
            const g = t => p.find(x => x.type === t).value;
            return { date: `${g('year')}-${g('month')}-${g('day')}`, mins: (+g('hour') % 24) * 60 + (+g('minute')) };
        }
        function addDays(iso, n) {
            const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n);
            return d.toISOString().slice(0, 10);
        }
        // Shift changes at 08:10 / 20:10; before 08:10 is still yesterday's Night shift.
        function autoDateShift() {
            const { date, mins } = istParts();
            if (mins >= 490 && mins < 1210) return { date, shift: 'Day' };
            if (mins < 490) return { date: addDays(date, -1), shift: 'Night' };
            return { date, shift: 'Night' };
        }
        // Start (ms) of a 2-hour slot index for date/shift, IST.
        function slotStartMs(date, shift, idx) {
            const base = Date.parse(`${date}T${shift === 'Night' ? '20' : '08'}:00:00+05:30`);
            return base + idx * 2 * 3600 * 1000;
        }
        function slotLabel(slot, shift) {
            const i = (OV ? OV.slotLabels : []).indexOf(slot);
            const [a, b] = slot.split('-');
            const day = shift !== 'Night';
            const startAm = (i <= 1) === day;
            const s = startAm ? 'AM' : 'PM';
            const e = i === 1 ? (s === 'AM' ? 'PM' : 'AM') : s;
            return `${a} ${s}–${b} ${e}`;
        }
        function fmtDate(ts) {
            if (!ts) return '—';
            try { return new Date(ts).toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short' }); }
            catch (_) { return String(ts).slice(0, 10); }
        }
        function fmtTime(ts) {
            if (!ts) return '';
            try { return new Date(ts).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false }); }
            catch (_) { return String(ts); }
        }

        /* ================= Boot ================= */
        document.addEventListener('DOMContentLoaded', () => {
            JPSMS.auth.requireAuth();
            JPSMS.renderShell('quality');
            const params = new URLSearchParams(location.search);
            const a = autoDateShift();
            $('filter-date').value = params.get('date') || a.date;
            $('filter-shift').value = params.get('shift') || a.shift;
            $('filter-line').onchange = fillMachineSelect;
            switchView(VIEWS[params.get('view')] ? params.get('view') : 'dashboard');
        });

        function applyFilters() { loadView(true); }

        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.q-tab').forEach(b => b.classList.toggle('active', b.dataset.view === view));
            Object.keys(VIEWS).forEach(v => $('view-' + v).classList.toggle('hidden', v !== view));
            $('page-title').textContent = VIEWS[view][0];
            $('page-sub').textContent = VIEWS[view][1];
            const u = new URL(location.href); u.searchParams.set('view', view); history.replaceState(null, '', u);
            loadView(false);
        }

        async function loadView(force) {
            if (currentView === 'hourly') return loadHourlyTable();
            const date = $('filter-date').value, shift = $('filter-shift').value;
            const key = date + '|' + shift;
            const box = $({ dashboard: 'dash-notok', compliance: 'compliance-container', onlineqc: 'onlineqc-container', holds: 'holds-container' }[currentView]);
            if (force || !OV || OV_KEY !== key) {
                if (box) box.innerHTML = '<div class="q-empty">Loading…</div>';
                try {
                    const res = await JPSMS.api.get(`/qc/overview?date=${encodeURIComponent(date)}&shift=${encodeURIComponent(shift)}`);
                    if (!res.ok) throw new Error(res.error || 'Could not load QC data');
                    OV = res.data; OV_KEY = key;
                    fillFilters();
                } catch (e) {
                    if (box) box.innerHTML = `<div class="q-empty" style="color:var(--q-bad)">${esc(e.message)}</div>`;
                    return;
                }
            }
            const active = OV.holds.filter(h => h.status === 'ACTIVE').length;
            $('hold-badge').textContent = active;
            $('hold-badge').classList.toggle('hidden', !active);
            ({ dashboard: renderDashboard, compliance: renderCompliance, onlineqc: renderOnlineQC, holds: renderHolds })[currentView]();
        }

        /* ================= Filters ================= */
        function fillFilters() {
            const lineSel = $('filter-line'), keep = lineSel.value;
            const lines = [...new Set(OV.machines.map(m => m.line))];
            lineSel.innerHTML = '<option value="">All Lines</option>' + lines.map(l => `<option>${esc(l)}</option>`).join('');
            if (lines.includes(keep)) lineSel.value = keep;
            fillMachineSelect();
        }
        function fillMachineSelect() {
            const sel = $('filter-machine'), keep = sel.value, line = $('filter-line').value;
            const list = OV.machines.filter(m => !line || m.line === line);
            sel.innerHTML = '<option value="All Machines">All Machines</option>' + list.map(m => `<option>${esc(m.machine)}</option>`).join('');
            if (list.some(m => m.machine === keep)) sel.value = keep;
            if (OV && currentView !== 'hourly') loadView(false);
        }
        function visibleMachines() {
            const line = $('filter-line').value, mc = $('filter-machine').value;
            return OV.machines.filter(m => (!line || m.line === line) && (mc === 'All Machines' || m.machine === mc));
        }
        function inScope(machine) { return visibleMachines().some(m => m.machine === machine); }

        /* ================= Slot status ================= */
        const isBad = v => /not\s*ok/i.test(String(v || ''));
        const isOk = v => /^ok$/i.test(String(v || '').trim());
        function entryResult(r) {
            const st = [r.visual_status, r.colour_status, r.ff_status].filter(Boolean);
            if (!st.length) return 'ok';
            return st.some(isBad) ? 'bad' : 'ok';
        }
        function entryProblems(r) {
            const out = [];
            if (isBad(r.visual_status)) out.push('Visual: ' + (r.visual_problem || 'Not OK'));
            if (isBad(r.colour_status)) out.push('Colour: ' + (r.colour_problem || 'Not OK'));
            if (isBad(r.ff_status)) out.push('F/F: ' + (r.ff_problem || 'Not OK'));
            return out;
        }
        function slotState(machine, slot, idx) {
            const shift = OV.shift || $('filter-shift').value;
            const entries = OV.slots.filter(r => r.machine === machine && r.slot === slot && (!OV.shift || r.shift === OV.shift));
            if (entries.length) return { kind: entries.some(e => entryResult(e) === 'bad') ? 'bad' : 'ok', entries };
            const now = Date.now(), start = slotStartMs(OV.date, shift, idx), end = start + 2 * 3600 * 1000;
            if (now >= end) return { kind: 'miss', entries };
            if (now >= start) return { kind: 'due', entries };
            return { kind: 'future', entries };
        }

        /* ================= Dashboard ================= */
        function renderDashboard() {
            const ms = visibleMachines(), names = new Set(ms.map(m => m.machine));
            const slots = OV.slots.filter(r => names.has(r.machine));
            let due = 0, done = 0, missed = 0;
            ms.filter(m => m.plan || OV.slots.some(r => r.machine === m.machine)).forEach(m => OV.slotLabels.forEach((s, i) => {
                const st = slotState(m.machine, s, i);
                if (st.kind === 'ok' || st.kind === 'bad') { due++; done++; }
                else if (st.kind === 'miss') { due++; missed++; }
            }));
            const notOk = slots.filter(r => entryResult(r) === 'bad');
            const checks = slots.reduce((n, r) => n + [r.visual_status, r.colour_status, r.ff_status].filter(Boolean).length, 0);
            const fpa = OV.fpa.filter(f => names.has(f.machine));
            const fpaOk = fpa.filter(f => f.fpa_approval_status === 'Approved').length;
            const fpaPend = fpa.filter(f => f.fpa_approval_status === 'Pending').length;
            const memosOpen = OV.memos.filter(m => names.has(m.machine) && m.status !== 'SOLVED').length;
            const holds = OV.holds.filter(h => names.has(h.machine) && h.status === 'ACTIVE').length;
            const running = ms.filter(m => m.plan).length;
            const pct = due ? Math.round(done * 100 / due) : 0;

            const k = (cls, l, v, s) => `<div class="kpi ${cls}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
            $('kpis').innerHTML =
                k('', 'Running machines', running, `${ms.length} machines in view`) +
                k(pct >= 90 ? 'ok' : pct >= 60 ? 'due' : 'bad', 'Slot compliance', due ? pct + '%' : '—', `${done} of ${due} due slots filled`) +
                k(missed ? 'bad' : 'ok', 'Missed slots', missed, 'Slot ended with no QC entry') +
                k('', 'QC entries', slots.length, `${checks} checks (Visual / Colour / F&F)`) +
                k(notOk.length ? 'bad' : 'ok', 'Not OK entries', notOk.length, slots.length ? Math.round(notOk.length * 100 / slots.length) + '% of entries' : 'No entries yet') +
                k(fpaPend ? 'due' : 'ok', 'FPA', fpa.length, `${fpaOk} approved · ${fpaPend} pending`) +
                k(memosOpen ? 'bad' : 'ok', 'Open memos', memosOpen, 'Raised to Moulding, not solved') +
                k(holds ? 'bad' : 'ok', 'Active holds', holds, holds ? 'See the Hold tab' : 'No active holds');

            // Not OK by machine
            const byMc = {}; notOk.forEach(r => byMc[r.machine] = (byMc[r.machine] || 0) + 1);
            const mcTop = Object.entries(byMc).sort((a, b) => b[1] - a[1]).slice(0, 10);
            barChart('ch-machine', mcTop.map(x => x[0]), mcTop.map(x => x[1]), 'Not OK entries', '#dc2626', true);

            // Defect pareto
            const def = {};
            slots.forEach(r => [['visual', r.visual_status, r.visual_problem], ['colour', r.colour_status, r.colour_problem], ['ff', r.ff_status, r.ff_problem]]
                .forEach(([t, st, p]) => { if (isBad(st)) { const key = (p || (t === 'ff' ? 'Function/Fitment' : t === 'colour' ? 'Colour' : 'Visual') + ' (no reason)').trim(); def[key] = (def[key] || 0) + 1; } }));
            const defTop = Object.entries(def).sort((a, b) => b[1] - a[1]).slice(0, 10);
            barChart('ch-defect', defTop.map(x => x[0]), defTop.map(x => x[1]), 'Occurrences', '#f59e0b', true);

            // Per slot stacked
            const okBy = OV.slotLabels.map(s => slots.filter(r => r.slot === s && entryResult(r) === 'ok').length);
            const badBy = OV.slotLabels.map(s => slots.filter(r => r.slot === s && entryResult(r) === 'bad').length);
            stackChart('ch-slot', OV.slotLabels.map(s => slotLabel(s, OV.shift || $('filter-shift').value)), okBy, badBy);

            // By mould
            const byMould = {}; notOk.forEach(r => { const k2 = r.mould_name || r.item_name || '—'; byMould[k2] = (byMould[k2] || 0) + 1; });
            const mdTop = Object.entries(byMould).sort((a, b) => b[1] - a[1]).slice(0, 10);
            barChart('ch-mould', mdTop.map(x => x[0]), mdTop.map(x => x[1]), 'Not OK entries', '#7c3aed', true);

            // Latest Not OK
            const latest = notOk.slice().sort((a, b) => String(b.entered_at).localeCompare(String(a.entered_at))).slice(0, 15);
            $('dash-notok').innerHTML = latest.length ? `<div style="overflow:auto"><table class="q-table">
                <thead><tr><th>Time</th><th>Machine</th><th>Slot</th><th>Product / Mould</th><th>Colour</th><th>Finding</th><th>By</th></tr></thead>
                <tbody>${latest.map(r => `<tr>
                    <td style="white-space:nowrap">${esc(fmtTime(r.entered_at))}</td>
                    <td class="mc">${esc(r.machine)}</td>
                    <td style="white-space:nowrap">${esc(slotLabel(r.slot, r.shift))}</td>
                    <td><div>${esc(r.item_name || '—')}</div><div class="mc-sub">${esc(r.mould_name || '')}</div></td>
                    <td>${esc(r.colour || '—')}</td>
                    <td class="qc-prob">${entryProblems(r).map(esc).join('<br>')}</td>
                    <td>${esc(r.entered_by || '')}</td></tr>`).join('')}</tbody></table></div>`
                : '<div class="q-empty">No Not OK findings for this date/shift. 👍</div>';
        }

        function destroyChart(id) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } }
        function noData(id) {
            destroyChart(id);
            const c = $(id), ctx = c.getContext('2d');
            ctx.clearRect(0, 0, c.width, c.height);
            ctx.fillStyle = '#94a3b8'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('No data for this date/shift', c.width / 2, c.height / 2);
        }
        function barChart(id, labels, data, label, color, horizontal) {
            if (!labels.length) return noData(id);
            destroyChart(id);
            charts[id] = new Chart($(id), {
                type: 'bar',
                data: { labels, datasets: [{ label, data, backgroundColor: color, borderRadius: 4, maxBarThickness: 26 }] },
                options: {
                    indexAxis: horizontal ? 'y' : 'x', responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { beginAtZero: true, ticks: { precision: 0 } }, y: { ticks: { autoSkip: false, callback(v) { const t = this.getLabelForValue(v); return t.length > 28 ? t.slice(0, 27) + '…' : t; } } } }
                }
            });
        }
        function stackChart(id, labels, ok, bad) {
            if (!ok.some(Boolean) && !bad.some(Boolean)) return noData(id);
            destroyChart(id);
            charts[id] = new Chart($(id), {
                type: 'bar',
                data: { labels, datasets: [
                    { label: 'OK', data: ok, backgroundColor: '#16a34a', borderRadius: 4 },
                    { label: 'Not OK', data: bad, backgroundColor: '#dc2626', borderRadius: 4 }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } } } }
            });
        }

        /* ================= Compliance (2-hourly, DPR Compliance style) ================= */
        function renderCompliance() {
            const shift = OV.shift || $('filter-shift').value;
            const ms = visibleMachines();
            if (!ms.length) { $('compliance-container').innerHTML = '<div class="q-empty">No running machines or QC entries for this date/shift.</div>'; $('comp-summary').textContent = ''; return; }
            let due = 0, done = 0, bad = 0, missed = 0;
            let html = `<div class="q-scroll"><table class="q-table"><thead><tr>
                <th style="min-width:200px">Machine</th>
                ${OV.slotLabels.map(s => `<th class="cell">${esc(slotLabel(s, shift))}</th>`).join('')}
                <th class="cell">Done</th><th class="cell">FPA</th><th class="cell">Memo</th><th class="cell">Hold</th></tr></thead><tbody>`;
            let lastLine = null;
            ms.forEach(m => {
                if (m.line !== lastLine) {
                    lastLine = m.line;
                    const inLine = ms.filter(x => x.line === m.line);
                    html += `<tr class="line-row"><td colspan="${OV.slotLabels.length + 5}">${esc(m.line)} <span style="font-weight:600;opacity:.8">· ${inLine.length} machine${inLine.length === 1 ? '' : 's'}</span></td></tr>`;
                }
                let mDue = 0, mDone = 0;
                const cells = OV.slotLabels.map((s, i) => {
                    const st = slotState(m.machine, s, i);
                    if (st.kind === 'ok' || st.kind === 'bad') { due++; done++; mDue++; mDone++; if (st.kind === 'bad') bad++; }
                    else if (st.kind === 'miss') { due++; mDue++; missed++; }
                    const arg = `'${esc(m.machine).replace(/'/g, "\\'")}','${s}'`;
                    if (st.kind === 'ok') return `<td class="cell"><span class="pill ok done-ok" onclick="showSlot(${arg})" title="${esc(st.entries[0].entered_by || '')}"><i class="bi bi-check-lg"></i></span></td>`;
                    if (st.kind === 'bad') return `<td class="cell"><span class="pill bad" onclick="showSlot(${arg})" title="${esc(entryProblems(st.entries[0]).join(' · '))}"><i class="bi bi-x-lg"></i> Not OK</span></td>`;
                    if (st.kind === 'miss') return `<td class="cell"><span class="pill miss">Missed</span></td>`;
                    if (st.kind === 'due') return `<td class="cell"><span class="pill due">Due</span></td>`;
                    return `<td class="cell"><span class="pill future">—</span></td>`;
                }).join('');
                const fpa = OV.fpa.filter(f => f.machine === m.machine);
                const fpaCell = !fpa.length ? '<span class="tag grey">—</span>'
                    : fpa.some(f => f.fpa_approval_status === 'Rejected') ? '<span class="tag bad">Rejected</span>'
                    : fpa.some(f => f.fpa_approval_status === 'Pending') ? '<span class="tag due">Pending</span>'
                    : '<span class="tag ok">Approved</span>';
                const memos = OV.memos.filter(x => x.machine === m.machine);
                const openM = memos.filter(x => x.status !== 'SOLVED').length;
                const memoCell = !memos.length ? '<span class="tag grey">—</span>' : openM ? `<span class="tag bad">${openM} open</span>` : `<span class="tag ok">${memos.length} solved</span>`;
                const hold = OV.holds.find(h => h.machine === m.machine && h.status === 'ACTIVE');
                const holdCell = hold ? `<span class="tag bad" style="cursor:pointer" onclick="switchView('holds')">ON HOLD</span>` : '<span class="tag grey">—</span>';
                const pctTxt = mDue ? `${mDone}/${mDue}` : '—';
                html += `<tr><td><div class="mc">${esc(m.machine)}</div><div class="mc-sub">${esc(m.plan ? (m.plan.item_name || m.plan.mould_name || '') : 'No running plan')}</div></td>
                    ${cells}<td class="cell" style="font-weight:700;color:${mDue && mDone < mDue ? 'var(--q-bad)' : 'var(--q-ok)'}">${pctTxt}</td>
                    <td class="cell">${fpaCell}</td><td class="cell">${memoCell}</td><td class="cell">${holdCell}</td></tr>`;
            });
            html += '</tbody></table></div>';
            $('compliance-container').innerHTML = html;
            $('comp-summary').innerHTML = due
                ? `<b style="color:${done === due ? 'var(--q-ok)' : 'var(--q-bad)'}">${Math.round(done * 100 / due)}%</b> filled · ${done}/${due} due slots · <span style="color:var(--q-bad)">${missed} missed · ${bad} Not OK</span>`
                : 'No slots due yet';
        }

        function showSlot(machine, slot) {
            const rows = OV.slots.filter(r => r.machine === machine && r.slot === slot && (!OV.shift || r.shift === OV.shift));
            const st = (s, p, rm) => !s ? '<span class="qc-st na">Not checked</span>'
                : isBad(s) ? `<span class="qc-st bad">Not OK</span>${p ? ' — ' + esc(p) : ''}${rm ? `<div class="qc-prob">${esc(rm)}</div>` : ''}`
                : '<span class="qc-st ok">OK</span>';
            openModal(`<h3>${esc(machine)} · ${esc(slotLabel(slot, OV.shift || $('filter-shift').value))}</h3>` + rows.map(r => `
                <div class="kv" style="margin-bottom:12px">
                    <b>Product</b><span>${esc(r.item_name || '—')}</span>
                    <b>Mould</b><span>${esc(r.mould_name || '—')}</span>
                    <b>Job card</b><span>${esc(r.job_card_no || '—')}</span>
                    <b>Colour</b><span>${esc(r.colour || '—')}</span>
                    <b>Visual</b><span>${st(r.visual_status, r.visual_problem, r.visual_remarks)}</span>
                    <b>Colour check</b><span>${st(r.colour_status, r.colour_problem, r.colour_remarks)}</span>
                    <b>Function/Fit</b><span>${st(r.ff_status, r.ff_problem, '')}${r.ff_photo_url ? ` · <a href="${esc(r.ff_photo_url)}" target="_blank" rel="noopener">photo</a>` : ''}</span>
                    <b>Entered by</b><span>${esc(r.entered_by || '—')} · ${esc(fmtTime(r.entered_at))}</span>
                </div>`).join('') + '<div style="text-align:right"><button class="btn btn-outline small" onclick="closeModal()">Close</button></div>');
        }

        /* ================= Online QC report ================= */
        function renderOnlineQC() {
            const shift = OV.shift || $('filter-shift').value;
            const onlyBad = $('only-notok').checked;
            const names = new Set(visibleMachines().map(m => m.machine));
            const order = OV.machines.map(m => m.machine);
            let rows = OV.slots.filter(r => names.has(r.machine));
            if (onlyBad) rows = rows.filter(r => entryResult(r) === 'bad');
            rows.sort((a, b) => order.indexOf(a.machine) - order.indexOf(b.machine) || OV.slotLabels.indexOf(a.slot) - OV.slotLabels.indexOf(b.slot));
            const total = OV.slots.filter(r => names.has(r.machine));
            $('oqc-summary').innerHTML = `${total.length} entries · <span style="color:var(--q-bad)">${total.filter(r => entryResult(r) === 'bad').length} Not OK</span> · ${new Set(total.map(r => r.machine)).size} machines`;
            if (!rows.length) { $('onlineqc-container').innerHTML = `<div class="q-empty">${onlyBad ? 'No Not OK entries.' : 'No QC app entries for this date/shift yet.'}</div>`; return; }
            const st = (s, p, rm) => !s ? '<span class="qc-st na">—</span>'
                : isBad(s) ? `<span class="qc-st bad">Not OK</span>${p ? `<div class="qc-prob">${esc(p)}</div>` : ''}${rm ? `<div class="qc-prob">${esc(rm)}</div>` : ''}`
                : '<span class="qc-st ok">OK</span>';
            let html = `<div class="q-scroll"><table class="q-table"><thead><tr>
                <th>Machine</th><th>Slot</th><th>Product / Mould</th><th>Colour</th><th>Visual</th><th>Colour check</th><th>Function / Fitment</th><th>Entered</th></tr></thead><tbody>`;
            let last = null;
            rows.forEach(r => {
                const first = r.machine !== last; last = r.machine;
                html += `<tr${first ? ' style="border-top:2px solid #cbd5e1"' : ''}>
                    <td class="mc">${first ? esc(r.machine) : ''}</td>
                    <td style="white-space:nowrap;font-weight:600">${esc(slotLabel(r.slot, r.shift || shift))}</td>
                    <td><div>${esc(r.item_name || '—')}</div><div class="mc-sub">${esc(r.mould_name || '')}</div><div class="mc-sub">${esc(r.job_card_no || '')}</div></td>
                    <td>${esc(r.colour || '—')}</td>
                    <td>${st(r.visual_status, r.visual_problem, r.visual_remarks)}</td>
                    <td>${st(r.colour_status, r.colour_problem, r.colour_remarks)}</td>
                    <td>${st(r.ff_status, r.ff_problem, '')}${r.ff_photo_url ? `<div><a href="${esc(r.ff_photo_url)}" target="_blank" rel="noopener">photo</a></div>` : ''}</td>
                    <td style="white-space:nowrap"><div>${esc(r.entered_by || '')}</div><div class="mc-sub">${esc(fmtTime(r.entered_at))}</div></td></tr>`;
            });
            $('onlineqc-container').innerHTML = html + '</tbody></table></div>';
        }

        /* ================= Holds ================= */
        function renderHolds() {
            const names = new Set(visibleMachines().map(m => m.machine));
            const mcFilter = $('filter-machine').value !== 'All Machines' || $('filter-line').value;
            const list = OV.holds.filter(h => !mcFilter || names.has(h.machine));
            if (!list.length) { $('holds-container').innerHTML = '<div class="q-empty">No active holds, and none placed on this date. 👍</div>'; return; }
            const user = (JPSMS.auth.getUser && JPSMS.auth.getUser()) || {};
            const canRelease = ['quality', 'quality_manager', 'quality_supervisor', 'qc_supervisor', 'quality_ass__manager', 'admin', 'superadmin'].includes(String(user.role_code || '').toLowerCase());
            $('holds-container').innerHTML = `<div class="q-scroll"><table class="q-table"><thead><tr>
                <th>Status</th><th>Machine</th><th>Date / Shift</th><th>Job card</th><th>Qty</th><th>Reason</th><th>Held by</th><th>Released</th><th></th></tr></thead><tbody>
                ${list.map(h => `<tr>
                    <td>${h.status === 'ACTIVE' ? '<span class="tag bad">ON HOLD</span>' : '<span class="tag ok">Released</span>'}</td>
                    <td class="mc">${esc(h.machine)}</td>
                    <td style="white-space:nowrap">${esc(fmtDate(h.dpr_date))} · ${esc(h.shift || '')}${h.slot ? ` · ${esc(h.slot)}` : ''}</td>
                    <td>${esc(h.job_card_no || '—')}</td>
                    <td>${esc(h.qty_on_hold ?? '—')}</td>
                    <td><div style="font-weight:600">${esc(h.reason || '')}</div>${h.remarks ? `<div class="mc-sub" style="white-space:normal">${esc(h.remarks)}</div>` : ''}</td>
                    <td style="white-space:nowrap">${esc(h.hold_by || '')}<div class="mc-sub">${esc(fmtTime(h.hold_at))}</div></td>
                    <td style="white-space:nowrap">${h.released_at ? `${esc(h.released_by || '')}<div class="mc-sub">${esc(fmtTime(h.released_at))}</div>${h.release_remarks ? `<div class="mc-sub">${esc(h.release_remarks)}</div>` : ''}` : '—'}</td>
                    <td>${h.status === 'ACTIVE' && canRelease ? `<button class="btn btn-outline small" onclick="releaseHold(${Number(h.id)})">Release</button>` : ''}</td>
                </tr>`).join('')}</tbody></table></div>`;
        }

        async function releaseHold(id) {
            const remarks = prompt('Release this hold? Enter release remarks:');
            if (remarks === null) return;
            const user = (JPSMS.auth.getUser && JPSMS.auth.getUser()) || {};
            try {
                const res = await JPSMS.api.post(`/qc/holds/${id}/release`, { remarks, session: { username: user.username || '' } });
                if (!res.ok) throw new Error(res.error || 'Release failed');
                loadView(true);
            } catch (e) { alert(e.message); }
        }

        /* ================= Modal ================= */
        function openModal(html) { $('q-modal-box').innerHTML = html; $('q-modal').classList.remove('hidden'); }
        function closeModal() { $('q-modal').classList.add('hidden'); }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        /* ================= Hourly (legacy web hourly QC reports) ================= */
            async function loadHourlyTable() {
                const date = document.getElementById('filter-date').value;
                const shift = document.getElementById('filter-shift').value;
                const machine = document.getElementById('filter-machine').value;
                const container = document.getElementById('hourly-container');

                container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted)">Loading Hourly Report...</div>';

                try {
                    // Use new Reports API
                    const res = await JPSMS.api.get(`/qc/reports?date=${date}&shift=${shift}&machine=${encodeURIComponent(machine)}`);

                    if (!res.ok || !res.data) {
                        container.innerHTML = `<div style="text-align:center; color:red; padding:40px">Error: ${res.error || 'No data received'}</div>`;
                        return;
                    }

                    const rows = Array.isArray(res.data) ? res.data : [];

                    if (rows.length === 0) {
                        container.innerHTML = '<div style="text-align:center; padding: 40px">No entries found for this selection.</div>';
                        return;
                    }

                    // Render Table matching Screenshot Style
                    let html = `
                    <div style="overflow-x:auto;">
                        <table class="table table-bordered table-hover" style="width:100%; font-size:14px; background:white;">
                            <thead style="background:var(--bg-main); color:var(--text-muted); font-size:12px; text-transform:uppercase;">
                                <tr>
                                    <th style="padding:12px">Date</th>
                                    <th style="padding:12px">Shift</th>
                                    <th style="padding:12px">Line</th>
                                    <th style="padding:12px">Machine</th>
                                    <th style="padding:12px">Hour Slot</th>
                                    <th style="padding:12px">Product Name</th>
                                    <th style="padding:12px">Mould Name</th>
                                    <th style="padding:12px; text-align:right">Checked</th>
                                    <th style="padding:12px; text-align:right">Rejected</th>
                                    <th style="padding:12px">Defect</th>
                                    <th style="padding:12px">Supervisor</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    rows.forEach(r => {
                        html += `
                        <tr style="border-bottom:1px solid #eee;">
                            <td style="padding:12px">${r.date.split('T')[0]}</td>
                            <td style="padding:12px">${r.shift}</td>
                            <td style="padding:12px">${r.line || '-'}</td>
                            <td style="padding:12px"><strong>${r.machine}</strong></td>
                            <td style="padding:12px"><span class="badge blue">${r.hour_slot}</span></td>
                            <td style="padding:12px">${r.item_name || '-'}</td>
                            <td style="padding:12px">${r.mould_name || '-'}</td>
                            <td style="padding:12px; text-align:right">${r.qty_checked}</td>
                            <td style="padding:12px; text-align:right; color:var(--danger); font-weight:bold;">${r.qty_rejected}</td>
                            <td style="padding:12px">${r.defect_description || '-'}</td>
                            <td style="padding:12px; color:var(--text-muted)">${r.supervisor || '-'}</td>
                        </tr>
                        `;
                    });

                    html += `</tbody></table></div>`;
                    container.innerHTML = html;

                } catch (e) {
                    console.error(e);
                    container.innerHTML = `<div style="text-align:center; color:red; padding:40px">Error: ${escHtml(e.message)}</div>`;
                }
            }

            function renderStatusCell(data) {
                // Handle legacy string case or new object case
                let status = 'MISSING';
                let details = null;

                if (typeof data === 'string') status = data;
                else if (data && typeof data === 'object') {
                    status = data.status || 'MISSING';
                    details = data.details;
                }

                let icon = '';
                let tooltip = '';

                if (status === 'FILLED' || status === 'LATE') {
                    icon = '<i class="bi bi-check-circle-fill"></i>';
                    if (status === 'LATE') icon = '<i class="bi bi-clock-history"></i>';

                    if (details) {
                        tooltip = `title="Item: ${details.item || 'N/A'}\nRej: ${details.rej || 0}"`;
                    }
                } else if (status === 'MISSING') {
                    icon = '<i class="bi bi-dash-lg" style="opacity:0.2"></i>'; // Less aggressive than red cross
                } else if (status === 'PENDING') {
                    icon = '<i class="bi bi-hourglass" style="opacity:0.5"></i>';
                }

                return `<div class="comp-cell status status-${status}" ${tooltip}>${icon}</div>`;
            }


            /* Updated: Dashboard Logic v3.0 — FPA + Holds + Issues panels */
    </script>
