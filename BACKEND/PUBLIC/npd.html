<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPD Tracker - JMS OCEAN</title>
    <link href="/assets/vendor/fonts/g-e34670640e.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/app.css?v=12">
    <style>
        :root {
            --bg: #f5f7fb; --card: #fff; --line: #e4e9f0; --ink: #0f172a; --mute: #64748b;
            /* stage colours: Blue pending, Yellow in progress, Green complete, Red N/A */
            --p-bg: #dbeafe; --p-ink: #1d4ed8;
            --i-bg: #fef3c7; --i-ink: #a16207;
            --c-bg: #dcfce7; --c-ink: #15803d;
            --n-bg: #fee2e2; --n-ink: #b91c1c;
        }
        .npd { padding: 20px 24px 48px; background: var(--bg); min-height: 100vh; color: var(--ink); font-size: 13px; }
        .npd { flex: 1 1 auto; min-width: 0; max-width: 100%; }
        .npd * { box-sizing: border-box; }
        .hd { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
        .hd h1 { font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 800; margin: 0; display: flex; align-items: center; gap: 10px; }
        .hd h1 .ic { width: 38px; height: 38px; border-radius: 11px; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 18px; }
        .hd .sub { color: var(--mute); font-size: 13px; margin-top: 4px; }
        .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 14px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
        .btn.pri { background: #0f172a; color: #fff; border-color: #0f172a; }
        .btn.sm { padding: 4px 9px; font-size: 12px; border-radius: 8px; }
        .btn.danger { color: #b91c1c; }
        .inp { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; background: #fff; }
        .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
        .legend { display: flex; gap: 8px; flex-wrap: wrap; }
        .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 12px; }
        .st-pending { background: var(--p-bg); color: var(--p-ink); }
        .st-in_progress { background: var(--i-bg); color: var(--i-ink); }
        .st-complete { background: var(--c-bg); color: var(--c-ink); }
        .st-na { background: var(--n-bg); color: var(--n-ink); }
        .tiles { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
        .tile { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; cursor: pointer; font-weight: 600; }
        .tile b { font-size: 15px; margin-left: 4px; }
        .tile.on { border-color: #0f172a; box-shadow: 0 0 0 1px #0f172a inset; }
        .wrap { max-width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: auto; max-height: calc(100vh - 210px); }
        table.g { border-collapse: separate; border-spacing: 0; min-width: 100%; }
        .g th, .g td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 4px; vertical-align: middle; }
        .g thead th { position: sticky; background: #f8fafc; z-index: 2; font-size: 11px; font-weight: 700; color: #334155; text-align: center; }
        .g thead tr.grp th { top: 0; height: 28px; text-transform: uppercase; letter-spacing: .4px; font-size: 10.5px; }
        .g thead tr.col th { top: 28px; min-width: 112px; max-width: 130px; white-space: normal; line-height: 1.25; padding: 6px; }
        .g thead tr.col th small { display: block; color: var(--mute); font-weight: 600; margin-top: 2px; }
        .g .fix { position: sticky; background: #fff; z-index: 1; }
        .g thead .fix { z-index: 3; background: #f8fafc; }
        .g .c0 { left: 0; min-width: 52px; max-width: 52px; text-align: center; }
        .g .c1 { left: 52px; min-width: 270px; max-width: 270px; box-shadow: 2px 0 0 var(--line); }
        .g tbody tr:hover td { background-color: #fafcff; }
        .g td.c1 .nm { font-weight: 700; }
        .g td.c1 .pc { display: flex; gap: 8px; align-items: center; }
        .g td.c1 .pc > div { flex: 1; min-width: 0; }
        .thumb { width: 46px; height: 46px; flex: 0 0 46px; border-radius: 8px; border: 1px solid var(--line); background: #f8fafc; overflow: hidden; display: grid; place-items: center; color: #cbd5e1; font-size: 20px; cursor: pointer; }
        .thumb img { width: 100%; height: 100%; object-fit: cover; }
        .g td.c1 .meta { color: var(--mute); font-size: 11px; display: flex; gap: 8px; margin-top: 3px; }
        .g td.c1 .meta a { color: #2563eb; cursor: pointer; text-decoration: none; }
        select.cell, span.cell { width: 100%; border: 0; border-radius: 7px; padding: 6px 4px; font-weight: 700; font-size: 11.5px; text-align: center; text-align-last: center; cursor: pointer; appearance: none; display: block; }
        span.cell { cursor: default; }
        input.dt { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 5px 4px; font-size: 12px; }
        select.ps { width: 130px; border: 1px solid var(--line); border-radius: 7px; padding: 6px; font-weight: 700; font-size: 12px; }
        .ps-Hold { background: #f1f5f9; color: #475569; }
        .ps-Launched { background: var(--c-bg); color: var(--c-ink); }
        .ps-Delayed { background: var(--n-bg); color: var(--n-ink); }
        .ps-On.Schedule, .ps-OnSchedule { background: var(--p-bg); color: var(--p-ink); }
        .ps-Cancelled { background: #e5e7eb; color: #374151; text-decoration: line-through; }
        textarea.rm { width: 220px; min-height: 34px; border: 1px solid var(--line); border-radius: 7px; padding: 5px; font-size: 12px; resize: vertical; font-family: inherit; }
        .empty { padding: 60px 20px; text-align: center; color: var(--mute); }
        .ro-note { color: var(--mute); font-size: 12px; }
        /* modal */
        .mb { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); display: none; align-items: flex-start; justify-content: center; z-index: 2000; padding: 40px 16px; overflow: auto; }
        .mb.on { display: flex; }
        .md { background: #fff; border-radius: 16px; width: 100%; max-width: 760px; padding: 20px 22px; }
        .md h3 { margin: 0 0 4px; font-family: 'Outfit', sans-serif; }
        .md .row2 { display: grid; grid-template-columns: 120px 1fr; gap: 10px; margin: 12px 0; }
        .sec { margin-top: 18px; }
        .sec h4 { margin: 0 0 8px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .flist { display: flex; flex-direction: column; gap: 6px; }
        .fitem { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
        .fitem a { flex: 1; color: #2563eb; text-decoration: none; word-break: break-all; }
        .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .gal .im { position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; aspect-ratio: 1; background: #f8fafc; }
        .gal .im img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
        .gal .im button { position: absolute; top: 6px; right: 6px; border: 0; border-radius: 6px; background: rgba(255,255,255,.9); color: #b91c1c; cursor: pointer; padding: 2px 6px; }
        .none { color: var(--mute); font-size: 12px; }
        /* full screen viewer: images zoom / pan, PDFs open inline */
        .vw { position: fixed; inset: 0; z-index: 3000; background: rgba(2, 6, 23, .94); display: none; flex-direction: column; color: #e2e8f0; }
        .vw.on { display: flex; }
        .vw .vbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: rgba(15, 23, 42, .85); flex-wrap: wrap; }
        .vw .vname { flex: 1; min-width: 120px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .vw .vname small { color: #94a3b8; font-weight: 600; margin-left: 8px; }
        .vw .vb { border: 1px solid rgba(148, 163, 184, .35); background: rgba(30, 41, 59, .9); color: #e2e8f0; border-radius: 9px; height: 34px; min-width: 34px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-size: 13px; text-decoration: none; }
        .vw .vb:hover { background: #334155; }
        .vw .vpct { min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; font-size: 13px; }
        .vw .vstage { flex: 1; position: relative; overflow: hidden; touch-action: none; display: grid; place-items: center; }
        .vw .vstage img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; user-select: none; -webkit-user-drag: none; cursor: grab; }
        .vw .vstage img.drag { cursor: grabbing; }
        .vw .vstage iframe { width: 100%; height: 100%; border: 0; background: #fff; }
        .vw .vnone { text-align: center; color: #cbd5e1; }
        .vw .vnone i { font-size: 54px; display: block; margin-bottom: 10px; }
        .vw .vnav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; border: 0; border-radius: 10px; background: rgba(30, 41, 59, .75); color: #fff; font-size: 22px; cursor: pointer; z-index: 2; }
        .vw .vnav.l { left: 12px; }
        .vw .vnav.r { right: 12px; }
        .vw .zoom-only { display: inline-flex; gap: 8px; align-items: center; }
        @media (max-width: 700px) { .npd { padding: 14px 10px 80px; } .g .c1 { min-width: 200px; max-width: 200px; } .wrap { max-height: none; } }
    </style>
</head>

<body>
    <div class="npd">
        <div class="hd">
            <div>
                <h1><span class="ic"><i class="bi bi-lightbulb"></i></span>NPD Tracker</h1>
                <div class="sub">New product development: every stage from mould receipt to launch</div>
            </div>
            <div class="tools">
                <span class="ro-note" id="roNote"></span>
                <button class="btn" id="refresh"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
                <button class="btn" id="exportBtn" title="Download the products shown as an Excel file"><i class="bi bi-file-earmark-excel" style="color:#15803d"></i> Export Excel</button>
                <button class="btn pri" id="addBtn" style="display:none"><i class="bi bi-plus-lg"></i> Add Product</button>
            </div>
        </div>

        <div class="bar">
            <input class="inp" id="q" placeholder="Search product…" style="width:220px">
            <div class="legend">
                <span class="chip st-pending">Pending</span>
                <span class="chip st-in_progress">In Progress</span>
                <span class="chip st-complete">Complete</span>
                <span class="chip st-na">Not Applicable</span>
            </div>
            <div class="tiles" id="tiles"></div>
        </div>

        <div class="wrap">
            <table class="g" id="grid"></table>
            <div class="empty" id="empty" style="display:none"></div>
        </div>
    </div>

    <!-- add product -->
    <div class="mb" id="addModal">
        <div class="md" style="max-width:460px">
            <h3>Add NPD Product</h3>
            <div class="row2"><label>Product *</label><input class="inp" id="aName" maxlength="300"></div>
            <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
                <button class="btn" data-close="addModal">Cancel</button>
                <button class="btn pri" id="aSave">Add</button>
            </div>
        </div>
    </div>

    <!-- trial report + images -->
    <div class="mb" id="fileModal">
        <div class="md">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
                <div><h3 id="fTitle"></h3><div class="none">Trial reports and product photos after trial</div></div>
                <button class="btn sm" data-close="fileModal"><i class="bi bi-x-lg"></i></button>
            </div>
            <div class="sec">
                <h4>Trial Report <span class="ed"><input type="file" id="repFile" multiple hidden accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.jpg,.jpeg,.png,.webp"><button class="btn sm" onclick="document.getElementById('repFile').click()"><i class="bi bi-upload"></i> Upload Trial Report</button></span></h4>
                <div class="flist" id="repList"></div>
            </div>
            <div class="sec">
                <h4>Product Images After Trial <span class="ed"><input type="file" id="imgFile" multiple hidden accept="image/*"><button class="btn sm" onclick="document.getElementById('imgFile').click()"><i class="bi bi-camera"></i> Upload Images</button></span></h4>
                <div class="gal" id="imgList"></div>
            </div>
        </div>
    </div>

    <!-- full screen viewer -->
    <div class="vw" id="viewer" aria-modal="true" role="dialog">
        <div class="vbar">
            <div class="vname" id="vName"></div>
            <span class="zoom-only" id="vZoom">
                <button class="vb" data-z="out" title="Zoom out (-)"><i class="bi bi-zoom-out"></i></button>
                <span class="vpct" id="vPct">100%</span>
                <button class="vb" data-z="in" title="Zoom in (+)"><i class="bi bi-zoom-in"></i></button>
                <button class="vb" data-z="fit" title="Fit to screen (0)"><i class="bi bi-arrows-angle-contract"></i> Fit</button>
                <button class="vb" data-z="one" title="Actual size (1)">1:1</button>
                <button class="vb" data-z="rot" title="Rotate (R)"><i class="bi bi-arrow-clockwise"></i></button>
            </span>
            <a class="vb" id="vOpen" target="_blank" rel="noopener" title="Open in new tab"><i class="bi bi-box-arrow-up-right"></i></a>
            <a class="vb" id="vDown" download title="Download"><i class="bi bi-download"></i></a>
            <button class="vb" id="vClose" title="Close (Esc)"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="vstage" id="vStage">
            <button class="vnav l" id="vPrev" title="Previous"><i class="bi bi-chevron-left"></i></button>
            <button class="vnav r" id="vNext" title="Next"><i class="bi bi-chevron-right"></i></button>
        </div>
    </div>

    <script src="/assets/app.min.js?v=1577"></script>
    <script>
        (function () {
            /* keep keys in sync with STAGES in src/modules/npd/registerNpdRoutes.js */
            const GROUPS = [
                { label: 'Mould & Trial', cols: [
                    ['mould_received', 'Final mould received @ factory', 'Tool Room'],
                    ['mould_trials', 'Product mould final trials @ factory', 'Moulding'],
                    ['rm_colour', 'RM & colour finalization', 'Planning / Moulding'],
                    ['samples_ho', 'Final samples sent to HO for approval & photo shoot', 'QC'],
                    ['pilot_drop_test', 'Pilot run & drop test @ factory', 'Moulding / QC'],
                    ['qc_approval_ho', 'Final QC testing & approval from HO', 'QC']] },
                { label: 'Packing, BOM & ERP', cols: [
                    ['packing_material', 'Packing material finalization', 'Packing'],
                    ['bom_approval', 'Product BOM finalization / approval', 'Planning'],
                    ['packing_receiving', 'Packing material follow up & receiving @ factory', 'Purchase'],
                    ['or_jr_erp', 'OR-JR making in ERP', 'HO'],
                    ['production_planning', 'Production planning as per OR-JR ERP', 'Planning'],
                    ['jc_start_date', 'Planned job card start date', 'Planning', 'date'],
                    ['jc_end_date', 'Planned job card completion date', 'Planning', 'date'],
                    ['launch_date', 'Launch date finalization', 'Planning', 'date']] },
                { label: 'Mass Production', cols: [
                    ['mass_moulding', 'Mass production - moulding', 'Moulding'],
                    ['mass_printing', 'Mass production - printing / tufting', 'Production'],
                    ['mass_packaging', 'Mass production - packaging', 'Packing'],
                    ['fg_receiving', 'Finish goods receiving', 'W/H']] },
                { label: 'Costing & Launch', cols: [
                    ['ex_factory_cost', 'Ex factory cost finalization', 'Planning'],
                    ['price_final', 'Price finalization', 'HO'],
                    ['post_card_receiving', 'Final post card follow up & receiving', 'Planning'],
                    ['post_card_posting', 'Posting post card in new product launch group', 'Planning'],
                    ['dispatch_date', 'Actual dispatch date', '', 'date']] }
            ];
            const COLS = GROUPS.flatMap(g => g.cols);
            const STATE = [['pending', 'Pending'], ['in_progress', 'In Progress'], ['complete', 'Complete'], ['na', 'N/A']];
            const PSTAT = ['Hold', 'Launched', 'Delayed', 'On Schedule', 'Cancelled'];
            const S = { rows: [], canEdit: false, q: '', fstat: '', open: null };
            const $ = id => document.getElementById(id);
            const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            const psClass = s => 'ps-' + String(s || '').replace(/\s+/g, '');
            const toast = (m, t) => (window.JPSMS && JPSMS.toast) ? JPSMS.toast(m, t) : alert(m);
            const api = (url, opt = {}) => JPSMS.api.request(url, { skipLoader: true, ...opt });

            async function load() {
                try {
                    const res = await api('/npd/products');
                    S.rows = res.data || [];
                    S.canEdit = !!res.can_edit;
                    $('addBtn').style.display = S.canEdit ? '' : 'none';
                    $('roNote').textContent = S.canEdit ? '' : 'View only - editing is for PPC managers';
                    render();
                } catch (e) { }
            }

            function stageCell(p, c) {
                const [key, , , type] = c;
                const v = (p.stages || {})[key];
                if (type === 'date') {
                    if (!S.canEdit) return `<td>${v ? esc(fmtDate(v)) : '<span class="none">—</span>'}</td>`;
                    return `<td><input type="date" class="dt" data-id="${p.id}" data-stage="${key}" value="${esc(v || '')}"></td>`;
                }
                const st = v || 'pending';
                if (!S.canEdit) return `<td><span class="cell st-${st}">${(STATE.find(s => s[0] === st) || STATE[0])[1]}</span></td>`;
                return `<td><select class="cell st-${st}" data-id="${p.id}" data-stage="${key}">${STATE.map(([k, l]) => `<option value="${k}"${k === st ? ' selected' : ''}>${l}</option>`).join('')}</select></td>`;
            }
            function fmtDate(v) { const d = new Date(v + 'T00:00:00'); return isNaN(d) ? v : d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: '2-digit' }); }

            function render() {
                const q = S.q.toLowerCase();
                const rows = S.rows.filter(p => (!q || (p.product_name + ' ' + (p.sr_no || '')).toLowerCase().includes(q)) && (!S.fstat || (p.status || 'No status') === S.fstat));
                const counts = {};
                S.rows.forEach(p => { const k = p.status || 'No status'; counts[k] = (counts[k] || 0) + 1; });
                $('tiles').innerHTML = [['', 'All', S.rows.length], ...PSTAT.map(s => [s, s, counts[s] || 0])]
                    .map(([k, l, n]) => `<span class="tile${S.fstat === k ? ' on' : ''}" data-f="${esc(k)}">${esc(l)}<b>${n}</b></span>`).join('');

                let h = `<thead><tr class="grp"><th class="fix c0" rowspan="2" style="top:0">Sr</th><th class="fix c1" rowspan="2" style="top:0;text-align:left">Product</th>`;
                GROUPS.forEach(g => { h += `<th colspan="${g.cols.length}">${esc(g.label)}</th>`; });
                h += `<th rowspan="2" style="top:0;min-width:140px">Status</th><th rowspan="2" style="top:0;min-width:230px">Remarks</th>${S.canEdit ? '<th rowspan="2" style="top:0"></th>' : ''}</tr><tr class="col">`;
                COLS.forEach(c => { h += `<th>${esc(c[1])}${c[2] ? `<small>${esc(c[2])}</small>` : ''}</th>`; });
                h += `</tr></thead><tbody>`;
                rows.forEach(p => {
                    const reps = p.files.filter(f => f.kind === 'report').length, imgs = p.files.filter(f => f.kind === 'image').length;
                    /* latest product photo after trial, else a placeholder; click opens the files */
                    const img = p.files.filter(f => f.kind === 'image').pop();
                    const thumb = `<span class="thumb" ${img ? `data-thumb="${p.id}"` : `data-files="${p.id}"`}title="${img ? 'Product images' : 'No product image yet'}">${img ? `<img src="${esc(img.url)}" alt="" loading="lazy">` : '<i class="bi bi-image"></i>'}</span>`;
                    const name = S.canEdit
                        ? `<input class="inp" style="width:100%;padding:4px 6px;font-weight:700" data-id="${p.id}" data-f="product_name" value="${esc(p.product_name)}">`
                        : `<div class="nm">${esc(p.product_name)}</div>`;
                    h += `<tr><td class="fix c0"><b>${esc(p.sr_no || '')}</b></td>
                        <td class="fix c1"><div class="pc">${thumb}<div>${name}<div class="meta"><a data-files="${p.id}"><i class="bi bi-file-earmark-text"></i> Trial report (${reps})</a><a data-files="${p.id}"><i class="bi bi-images"></i> Images (${imgs})</a></div></div></div></td>`;
                    COLS.forEach(c => { h += stageCell(p, c); });
                    h += S.canEdit
                        ? `<td><select class="ps ${psClass(p.status)}" data-id="${p.id}" data-f="status"><option value="">— Select —</option>${PSTAT.map(s => `<option${s === p.status ? ' selected' : ''}>${s}</option>`).join('')}</select></td>
                           <td><textarea class="rm" data-id="${p.id}" data-f="remarks">${esc(p.remarks || '')}</textarea></td>
                           <td><button class="btn sm danger" data-del="${p.id}" title="Delete"><i class="bi bi-trash"></i></button></td>`
                        : `<td>${p.status ? `<span class="chip ${psClass(p.status)}">${esc(p.status)}</span>` : '<span class="none">—</span>'}</td><td style="min-width:230px">${esc(p.remarks || '')}</td>`;
                    h += '</tr>';
                });
                $('grid').innerHTML = h + '</tbody>';
                $('empty').style.display = rows.length ? 'none' : '';
                $('empty').textContent = S.rows.length ? 'No product matches the filter.' : (S.canEdit ? 'No NPD products yet. Click "Add Product" to start.' : 'No NPD products yet.');
            }

            async function save(id, body) {
                try {
                    const res = await api(`/npd/products/${id}`, { method: 'PUT', body: JSON.stringify(body) });
                    const i = S.rows.findIndex(r => r.id === id);
                    if (i >= 0) S.rows[i] = { ...S.rows[i], ...res.data, files: S.rows[i].files };
                    return true;
                } catch (e) { load(); return false; }
            }

            $('grid').addEventListener('change', e => {
                const t = e.target, id = Number(t.dataset.id);
                if (!id) return;
                if (t.dataset.stage) {
                    if (t.tagName === 'SELECT') t.className = 'cell st-' + t.value;
                    save(id, { stages: { [t.dataset.stage]: t.value } });
                } else if (t.dataset.f) {
                    if (t.dataset.f === 'product_name' && !t.value.trim()) { toast('Product name is required', 'error'); load(); return; }
                    if (t.dataset.f === 'status') { t.className = 'ps ' + psClass(t.value); save(id, { status: t.value }).then(ok => ok && render()); return; }
                    save(id, { [t.dataset.f]: t.value });
                }
            });
            $('grid').addEventListener('click', async e => {
                const th = e.target.closest('[data-thumb]');
                if (th) {
                    const p = S.rows.find(r => r.id === Number(th.dataset.thumb));
                    const imgs = p ? p.files.filter(x => x.kind === 'image') : [];
                    if (imgs.length) return openViewer(imgs, imgs.length - 1, p.product_name);
                }
                const f = e.target.closest('[data-files]');
                if (f) return openFiles(Number(f.dataset.files));
                const d = e.target.closest('[data-del]');
                if (d) {
                    const p = S.rows.find(r => r.id === Number(d.dataset.del));
                    if (!p || !confirm(`Delete "${p.product_name}" with its trial reports and images?`)) return;
                    try { await api(`/npd/products/${p.id}`, { method: 'DELETE' }); S.rows = S.rows.filter(r => r.id !== p.id); render(); }
                    catch (err) { }
                }
            });
            $('tiles').addEventListener('click', e => { const t = e.target.closest('[data-f]'); if (t) { S.fstat = t.dataset.f; render(); } });
            $('q').addEventListener('input', e => { S.q = e.target.value.trim(); render(); });
            $('refresh').onclick = load;
            /* Excel of the rows shown (status tile + search), built on the server with colours */
            $('exportBtn').onclick = async () => {
                const b = $('exportBtn');
                b.disabled = true;
                try {
                    const headers = {};
                    const token = localStorage.getItem('token');
                    if (token) headers.Authorization = `Bearer ${token}`;
                    const u = JSON.parse(localStorage.getItem('user') || '{}');
                    if (u.username) headers['X-User-Name'] = u.username;
                    const qs = new URLSearchParams({ status: S.fstat, q: S.q });
                    const res = await fetch(`/api/npd/export.xlsx?${qs}`, { headers });
                    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'Export failed');
                    const blob = await res.blob();
                    const name = (res.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/);
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = name ? name[1] : 'NPD_Tracker.xlsx';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
                } catch (e) { toast(e.message || 'Export failed', 'error'); }
                finally { b.disabled = false; }
            };

            document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => $(b.dataset.close).classList.remove('on'));
            $('addBtn').onclick = () => { $('aName').value = ''; $('addModal').classList.add('on'); $('aName').focus(); };
            $('aSave').onclick = async () => {
                const name = $('aName').value.trim();
                if (!name) return toast('Product name is required', 'error');
                try {
                    const res = await api('/npd/products', { method: 'POST', body: JSON.stringify({ product_name: name }) });
                    S.rows.push(res.data); $('addModal').classList.remove('on'); render();
                } catch (e) { }
            };

            function openFiles(id) {
                S.open = id;
                renderFiles();
                $('fileModal').classList.add('on');
            }
            function renderFiles() {
                const p = S.rows.find(r => r.id === S.open);
                if (!p) return;
                $('fTitle').textContent = p.product_name;
                document.querySelectorAll('#fileModal .ed').forEach(el => el.style.display = S.canEdit ? '' : 'none');
                const by = f => `<span class="none">${esc(f.uploaded_by || '')} · ${new Date(f.uploaded_at).toLocaleDateString('en-GB')}</span>`;
                const del = f => S.canEdit ? `<button class="btn sm danger" data-fdel="${f.id}" title="Delete"><i class="bi bi-trash"></i></button>` : '';
                const reps = p.files.filter(f => f.kind === 'report');
                $('repList').innerHTML = reps.length ? reps.map(f => `<div class="fitem"><i class="bi bi-file-earmark-text"></i><a href="${esc(f.url)}" data-view="report" data-fid="${f.id}">${esc(f.original_name || 'report')}</a>${by(f)}${del(f)}</div>`).join('') : '<div class="none">No trial report uploaded.</div>';
                const imgs = p.files.filter(f => f.kind === 'image');
                $('imgList').innerHTML = imgs.length ? imgs.map(f => `<div class="im"><a href="${esc(f.url)}" data-view="image" data-fid="${f.id}"><img src="${esc(f.url)}" alt="${esc(f.original_name || '')}" loading="lazy"></a>${S.canEdit ? `<button data-fdel="${f.id}" title="Delete"><i class="bi bi-trash"></i></button>` : ''}</div>`).join('') : '<div class="none">No product images uploaded.</div>';
            }
            async function uploadFiles(input, kind) {
                const files = [...input.files];
                input.value = '';
                if (!files.length || !S.open) return;
                const fd = new FormData();
                files.forEach(f => fd.append('files', f));
                try {
                    const res = await api(`/npd/products/${S.open}/files/${kind}`, { method: 'POST', body: fd });
                    const p = S.rows.find(r => r.id === S.open);
                    p.files.push(...(res.data || []));
                    renderFiles(); render();
                    if (res.data.length < files.length) toast('Some files were skipped (type not allowed)', 'warning');
                } catch (e) { }
            }
            $('repFile').onchange = e => uploadFiles(e.target, 'report');
            $('imgFile').onchange = e => uploadFiles(e.target, 'image');
            $('fileModal').addEventListener('click', async e => {
                const v = e.target.closest('[data-view]');
                if (v) {
                    e.preventDefault();
                    const p = S.rows.find(r => r.id === S.open);
                    const list = p.files.filter(f => f.kind === v.dataset.view);
                    return openViewer(list, Math.max(0, list.findIndex(f => f.id === Number(v.dataset.fid))), p.product_name);
                }
                const b = e.target.closest('[data-fdel]');
                if (!b || !confirm('Delete this file?')) return;
                e.preventDefault();
                try {
                    await api(`/npd/files/${b.dataset.fdel}`, { method: 'DELETE' });
                    const p = S.rows.find(r => r.id === S.open);
                    p.files = p.files.filter(f => f.id !== Number(b.dataset.fdel));
                    renderFiles(); render();
                } catch (err) { }
            });

            /* ---------- full screen viewer ---------- */
            const IMG_RE = /\.(jpe?g|png|webp|gif)$/i;
            const kindOf = f => IMG_RE.test(f.url) ? 'image' : /\.pdf$/i.test(f.url) ? 'pdf' : 'other';
            const V = { list: [], i: 0, title: '', img: null, s: 1, x: 0, y: 0, rot: 0, ptrs: new Map(), pinch: null, drag: null };
            const stage = $('vStage');
            const clearStage = () => stage.querySelectorAll('img, iframe, .vnone').forEach(el => el.remove());
            function openViewer(list, i, title) {
                if (!list.length) return;
                V.list = list; V.i = i; V.title = title || '';
                $('viewer').classList.add('on');
                document.body.style.overflow = 'hidden';
                showItem();
            }
            function closeViewer() {
                $('viewer').classList.remove('on');
                document.body.style.overflow = '';
                clearStage();
            }
            function showItem() {
                const f = V.list[V.i], k = kindOf(f);
                clearStage();
                $('vName').innerHTML = `${esc(V.title)} <small>${esc(f.original_name || '')}${V.list.length > 1 ? ` · ${V.i + 1} / ${V.list.length}` : ''}</small>`;
                $('vOpen').href = f.url;
                $('vDown').href = f.url;
                $('vDown').setAttribute('download', f.original_name || '');
                $('vPrev').style.display = $('vNext').style.display = V.list.length > 1 ? '' : 'none';
                $('vZoom').style.display = k === 'image' ? '' : 'none';
                V.img = null;
                if (k === 'image') {
                    const im = new Image();
                    im.alt = f.original_name || '';
                    im.draggable = false;
                    im.onload = () => { V.rot = 0; fit(); };
                    im.src = f.url;
                    stage.appendChild(im);
                    V.img = im;
                } else if (k === 'pdf') {
                    const fr = document.createElement('iframe');
                    fr.src = f.url;
                    fr.title = f.original_name || 'Trial report';
                    stage.appendChild(fr);
                } else {
                    const ext = (f.url.split('.').pop() || '').toUpperCase();
                    stage.insertAdjacentHTML('beforeend', `<div class="vnone"><i class="bi bi-file-earmark-text"></i>${esc(ext)} files cannot be shown in the browser.<br><br><a class="vb" href="${esc(f.url)}" download="${esc(f.original_name || '')}" style="display:inline-flex"><i class="bi bi-download"></i> Download to open</a></div>`);
                }
            }
            /* size of the image as drawn (width / height swap at 90 and 270 degrees) */
            const dims = () => { const w = V.img.naturalWidth, h = V.img.naturalHeight; return V.rot % 180 ? [h, w] : [w, h]; };
            function apply() {
                if (!V.img) return;
                const w = V.img.naturalWidth, h = V.img.naturalHeight, [dw, dh] = dims();
                /* rotate about the image centre, then scale + move the rotated box */
                V.img.style.transform = `translate(${V.x}px, ${V.y}px) scale(${V.s}) translate(${dw / 2}px, ${dh / 2}px) rotate(${V.rot}deg) translate(${-w / 2}px, ${-h / 2}px)`;
                $('vPct').textContent = Math.round(V.s * 100) + '%';
            }
            function fit() {
                if (!V.img || !V.img.naturalWidth) return;
                const r = stage.getBoundingClientRect(), [w, h] = dims();
                V.s = Math.min((r.width - 40) / w, (r.height - 40) / h, 1);
                V.x = (r.width - w * V.s) / 2;
                V.y = (r.height - h * V.s) / 2;
                apply();
            }
            /* zoom by factor f keeping stage point (cx, cy) still; default the centre */
            function zoomAt(f, cx, cy) {
                if (!V.img) return;
                const r = stage.getBoundingClientRect();
                if (cx == null) { cx = r.width / 2; cy = r.height / 2; }
                const ns = Math.min(10, Math.max(0.05, V.s * f));
                V.x = cx - (cx - V.x) * ns / V.s;
                V.y = cy - (cy - V.y) * ns / V.s;
                V.s = ns;
                apply();
            }
            const rotate = () => { V.rot = (V.rot + 90) % 360; fit(); };
            const step = d => { V.i = (V.i + d + V.list.length) % V.list.length; showItem(); };
            document.querySelectorAll('#vZoom [data-z]').forEach(b => b.onclick = () => {
                const z = b.dataset.z;
                if (z === 'in') zoomAt(1.25);
                else if (z === 'out') zoomAt(0.8);
                else if (z === 'fit') fit();
                else if (z === 'one') zoomAt(1 / V.s);
                else if (z === 'rot') rotate();
            });
            $('vClose').onclick = closeViewer;
            $('vPrev').onclick = () => step(-1);
            $('vNext').onclick = () => step(1);
            const local = e => { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
            stage.addEventListener('wheel', e => {
                if (!V.img) return;
                e.preventDefault();
                const [x, y] = local(e);
                zoomAt(Math.exp(-e.deltaY * 0.0015), x, y);
            }, { passive: false });
            stage.addEventListener('dblclick', e => {
                if (!V.img || e.target !== V.img) return;
                const [x, y] = local(e);
                if (V.s < 1.5) zoomAt(2.5 / V.s, x, y); else fit();
            });
            /* one finger / mouse drags, two fingers pinch-zoom */
            stage.addEventListener('pointerdown', e => {
                if (!V.img || e.target.closest('.vnav')) return;
                stage.setPointerCapture(e.pointerId);
                V.ptrs.set(e.pointerId, local(e));
                if (V.ptrs.size === 2) {
                    const [a, b] = [...V.ptrs.values()];
                    V.pinch = Math.hypot(a[0] - b[0], a[1] - b[1]);
                    V.drag = null;
                } else {
                    V.drag = { p: local(e), x: V.x, y: V.y };
                    V.img.classList.add('drag');
                }
            });
            stage.addEventListener('pointermove', e => {
                if (!V.ptrs.has(e.pointerId)) return;
                V.ptrs.set(e.pointerId, local(e));
                if (V.pinch && V.ptrs.size === 2) {
                    const [a, b] = [...V.ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
                    zoomAt(d / V.pinch, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
                    V.pinch = d;
                } else if (V.drag) {
                    const p = local(e);
                    V.x = V.drag.x + p[0] - V.drag.p[0];
                    V.y = V.drag.y + p[1] - V.drag.p[1];
                    apply();
                }
            });
            const pointerUp = e => {
                V.ptrs.delete(e.pointerId);
                if (V.ptrs.size < 2) V.pinch = null;
                if (!V.ptrs.size) { V.drag = null; if (V.img) V.img.classList.remove('drag'); }
            };
            stage.addEventListener('pointerup', pointerUp);
            stage.addEventListener('pointercancel', pointerUp);
            window.addEventListener('resize', () => { if ($('viewer').classList.contains('on')) fit(); });
            document.addEventListener('keydown', e => {
                if (!$('viewer').classList.contains('on')) return;
                const k = e.key;
                if (k === 'Escape') closeViewer();
                else if (k === 'ArrowLeft' && V.list.length > 1) step(-1);
                else if (k === 'ArrowRight' && V.list.length > 1) step(1);
                else if (k === '+' || k === '=') zoomAt(1.25);
                else if (k === '-') zoomAt(0.8);
                else if (k === '0') fit();
                else if (k === '1') zoomAt(1 / V.s);
                else if (k === 'r' || k === 'R') rotate();
            });

            if (window.JPSMS && JPSMS.renderShell) JPSMS.renderShell();
            /* the shell moves the page into .main-content, which has a transform, so a
               position:fixed overlay inside it would not cover the sidebar */
            ['viewer', 'fileModal', 'addModal'].forEach(id => document.body.appendChild($(id)));
            load();
        })();
    </script>
</body>

</html>
