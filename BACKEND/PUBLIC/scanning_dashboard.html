<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMS OCEAN - Scanning Dashboard</title>
    <link rel="stylesheet" href="/assets/app.css?v=12">
    <link rel="stylesheet" href="/assets/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/packing-scan.css?v=1">
</head>

<body>
    <div class="main-content">
        <div class="sc-page db">
            <div class="header sc-head">
                <div class="page-title">Scanning Dashboard</div>
                <span class="db-clock" id="dbClock"></span>
                <span class="db-live" role="status"><i class="sc-dot" id="dbConn"></i><span id="dbConnT">Connecting</span></span>
                <div class="sc-acts">
                    <nav class="sc-views" aria-label="Scanning views"><a href="scanning.html">Cards</a><a href="scanning_list.html">List</a><a href="scanning_dashboard.html" aria-current="page">Dashboard</a></nav>
                    <button type="button" class="btn btn-outline" id="dbSound"></button>
                    <button type="button" class="btn btn-outline" id="dbTv"><i class="bi bi-tv"></i>TV mode</button>
                    <button type="button" class="btn btn-outline" id="dbRefresh"><i class="bi bi-arrow-clockwise"></i>Refresh</button>
                </div>
            </div>
            <div class="db-stale" id="dbStale" role="alert" hidden><i class="bi bi-wifi-off"></i><span></span></div>
            <div class="db-kpis">
                <div><span>Progress</span><b id="kPct">0%</b><div class="sc-bar"><i id="kBar"></i></div><small id="kDone">&nbsp;</small></div>
                <div><span>Running</span><b id="kRun">0</b><small id="kRunSub">&nbsp;</small></div>
                <div><span>Slow</span><b id="kSlow">0</b><small>no scan for 5 min</small></div>
                <div><span>Stopped</span><b id="kStop">0</b><small>no scan for 15 min</small></div>
                <div><span>Packed today</span><b id="kToday">0</b><small id="kHour">&nbsp;</small></div>
                <div><span>Wrong scans</span><b id="kWrong">0</b><small>last hour</small></div>
            </div>
            <div class="db-filters">
                <div class="sc-bar1"><span>Status</span><div class="sc-chips" id="dbStatus" role="group" aria-label="Status"></div></div>
                <div class="sc-bar1"><span>Assembly</span><div class="sc-chips" id="scAssembly" role="group" aria-label="Assembly station"></div></div>
            </div>
            <div class="db-grid" id="dbGrid"><div class="db-skel"></div><div class="db-skel"></div><div class="db-skel"></div><div class="db-skel"></div></div>
            <div class="sc-empty" id="dbEmpty" hidden></div>
        </div>
    </div>

    <div class="db-alert" id="dbAlert" role="alert" hidden></div>
    <dialog class="db-detail" id="dbDetail" aria-label="Job detail">
        <button type="button" class="db-x" data-close aria-label="Close"><i class="bi bi-x-lg"></i></button>
        <div id="dbDetailBody"></div>
    </dialog>

    <script src="/assets/app.min.js?v=1583"></script>
    <script src="/js/scanning_dashboard.js?v=1"></script>
</body>

</html>
