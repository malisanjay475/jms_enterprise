<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JMS OCEAN - Reports</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1e293b">
  <link rel="stylesheet" href="/assets/app.css?v=11">
  <link rel="stylesheet" href="/assets/bootstrap-icons.min.css">

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="/assets/vendor/datatables.net/1.13.4/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="/assets/vendor/datatables.net/buttons/2.3.6/css/buttons.dataTables.min.css">

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg-soft: #f8fafc;
      --text-main: #1e293b;
      --text-light: #64748b;
      --border: #e2e8f0;
    }

    body {
      background-color: var(--bg-soft);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text-main);
      font-size: 0.85rem;
    }

    .main-content {
      padding: 20px;
      max-width: 100%;
      margin: 0 auto;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .page-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.03em;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .filter-bar {
      display: flex;
      gap: 15px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-light);
      letter-spacing: 0.05em;
    }

    .form-input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.85rem;
      min-width: 160px;
      background: #ffffff;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .btn-action {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 9px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action:hover {
      background-color: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-action:active {
      transform: translateY(0);
    }

    /* DataTable Overrides */
    table.dataTable.display tbody tr td {
      padding: 10px 12px;
      font-size: 0.8rem;
    }

    table.dataTable thead th {
      background: #f8fafc !important;
      color: #475569 !important;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      padding: 12px !important;
      border-bottom: 2px solid var(--border) !important;
    }

    .dataTables_wrapper .dataTables_filter input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 6px 12px;
    }

    .dt-buttons .dt-button {
      background: white !important;
      border: 1px solid #e2e8f0 !important;
      border-radius: 8px !important;
      padding: 6px 16px !important;
      font-size: 0.8rem !important;
      font-weight: 600 !important;
      color: var(--text-main) !important;
      transition: all 0.2s !important;
    }

    .dt-buttons .dt-button:hover {
      background: #f8fafc !important;
      border-color: #cbd5e1 !important;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-summary { background: #eff6ff; color: #2563eb; }
    .badge-detail { background: #fdf2f8; color: #db2777; }

    .mw-chk {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
    }
    .mw-chk input { width: 15px; height: 15px; cursor: pointer; }
    .mw-chk input:disabled { cursor: not-allowed; }
    .mw-chk input:disabled + span,
    .mw-chk:has(input:disabled) { color: var(--text-light); }

    /* Mould-wise printable report */
    .mould-report-table {
      border-collapse: collapse;
      margin-bottom: 28px;
      font-size: 0.9rem;
      page-break-inside: avoid;
    }
    .mould-report-table td,
    .mould-report-table th {
      border: 1px solid #000;
      padding: 6px 14px;
      text-align: center;
    }
    .mould-report-table .mr-label { font-weight: 700; text-align: left; }
    .mould-report-table .mr-mould-name {
      background: #ffff00;
      font-weight: 800;
      text-align: left;
    }
    .mould-report-table .mr-colhead { font-weight: 700; text-align: left; }
    .mould-report-table td.mr-num { text-align: right; }
    .mould-report-table .mr-grand td {
      font-weight: 800;
      font-size: 1rem;
      text-align: right;
      border-top: 2px solid #000;
    }

    @media print {
      body { background: #fff; font-size: 12px; }
      .no-print, .header-row,
      #filterCard, #tableCard, #emptyState { display: none !important; }
      .card { box-shadow: none; border: none; padding: 0; }
      #mouldReportCard { display: block !important; }
    }

    @media (max-width: 768px) {
      .filter-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .control-group {
        width: 100%;
      }
      .form-input {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="main-content">
    <div class="header-row">
      <div>
        <div class="page-title" id="pageTitle">Reports</div>
        <div style="font-size:0.85rem; color:var(--text-light); margin-top:4px">
          Generate production, stock, and factory-wise reports.
        </div>
      </div>
      <div style="font-size:0.85rem; color:var(--text-light)">
        <a href="/index.html" style="text-decoration:none; color:var(--primary)">Dashboard</a> / Reports
      </div>
    </div>

    <!-- Filter Card -->
    <div class="card" id="filterCard">
      <div class="filter-bar">
        <div class="control-group">
          <label class="control-label">Factory</label>
          <select id="factorySelector" class="form-input">
            <option value="">Loading...</option>
          </select>
        </div>

        <div class="control-group">
          <label class="control-label">Report Type</label>
          <select id="reportType" class="form-input" onchange="onReportTypeChange()">
            <option value="summary">Summary View</option>
            <option value="detail">Detailed View</option>
            <option value="jms-plan">JMS Plan</option>
            <option value="mould-wise-qty">Mould Wise Item QTY</option>
            <option value="extra-qty-allowed">Extra Allowed QTY By PPC</option>
            <option value="machine-maintenance">Machine Maintenance Report</option>
            <option value="tonnage">Tonnage Report</option>
            <option value="machine-wise">Machine-Wise Plan Report</option>
            <option value="machine-date-history">Machine Date-Wise History</option>
          </select>
        </div>

        <div class="control-group" id="mdhMachineGroup" style="display:none">
          <label class="control-label">Machine</label>
          <select id="mdhMachine" class="form-input">
            <option value="">Select machine…</option>
          </select>
        </div>

        <div class="control-group" id="mdhShiftGroup" style="display:none">
          <label class="control-label">Shift split</label>
          <label class="mw-chk" style="padding-top:8px"><input type="checkbox" id="mdhSplitShift"> Split by Day / Night</label>
        </div>

        <div class="control-group" id="mwMachineGroup" style="display:none">
          <label class="control-label">Machine</label>
          <select id="mwMachine" class="form-input">
            <option value="">All Machines</option>
          </select>
        </div>

        <div class="control-group" id="mwViewGroup" style="display:none">
          <label class="control-label">View</label>
          <select id="mwView" class="form-input">
            <option value="summary" selected>Summary (per plan)</option>
            <option value="detail">Detail (per colour)</option>
          </select>
        </div>

        <div class="control-group" id="mwSiblingGroup" style="display:none">
          <label class="control-label">Same OR on other machines</label>
          <label class="mw-chk" style="padding-top:8px"><input type="checkbox" id="mwSiblingOr"> Include</label>
        </div>

        <div class="control-group" id="mwScheduleGroup" style="display:none">
          <label class="control-label">Machine finish schedule</label>
          <label class="mw-chk" style="padding-top:8px"><input type="checkbox" id="mwSchedule"> All machines, plan-by-plan finish times</label>
        </div>

        <div class="control-group" id="maintPeriodGroup" style="display:none">
          <label class="control-label">Period</label>
          <select id="maintPeriod" class="form-input">
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </div>

        <div class="control-group" id="tonnagePeriodGroup" style="display:none">
          <label class="control-label">Period</label>
          <select id="tonnagePeriod" class="form-input">
            <option value="daily">Daily (Date wise)</option>
            <option value="weekly">Weekly</option>
            <option value="monthly" selected>Monthly</option>
            <option value="yearly">Yearly</option>
          </select>
        </div>

        <div class="control-group" id="tonnageShiftGroup" style="display:none">
          <label class="control-label">Shift</label>
          <select id="tonnageShift" class="form-input">
            <option value="all" selected>Day + Night (Combined)</option>
            <option value="split">Day &amp; Night (Split)</option>
            <option value="Day">Day Only</option>
            <option value="Night">Night Only</option>
          </select>
        </div>

        <div class="control-group" id="tonnageMachineGroup" style="display:none">
          <label class="control-label">Breakdown</label>
          <select id="tonnageMachine" class="form-input">
            <option value="0" selected>Date wise only</option>
            <option value="1">Machine wise</option>
          </select>
        </div>

        <div class="control-group" id="mouldSearchGroup" style="display:none">
          <label class="control-label">Mould Name / No</label>
          <input type="text" id="mouldSearch" class="form-input" placeholder="e.g. MULTI LOOP BASKET">
        </div>

        <div class="control-group">
          <label class="control-label">From Date</label>
          <input type="date" id="dateFrom" class="form-input">
        </div>

        <div class="control-group">
          <label class="control-label">To Date</label>
          <input type="date" id="dateTo" class="form-input">
        </div>

        <button class="btn-action" onclick="generateReport()">
          <i class="bi bi-play-fill"></i> Generate Report
        </button>
      </div>

      <!-- Mould-Wise field strip (extra columns / group-by dimensions) -->
      <div id="mouldFieldStrip" style="display:none; margin-top:14px; padding-top:14px; border-top:1px dashed var(--border);">
        <div class="control-label" style="margin-bottom:8px;">Include Columns</div>
        <div style="display:flex; flex-wrap:wrap; gap:16px 22px;">
          <label class="mw-chk"><input type="checkbox" value="or_no"      onchange="onMouldFieldChange()"> OR No.</label>
          <label class="mw-chk"><input type="checkbox" value="jc_no"      onchange="onMouldFieldChange()"> JC No.</label>
          <label class="mw-chk"><input type="checkbox" value="colour" id="mwColour" disabled onchange="onMouldFieldChange()"> Colours <span style="color:var(--text-light); font-size:0.72rem;">(needs OR No.)</span></label>
          <label class="mw-chk"><input type="checkbox" value="machine"    onchange="onMouldFieldChange()"> Machine</label>
          <label class="mw-chk"><input type="checkbox" value="efficiency" onchange="onMouldFieldChange()"> Efficiency</label>
          <label class="mw-chk"><input type="checkbox" value="std_prod"   onchange="onMouldFieldChange()"> Production As Per STD</label>
          <label class="mw-chk"><input type="checkbox" value="std_cycle"  onchange="onMouldFieldChange()"> STD Cycle Time</label>
          <label class="mw-chk"><input type="checkbox" value="avg_cycle"  onchange="onMouldFieldChange()"> Average Cycle Time</label>
          <label class="mw-chk"><input type="checkbox" value="std_weight" onchange="onMouldFieldChange()"> STD Weight</label>
          <label class="mw-chk"><input type="checkbox" value="downtime"   onchange="onMouldFieldChange()"> Downtime (reason + min)</label>
          <label class="mw-chk"><input type="checkbox" value="reject_qty" onchange="onMouldFieldChange()"> Reject Qty</label>
          <label class="mw-chk"><input type="checkbox" value="reject_pct" onchange="onMouldFieldChange()"> Reject %</label>
        </div>
      </div>

      <!-- Machine-Tonnage checkbox filter (Mould-Wise only). Default: all selected. -->
      <div id="tonnageStrip" style="display:none; margin-top:14px; padding-top:14px; border-top:1px dashed var(--border);">
        <div style="display:flex; align-items:center; gap:14px; margin-bottom:8px;">
          <span class="control-label" style="margin:0;">Machine Tonnage</span>
          <label class="mw-chk"><input type="checkbox" id="tonnageAll" checked onchange="onTonnageAllChange()"> <b>All</b></label>
        </div>
        <div id="tonnageChecks" style="display:flex; flex-wrap:wrap; gap:8px 18px;">
          <span style="color:var(--text-light); font-size:0.8rem;">Loading tonnages…</span>
        </div>
      </div>
    </div>

    <!-- Data Table Card -->
    <div class="card" id="tableCard" style="display:none">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px">
        <h3 style="margin:0; font-size:1.1rem; font-weight:700">WIP Report Results</h3>
        <span id="reportStatusBadge" class="status-badge"></span>
      </div>
      <div id="eqaSummaryStrip" style="display:none; margin-bottom:15px;"></div>
      <div style="width:100%; overflow-x:auto;">
        <table id="reportTable" class="display nowrap compact" style="width:100%">
          <thead>
            <tr id="tableHeader"></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Mould-Wise Printable Report -->
    <div class="card" id="mouldReportCard" style="display:none">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px" class="no-print">
        <h3 style="margin:0; font-size:1.1rem; font-weight:700">Mould Wise Item QTY</h3>
        <div style="display:flex; gap:8px;">
          <button class="btn-action" style="background:#166534" onclick="downloadMouldExcel()">
            <i class="bi bi-file-earmark-excel"></i> Download Excel
          </button>
          <button class="btn-action" onclick="window.print()">
            <i class="bi bi-printer"></i> Print
          </button>
        </div>
      </div>
      <div id="mouldReportBody"></div>
    </div>

    <!-- Machine Finish Schedule (per-machine, plan-by-plan finish times) -->
    <div class="card" id="mwScheduleCard" style="display:none">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px" class="no-print">
        <h3 style="margin:0; font-size:1.1rem; font-weight:700">Machine Finish Schedule</h3>
        <div>
          <span id="mwScheduleCount" class="status-badge" style="margin-right:8px"></span>
          <button class="btn-action" onclick="window.print()"><i class="bi bi-printer"></i> Print</button>
        </div>
      </div>
      <div id="mwScheduleBody"></div>
    </div>

    <!-- Empty State -->
    <div id="emptyState" style="text-align:center; padding:100px 20px; color:var(--text-light)">
      <i class="bi bi-file-earmark-bar-graph" style="font-size:3rem; opacity:0.3"></i>
      <h3 style="margin-top:10px">No Report Generated</h3>
      <p>Select your filters above and click "Generate Report" to view data.</p>
    </div>
  </div>

  <script src="/assets/vendor/jquery/jquery-3.6.0.min.js"></script>
  <script src="/assets/vendor/datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="/assets/vendor/datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>
  <script src="/assets/vendor/cdnjs/jszip/3.1.3/jszip.min.js"></script>
  <script src="/assets/vendor/datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>

  <script src="/assets/app.min.js"></script>
  <script>
    let reportTable = null;

    document.addEventListener('DOMContentLoaded', async () => {
      JPSMS.auth.requireAuth();
      JPSMS.renderShell('reports');

      initFilters();
      ['factorySelector', 'dateFrom', 'dateTo'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('change', onMdhFilterChange);
      });
      const params = new URLSearchParams(window.location.search);
      if (params.get('view') === 'jms-plan') {
        document.getElementById('reportType').value = 'jms-plan';
      }

      // Auto-set current month dates
      const now = new Date();
      const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
      const today = now.toISOString().split('T')[0];
      document.getElementById('dateFrom').value = firstDay;
      document.getElementById('dateTo').value = today;

      // Deep-link from the Machine Timeline: ?view=machine-wise[&machine=..][&mwview=summary|detail]
      if (params.get('view') === 'machine-wise') {
        document.getElementById('reportType').value = 'machine-wise';
        onReportTypeChange();
        await loadMwMachines();
        const m = params.get('machine');
        if (m) document.getElementById('mwMachine').value = m;
        if (params.get('mwview') === 'detail') document.getElementById('mwView').value = 'detail';
        generateReport();
      }
    });

    async function initFilters() {
      const selector = document.getElementById('factorySelector');
      const factories = JPSMS.factories.getAllowed();
      const canAll = JPSMS.factories.canSelectAll();
      
      let html = canAll ? '<option value="">All Factories</option>' : '';
      factories.forEach(f => {
        html += `<option value="${f.id}">${f.name}</option>`;
      });
      selector.innerHTML = html;

      // Default to current scope if available
      const scope = JPSMS.factories.getCurrentScope();
      if (scope.id) selector.value = scope.id;
    }

    function onReportTypeChange() {
      const type = document.getElementById('reportType').value;
      const isMould = type === 'mould-wise-qty';
      document.getElementById('mouldSearchGroup').style.display = isMould ? 'flex' : 'none';
      document.getElementById('mouldFieldStrip').style.display = isMould ? 'block' : 'none';
      document.getElementById('tonnageStrip').style.display = isMould ? 'block' : 'none';
      if (isMould) loadTonnages();
      document.getElementById('maintPeriodGroup').style.display = type === 'machine-maintenance' ? 'flex' : 'none';
      document.getElementById('tonnagePeriodGroup').style.display = type === 'tonnage' ? 'flex' : 'none';
      document.getElementById('tonnageShiftGroup').style.display = type === 'tonnage' ? 'flex' : 'none';
      document.getElementById('tonnageMachineGroup').style.display = type === 'tonnage' ? 'flex' : 'none';
      const isMw = type === 'machine-wise';
      document.getElementById('mwMachineGroup').style.display = isMw ? 'flex' : 'none';
      document.getElementById('mwViewGroup').style.display = isMw ? 'flex' : 'none';
      document.getElementById('mwSiblingGroup').style.display = isMw ? 'flex' : 'none';
      document.getElementById('mwScheduleGroup').style.display = isMw ? 'flex' : 'none';
      const isMdh = type === 'machine-date-history';
      document.getElementById('mdhMachineGroup').style.display = isMdh ? 'flex' : 'none';
      document.getElementById('mdhShiftGroup').style.display = isMdh ? 'flex' : 'none';
      if (isMw) loadMwMachines();
      if (isMdh) {
        // Reflect the "last 2 months" default in the visible date fields (the page
        // otherwise pre-fills the current month). The user can still change them.
        const now = new Date();
        const twoMonthsAgo = new Date(now.getFullYear(), now.getMonth() - 2, now.getDate());
        document.getElementById('dateFrom').value = twoMonthsAgo.toISOString().split('T')[0];
        document.getElementById('dateTo').value = now.toISOString().split('T')[0];
        loadMdhMachines();
      }
    }

    // When the factory or dates change while the Machine Date-Wise History report is
    // active, refresh the machine dropdown so its options match the new window.
    function onMdhFilterChange() {
      const type = document.getElementById('reportType').value;
      if (type === 'machine-date-history') {
        loadMdhMachines();
      }
      // Refresh tonnage options when the factory changes (cached per-factory, so
      // a date change is a no-op).
      if (type === 'mould-wise-qty') {
        loadTonnages();
      }
    }

    // Build the date-range query for the machine-date-history endpoint. Returns
    // { ok, qs } or { ok:false, error } — a half-filled range (only From or only To)
    // is rejected rather than silently falling back to the 2-month default.
    function mdhRangeQuery() {
      const from = document.getElementById('dateFrom').value;
      const to = document.getElementById('dateTo').value;
      if ((from && !to) || (!from && to)) {
        return { ok: false, error: 'Enter both From and To dates, or leave both blank for the last 2 months.' };
      }
      return { ok: true, qs: (from && to) ? `&from=${from}&to=${to}` : `&months=2` };
    }

    // Machines that actually have production in the window — guarantees the dropdown
    // values match the DPR data the report queries.
    async function loadMdhMachines() {
      const sel = document.getElementById('mdhMachine');
      const range = mdhRangeQuery();
      if (!range.ok) {
        sel.innerHTML = '<option value="">Select machine…</option>';
        JPSMS.toast(range.error, 'error');
        return;
      }
      try {
        const factoryId = document.getElementById('factorySelector').value;
        const res = await JPSMS.api.get(`/reports/machine-date-history?factory_id=${factoryId}${range.qs}`);
        const machines = (res && res.machines) || [];
        const escLocal = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const prev = sel.value;
        sel.innerHTML = '<option value="">Select machine…</option>' +
          machines.map(m => `<option value="${escLocal(m)}">${escLocal(m)}</option>`).join('');
        if (prev && machines.includes(prev)) sel.value = prev;
      } catch (e) {
        console.warn('loadMdhMachines failed', e);
        // Clear stale options so a machine from an earlier window can't be generated.
        sel.innerHTML = '<option value="">Select machine…</option>';
        JPSMS.toast('Could not load machines for this range. Adjust the filters and retry.', 'error');
      }
    }

    let _mwMachinesLoaded = false;
    async function loadMwMachines() {
      if (_mwMachinesLoaded) return;
      try {
        const factoryId = document.getElementById('factorySelector').value;
        const res = await JPSMS.api.get(`/planning/board${factoryId ? `?factory_id=${factoryId}` : ''}`);
        const plans = (res && res.data && res.data.plans) || [];
        const machines = [...new Set(plans.map(p => p.machine).filter(Boolean))].sort();
        const escLocal = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const sel = document.getElementById('mwMachine');
        sel.innerHTML = '<option value="">All Machines</option>' +
          machines.map(m => `<option value="${escLocal(m)}">${escLocal(m)}</option>`).join('');
        _mwMachinesLoaded = true;
      } catch (e) { console.warn('loadMwMachines failed', e); }
    }

    function onMouldFieldChange() {
      // Colour is only meaningful when grouped by OR No.
      const orNo = document.querySelector('#mouldFieldStrip input[value="or_no"]');
      const colour = document.getElementById('mwColour');
      colour.disabled = !orNo.checked;
      if (!orNo.checked) colour.checked = false;
    }

    function getSelectedMouldFields() {
      return Array.from(
        document.querySelectorAll('#mouldFieldStrip input[type="checkbox"]:checked')
      ).map(c => c.value);
    }

    // --- Machine Tonnage filter (checkboxes, default all selected) ---
    let _tonnagesLoadedFor = null;
    async function loadTonnages(force) {
      const factoryId = document.getElementById('factorySelector').value || '';
      if (!force && _tonnagesLoadedFor === factoryId) return;
      const box = document.getElementById('tonnageChecks');
      try {
        const res = await JPSMS.api.get(`/reports/machine-tonnages?factory_id=${factoryId}`);
        const list = (res && res.data) || [];
        _tonnagesLoadedFor = factoryId;
        if (!list.length) {
          box.innerHTML = '<span style="color:var(--text-light); font-size:0.8rem;">No machine tonnages found for this factory.</span>';
          document.getElementById('tonnageAll').checked = true;
          return;
        }
        box.innerHTML = list.map(t =>
          `<label class="mw-chk"><input type="checkbox" class="tonnage-chk" value="${t}" checked onchange="onTonnageItemChange()"> ${t}T</label>`
        ).join('');
        document.getElementById('tonnageAll').checked = true;
      } catch (e) {
        box.innerHTML = '<span style="color:var(--text-light); font-size:0.8rem;">Could not load tonnages.</span>';
      }
    }
    function onTonnageAllChange() {
      const all = document.getElementById('tonnageAll').checked;
      document.querySelectorAll('.tonnage-chk').forEach(c => { c.checked = all; });
    }
    function onTonnageItemChange() {
      const boxes = Array.from(document.querySelectorAll('.tonnage-chk'));
      document.getElementById('tonnageAll').checked = boxes.length > 0 && boxes.every(c => c.checked);
    }
    // Returns '' when all (or none available) are selected → backend treats as "all".
    function getTonnagesParam() {
      const boxes = Array.from(document.querySelectorAll('.tonnage-chk'));
      if (!boxes.length) return '';
      const checked = boxes.filter(c => c.checked).map(c => c.value);
      if (checked.length === boxes.length) return '';        // all → no filter
      return checked.join(',');
    }

    // Styled Excel download of the current Mould-Wise report (server-generated).
    async function downloadMouldExcel() {
      const factoryId = document.getElementById('factorySelector').value || '';
      const from = document.getElementById('dateFrom').value;
      const to = document.getElementById('dateTo').value;
      const search = encodeURIComponent(document.getElementById('mouldSearch').value.trim());
      const fields = encodeURIComponent(getSelectedMouldFields().join(','));
      const tonnages = encodeURIComponent(getTonnagesParam());
      const url = `/api/reports/mould-wise-qty.xlsx?factory_id=${factoryId}&from=${from}&to=${to}&q=${search}&fields=${fields}&tonnages=${tonnages}`;
      const headers = {};
      const token = localStorage.getItem('token');
      if (token) headers['Authorization'] = `Bearer ${token}`;
      try { const u = JSON.parse(localStorage.getItem('user') || '{}'); if (u && u.username) headers['X-User-Name'] = u.username; } catch (e) {}
      if (factoryId) headers['X-Factory-ID'] = factoryId;
      try {
        JPSMS.toast('Preparing Excel…', 'info');
        const res = await fetch(url, { headers });
        if (!res.ok) throw new Error(`Download failed (${res.status})`);
        const blob = await res.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Mould_Wise_Item_QTY_${from || 'all'}_${to || 'all'}.xlsx`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      } catch (e) {
        JPSMS.toast(e.message || 'Excel download failed', 'error');
      }
    }

    async function generateReport() {
      const type = document.getElementById('reportType').value;
      const factoryId = document.getElementById('factorySelector').value;
      const from = document.getElementById('dateFrom').value;
      const to = document.getElementById('dateTo').value;

      try {
        let endpoint;
        if (type === 'jms-plan') {
          endpoint = `/reports/jms-plan?factory_id=${factoryId}&from=${from}&to=${to}`;
        } else if (type === 'mould-wise-qty') {
          const search = encodeURIComponent(document.getElementById('mouldSearch').value.trim());
          const fields = getSelectedMouldFields().join(',');
          const tonnages = encodeURIComponent(getTonnagesParam());
          endpoint = `/reports/mould-wise-qty?factory_id=${factoryId}&from=${from}&to=${to}&q=${search}&fields=${encodeURIComponent(fields)}&tonnages=${tonnages}`;
        } else if (type === 'extra-qty-allowed') {
          endpoint = `/reports/extra-qty-allowed?from=${from}&to=${to}`;
        } else if (type === 'machine-maintenance') {
          const period = document.getElementById('maintPeriod').value;
          endpoint = `/reports/machine-maintenance?from=${from}&to=${to}&group=${period}`;
        } else if (type === 'tonnage') {
          const period = document.getElementById('tonnagePeriod').value;
          const shift = document.getElementById('tonnageShift').value;
          const machine = document.getElementById('tonnageMachine').value;
          endpoint = `/reports/tonnage?factory_id=${factoryId}&from=${from}&to=${to}&group=${period}&shift=${shift}&machine=${machine}`;
        } else if (type === 'machine-wise') {
          const schedule = document.getElementById('mwSchedule').checked;
          // Finish-schedule mode forces ALL machines + summary view (one row per plan).
          const mwMachine = schedule ? '' : encodeURIComponent(document.getElementById('mwMachine').value || '');
          const mwView = schedule ? 'summary' : (document.getElementById('mwView').value || 'summary');
          const sibling = document.getElementById('mwSiblingOr').checked ? '1' : '0';
          endpoint = `/reports/machine-wise?factory_id=${factoryId}&machine=${mwMachine}&view=${mwView}&includeSiblingOr=${sibling}`;
        } else if (type === 'machine-date-history') {
          const machine = encodeURIComponent(document.getElementById('mdhMachine').value || '');
          if (!machine) { JPSMS.toast('Select a machine first.', 'error'); return; }
          const range = mdhRangeQuery();
          if (!range.ok) { JPSMS.toast(range.error, 'error'); return; }
          const splitShift = document.getElementById('mdhSplitShift').checked ? '&split_shift=1' : '';
          endpoint = `/reports/machine-date-history?factory_id=${factoryId}&machine=${machine}${range.qs}${splitShift}`;
        } else {
          endpoint = `/reports/wip?type=${type}&factory_id=${factoryId}&from=${from}&to=${to}`;
        }
        const res = await JPSMS.api.get(endpoint);

        if (res.ok) {
          if (type === 'mould-wise-qty') {
            renderMouldReport(res.data, getSelectedMouldFields());
          } else if (type === 'tonnage') {
            window._tonnageGroup = res.group || 'monthly';
            window._tonnageShift = res.shift || 'all';
            window._tonnageMachineWise = !!res.machineWise;
            window._tonnagePeriods = res.periods || [];
            renderReport(res.data, type, res.summary);
          } else if (type === 'machine-wise') {
            window._mwView = res.view || 'summary';
            if (document.getElementById('mwSchedule').checked) {
              renderMachineSchedule(res.data);
            } else {
              renderReport(res.data, type, null);
            }
          } else if (type === 'machine-date-history') {
            window._mdhMachine = res.machine || '';
            window._mdhSplitShift = !!res.splitShift;
            renderReport(res.data, type, null);
          } else {
            window._maintGroup = res.group || 'daily';
            renderReport(res.data, type, res.summary);
          }
        } else {
          JPSMS.toast(res.error || 'Failed to fetch report', 'error');
        }
      } catch (err) {
        console.error(err);
        JPSMS.toast(err.message || 'Error generating report', 'error');
      }
    }

    function fmtDate(iso) {
      if (!iso) return '';
      const [y, m, d] = String(iso).split('T')[0].split('-');
      return `${d}-${m}-${y}`;
    }

    function renderMouldReport(groups, fields) {
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('tableCard').style.display = 'none';
      document.getElementById('mwScheduleCard').style.display = 'none';
      const card = document.getElementById('mouldReportCard');
      const body = document.getElementById('mouldReportBody');
      card.style.display = 'block';

      if (!groups || groups.length === 0) {
        body.innerHTML = '<p style="color:var(--text-light)">No production found for this mould / date range.</p>';
        return;
      }

      const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

      const on = new Set(fields || []);

      // Leading dimension columns (before Date), in the strip's visual order.
      const leadCols = [];
      if (on.has('or_no'))   leadCols.push({ label: 'OR No.',  get: r => r.orNo, num: false });
      if (on.has('jc_no'))   leadCols.push({ label: 'JC No.',  get: r => r.jcNo, num: false });
      if (on.has('colour'))  leadCols.push({ label: 'Colour',  get: r => r.colour, num: false });
      if (on.has('machine')) leadCols.push({ label: 'Machine', get: r => r.machine, num: false });

      // Trailing metric columns (after Total).
      const metricCols = [];
      if (on.has('std_prod'))   metricCols.push({ label: 'Prod (STD)',  get: r => r.stdProd, num: true, sum: true });
      if (on.has('std_cycle'))  metricCols.push({ label: 'STD Cycle (s)', get: r => r.stdCycle || '', num: true });
      if (on.has('avg_cycle'))  metricCols.push({ label: 'Avg Cycle (s)', get: r => r.avgCycle || '', num: true, avg: true, rawKey: 'avgCycle' });
      if (on.has('std_weight')) metricCols.push({ label: 'STD Wt (kg)',  get: r => r.stdWeight || '', num: true });
      if (on.has('efficiency')) metricCols.push({ label: 'Eff %',       get: r => r.efficiency + '%', num: true });
      if (on.has('downtime'))   metricCols.push({ label: 'Downtime',    get: r => (r.downtimeMin ? r.downtimeMin + 'm' : '') + (r.downtimeReason ? ' — ' + r.downtimeReason : ''), num: false });
      if (on.has('reject_qty')) metricCols.push({ label: 'Reject Qty',  get: r => r.rejectQty, num: true, sum: true });
      if (on.has('reject_pct')) metricCols.push({ label: 'Reject %',    get: r => r.rejectPct + '%', num: true, avg: true, rawKey: 'rejectPct', pct: true });

      const totalCols = leadCols.length + 4 + metricCols.length;

      body.innerHTML = groups.map(g => {
        const rows = g.rows.map(r => `
          <tr>
            ${leadCols.map(c => `<td class="${c.num ? 'mr-num' : 'mr-label'}">${esc(c.get(r))}</td>`).join('')}
            <td class="mr-label">${fmtDate(r.date)}</td>
            <td class="mr-num">${r.day}</td>
            <td class="mr-num">${r.night}</td>
            <td class="mr-num">${r.total}</td>
            ${metricCols.map(c => `<td class="mr-num">${esc(c.get(r))}</td>`).join('')}
          </tr>`).join('');

        const headCells = [
          ...leadCols.map(c => `<td class="mr-colhead">${esc(c.label)}</td>`),
          '<td class="mr-colhead">Date</td>',
          '<td class="mr-colhead">Day</td>',
          '<td class="mr-colhead">Night</td>',
          '<td class="mr-colhead">Total</td>',
          ...metricCols.map(c => `<td class="mr-colhead">${esc(c.label)}</td>`)
        ].join('');

        // Grand-total row: blanks up to the Total column, then per-column
        // aggregates — sum for counts (Prod STD, Reject Qty), average for rates
        // (Reject %, Avg Cycle Time).
        const grandLead = leadCols.map(() => '<td></td>').join('') + '<td></td><td></td><td></td>';
        const grandMetrics = metricCols.map(c => {
          if (c.sum) {
            const s = g.rows.reduce((acc, r) => acc + (Number(c.get(r)) || 0), 0);
            return `<td>${s}</td>`;
          }
          if (c.avg) {
            // Average over meaningful rows: Reject % over produced days; Avg
            // Cycle over rows that actually ran (cycle > 0).
            const src = g.rows.filter(r => c.rawKey === 'rejectPct'
              ? Number(r.total) > 0
              : Number(r[c.rawKey]) > 0);
            if (!src.length) return '<td></td>';
            const avg = src.reduce((a, r) => a + Number(r[c.rawKey] || 0), 0) / src.length;
            const val = Math.round(avg * 100) / 100;
            return `<td>${c.pct ? val + '%' : val}</td>`;
          }
          return '<td></td>';
        }).join('');

        const title = esc(g.mouldName || g.mouldNo || 'Unknown Mould');
        return `
          <table class="mould-report-table">
            <tr>
              <td class="mr-label">Mould Name</td>
              <td class="mr-mould-name" colspan="${totalCols - 1}">${title}</td>
            </tr>
            <tr>${headCells}</tr>
            ${rows}
            <tr class="mr-grand">
              ${grandLead}<td>${g.grandTotal}</td>${grandMetrics}
            </tr>
          </table>`;
      }).join('');
    }

    function tonnagePeriodLabel(v, group) {
      if (!v) return '';
      if (group === 'daily') return fmtDate(v);
      if (group === 'yearly') return String(v).slice(0, 4);
      if (group === 'monthly') {
        const [y, m] = String(v).split('-');
        const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return `${names[Number(m) - 1] || m} ${y}`;
      }
      return 'Week of ' + fmtDate(v); // weekly
    }

    function renderTonnageSummary(summary, periods, group, shift) {
      const strip = document.getElementById('eqaSummaryStrip');
      if (!summary) { strip.style.display = 'none'; strip.innerHTML = ''; return; }
      const split = shift === 'split';
      const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const t = v => Number(v || 0).toLocaleString('en-IN', { minimumFractionDigits: 3, maximumFractionDigits: 3 }) + ' T';
      const pill = (label, val, color) =>
        `<span style="background:${color}12;color:${color};border:1px solid ${color}44;border-radius:8px;padding:4px 12px;font-weight:800;font-size:0.78rem;white-space:nowrap">${esc(label)}: ${esc(val)}</span>`;
      const shiftLabel = shift === 'Day' ? ' (Day)' : shift === 'Night' ? ' (Night)' : '';

      const colspan = split ? 5 : 4;
      const periodRows = (periods || []).map(p => `
        <tr>
          <td style="text-align:left;padding:6px 12px;border-bottom:1px solid var(--border)">${esc(tonnagePeriodLabel(p.period_start, group))}</td>
          ${split ? `<td style="text-align:left;padding:6px 12px;border-bottom:1px solid var(--border);font-weight:700">${esc(p.shift || '')}</td>` : ''}
          <td style="text-align:right;padding:6px 12px;border-bottom:1px solid var(--border);color:#16a34a;font-weight:700">${t(p.good_tonnage)}</td>

          <td style="text-align:right;padding:6px 12px;border-bottom:1px solid var(--border);font-weight:800">${t(p.overall_tonnage)}</td>

      strip.innerHTML = `
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
          ${pill('Good Tonnage' + shiftLabel, t(summary.good_tonnage), '#16a34a')}
          ${pill('Reject Tonnage' + shiftLabel, t(summary.reject_tonnage), '#dc2626')}
          ${pill('Overall Tonnage' + shiftLabel, t(summary.overall_tonnage), '#2563eb')}
          ${pill('Reject %', Number(summary.reject_pct || 0).toFixed(2) + '%', '#b45309')}
        </div>
        <div style="overflow-x:auto">
          <table style="border-collapse:collapse;min-width:420px;font-size:0.8rem">
            <thead>
              <tr>
                ${th(group === 'daily' ? 'Date' : 'Period', 'left')}
                ${split ? th('Shift', 'left') : ''}
                ${th('Good', 'right')}
                ${th('Reject', 'right')}
                ${th('Overall', 'right')}
              </tr>
            </thead>
            <tbody>${periodRows || `<tr><td colspan="${colspan}" style="padding:8px 12px;color:var(--text-light)">No data</td></tr>`}</tbody>
          </table>
        </div>`;
    }

    // Machine Finish Schedule: all machines, each with its running + queued plans
    // laid out left-to-right in queue order, each showing its finish (Exp End) time.
    function renderMachineSchedule(data) {
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('tableCard').style.display = 'none';
      document.getElementById('mouldReportCard').style.display = 'none';
      document.getElementById('mwScheduleCard').style.display = 'block';

      const escL = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const fmtFinish = iso => {
        if (!iso) return '—';
        const dt = new Date(iso);
        if (isNaN(dt.getTime())) return '—';
        const p = n => String(n).padStart(2, '0');
        return `${p(dt.getDate())}-${p(dt.getMonth() + 1)}-${dt.getFullYear()} ${p(dt.getHours())}:${p(dt.getMinutes())} Hrs`;
      };

      const groups = [];
      const idx = new Map();
      (data || []).forEach(r => {
        const m = r.machine || '—';
        if (!idx.has(m)) { idx.set(m, groups.length); groups.push({ machine: m, plans: [] }); }
        groups[idx.get(m)].plans.push(r);
      });
      document.getElementById('mwScheduleCount').textContent = `${groups.length} machine${groups.length === 1 ? '' : 's'}`;

      let html = '';
      if (!groups.length) {
        html = '<div style="color:var(--text-light);padding:20px">No running or queued plans found.</div>';
      }
      groups.forEach(g => {
        const cells = g.plans.map((p, i) => `
          <span style="display:inline-block;min-width:196px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:8px 11px;font-size:.82rem;line-height:1.45;vertical-align:top">
            <b>Plan ${p.planQueued || i + 1}</b> <span style="color:#64748b">${escL(p.planId || '')}</span><br>
            <span style="color:#334155">${escL(p.mouldName || '')}</span><br>
            <span style="color:#64748b;font-size:.76rem">${escL(p.orNo || '')}</span><br>
            <span style="color:#0369a1;font-weight:800">Finish: ${fmtFinish(p.expEndDate)}</span>
          </span>`).join('<span style="align-self:center;color:#94a3b8;font-weight:900;padding:0 2px">→</span>');
        html += `
          <div style="display:flex;gap:14px;align-items:flex-start;padding:12px 6px;border-bottom:1px solid var(--border)">
            <div style="flex:0 0 190px;font-weight:800;color:var(--text);padding-top:6px">${escL(g.machine)}</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:stretch">${cells || '<span style="color:var(--text-light);padding-top:8px">No plans</span>'}</div>
          </div>`;
      });
      document.getElementById('mwScheduleBody').innerHTML = html;
    }

    function renderReport(data, type, summary) {
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('mouldReportCard').style.display = 'none';
      document.getElementById('mwScheduleCard').style.display = 'none';
      document.getElementById('tableCard').style.display = 'block';
      if (type === 'extra-qty-allowed') renderEqaSummary(summary);
      else if (type === 'machine-maintenance') renderMaintSummary(summary);
      else if (type === 'tonnage') renderTonnageSummary(summary, window._tonnagePeriods, window._tonnageGroup || 'monthly', window._tonnageShift || 'all');
      else renderEqaSummary(null);

      const badge = document.getElementById('reportStatusBadge');
      badge.textContent = type === 'jms-plan' ? 'JMS Plan'
        : type === 'extra-qty-allowed' ? 'Extra Allowed QTY By PPC'
        : type === 'machine-maintenance' ? `Machine Maintenance (${(window._maintGroup || 'daily')})`
        : type === 'tonnage' ? `Tonnage (${(window._tonnageGroup || 'monthly')}${(window._tonnageShift && window._tonnageShift !== 'all') ? ' · ' + (window._tonnageShift === 'split' ? 'Day+Night' : window._tonnageShift) : ''})`
        : type === 'machine-wise' ? `Machine-Wise Plan (${window._mwView === 'detail' ? 'Detail · per colour' : 'Summary · per plan'})`
        : type === 'machine-date-history' ? `Machine Date-Wise History${window._mdhMachine ? ' · ' + window._mdhMachine : ''}${window._mdhSplitShift ? ' · Day/Night' : ''}`
        : (type === 'summary' ? 'Summary View' : 'Detailed View');
      badge.className = 'status-badge ' + (type === 'summary' ? 'badge-summary' : 'badge-detail');

      if (reportTable) {
        reportTable.destroy();
        document.getElementById('tableHeader').innerHTML = '';
        document.getElementById('tableBody').innerHTML = '';
      }

      let columns = [];
      if (type === 'jms-plan') {
        columns = [
          { title: "OR/JR No", data: "orJrNo" },
          { title: "JR Date", data: "jrDate", render: v => v ? String(v).split('T')[0] : '' },
          { title: "Our Code", data: "ourCode" },
          { title: "BomType (Client Name)", data: "bomType" },
          { title: "JR Item Name", data: "jrItemName" },
          { title: "JR Qty", data: "jrQty" },
          { title: "UOM", data: "uom" },
          { title: "Plan Date", data: "planDate", render: v => v ? String(v).split('T')[0] : '' },
          { title: "Plan Qty", data: "planQty" },
          { title: "Mould No", data: "mouldNo" },
          { title: "Mould", data: "mould" },
          { title: "Mould Item Qty", data: "mouldItemQty" },
          { title: "Tonnage", data: "tonnage" },
          { title: "Machine", data: "machine" },
          { title: "Cycle Time", data: "cycleTime" },
          { title: "Cavity", data: "cavity" },
          { title: "Batch No.", data: "batchNo" },
          { title: "Batch Qty", data: "batchQty" },
          { title: "Consumption Ratio Qty", data: "consumptionRatioQty" },
          { title: "Who Create User Name", data: "createdBy" },
          { title: "Timestamp", data: "timestamp", render: v => v ? new Date(v).toLocaleString('en-IN') : '' }
        ];
      } else if (type === 'extra-qty-allowed') {
        columns = [
          { title: "Allowed At", data: "allowed_at", render: v => v ? new Date(v).toLocaleString('en-IN') : '' },
          { title: "Allowed By", data: "allowed_by" },
          { title: "Role", data: "allowed_role" },
          { title: "OR/JR No", data: "order_no" },
          { title: "JC No", data: "jc_no" },
          { title: "Plan ID", data: "plan_id" },
          { title: "Machine", data: "machine" },
          { title: "Mould", data: "mould_name" },
          { title: "Colour", data: "colour" },
          { title: "Extra Qty", data: "extra_qty" },
          { title: "Why (Remarks)", data: "remarks" }
        ];
      } else if (type === 'machine-maintenance') {
        const group = window._maintGroup || 'daily';
        const periodTitle = group === 'monthly' ? 'Month' : group === 'weekly' ? 'Week Starting' : 'Date';
        columns = [
          { title: periodTitle, data: "period_start", render: v => {
              if (!v) return '';
              if (group === 'monthly') return String(v).slice(0, 7);
              return fmtDate(v);
            } },
          { title: "Machine", data: "machine" },
          { title: "Maintenance Downtime (Hrs)", data: "maint_min", render: v => (Number(v || 0) / 60).toFixed(1) },
          { title: "Maintenance Downtime (Min)", data: "maint_min" },
          { title: "Entries", data: "entry_count" }
        ];
      } else if (type === 'tonnage') {
        const group = window._tonnageGroup || 'monthly';
        const tCell = v => Number(v || 0).toLocaleString('en-IN', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
        columns = [
          { title: group === 'daily' ? "Date" : "Period", data: "period_start", render: v => tonnagePeriodLabel(v, group) },
          ...(window._tonnageShift === 'split' ? [{ title: "Shift", data: "shift" }] : []),
          ...(window._tonnageMachineWise ? [{ title: "Machine", data: "machine" }] : []),
          { title: "Good Tonnage (T)", data: "good_tonnage", render: tCell },
          { title: "Reject Tonnage (T)", data: "reject_tonnage", render: tCell },
          { title: "Overall Tonnage (T)", data: "overall_tonnage", render: tCell },
          { title: "Reject %", data: null, render: (d, t, row) => {
              const o = Number(row.overall_tonnage || 0);
              return o > 0 ? (Number(row.reject_tonnage || 0) / o * 100).toFixed(2) + '%' : '0%';
            } }
        ];
      } else if (type === 'machine-wise') {
        const isDetail = (window._mwView === 'detail');
        const d = v => v ? fmtDate(v) : '';
        const dt = v => v ? new Date(v).toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
        const num = v => (v == null || v === '') ? '' : Number(v).toLocaleString('en-IN');
        columns = [
          { title: "Machine", data: "machine" },
          { title: "OR No", data: "orNo" },
          { title: "OR Date", data: "orDate", render: d },
          { title: "JC No", data: "jcNo" },
          { title: "JC Date", data: "jcDate", render: d },
          { title: "Plan ID", data: "planId" },
          { title: "Mould No", data: "mouldNo" },
          { title: "Mould Name", data: "mouldName" },
          { title: "Qty", data: "qty", render: num },
          { title: "Bal Qty", data: "balQty", render: num },
          ...(isDetail ? [{ title: "Colour", data: "colour" }] : []),
          { title: "Start Date", data: "startDate", render: d },
          { title: "End Date", data: "endDate", render: d },
          { title: "Exp. End Date", data: "expEndDate", render: dt },
          { title: "Total Plan Time (Hrs)", data: "totalPlanTime", render: v => v == null ? '' : Number(v).toFixed(2) },
          { title: "Rem Bal Qty", data: "remBalQty", render: num },
          { title: "Plan Queued", data: "planQueued" }
        ];
      } else if (type === 'machine-date-history') {
        const num = v => (v == null || v === '') ? '' : Number(v).toLocaleString('en-IN');
        const txt = $.fn.dataTable.render.text();
        columns = [
          { title: "Date", data: "date", render: v => v ? fmtDate(v) : '' },
          ...(window._mdhSplitShift ? [{ title: "Shift", data: "shift", render: txt }] : []),
          { title: "Mould No", data: "mouldNo", render: txt },
          { title: "Mould Name", data: "mouldName", render: txt },
          { title: "Good Qty", data: "goodQty", render: num },
          { title: "Reject Qty", data: "rejectQty", render: num }
        ];
      } else if (type === 'summary') {
        columns = [
          { title: "Unit", data: "factory_unit" },
          { title: "Item Code", data: "item_code" },
          { title: "Item Name", data: "item_name" },
          { title: "UOM", data: "uom" },
          { title: "Prev Stock", data: "previous_stock_qty" },
          { title: "Current Stock", data: "current_stock_available_qty" },
          { title: "Total Qty", data: "total_qty" },
          { title: "Entries", data: "entries_count" }
        ];
      } else {
        columns = [
          { title: "Date", data: "stock_date", render: v => v ? v.split('T')[0] : '' },
          { title: "Unit", data: "factory_unit" },
          { title: "Item Code", data: "item_code" },
          { title: "Item Name", data: "item_name" },
          { title: "Job No", data: "job_no" },
          { title: "Job Date", data: "job_date", render: v => v ? v.split('T')[0] : '' },
          { title: "Total Qty", data: "total_qty" },
          { title: "UOM", data: "uom" },
          { title: "Status", data: "row_status" },
          { title: "Remarks", data: "remark_from_factory_unit" }
        ];
      }

      reportTable = $('#reportTable').DataTable({
        data: data,
        columns: columns,
        pageLength: 25,
        // Machine-Wise report is already returned in natural machine order
        // (…-6, -7, -8, -10, -11) with each machine's queue in sequence — keep
        // that server order instead of letting DataTables re-sort Machine as text.
        order: (type === 'machine-wise' || type === 'machine-date-history') ? [] : undefined,
        dom: 'Bfrtip',
        buttons: [
          {
            extend: 'excelHtml5',
            title: (type === 'jms-plan' ? 'JMS Plan Report' : type === 'extra-qty-allowed' ? 'Extra Allowed QTY By PPC' : type === 'machine-maintenance' ? 'Machine Maintenance Report' : type === 'tonnage' ? 'Tonnage Report' : type === 'machine-wise' ? ('Machine-Wise Plan Report (' + (window._mwView === 'detail' ? 'Detail' : 'Summary') + ')') : type === 'machine-date-history' ? ('Machine Date-Wise History' + (window._mdhMachine ? ' - ' + window._mdhMachine : '')) : 'WIP Report') + ' - ' + new Date().toLocaleString('en-IN'),
            className: 'btn-dt'
          },
          {
            extend: 'csvHtml5',
            title: (type === 'jms-plan' ? 'JMS Plan Report' : type === 'extra-qty-allowed' ? 'Extra Allowed QTY By PPC' : type === 'machine-maintenance' ? 'Machine Maintenance Report' : type === 'tonnage' ? 'Tonnage Report' : type === 'machine-wise' ? ('Machine-Wise Plan Report (' + (window._mwView === 'detail' ? 'Detail' : 'Summary') + ')') : type === 'machine-date-history' ? ('Machine Date-Wise History' + (window._mdhMachine ? ' - ' + window._mdhMachine : '')) : 'WIP Report') + ' - ' + new Date().toLocaleString('en-IN'),
             className: 'btn-dt'
          }
        ],
        order: [[0, 'desc']],
        responsive: true
      });
    }
  </script>
</body>

</html>
