            const dayMs = v => { const d = day(v); return d ? new Date(d + 'T00:00:00').getTime() : null; };
            function fd(v, withTime) {
                if (!v) return '—';
                const s = String(v);
                const d = /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s + 'T00:00:00') : new Date(s);
                if (isNaN(d)) return '—';
                let out = `${d.getDate()} ${MON[d.getMonth()]}`;
                if (d.getFullYear() !== new Date().getFullYear()) out += ` ${String(d.getFullYear()).slice(2)}`;
                if (withTime && !/^\d{4}-\d{2}-\d{2}$/.test(s)) out += `, ${d.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' })}`;
                return out;
            }
            const hrs = h => h == null ? '—' : h < 1 ? `${Math.max(1, Math.round(h * 60))} min` : h < 48 ? `${h.toFixed(1)} h` : `${(h / 24).toFixed(1)} days`;
            const LABEL = { NOT_STARTED: 'Not started', NOT_PLANNED: 'No machine', IN_PROGRESS: 'In progress', RUNNING: 'Running', COMPLETE: 'Complete', PAUSED: 'Paused', PLANNED: 'Planned', QUEUED: 'Queued', IDLE: 'Idle', LATE: 'Late' };
            const pill = s => `<span class="pill s-${esc(s)}">${esc(LABEL[s] || s)}</span>`;
            const track = (pct, cls) => `<div class="track ${cls || ''}"><i style="width:${Math.max(0, Math.min(100, pct || 0))}%"></i></div>`;
            const isLate = o => o.status !== 'COMPLETE' && (o.delayed || (o.target_date && day(o.target_date) < todayStr()));
            const short = s => String(s || '').replace(/\s+/g, ' ').trim();
            /* never round up to 100 until it is really done */
            const pf = p => { const v = Number(p || 0); return v >= 100 ? '100%' : v >= 99 ? (Math.floor(v * 10) / 10) + '%' : Math.floor(v) + '%'; };
            /* how a mould stands against the order's target: tone, headline, detail */
            const slack = h => h == null ? '' : (Math.abs(h) < 24 ? Math.round(Math.abs(h)) + ' h' : (Math.abs(h) / 24).toFixed(1) + ' days');
            function startInfo(m) {
                switch (m.start_state) {
                    case 'DONE': return { tone: 'good', ic: 'bi-check-circle-fill', t: 'Done', d: 'completed ' + fd(m.completed_on) };
                    case 'ON_TRACK': return { tone: 'run', ic: 'bi-play-circle-fill', t: 'Running, on time', d: slack(m.slack_hours) + ' to spare' };
                    case 'FINISH_LATE': return { tone: 'bad', ic: 'bi-exclamation-octagon-fill', t: 'Running, finishes late', d: slack(m.slack_hours) + ' after target' };
                    case 'RUNNING': return { tone: 'run', ic: 'bi-play-circle-fill', t: 'Running', d: 'no rate yet' };
                    case 'ON_TIME': return { tone: 'good', ic: 'bi-calendar-check', t: 'Starts on time', d: slack(m.slack_hours) + ' before must-start' };
                    case 'START_LATE': return { tone: 'bad', ic: 'bi-alarm-fill', t: 'Will start late', d: slack(m.slack_hours) + ' after must-start' };
                    case 'NEEDS_MACHINE': return { tone: 'warn', ic: 'bi-cpu', t: 'Needs a machine', d: 'start within ' + slack(m.slack_hours) };
                    case 'OVERDUE': return { tone: 'bad', ic: 'bi-exclamation-triangle-fill', t: 'Should have started', d: slack(m.slack_hours) + ' ago, no machine' };
                    case 'NO_TARGET': return { tone: 'grey', ic: 'bi-dash-circle', t: 'No target date', d: 'set it in ERP' };
                    default: return { tone: 'grey', ic: 'bi-question-circle', t: 'No rate', d: 'no standard or DPR rate' };
                }
            }
            const stHtml = m => { const i = startInfo(m); return `<span class="st ${i.tone}"><span class="t"><i class="bi ${i.ic}"></i>${i.t}</span><span class="d">${esc(i.d)}</span></span>`; };

            function stamp(ok) {
                $('live').classList.toggle('off', !ok);
                $('upd').textContent = ok ? `Updated ${new Date().toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' })} · refreshes every minute` : 'Could not refresh, retrying';
            }
            const kpi = (ic, tone, v, l, f) => `<div class="kpi" ${f != null ? `data-f="${f}"` : ''}><div class="ic t-${tone}"><i class="bi ${ic}"></i></div><div><div class="v">${v}</div><div class="l">${l}</div></div></div>`;

            /* ================================================== ORDER LIST */
            async function loadOrders() {
                const q = $('q').value.trim();
                const res = await JPSMS.api.request(`/order-tracker/orders?scope=${$('scope').value}${q ? '&q=' + encodeURIComponent(q) : ''}`, { skipLoader: true });
                S.orders = res.data || [];
                renderOrders();
            }

            const OFILTERS = [['', 'All'], ['RUNNING', 'Running'], ['LATE', 'Late'], ['LATESTART', 'Mould late'], ['PAUSED', 'Paused'], ['NOT_STARTED', 'Not started'], ['UNSCHED', 'No end date'], ['COMPLETE', 'Complete']];
            const omatch = (o, f) => !f || (f === 'LATE' ? isLate(o) : f === 'LATESTART' ? o.late_starts > 0 : f === 'UNSCHED' ? (o.status !== 'COMPLETE' && !o.expected_end) : o.status === f);

            function nextLine(o) {
                const n = o.next_start;
                if (!n) return '';
                const i = startInfo(n);
                const when = n.must_start_by ? 'must start by <b>' + fd(n.must_start_by, true) + '</b>' : 'no target date';
                return `<div class="nextl ${i.tone}"><i class="bi ${i.ic}"></i><span>Next: <b>${esc(short(n.mould_name))}</b> ${when}${n.machine ? ' · queued on ' + esc(n.machine) : ' · no machine yet'}</span></div>`;
            }

            function renderOrders() {
                const O = S.orders;
                const machines = new Set(O.flatMap(o => o.running_machines)).size;
                $('okpis').innerHTML = [
                    kpi('bi-receipt', 'grey', O.length, 'Orders in view', ''),
                    kpi('bi-play-circle', 'blue', O.filter(o => o.status === 'RUNNING').length, `Running · ${machines} machine${machines === 1 ? "" : "s"}`, 'RUNNING'),
                    kpi('bi-box-seam', 'green', n0(O.reduce((s, o) => s + o.sets_made, 0)), `Sets made of ${n0(O.reduce((s, o) => s + o.order_qty, 0))}`, null),
                    kpi('bi-alarm', 'red', O.filter(isLate).length, 'Late or at risk', 'LATE'),
                    kpi('bi-hourglass-split', 'amber', O.filter(o => o.late_starts > 0).length, 'Orders with a late mould', 'LATESTART')
                ].join('');
                $('ochips').innerHTML = OFILTERS.map(([f, l]) => `<span class="chip ${S.ofilter === f ? 'on' : ''}" data-of="${f}">${l}<span class="n">${O.filter(o => omatch(o, f)).length}</span></span>`).join('');

                const sort = $('sort').value;
                const rows = O.filter(o => omatch(o, S.ofilter)).sort((a, b) =>
                    sort === 'pct' ? a.pct - b.pct
                        : sort === 'date' ? String(b.order_date || '').localeCompare(String(a.order_date || ''))
                            : (Number(isLate(b)) - Number(isLate(a))) || String(a.expected_end || '9999').localeCompare(String(b.expected_end || '9999')));
                if (!rows.length) { $('olist').innerHTML = `<div class="otc empty"><i class="bi bi-inboxes"></i>No orders match these filters.</div>`; return; }

                $('olist').innerHTML = rows.map(o => {
                    const late = isLate(o);
                    const neck = o.bottleneck && o.bottleneck.mould_no;
                    const bars = o.moulds.map(m => `<div class="mbar ${m.mould_no === neck ? 'neck' : ''}" title="${esc(m.mould_name)} · ${n0(m.produced)} / ${n0(m.required)} pcs">
                            <div class="nm"><span>${esc(short(m.mould_name))}</span><span>${pf(m.pct)}</span></div>
                            ${track(m.pct, 'thin ' + (m.status === 'COMPLETE' ? 'g' : m.mould_no === neck ? 'a' : ''))}</div>`).join('');
                    return `<div class="otc orow ${o.status} ${late ? 'late' : ''}" data-order="${esc(o.order_no)}">
                        <div>
                            <div class="no">${esc(o.order_no)}</div>
                            <div class="prod" title="${esc(o.product_name)}">${esc(o.product_name) || '—'}</div>
                            <div class="muted small">${esc(o.client_name)}${o.order_date ? ' · ' + fd(o.order_date) : ''} · ${o.jc_count} JC</div>
                        </div>
                        <div>
                            <div class="sets"><span><span class="big">${n0(o.sets_made)}</span> <span class="muted">/ ${n0(o.order_qty)} sets</span></span><span class="b">${pf(o.pct)}</span></div>
                            ${track(o.pct, o.status === 'COMPLETE' ? 'g' : late ? 'a' : '')}
                            <div class="mbars">${bars}</div>
                        </div>
                        <div class="dates">
                            <div><div class="l">Started</div><div class="v">${fd(o.start_date)}</div></div>
                            <div><div class="l">Target</div><div class="v">${fd(o.target_date)}</div></div>
                            <div><div class="l">${o.status === 'COMPLETE' ? 'Finished' : 'Expected'}</div><div class="v ${late ? 'late' : ''}">${o.expected_end ? fd(o.expected_end, o.status !== 'COMPLETE') : '<span class="muted">Not set</span>'}</div></div>
                            <div class="vrow">${o.target_date && (o.expected_end || o.completed_on) ? variance(o.status === 'COMPLETE' ? o.completed_on : o.expected_end, o.target_date) + ' <span class="muted small">vs target</span>' : ''}</div>
                            ${nextLine(o)}
                        </div>
                        <div class="right">
                            <div>${pill(o.status)}${late ? ' ' + pill('LATE') : ''}</div>
                            <div class="small"><span class="muted">Process:</span> <b>${esc(o.process ? o.process.current_name : '—')}</b></div>
                            ${o.action_count ? `<div class="small" style="color:var(--red);font-weight:700"><i class="bi bi-lightning-charge-fill"></i> ${o.action_count} action${o.action_count > 1 ? 's' : ''} needed</div>` : ''}
                            <div>${o.running_machines.slice(0, 3).map(m => `<span class="mc">${esc(m)}</span>`).join('')}${o.running_machines.length > 3 ? `<span class="muted small">+${o.running_machines.length - 3}</span>` : ''}</div>
                        </div>
                    </div>`;
                }).join('');
            }

            /* ================================================ ORDER DETAIL */
            async function openOrder(no, silent) {
                S.order = no;
                if (!silent) {
                    show('detail');
                    $('v-detail').innerHTML = `<div class="otc empty">Loading ${esc(no)}…</div>`;
                    history.replaceState(null, '', `?order=${encodeURIComponent(no)}`);
                    window.scrollTo(0, 0);
                }
                try {
                    const res = await JPSMS.api.request(`/order-tracker/order?order_no=${encodeURIComponent(no)}`, { skipLoader: true });
                    if (S.order === no) { S.detail = res.data; renderDetail(); }
                } catch (e) { if (!silent) $('v-detail').innerHTML = `<div class="otc empty"><i class="bi bi-exclamation-circle"></i>Could not load ${esc(no)}.</div>`; }
            }
            function closeOrder() {
                S.order = null; S.detail = null;
                if (S.chart) { S.chart.destroy(); S.chart = null; }
                history.replaceState(null, '', location.pathname + (S.view !== 'orders' ? '?view=' + S.view : ''));
                show(S.view);
            }

            /* ---------- date helpers for the detail page ---------- */
            const ts = v => { if (!v) return null; const s = String(v); const t = /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s + 'T12:00:00').getTime() : new Date(s).getTime(); return isNaN(t) ? null : t; };
            const endOfDay = v => { if (!v) return null; const s = String(v); return /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s + 'T23:59:00').getTime() : ts(s); };
            /* end vs planned end, in days: + late, - early */
            function variance(endV, planV) {
                const e = ts(endV), p = endOfDay(planV);
                if (e == null || p == null) return '<span class="muted">—</span>';
                const d = (e - p) / 86400000;
                /* any time past the planned end is late; up to half a day early still reads as on time */
                if (d <= 1 / 24 && d > -0.5) return '<span class="var ok"><i class="bi bi-check2"></i>On time</span>';
                const txt = Math.abs(d) < 1.5 ? Math.max(1, Math.round(Math.abs(d) * 24)) + ' h' : Math.round(Math.abs(d)) + ' days';
                return d > 0 ? `<span class="var late"><i class="bi bi-arrow-up-right"></i>${txt} late</span>` : `<span class="var early"><i class="bi bi-arrow-down-left"></i>${txt} early</span>`;
            }
            /* a date cell: actual (solid dot) or expected (hollow dot) */
            const dAct = (v, time) => v ? `<span class="dt act" title="Actual"><i></i>${fd(v, time)}</span>` : '';
            const dExp = (v, time) => v ? `<span class="dt exp" title="Expected"><i></i>${fd(v, time)}</span>` : '';
            const dPlan = (v, time) => v ? `<span class="dt plan">${fd(v, time)}</span>` : '<span class="muted">—</span>';
            const dash = '<span class="muted">—</span>';

            /* ---------- hero: the order's journey on one line ---------- */
            function journey(o) {
                const now = Date.now(), done = o.status === 'COMPLETE';
                const pts = [
                    { k: 'Ordered', v: o.order_date, t: 'base' },
                    { k: 'Plan start', v: o.plan_start, t: 'plan' },
                    { k: 'Started', v: o.start_date, t: 'act' },
                    { k: done ? 'Finished' : o.expected_end ? 'Expected end' : 'Earliest end', v: done ? o.completed_on : (o.expected_end || o.earliest_end), t: done ? 'act' : (isLate(o) ? 'late' : 'exp'), time: !done },
                    { k: 'Target', v: o.target_date, t: 'target' }
                ].filter(p => ts(p.v) != null);
                if (!done) pts.push({ k: 'Today', v: new Date(now).toISOString(), t: 'today' });
                if (pts.length < 2) return '';
                const tgtCap = endOfDay(o.target_date) ? endOfDay(o.target_date) + 60 * 86400000 : Infinity;
                pts.forEach(p => { if (ts(p.v) > tgtCap) { p.real = p.v; p.v = new Date(tgtCap).toISOString(); } });
                const xs = pts.map(p => ts(p.v)); const lo = Math.min(...xs), hi = Math.max(...xs), span = Math.max(1, hi - lo);
                const pos = t => 4 + (t - lo) / span * 92;
                /* events on the same day share one marker, so labels never stack */
                const byDay = [];
                pts.slice().sort((a, b) => ts(a.v) - ts(b.v)).forEach(p => {
                    const d = p.t === 'today' ? 'today' : day(p.v);
                    const g = byDay.find(x => x.d === d);
                    if (g) { g.k += ' · ' + p.k; if (['late', 'target', 'exp', 'act'].includes(p.t)) g.t = p.t; }
                    else byDay.push({ ...p, d });
                });
                const sorted = byDay;
                /* labels alternate above / below so close dates do not collide */
                /* each label goes above or below the line, whichever side has room; a label
                   that fits on neither side is merged into its neighbour */
                const GAP = 11, lastAt = { up: -99, dn: -99 }, placed = [];
                sorted.forEach(p => {
                    const x = pos(ts(p.v));
                    const side = x - lastAt.up >= GAP ? 'up' : x - lastAt.dn >= GAP ? 'dn' : null;
                    if (side) { lastAt[side] = x; placed.push({ ...p, side, x }); }
                    else { const prev = placed[placed.length - 1]; prev.k += ' · ' + p.k; prev.extra = (prev.extra || []).concat(fd(p.v, p.time)); }
                });
                const marks = placed.map(p => `<div class="jm ${p.t} ${p.side} ${p.x < 12 ? 'edgeL' : p.x > 88 ? 'edgeR' : ''}" style="left:${p.x}%">
                        <span class="lab"><b>${p.k}</b>${p.t === 'today' ? 'now' : (p.real ? '→ ' : '') + fd(p.real || p.v, p.time)}${p.extra ? ' / ' + p.extra.join(' / ') : ''}</span><span class="pin"></span></div>`).join('');
                const startT = ts(o.start_date), nowT = done ? ts(o.completed_on) : now;
                const prog = startT ? `<div class="jprog" style="left:${pos(startT)}%;width:${Math.max(0, pos(nowT || now) - pos(startT))}%"></div>` : '';
                const endT = ts(o.expected_end), tgtT = endOfDay(o.target_date);
                const lateSeg = !done && endT && tgtT && endT > tgtT ? `<div class="jlate" style="left:${pos(tgtT)}%;width:${pos(endT) - pos(tgtT)}%"></div>` : '';
                return `<div class="journey"><div class="jline"></div>${prog}${lateSeg}${marks}</div>`;
            }

            /* ---------- the master dates table ---------- */
            function datesTable(o) {
                const done = o.status === 'COMPLETE';
                const mustFirst = o.moulds.map(m => m.must_start_by).filter(Boolean).sort()[0];
                const row = (cls, name, sub, planStart, start, must, planEnd, end, varHtml, pct, status) => `<tr class="${cls}">
                    <td class="nm"><div class="b">${name}</div>${sub ? `<div class="muted small">${sub}</div>` : ''}</td>
                    <td>${planStart}</td><td>${start}</td><td>${must}</td><td>${planEnd}</td><td>${end}</td><td>${varHtml}</td>
                    <td style="min-width:110px">${pct == null ? '' : `<div class="small b" style="text-align:right">${pf(pct)}</div>${track(pct, 'thin ' + (pct >= 100 ? 'g' : ''))}`}</td>
                    <td>${status}</td></tr>`;
                const grp = (ic, label, n) => `<tr class="grp"><td colspan="9"><i class="bi ${ic}"></i> ${label}${n != null ? ` <span class="muted">· ${n}</span>` : ''}</td></tr>`;

                const orderEnd = done ? dAct(o.completed_on) : (o.expected_end ? dExp(o.expected_end, true) : '<span class="muted">Not set</span>');
                let html = grp('bi-receipt', 'Order') + row('lvl0', esc(o.order_no), `${n0(o.sets_made)} / ${n0(o.order_qty)} sets`,
                    dPlan(o.plan_start), o.start_date ? dAct(o.start_date) : dash, mustFirst && !o.start_date ? `<b class="must">${fd(mustFirst, true)}</b>` : dash,
                    dPlan(o.target_date), orderEnd, variance(done ? o.completed_on : o.expected_end, o.target_date), o.pct, pill(o.status) + (isLate(o) ? ' ' + pill('LATE') : ''));

                html += grp('bi-card-checklist', 'Job cards', o.job_cards.length);
                html += o.job_cards.map(j => {
                    const jDone = j.status === 'COMPLETE' || j.completed_on;
                    const end = j.completed_on ? dAct(j.completed_on) : j.expected_end ? dExp(j.expected_end, true) : '<span class="muted">Not set</span>';
                    return row('lvl1', esc(j.job_card_no), `issued ${fd(j.job_card_date)} · ${n0(j.sets_made)} / ${n0(j.qty)} sets`,
                        dPlan(j.planned_start), j.actual_start ? dAct(j.actual_start) : dash, dash,
                        dPlan(j.planned_comp_date || j.planned_end), end, variance(j.completed_on || j.expected_end, j.planned_comp_date || j.planned_end),
                        j.pct, pill(jDone ? 'COMPLETE' : j.status));
                }).join('') || '<tr><td colspan="9" class="muted small" style="padding-left:28px">No job cards yet</td></tr>';

                html += grp('bi-boxes', 'Moulds, in start order', o.moulds.length);
                html += o.moulds.slice().sort((a, b) => (a.start_seq || 99) - (b.start_seq || 99)).map(m => {
                    const mDone = m.status === 'COMPLETE', run = m.status === 'RUNNING';
                    const start = m.first_date ? dAct(m.first_date) : m.expected_start ? dExp(m.expected_start, true) : '<span class="muted">Not scheduled</span>';
                    const must = mDone || run || m.first_date ? dash : m.must_start_by ? `<b class="must">${fd(m.must_start_by, true)}</b>` : dash;
                    const end = mDone ? dAct(m.completed_on) : m.eta ? dExp(m.eta, true) : '<span class="muted">Not set</span>';
                    const seq = mDone ? '<span class="sq done"><i class="bi bi-check"></i></span>' : `<span class="sq ${run ? 'run' : ''}">${m.start_seq || '·'}</span>`;
                    const where = run ? m.machines.join(', ') : m.queue ? `${m.queue.machine} (#${m.queue.position} in queue)` : (mDone ? m.all_machines.filter(x => x && x.length > 1).join(', ') : 'no machine');
                    return row('lvl1' + (o.bottleneck && o.bottleneck.mould_no === m.mould_no ? ' neck' : ''),
                        `${seq}${esc(m.mould_name)}`, `×${m.ratio} per set · ${n0(m.produced)} / ${n0(m.required)} pcs · ${esc(where)}${m.rate_pph ? ' · ' + n0(m.rate_pph) + '/h' : ''}`,
                        dPlan(m.plan_start), start, must, dPlan(o.target_date), end, variance(mDone ? m.completed_on : m.eta, o.target_date), m.pct, stHtml(m));
                }).join('');

                const plans = o.moulds.flatMap(m => m.plans.map(p => ({ ...p, mould: m.mould_name })));
                if (plans.length) {
                    html += grp('bi-cpu', 'Machine plans', plans.length);
                    html += plans.map(p => {
                        const pDone = ['COMPLETED', 'CLOSED'].includes(p.status);
                        /* completion remark (and who completed it) under the plan line */
                        const rem = pDone && (p.remarks || p.completed_by)
                            ? `<div class="small" style="color:#334155;font-style:italic;white-space:normal"><i class="bi bi-chat-left-text"></i> ${p.remarks ? esc(p.remarks) : '<span class="muted">no remark</span>'}${p.completed_by ? ` <span class="muted">— ${esc(p.completed_by)}</span>` : ''}</div>`
                            : '';
                        return row('lvl1', `${esc(p.machine)}`, `${esc(p.plan_id)} · ${esc(short(p.mould))} · ${n0(p.plan_qty)} pcs${p.job_card_no ? ' · ' + esc(p.job_card_no) : ''}${rem}`,
                            dPlan(p.start_date), dash, dash, dPlan(p.end_date), pDone ? dAct(p.completed_at) : dash,
                            pDone && p.end_date ? variance(p.completed_at, p.end_date) : dash, null,
                            pill(pDone ? 'COMPLETE' : p.status === 'RUNNING' ? 'RUNNING' : 'PLANNED'));
                    }).join('');
                }
                return `<div class="otc scroll"><table class="tbl dates-t"><thead><tr>
                    <th>What</th><th>Planned start</th><th>Started / starts</th><th>Must start by</th><th>Planned end</th><th>Ended / ends</th><th>Early / late</th><th>Done</th><th>Status</th>
                    </tr></thead><tbody>${html}</tbody></table></div>`;
            }

            /* ---------- timeline: plan window, actual, forecast ---------- */
            function gantt(o) {
                const now = Date.now();
                const rows = [];
                rows.push({ lvl: 0, name: 'Order', planS: o.plan_start, planE: o.target_date, actS: o.start_date, actE: o.status === 'COMPLETE' ? o.completed_on : (o.last_date || null), eta: o.status === 'COMPLETE' ? null : o.expected_end, fs: null, must: null, done: o.status === 'COMPLETE' });
                o.job_cards.forEach(j => rows.push({ lvl: 1, name: j.job_card_no, planS: j.planned_start, planE: j.planned_comp_date || j.planned_end, actS: j.actual_start, actE: j.completed_on || j.last_production, eta: j.completed_on ? null : j.expected_end, fs: null, must: null, done: !!j.completed_on }));
                o.moulds.slice().sort((a, b) => (a.start_seq || 99) - (b.start_seq || 99)).forEach(m => rows.push({
                    lvl: 2, name: (m.start_seq ? m.start_seq + '. ' : '✓ ') + short(m.mould_name), planS: m.plan_start, planE: null,
                    actS: m.first_date, actE: m.status === 'COMPLETE' ? m.completed_on : m.last_date, eta: m.status === 'COMPLETE' ? null : m.eta,
                    fs: m.status !== 'RUNNING' && m.expected_start ? m.expected_start : null, must: m.status === 'RUNNING' || m.first_date ? null : m.must_start_by,
                    done: m.status === 'COMPLETE', queued: m.status !== 'RUNNING'
                }));
                const xs = [now, endOfDay(o.target_date)];
                rows.forEach(r => [r.planS, r.planE, r.actS, r.actE, r.eta, r.must, r.fs].forEach(v => { const t = ts(v); if (t) xs.push(t); }));
                const valid = xs.filter(Boolean);
                let lo = Math.min(...valid) - 86400000, hi = Math.max(...valid) + 86400000;
                const span = hi - lo, days = Math.max(1, Math.round(span / 86400000));
                const x = t => ((t - lo) / span * 100).toFixed(2) + '%';
                const w = (a, b) => (Math.max(0, b - a) / span * 100).toFixed(2) + '%';
                const step = Math.max(1, Math.ceil(days / 9));
                const ticks = [];
                for (let t = new Date(new Date(lo).toDateString()).getTime() + 86400000; t <= hi; t += step * 86400000) ticks.push(`<span style="left:${x(t)}">${fd(new Date(t).toLocaleDateString('en-CA'))}</span>`);
                const tgt = endOfDay(o.target_date);
                const lines = `<div class="gline today" style="left:${x(now)}"></div>` + (tgt ? `<div class="gline target" style="left:${x(tgt)}"></div>` : '');
                const body = rows.map(r => {
                    let bars = '';
                    const ps = ts(r.planS), pe = endOfDay(r.planE);
                    if (ps && pe && pe > ps) bars += `<div class="gplan" style="left:${x(ps)};width:${w(ps, pe)}" title="Planned ${fd(r.planS)} – ${fd(r.planE)}"></div>`;
                    const as = ts(r.actS), ae = r.actE ? Math.min(now, endOfDay(r.actE)) : null;
                    if (as && ae) bars += `<div class="gbar ${r.done ? 'g' : ''}" style="left:${x(as)};width:${w(as, ae)}" title="Actual ${fd(r.actS)} – ${fd(r.actE)}"></div>`;
                    const et = ts(r.eta);
                    if (et) { const from = r.fs ? ts(r.fs) : Math.max(ae || now, now); bars += `<div class="gbar ${r.queued && r.lvl === 2 ? 'fa' : 'f'}" style="left:${x(from)};width:${w(from, et)}" title="Expected ${fd(r.eta, true)}"></div>`; }
                    if (r.must) bars += `<div class="gmust" style="left:${x(ts(r.must))}" title="Must start by ${fd(r.must, true)}"></div>`;
                    return `<div class="grow l${r.lvl}"><div class="gl" title="${esc(r.name)}">${esc(r.name)}</div><div class="gtrack" style="--d:${(100 / days).toFixed(3)}%">${bars}${lines}</div></div>`;
                }).join('');
                return `<div class="otc gantt">${body}
                    <div class="gaxis"><div></div><div class="ticks">${ticks.join('')}</div></div>
                    <div class="glegend"><span><b class="lg-plan"></b>Planned</span><span><b style="background:var(--blue)"></b>Actual</span><span><b style="background:var(--green)"></b>Complete</span>
                    <span><b class="lg-f"></b>Forecast</span><span><b class="lg-fa"></b>Forecast, waiting for machine</span><span><b class="lg-must"></b>Must start by</span>
                    <span><b style="background:var(--ink);width:3px"></b>Today</span><span><b style="background:var(--red);width:3px"></b>Target</span></div></div>`;
            }

            /* ---------- job card x mould grid: pieces + the date each was done / will be done ---------- */
            function jcGrid(o) {
                if (!o.job_cards.length) return '<div class="otc empty"><i class="bi bi-card-checklist"></i>No job cards yet.</div>';
                const head = o.moulds.map(m => `<th class="r">${esc(short(m.mould_name))}<div class="muted" style="text-transform:none;font-weight:600">×${m.ratio} per set</div></th>`).join('');
                const body = o.job_cards.map(j => `<tr>
                    <td class="nm"><div class="b">${esc(j.job_card_no)}</div><div class="muted small">${n0(j.qty)} sets · ${n0(j.sets_made)} made</div></td>
                    ${j.moulds.map(m => {
                        const ok = m.done_on;
                        return `<td class="r cell ${ok ? 'ok' : ''}"><div><b>${n0(m.produced)}</b> <span class="muted">/ ${n0(m.required)}</span></div>
                            ${track(m.required ? m.produced / m.required * 100 : 0, 'thin ' + (ok ? 'g' : ''))}
                            <div class="small ${ok ? 'gtxt' : 'muted'}">${ok ? '✓ ' + fd(m.done_on) : m.eta ? '→ ' + fd(m.eta, true) : 'not scheduled'}</div></td>`;
                    }).join('')}
                    <td class="nowrap">${j.completed_on ? dAct(j.completed_on) : j.expected_end ? dExp(j.expected_end, true) : dash}</td></tr>`).join('');
                return `<div class="otc scroll"><table class="tbl grid-t"><thead><tr><th>Job card</th>${head}<th>Job card done</th></tr></thead><tbody>${body}</tbody></table></div>`;
            }

            const VIC = { ON_TIME: 'bi-check-lg', DONE: 'bi-check2-all', AT_RISK: 'bi-exclamation-lg', LATE: 'bi-x-lg', NO_TARGET: 'bi-question-lg' };
            function verdictHtml(o) {
                const v = o.verdict || {};
                return `<div class="verdict ${esc(v.code)}"><div class="vi"><i class="bi ${VIC[v.code] || 'bi-question-lg'}"></i></div>
                    <div><div class="vt">${esc(v.text || '')}</div><div class="vd">${esc(v.detail || '')}</div></div>
                    <div class="proc"><div class="l">Current process</div><div class="v">${esc(o.process ? o.process.current_name : '—')}</div></div></div>`;
            }
            function adviceHtml(o) {
                const list = o.suggestions || [];
                if (!list.length) return '';
                const ic = { bad: 'bi-lightning-charge-fill', warn: 'bi-lightbulb-fill', good: 'bi-check-circle-fill' };
                return `<div class="sec"><div class="sech"><h3><i class="bi bi-magic"></i> What to do to finish on time</h3><span class="muted small">From the live machine board: free machines, queues and rates</span></div>
                    <div class="advice">${list.map(t => `<div class="tip ${t.level}"><div class="ti"><i class="bi ${ic[t.level]}"></i></div><div><div class="tt">${esc(t.title)}</div><div class="tx">${esc(t.text)}</div></div></div>`).join('')}</div></div>`;
            }
            const SIC = { moulding: 'bi-boxes', shifting: 'bi-truck', printing: 'bi-printer', packing: 'bi-box-seam', warehouse: 'bi-building' };
            const SST = { DONE: 'Done', IN_PROGRESS: 'In progress', PENDING: 'Pending' };
            function processHtml(o) {
                if (!o.job_cards.length) return '';
                const one = j => {
                    const cur = j.process.current;
                    return `<div class="pipe">${j.process.stages.map(st => {
                        const isCur = st.key === cur && st.state !== 'DONE';
                        const lines = [];
                        if (st.plan_start) lines.push(`<span>Plan start</span> ${fd(st.plan_start)}`);
                        if (st.actual_start) lines.push(`<span>Started</span> <b>${fd(st.actual_start)}</b>`);
                        if (st.plan_end) lines.push(`<span>Plan end</span> ${fd(st.plan_end)}`);
                        if (st.revised_end) lines.push(`<span>Revised end</span> ${fd(st.revised_end)}`);
                        if (st.actual_end) lines.push(`<span>Done</span> <b>${fd(st.actual_end)}</b>`);
                        if (st.qty_need) lines.push(`<span>Qty</span> <b>${n0(st.qty_done)}</b> / ${n0(st.qty_need)} ${esc(st.unit || '')}`);
                        if (st.erp_status) lines.push(`<span>ERP</span> ${esc(st.erp_status)}`);
                        return `<div class="stg ${st.state} ${isCur ? 'cur' : ''}"><div class="dotl"><div class="dot"><i class="bi ${st.state === 'DONE' ? 'bi-check-lg' : SIC[st.key]}"></i></div><div class="bar"></div></div>
                            <div class="sn">${esc(st.name)}</div><div class="ss">${isCur && st.state === 'PENDING' ? 'Next' : SST[st.state]}</div>
                            <div class="sd">${lines.join('<br>') || '<span>no dates yet</span>'}</div></div>`;
                    }).join('')}</div>`;
                };
                const body = o.job_cards.length === 1 ? one(o.job_cards[0])
                    : o.job_cards.map(j => `<div class="pjc">${esc(j.job_card_no)} <span class="muted">· now: ${esc(j.process.current_name)}</span></div>${one(j)}`).join('');
                return `<div class="sec"><div class="sech"><h3><i class="bi bi-diagram-2"></i> Process</h3><span class="muted small">Moulding → Shifting → Printing / TUF → Packing → Warehouse · ERP stage status and dates</span></div><div class="otc">${body}</div></div>`;
            }
            function sequenceHtml(o) {
                const ms = o.moulds.slice().sort((a, b) => (a.status === 'COMPLETE') - (b.status === 'COMPLETE') || (a.start_seq || 99) - (b.start_seq || 99));
                const cards = ms.map(m => {
                    const i = startInfo(m), done = m.status === 'COMPLETE', run = m.status === 'RUNNING';
                    const where = run ? m.machines.join(', ') : m.queue ? `${m.queue.machine} · #${m.queue.position} in queue` : done ? (m.all_machines.filter(x => x && x.length > 1).join(', ') || '—') : 'no machine';
                    const tone = m.closed_short || ['START_LATE', 'OVERDUE', 'FINISH_LATE'].includes(m.start_state) ? 'bad' : m.start_state === 'NEEDS_MACHINE' ? 'warn' : '';
                    return `<div class="seqc ${m.status} ${tone}">
                        <div class="hd2"><span class="sq ${done ? 'done' : run ? 'run' : ''}">${done ? '<i class="bi bi-check"></i>' : m.start_seq}</span>
                            <div style="flex:1"><div class="nm2">${esc(m.mould_name)}</div><div class="muted small">×${m.ratio} per set <span class="src">${esc(m.ratio_source || '')}</span> · ${esc(where)}</div></div></div>
                        ${m.ratio_suspect ? `<div class="shortb"><i class="bi bi-exclamation-octagon"></i> Ratio ×${m.ratio} cannot be right: fix the consumption ratio</div>` : m.ratio_mismatch ? `<div class="mism"><i class="bi bi-info-circle"></i> ERP BOM says ×${m.ratio_bom}; using ×${m.ratio} from ${esc(m.ratio_source)}</div>` : ''}
                        <div class="qty"><div><b>${n0(m.required)}</b><span>Need</span></div><div><b>${n0(m.produced)}</b><span>Made</span></div>
                            <div class="${m.balance ? 'bal' : ''}"><b>${n0(m.balance)}</b><span>Balance</span></div><div><b>${n0(m.shifted)}</b><span>Shifted</span></div></div>
                        <div style="display:flex;justify-content:space-between;font-size:12px"><span class="muted">= ${n0(m.sets_equiv)} sets</span><b>${pf(m.pct)}</b></div>
                        ${track(m.pct, done ? 'g' : tone === 'bad' ? 'a' : '')}
                        <div class="mrate">
                            <div><span>Cycle</span><b>${m.cycle_time ? m.cycle_time + ' s' : '—'}</b></div>
                            <div><span>Cavity</span><b>${m.cavity || '—'}</b></div>
                            <div><span>Std</span><b>${m.std_pph ? n0(m.std_pph) + '/h' : '—'}</b></div>
                            <div><span>Live</span><b>${m.live_pph ? n0(m.live_pph) + '/h' : '—'}</b></div>
                        </div>
                        ${m.need_pph && !done ? `<div class="pace ${m.run_pph >= m.need_pph ? 'ok' : 'bad'}">
                            <div class="pl"><span>Needs <b>${n0(m.need_pph)}/h</b> to make the target</span><span>${m.run_pph ? 'running ' + n0(m.run_pph) + '/h' : 'not running'}</span></div>
                            <div class="pt"><i style="width:${Math.min(100, m.run_pph / m.need_pph * 100)}%"></i></div></div>` : ''}
                        <div class="sdates">
                            <div>Start<b>${m.first_date ? fd(m.first_date) : m.expected_start ? '○ ' + fd(m.expected_start, true) : '—'}</b></div>
                            <div>Must start<b style="color:var(--red)">${done || run || m.first_date ? '—' : m.must_start_by ? fd(m.must_start_by, true) : '—'}</b></div>
                            <div>${done ? 'Done' : 'End'}<b>${done ? fd(m.completed_on) : m.eta && m.scheduled ? '○ ' + fd(m.eta, true) : m.eta ? 'if started now: ' + fd(m.eta, true) : '—'}</b></div>
                        </div>
                        ${m.closed_short ? `<div class="shortb"><i class="bi bi-exclamation-triangle"></i> Plan closed ${n0(m.balance)} pcs short (${n0(Math.ceil(m.balance / (m.ratio || 1)))} sets)</div>` : `<div style="margin-top:8px">${stHtml(m)}</div>`}
                    </div>`;
                });
                return `<div class="sec"><div class="sech"><h3><i class="bi bi-sort-numeric-down"></i> Mould sequence</h3><span class="muted small">In the order the moulds must start · all quantities in pieces</span></div>
                    <div class="seqw">${cards.join('<div class="seqa"><i class="bi bi-chevron-right"></i></div>')}</div></div>`;
            }

            function qtyTiles(o) {
                const p = o.pace || {};
                const behind = p.need_sets_per_day && p.now_sets_per_day != null && p.now_sets_per_day < p.need_sets_per_day;
                return [
                    ['Order qty', n0(o.order_qty), 'sets'],
                    ['Job cards', n0(o.jc_qty), `${o.jc_count} job card${o.jc_count === 1 ? '' : 's'}${o.jc_qty < o.order_qty ? ' · ' + n0(o.order_qty - o.jc_qty) + ' without JC' : ''}`],
                    ['Sets made', n0(o.sets_made), pf(o.pct) + ' of order'],
                    ['Sets to go', n0(o.sets_balance), p.days_left != null ? (p.days_left > 0 ? p.days_left + ' days to target' : 'target passed') : 'no target'],
                    ['Needed / day', p.need_sets_per_day ? n0(p.need_sets_per_day) : '—', 'sets per day to make the target'],
                    ['Making / day', p.now_sets_per_day != null ? n0(p.now_sets_per_day) : '—', behind ? '<b style="color:var(--red)">too slow for the target</b>' : 'at the current machines and rates']
                ].map(t => `<div class="qtile ${t[0] === 'Making / day' && behind ? 'bad' : ''}"><div class="l">${t[0]}</div><div class="v">${t[1]}</div><div class="s">${t[2]}</div></div>`).join('');
            }

            function renderDetail() {
                const o = S.detail; if (!o) return;
                const late = isLate(o), done = o.status === 'COMPLETE';
                const notes = [];
                if (o.jc_qty && o.jc_qty < o.order_qty) notes.push(`<div class="note i"><i class="bi bi-info-circle"></i><div>Job cards cover <b>${n0(o.jc_qty)}</b> of ${n0(o.order_qty)} ordered; <b>${n0(o.order_qty - o.jc_qty)}</b> still need a job card.</div></div>`);
                if (o.unlinked_qty) notes.push(`<div class="note i"><i class="bi bi-link-45deg"></i><div>${n0(o.unlinked_qty)} pcs booked in DPR without a job card number count for the order, not for a job card.</div></div>`);

                const daysLeft = !done && o.expected_end ? (ts(o.expected_end) - Date.now()) / 86400000 : null;
                const tiles = [
                    ['Planned start', fd(o.plan_start), 'ERP mould start'],
                    ['Actual start', fd(o.start_date), o.start_date ? 'first DPR entry' : 'not started'],
                    ['Target', fd(o.target_date), 'ERP completion date'],
                    [done ? 'Finished' : 'Expected end', done ? fd(o.completed_on) : o.expected_end ? fd(o.expected_end, true) : 'Not set', done ? 'all sets made' : (daysLeft != null ? (daysLeft < 1 ? Math.max(1, Math.round(daysLeft * 24)) + ' h from now' : daysLeft.toFixed(1) + ' days from now') : (o.earliest_end ? 'earliest ' + fd(o.earliest_end, true) + ' if started now' : 'a mould has no machine'))],
                    ['Early / late', variance(done ? o.completed_on : o.expected_end, o.target_date), 'against target']
                ].map(t => `<div class="dtile"><div class="l">${t[0]}</div><div class="v">${t[1]}</div><div class="s">${t[2]}</div></div>`).join('');

                $('v-detail').innerHTML = `
                    <div class="crumb"><button class="btn" id="back"><i class="bi bi-arrow-left"></i> All orders</button>
                        <span class="muted small">Order Tracker / <b style="color:var(--ink)">${esc(o.order_no)}</b></span>
                        <span class="muted small" style="margin-left:auto"><span class="dt act"><i></i>actual</span> &nbsp; <span class="dt exp"><i></i>expected</span> &nbsp; plain = planned</span></div>

                    <div class="hero ${late ? 'late' : done ? 'done' : ''}">
                        <div class="htop">
                            <div>
                                <div class="hno">${esc(o.order_no)} ${pill(o.status)} ${late ? pill('LATE') : ''}</div>
                                <div class="hsub">${esc(o.product_name)}${o.client_name ? ' · ' + esc(o.client_name) : ''}${o.item_code ? ' · item ' + esc(o.item_code) : ''}</div>
                            </div>
                            <div class="hsets"><div><span class="big">${n0(o.sets_made)}</span><span class="of"> / ${n0(o.order_qty)} sets</span></div>
                                <div class="hbar"><i style="width:${Math.min(100, o.pct)}%"></i></div>
                                <div class="small">${pf(o.pct)} · ${o.moulds_complete}/${o.mould_count} moulds done · ${o.jc_count} job cards</div></div>
                        </div>
                        ${journey(o)}
                    </div>

                    ${verdictHtml(o)}
                    <div class="qtiles">${qtyTiles(o)}</div>
                    <div class="dtiles">${tiles}</div>
                    ${adviceHtml(o)}
                    ${processHtml(o)}
                    ${sequenceHtml(o)}
                    ${notes.length ? '<div style="margin-top:12px">' + notes.join('') + '</div>' : ''}

                    <div class="sec"><div class="sech"><h3><i class="bi bi-calendar-range"></i> All dates</h3><span class="muted small">Order, job cards, moulds and machine plans: planned, actual and expected</span></div>${datesTable(o)}</div>

                    <div class="sec"><div class="sech"><h3><i class="bi bi-bar-chart-steps"></i> Timeline</h3><span class="muted small">Outline = planned · solid = actual · striped = forecast</span></div>${gantt(o)}</div>

                    <div class="sec"><div class="sech"><h3><i class="bi bi-grid-3x3-gap"></i> Job card × mould</h3><span class="muted small">Pieces made per job card, with the date each was done or is expected (first in, first out)</span></div>${jcGrid(o)}</div>

                    <div class="sec"><div class="sech"><h3><i class="bi bi-graph-up"></i> Production by day</h3>
                        <div class="seg" id="cmode"><button data-c="cum" class="${S.chartMode === 'cum' ? 'on' : ''}">Cumulative %</button><button data-c="daily" class="${S.chartMode === 'daily' ? 'on' : ''}">Daily pcs</button></div></div>
                        <div class="otc" style="padding:16px;height:300px"><canvas id="chart"></canvas></div></div>`;

                $('back').onclick = closeOrder;
                document.querySelectorAll('#cmode button').forEach(b => b.onclick = () => { S.chartMode = b.dataset.c; document.querySelectorAll('#cmode button').forEach(x => x.classList.toggle('on', x === b)); drawChart(); });
                drawChart();
            }

            function drawChart() {
                const o = S.detail;
                if (S.chart) { S.chart.destroy(); S.chart = null; }
                if (!o || typeof Chart === 'undefined' || !$('chart')) return;
                const dates = [...new Set(o.moulds.flatMap(m => m.daily.map(d => d.date)))].sort();
                if (!dates.length) { $('chart').parentElement.innerHTML = '<div class="empty"><i class="bi bi-bar-chart"></i>No production booked yet.</div>'; return; }
                const colors = ['#2563eb', '#059669', '#d97706', '#7c3aed', '#db2777', '#0891b2', '#65a30d', '#475569'];
                const cum = S.chartMode === 'cum';
                const sets = o.moulds.map((m, i) => {
                    const by = new Map(m.daily.map(d => [d.date, d.qty]));
                    let run = 0;
                    const data = dates.map(d => { run += by.get(d) || 0; return cum ? (m.required ? +(run / m.required * 100).toFixed(1) : 0) : (by.get(d) || 0); });
                    const c = colors[i % colors.length];
                    return cum
                        ? { label: `${short(m.mould_name)} (×${m.ratio})`, data, borderColor: c, backgroundColor: c, tension: .25, pointRadius: 2, borderWidth: 2.5 }
                        : { label: `${short(m.mould_name)} (×${m.ratio})`, data, backgroundColor: c, borderRadius: 4 };
                });
                S.chart = new Chart($('chart'), {
                    type: cum ? 'line' : 'bar',
                    data: { labels: dates.map(d => fd(d)), datasets: sets },
                    options: {
                        maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
                        plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8 } },
                            tooltip: { callbacks: { label: c => `${c.dataset.label}: ${cum ? c.parsed.y + '%' : n0(c.parsed.y) + ' pcs'}` } } },
                        scales: { y: { beginAtZero: true, max: cum ? 100 : undefined, ticks: { callback: v => cum ? v + '%' : n0(v) } }, x: { grid: { display: false } } }
                    }
                });
            }

            /* ================================================ MACHINE WISE */
            async function loadMachines() {
                const res = await JPSMS.api.request('/order-tracker/machines', { skipLoader: true });
                S.machines = res.data || [];
                renderMachines();
            }

            function jobHtml(j) {
                return `<div class="job">
                    <div class="ord"><span><a class="lnk" data-order="${esc(j.order_no)}">${esc(j.order_no || '—')}</a> <span class="muted">${esc(j.job_card_no || '')}</span></span><span class="muted">${esc(j.plan_id)}</span></div>
                    <div class="mould">${esc(j.mould_name)}</div>
                    <div class="sets"><span><b>${n0(j.produced)}</b> <span class="muted">/ ${n0(j.plan_qty)} pcs</span></span><span class="b">${pf(j.pct)}</span></div>
                    ${track(j.pct)}
                    <div class="nums">
                        <div>Today<b>${n0(j.today_qty)}</b></div>
                        <div>Rate<b>${j.rate_pph ? n0(j.rate_pph) + '/h' : '—'}</b></div>
                        <div>Expected end<b>${fd(j.eta, true)}</b></div>
                    </div>
                    <div class="muted small" style="margin-top:6px">Started ${fd(j.first_date)} · ${hrs(j.hours_left)} left · ${n0(j.balance)} pcs to go</div>
                </div>`;
            }

            const MFILTERS = [['', 'All'], ['RUNNING', 'Running'], ['QUEUED', 'Queued only'], ['IDLE', 'Idle']];
            function renderMachines() {
                const M = S.machines;
                const run = M.filter(m => m.state === 'RUNNING');
                $('mkpis').innerHTML = [
                    kpi('bi-cpu', 'grey', M.length, 'Moulding machines', ''),
                    kpi('bi-play-circle', 'blue', run.length, `Running · ${M.length ? Math.round(run.length / M.length * 100) : 0}% in use`, 'RUNNING'),
                    kpi('bi-receipt', 'green', new Set(run.flatMap(m => m.running.map(j => j.order_no))).size, 'Orders running', null),
                    kpi('bi-hourglass', 'amber', M.filter(m => m.state === 'QUEUED').length, 'Queued, not running', 'QUEUED'),
                    kpi('bi-pause-circle', 'red', M.filter(m => m.state === 'IDLE').length, 'Idle, nothing planned', 'IDLE')
                ].join('');
                $('mchips').innerHTML = MFILTERS.map(([f, l]) => `<span class="chip ${S.mfilter === f ? 'on' : ''}" data-mf="${f}">${l}<span class="n">${M.filter(m => !f || m.state === f).length}</span></span>`).join('');

                const q = $('mq').value.trim().toLowerCase();
                const list = M.filter(m => (!S.mfilter || m.state === S.mfilter) && (!q || JSON.stringify([m.machine, m.running, m.queue]).toLowerCase().includes(q)));
                if (!list.length) { $('mlist').innerHTML = '<div class="otc empty"><i class="bi bi-cpu"></i>No machines match.</div>'; return; }
                const lines = [];
                list.forEach(m => { const l = m.line || 'No line'; let g = lines.find(x => x.l === l); if (!g) lines.push(g = { l, items: [] }); g.items.push(m); });
                $('mlist').innerHTML = lines.map(g => `
                    <div class="lineh"><h4>${esc(g.l)}</h4><span class="cnt">${g.items.filter(m => m.state === 'RUNNING').length} of ${g.items.length} running</span><hr></div>
                    <div class="macs">${g.items.map(m => `<div class="otc mac ${m.state}">
                        <div class="mh"><div><span class="mn">${esc(m.machine)}</span>${m.tonnage ? ` <span class="muted small">${esc(m.tonnage)} T</span>` : ''}</div>${pill(m.state)}</div>
                        ${m.running.map(jobHtml).join('') || `<div class="muted small" style="margin-top:12px">${m.queue.length ? 'Nothing running. Next job is waiting.' : 'Nothing running or planned.'}</div>`}
                        ${m.queue.length ? `<div class="queue"><div class="qh">UP NEXT · ${m.queue.length}</div>${m.queue.slice(0, 4).map((j, i) => `
                            <div class="qi"><span class="k">${i + 1}</span><span><a class="lnk" data-order="${esc(j.order_no)}">${esc(j.order_no)}</a> · ${esc(short(j.mould_name))} <span class="muted">· ${n0(j.balance)} pcs</span></span><span class="muted nowrap">${j.eta ? fd(j.eta, true) : '—'}</span></div>`).join('')}
                            ${m.queue.length > 4 ? `<div class="muted small">+${m.queue.length - 4} more</div>` : ''}</div>` : ''}
                        ${m.free_at ? `<div class="free"><i class="bi bi-flag"></i> Free from <b>${fd(m.free_at, true)}</b></div>` : ''}
                    </div>`).join('')}</div>`).join('');
            }

            /* ============================================== TONNAGE LOAD */
            const f2 = v => Number(v || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const tonName = t => t == null ? 'Unknown' : t + ' T';
            async function loadTonnage() {
                if (!$('tuntil').value) {
                    const d = new Date(); $('tuntil').value = new Date(d.getFullYear(), d.getMonth() + 1, 0).toLocaleDateString('en-CA');
                }
                const res = await JPSMS.api.request(`/order-tracker/tonnage?until=${$('tuntil').value}&eff=${Number($('teff').value) || 100}&basis=${$('tbasis').value}`, { skipLoader: true });
                S.tonnage = res.data || null;
                renderTonnage();
            }

            const bookTone = p => p == null ? 'var(--faint)' : p > 100 ? 'var(--red)' : p >= 85 ? 'var(--amber)' : 'var(--green)';
            const tonKey = r => r.tonnage == null ? 'x' : String(r.tonnage);
            const inactiveOf = r => { const M = S.tonnage && S.tonnage.master; const g = M && r.tonnage != null && M.by_tonnage.find(x => x.tonnage === r.tonnage); return g ? g.inactive : 0; };
            /* one-word answer per tonnage: short / tight / spare */
            function verdictChip(r) {
                if (r.tonnage == null) return '<span class="vchip none"><i class="bi bi-question-circle"></i>Add tonnage</span>';
                if (r.shortage_machines > 0) return `<span class="vchip short"><i class="bi bi-arrow-up-circle-fill"></i>Short ${f2(r.shortage_machines)} m/c</span>`;
                if (r.booked_pct >= 85) return '<span class="vchip tight"><i class="bi bi-exclamation-circle-fill"></i>Almost full</span>';
                if (!r.load_hours) return '<span class="vchip none"><i class="bi bi-dash-circle"></i>No load</span>';
                return `<span class="vchip ok"><i class="bi bi-check-circle-fill"></i>${f2(r.excess_machines)} m/c spare</span>`;
            }

            /* every column: name, small line, what it means, how it is worked out */
            const TCOLS = [
                ['M/c tonnage', '', 'The machine size (clamping force in tons) the mould needs. Each mould is counted under the smallest machine tonnage it fits.', 'Mould master tonnage → ERP BOM → machine it last ran on'],
                ['Hrs required', 'open load', 'Machine hours still needed to finish the pieces of the open orders on this tonnage. The bar under it shows how much is running now (blue), waiting in a machine queue (amber) and not planned on any machine yet (grey).', 'Σ balance pcs ÷ pcs per hour'],
                ['Days required', 'hrs ÷ 24', 'The same load in machine days (one machine running 24 hours = 1 day).', 'Hrs required ÷ 24'],
                ['Available hrs', '', 'Machine hours this tonnage can give between now and the "Plan until" date.', 'Machines × 24 × days left × efficiency %'],
                ['Available days', '', 'The same capacity in machine days.', 'Machines × days left × efficiency %'],
                ['Machines with us', '', 'Active moulding machines of this tonnage in the machine master, with how many are running or idle right now.', 'Count from Masters → Machines'],
                ['Machines needed', '', 'How many machines of this tonnage we would need running full time to finish the load by the date.', 'Hrs required ÷ (24 × days left × efficiency %)'],
                ['Machine shortage numbers', 'red', 'Extra machines we would need. Red means this tonnage cannot finish its load in time.', 'Machines needed − machines with us'],
                ['Machine shortage days', 'red', 'Machine days of work that will not fit before the date.', 'Days required − available days'],
                ['Capacity booked', '', 'How full this tonnage is. Over 100% = overloaded, 85–100% = almost full, under 85% = room to spare.', 'Hrs required ÷ available hrs'],
                ['Machine excess numbers', 'green', 'Machines of this tonnage that are spare and can take more work.', 'Machines with us − machines needed'],
                ['Machine excess days', 'green', 'Spare machine days available before the date.', 'Available days − days required']
            ];
            function guideHtml(r) {
                const ex = r ? [
                    `${tonName(r.tonnage)}`, `${f2(r.load_hours)} h`, `${f2(r.load_days)} days`, `${n0(r.avail_hours)} h`, `${f2(r.avail_days)} days`,
                    `${r.machine_count} machines`, `${f2(r.machines_needed)}`, r.shortage_machines ? f2(r.shortage_machines) : '-', r.shortage_days ? f2(r.shortage_days) : '-',
                    `${r.booked_pct}%`, r.excess_machines ? f2(r.excess_machines) : '-', r.excess_days ? f2(r.excess_days) : '-'] : [];
                return `<summary><i class="bi bi-book" style="color:var(--blue)"></i> What does each column mean?<span class="muted small" style="font-weight:600;margin-left:auto">click to ${$('tguide').open ? 'close' : 'open'}</span></summary>
                    <table class="gtab"><tbody>${TCOLS.map((c, i) => `<tr><td>${c[0]}</td><td>${c[2]}</td><td class="f">${c[3]}</td><td class="ex">${r ? 'e.g. ' + esc(tonName(r.tonnage)) + ': ' + esc(ex[i]) : ''}</td></tr>`).join('')}
                    <tr><td>Not planned yet</td><td colspan="3">Moulds of open orders that are <b>not on any machine</b> on the plan board — no running plan and no queued plan. Their hours still count as load; Planning has to put them on a machine.</td></tr>
                    <tr><td>No tonnage</td><td colspan="3">Moulds with no tonnage in the mould master or ERP that never ran on a machine. They cannot be placed in a row, so they are shown apart and not in the total. Fill the tonnage in Masters → Moulds.</td></tr>
                    </tbody></table>`;
            }
            const th = (c, extra) => `<th title="${esc(c[2] + ' (' + c[3] + ')')}">${c[0]}<i class="bi bi-info-circle qi"></i>${extra || c[1] ? `<small>${extra || c[1]}</small>` : ''}</th>`;

            /* machines as per the machine master, per tonnage */
            const MST = { RUNNING: ['var(--blue)', 'Running'], QUEUED: ['var(--amber)', 'Planned, not running'], IDLE: ['#94a3b8', 'Idle'], INACTIVE: ['#cbd5e1', 'Inactive'] };
            function masterHtml(M) {
                if (!M || !M.total) return '';
                const sel = S.mmSel;
                const groups = M.by_tonnage.concat(M.no_tonnage.total ? [Object.assign({ tonnage: null }, M.no_tonnage)] : []);
                const tile = g => {
                    const k = g.tonnage == null ? 'x' : String(g.tonnage), A = g.active || 1;
                    return `<div class="mmt ${sel === k ? 'on' : ''}" data-mm="${k}" title="Click to see the machines">
                        <div class="tt">${g.tonnage == null ? '<span style="color:var(--red)">No tonnage</span>' : g.tonnage + ' T'}</div>
                        <div class="nn">${g.active}${g.inactive ? ` <small>+${g.inactive} inactive</small>` : ''}</div>
                        <div class="sb"><i style="width:${g.running / A * 100}%;background:var(--blue)"></i><i style="width:${g.queued / A * 100}%;background:var(--amber)"></i><i style="width:${g.idle / A * 100}%;background:#94a3b8"></i></div>
                        <div class="ss">${g.running} running · ${g.queued} planned · ${g.idle} idle</div></div>`;
                };
                const open = groups.find(g => (g.tonnage == null ? 'x' : String(g.tonnage)) === sel);
                return `<div class="otc mm"><div class="mmh">
                    <div><h3><i class="bi bi-hdd-rack" style="color:var(--blue)"></i> Machines we have (Machine master)</h3>
                    <div class="muted small" style="margin-top:3px">Moulding machines in Masters → Machines, by tonnage. Big number = active machines counted as capacity. Click a tonnage to see its machines.</div></div>
                    <div class="tot"><span><b>${M.total}</b>in master</span><span><b>${M.active}</b>active</span>${M.inactive ? `<span><b>${M.inactive}</b>inactive</span>` : ''}<span><b style="color:var(--blue)">${M.running}</b>running</span><span><b style="color:var(--amber)">${M.queued}</b>planned</span><span><b>${M.idle}</b>idle</span></div></div>
                    <div class="mmg">${groups.map(tile).join('')}</div>
                    ${open ? `<div class="mml">${open.machines.map(m => `<span class="m ${m.state}" title="${esc(MST[m.state][1])}"><i style="background:${MST[m.state][0]}"></i>${esc(m.machine)}${m.line ? ` <small>${esc(m.line)}</small>` : ''}</span>`).join('')}
                        <span class="muted small" style="width:100%;margin-top:4px">${Object.entries(MST).map(([k, v]) => `<span class="lg"><i style="background:${v[0]};border-radius:50%"></i>${v[1]}</span>`).join('')}</span></div>` : ''}
                    ${M.no_tonnage.total ? `<div class="note a"><i class="bi bi-exclamation-triangle-fill"></i><div><b>${M.no_tonnage.total} machine${M.no_tonnage.total === 1 ? '' : 's'} with no tonnage</b> in the machine master: not counted in any tonnage row. Fill the tonnage in Masters → Machines.</div></div>` : ''}
                </div>`;
            }

            /* picture of load against capacity, one bar per tonnage */
            function boardHtml(rows) {
                const max = Math.max(1, ...rows.map(r => Math.max(r.load_hours, r.avail_hours)));
                return `<div class="otc lc"><h3><i class="bi bi-bar-chart-steps" style="color:var(--blue)"></i> Load against capacity</h3>
                    <div class="sub">Striped box = machine hours we have until the date (line = the limit). Coloured bar = hours of work: <span class="lg"><i style="background:var(--blue)"></i>running</span><span class="lg"><i style="background:var(--amber)"></i>queued</span><span class="lg"><i style="background:#94a3b8"></i>not planned yet</span> A bar past the line means not enough machines.</div>
                    ${rows.map(r => {
                        const L = r.load_hours || 1, over = r.load_hours > r.avail_hours;
                        return `<div class="lcr"><div class="tn">${tonName(r.tonnage)}<small>${r.machine_count} m/c</small></div>
                            <div class="lcb" title="${f2(r.load_hours)} h of work · ${n0(r.avail_hours)} h available"><div class="cap" style="width:${r.avail_hours / max * 100}%"></div>
                                <div class="ld" style="width:${r.load_hours / max * 100}%;${over ? 'box-shadow:0 0 0 2px var(--red)' : ''}"><i style="width:${r.running_hours / L * 100}%;background:var(--blue)"></i><i style="width:${r.queued_hours / L * 100}%;background:var(--amber)"></i><i style="width:${r.unplanned_hours / L * 100}%;background:#94a3b8"></i></div></div>
                            <div class="vt"><b style="color:${bookTone(r.booked_pct)}">${r.booked_pct == null ? '—' : r.booked_pct + '%'}</b> booked<br>${verdictChip(r)}</div></div>`;
                    }).join('')}</div>`;
            }
            function tonRow(r, open) {
                const pct = r.booked_pct;
                const L = r.load_hours || 1;
                const shortN = r.shortage_machines > 0, excessN = r.excess_machines > 0;
                const cell = (on, cls, v) => on ? `<td class="${cls}">${f2(v)}</td>` : '<td class="dash">-</td>';
                return `<tr class="cls ${open ? 'open' : ''}" data-ton="${tonKey(r)}">
                    <td class="ton"><i class="bi bi-chevron-${open ? 'down' : 'right'} muted small"></i> ${tonName(r.tonnage)}
                        <div class="muted small" style="font-weight:600">${r.orders} orders · ${r.moulds} moulds</div>${verdictChip(r)}</td>
                    <td>${f2(r.load_hours)}
                        <div class="split" title="Running ${f2(r.running_hours)} h · Queued ${f2(r.queued_hours)} h · Not planned yet ${f2(r.unplanned_hours)} h">
                            <i style="width:${r.running_hours / L * 100}%;background:var(--blue)"></i><i style="width:${r.queued_hours / L * 100}%;background:var(--amber)"></i><i style="width:${r.unplanned_hours / L * 100}%;background:#94a3b8"></i></div></td>
                    <td>${f2(r.load_days)}</td>
                    <td>${n0(r.avail_hours)}</td>
                    <td>${f2(r.avail_days)}</td>
                    <td>${r.machine_count}<div class="muted small">${r.running} running · ${r.idle} idle${inactiveOf(r) ? ` · ${inactiveOf(r)} inactive` : ''}</div></td>
                    <td>${r.machines_needed == null ? '—' : f2(r.machines_needed)}</td>
                    ${cell(shortN, 'short', r.shortage_machines)}${cell(shortN, 'short', r.shortage_days)}
                    <td><div class="bk"><b style="color:${bookTone(pct)}">${pct == null ? '—' : pct + '%'}</b><span class="bar"><i style="width:${Math.min(100, pct || 0)}%;background:${bookTone(pct)}"></i></span></div></td>
                    ${cell(excessN, 'excess', r.excess_machines)}${cell(excessN, 'excess', r.excess_days)}
                </tr>${open ? `<tr class="det"><td colspan="12">${tonDetail(r)}</td></tr>` : ''}`;
            }
            function tonDetail(r) {
                if (!r.items.length) return '<div class="tl-det muted">No open load on this tonnage.</div>';
                const where = i => i.status === 'RUNNING' ? `<span class="pill s-RUNNING">On ${esc(i.machines.join(', '))}</span>`
                    : i.queue ? `<span class="pill s-QUEUED">Queued #${i.queue.position} on ${esc(i.queue.machine)}</span>` : '<span class="pill s-NOT_PLANNED" title="No plan on any machine yet - Planning must put it on the plan board">Not planned yet</span>';
                const late = i => i.target_date && day(i.target_date) < todayStr();
                return `<div class="tl-det">
                    <div class="muted small" style="margin-bottom:8px"><b>Machines:</b> ${r.machines.map(m => `<span class="mc">${esc(m)}</span>`).join('') || '—'}</div>
                    <table><thead><tr><th>Order</th><th>Client / product</th><th>Mould</th><th>Mould T</th><th>Target</th><th class="r">Balance pcs</th><th class="r">Rate /h</th><th class="r">Hours</th><th class="r">Days</th><th>Where</th><th>Start</th></tr></thead><tbody>
                    ${r.items.map(i => `<tr>
                        <td><a class="lnk" data-order="${esc(i.order_no)}">${esc(i.order_no)}</a></td>
                        <td>${esc(short(i.client_name))}<div class="muted small">${esc(short(i.product_name))}</div></td>
                        <td>${esc(short(i.mould_name))}</td>
                        <td>${i.mould_tonnage ? i.mould_tonnage + ' T' : '—'}<div class="muted small">${esc(i.tonnage_source || '')}${i.oversize ? ' · <b style="color:var(--red)">bigger than any machine</b>' : ''}</div></td>
                        <td ${late(i) ? 'style="color:var(--red);font-weight:700"' : ''}>${fd(i.target_date)}</td>
                        <td class="r">${n0(i.balance)}</td>
                        <td class="r">${i.rate_pph ? n0(i.rate_pph) : '<span style="color:var(--red)">no rate</span>'}</td>
                        <td class="r b">${i.hours == null ? '—' : f2(i.hours)}</td>
                        <td class="r">${i.hours == null ? '—' : f2(i.hours / 24)}</td>
                        <td>${where(i)}</td>
                        <td>${stHtml(i)}</td></tr>`).join('')}
                    </tbody></table></div>`;
            }

            function renderTonnage() {
                const T = S.tonnage;
                if (!T) { $('tlist').innerHTML = '<div class="otc empty">No data.</div>'; return; }
                const t = T.total, rows = T.classes;
                const shortRows = rows.filter(r => r.shortage_machines > 0);
                $('tkpis').innerHTML = [
                    kpi('bi-cpu', 'grey', t.machine_count || 0, `Active machines · ${rows.length} tonnages${T.master && T.master.inactive ? ' · ' + T.master.inactive + ' inactive' : ''}`, null),
                    kpi('bi-hourglass-split', 'blue', n0(t.load_hours), `Load hours · ${f2(t.load_days)} machine days`, null),
                    kpi('bi-calendar-range', 'green', n0(t.avail_hours), `Available hours in ${f2(T.days)} days`, null),
                    kpi('bi-speedometer', t.booked_pct > 100 ? 'red' : t.booked_pct >= 85 ? 'amber' : 'green', t.booked_pct == null ? '—' : t.booked_pct + '%', 'Capacity booked', null),
                    kpi('bi-exclamation-triangle', shortRows.length ? 'red' : 'green', shortRows.length, shortRows.length ? 'Short: ' + shortRows.map(r => r.tonnage + ' T').join(', ') : 'No tonnage short', null)
                ].join('');
                const until = fd($('tuntil').value);
                $('thelp').innerHTML = `<i class="bi bi-info-circle-fill"></i><div>
                    <b>How to read:</b> Hrs required = pieces still to mould on ${$('tbasis').value === 'due' ? 'open orders due by ' + until : 'all open orders'} ÷ pieces per hour (live rate, else mould standard), grouped by the machine tonnage the mould needs.
                    Available = machines × 24 h × ${f2(T.days)} days left until ${until} × ${Math.round(T.eff * 100)}% efficiency.
                    <b style="color:var(--red)">Red</b> = we need more machines than we have; <b style="color:var(--green)">green</b> = spare machines. Click a row to see the orders and moulds behind it. Hover a column heading, or open <b>What does each column mean?</b> below, for every column.
                    <div style="margin-top:6px"><span class="lg"><i style="background:var(--blue)"></i>Running now</span><span class="lg"><i style="background:var(--amber)"></i>Queued on a machine</span><span class="lg"><i style="background:#94a3b8"></i>Not planned yet (not on any machine)</span></div></div>`;
                $('tmaster').innerHTML = masterHtml(T.master);
                $('tmaster').querySelectorAll('[data-mm]').forEach(el => el.onclick = () => { S.mmSel = S.mmSel === el.dataset.mm ? null : el.dataset.mm; renderTonnage(); });
                $('tboard').innerHTML = rows.length ? boardHtml(rows) : '';
                const g = $('tguide'), wasOpen = g.open;
                g.innerHTML = guideHtml(rows.slice().sort((a, b) => b.load_hours - a.load_hours)[0]);
                g.open = wasOpen;
                g.ontoggle = () => { const sm = g.querySelector('summary .small'); if (sm) sm.textContent = 'click to ' + (g.open ? 'close' : 'open'); };
                const openSet = S.tonOpen || (S.tonOpen = new Set());
                const all = rows.concat(T.unknown.items.length ? [T.unknown] : []);
                $('tlist').innerHTML = `<div class="otc tl-wrap"><table class="tl">
                    <thead><tr>
                        ${th(TCOLS[0])}${th(TCOLS[1])}${th(TCOLS[2])}${th(TCOLS[3], 'until ' + esc(until))}${th(TCOLS[4])}${th(TCOLS[5])}
                        ${th(TCOLS[6])}${th(['Machine shortage', '', TCOLS[7][2], TCOLS[7][3]], 'numbers')}${th(['Machine shortage', '', TCOLS[8][2], TCOLS[8][3]], 'days')}
                        ${th(TCOLS[9])}${th(['Machine excess', '', TCOLS[10][2], TCOLS[10][3]], 'numbers')}${th(['Machine excess', '', TCOLS[11][2], TCOLS[11][3]], 'days')}
                    </tr></thead>
                    <tbody>${all.map(r => tonRow(r, openSet.has(tonKey(r)))).join('')}</tbody>
                    <tfoot><tr><td style="text-align:left">Total</td><td>${n0(t.load_hours)}</td><td>${n0(t.load_days)}</td><td>${n0(t.avail_hours)}</td><td>${n0(t.avail_days)}</td>
                        <td>${t.machine_count || 0}</td><td>${n0(t.machines_needed)}</td><td>${f2(t.shortage_machines)}</td><td>${n0(t.shortage_days)}</td>
                        <td>${t.booked_pct == null ? '—' : t.booked_pct + '%'}</td><td>${f2(t.excess_machines)}</td><td>${n0(t.excess_days)}</td></tr></tfoot>
                </table></div>
                ${T.unknown.items.length ? `<div class="note a"><i class="bi bi-exclamation-triangle-fill"></i><div><b>${T.unknown.items.length} moulds (${f2(T.unknown.load_hours)} h) have no tonnage</b> in the mould master or ERP BOM and never ran on a machine, so they are not in the total. Add the tonnage in Masters → Moulds.</div></div>` : ''}
                ${t.no_rate ? `<div class="note a"><i class="bi bi-exclamation-triangle-fill"></i><div><b>${t.no_rate} moulds have no rate</b> (no DPR and no standard pcs/hour or cycle time), so their hours are not counted. Open a row to see them.</div></div>` : ''}`;
                $('tlist').querySelectorAll('tr.cls').forEach(tr => tr.onclick = e => {
                    if (e.target.closest('[data-order]')) return;
                    const k = tr.dataset.ton; if (openSet.has(k)) openSet.delete(k); else openSet.add(k);
                    renderTonnage();
                });
            }

            /* Excel built on the server, laid out like the monthly machine planning summary */
            async function tonnageXlsx() {
                const b = $('tcsv'); b.disabled = true;
                try {
                    const headers = {};
                    const token = localStorage.getItem('token');
                    if (token) headers.Authorization = `Bearer ${token}`;
                    const u = JSON.parse(localStorage.getItem('user') || '{}');
                    if (u.username) headers['X-User-Name'] = u.username;
                    const qs = new URLSearchParams({ until: $('tuntil').value, eff: Number($('teff').value) || 100, basis: $('tbasis').value, factory: $('fac').textContent || '' });
                    const res = await fetch(`/api/order-tracker/tonnage.xlsx?${qs}`, { headers });
                    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'Download failed');
                    const blob = await res.blob();
                    const name = (res.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/);
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = name ? name[1] : 'Machine_Planning_Summary.xlsx';
                    document.body.appendChild(a); a.click(); a.remove();
                    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
                } catch (e) { alert(e.message || 'Download failed'); }
                finally { b.disabled = false; }
            }

            /* ====================================================== WIRING */
            function show(v) {
                $('v-orders').style.display = v === 'orders' ? '' : 'none';
                $('v-machines').style.display = v === 'machines' ? '' : 'none';
                $('v-detail').style.display = v === 'detail' ? '' : 'none';
                $('v-tonnage').style.display = v === 'tonnage' ? '' : 'none';
            }

            async function refresh() {
                try {
                    if (S.order) await openOrder(S.order, true);
                    else if (S.view === 'orders') await loadOrders();
                    else if (S.view === 'tonnage') await loadTonnage();
                    else await loadMachines();
                    stamp(true);
                } catch (e) { stamp(false); }
            }

            function setView(v) {
                S.view = v; S.order = null; S.detail = null;
                document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
                try { localStorage.setItem('ot_view', v); } catch (e) { /* private mode */ }
                history.replaceState(null, '', location.pathname + (v !== 'orders' ? '?view=' + v : ''));
                show(v);
                refresh();
            }

            document.addEventListener('DOMContentLoaded', () => {
                if (window.JPSMS && JPSMS.renderShell) JPSMS.renderShell();
                try { $('fac').textContent = localStorage.getItem('jpsms_factory_name') || 'All factories'; } catch (e) { $('fac').textContent = ''; }

                document.querySelectorAll('#seg button').forEach(b => b.onclick = () => setView(b.dataset.view));
                $('refresh').onclick = refresh;
                $('scope').onchange = refresh;
                $('sort').onchange = renderOrders;
                let t; $('q').oninput = () => { clearTimeout(t); t = setTimeout(refresh, 400); };
                $('mq').oninput = renderMachines;
                $('tuntil').onchange = refresh; $('tbasis').onchange = refresh; $('teff').onchange = refresh;
                $('tcsv').onclick = tonnageXlsx;
                document.addEventListener('click', e => {
                    const of = e.target.closest('[data-of]');
                    if (of) { S.ofilter = of.dataset.of; renderOrders(); return; }
                    const mf = e.target.closest('[data-mf]');
                    if (mf) { S.mfilter = mf.dataset.mf; renderMachines(); return; }
                    const k = e.target.closest('.kpi[data-f]');
                    if (k) { if (S.view === 'orders') { S.ofilter = k.dataset.f; renderOrders(); } else { S.mfilter = k.dataset.f; renderMachines(); } return; }
                    const o = e.target.closest('[data-order]');
                    if (o && o.dataset.order) openOrder(o.dataset.order);
                });
                document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.order) closeOrder(); });

                const p = new URLSearchParams(location.search);
                let v = p.get('view');
                if (!v) { try { v = localStorage.getItem('ot_view'); } catch (e) { /* ignore */ } }
                setView(['machines', 'tonnage'].includes(v) ? v : 'orders');
                if (p.get('order')) openOrder(p.get('order'));
                setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
            });
        })();
    </script>
</body>

</html>
