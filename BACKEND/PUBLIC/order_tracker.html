<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracker - JMS OCEAN</title>
    <link href="/assets/vendor/fonts/g-e34670640e.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/app.css?v=12">
    <script src="/assets/vendor/jsdelivr/chart.js"></script>
    <style>
        :root {
            --bg: #f5f7fb; --card: #fff; --line: #e4e9f0; --line2: #f0f3f7;
            --ink: #0f172a; --ink2: #334155; --mute: #64748b; --faint: #94a3b8;
            --blue: #2563eb; --blue-bg: #eef4ff; --blue-br: #c7d7fe;
            --green: #059669; --green-bg: #ecfdf5; --green-br: #a7f3d0;
            --amber: #d97706; --amber-bg: #fffbeb; --amber-br: #fde68a;
            --red: #dc2626; --red-bg: #fef2f2; --red-br: #fecaca;
            --grey-bg: #f1f5f9;
            --r: 14px;
        }
        .ot { padding: 20px 24px 48px; background: var(--bg); min-height: 100vh; color: var(--ink); font-variant-numeric: tabular-nums; font-size: 14px; }
        .ot * { box-sizing: border-box; }
        .muted { color: var(--mute); }
        .small { font-size: 12px; }
        .b { font-weight: 700; }
        .nowrap { white-space: nowrap; }

        /* ---------- header ---------- */
        .hd { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
        .hd h1 { font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 800; margin: 0; letter-spacing: -.4px; display: flex; align-items: center; gap: 10px; }
        .hd h1 .ic { width: 38px; height: 38px; border-radius: 11px; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 18px; }
        .hd .sub { color: var(--mute); font-size: 13px; margin-top: 4px; }
        .hd .tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .live { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--mute); }
        .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: ping 2s infinite; }
        .live.off i { background: var(--faint); animation: none; }
        @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(5,150,105,.45); } 80%, 100% { box-shadow: 0 0 0 8px rgba(5,150,105,0); } }
        .seg { display: inline-flex; background: #e8edf3; border-radius: 12px; padding: 4px; }
        .seg button { border: 0; background: none; padding: 8px 16px; border-radius: 9px; font-weight: 600; font-size: 13px; color: var(--mute); display: inline-flex; gap: 6px; align-items: center; }
        .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(15,23,42,.12); }
        .btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 13px; font-weight: 600; font-size: 13px; color: var(--ink); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
        .btn:hover { background: #f8fafc; }

        /* ---------- kpis ---------- */
        .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 18px; }
        .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; gap: 12px; align-items: center; cursor: default; }
        .kpi[data-f] { cursor: pointer; }
        .kpi[data-f]:hover { border-color: var(--blue-br); }
        .kpi .ic { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font-size: 18px; flex: none; }
        .kpi .v { font-size: 24px; font-weight: 800; line-height: 1.1; }
        .kpi .l { font-size: 12px; color: var(--mute); font-weight: 600; }
        .t-blue { background: var(--blue-bg); color: var(--blue); }
        .t-green { background: var(--green-bg); color: var(--green); }
        .t-amber { background: var(--amber-bg); color: var(--amber); }
        .t-red { background: var(--red-bg); color: var(--red); }
        .t-grey { background: var(--grey-bg); color: var(--ink2); }

        /* ---------- toolbar ---------- */
        .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
        .search { position: relative; flex: 1; min-width: 240px; max-width: 440px; }
        .search i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); }
        .search input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px 9px 34px; font-size: 14px; background: #fff; }
        .bar select { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 13px; background: #fff; font-weight: 600; }
        .chips { display: flex; gap: 6px; flex-wrap: wrap; }
        .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 600; color: var(--mute); cursor: pointer; }
        .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
        .chip .n { opacity: .7; margin-left: 4px; }

        /* ---------- shared bits ---------- */
        .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
        .pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .s-RUNNING { background: var(--blue-bg); color: var(--blue); border-color: var(--blue-br); }
        .s-COMPLETE { background: var(--green-bg); color: var(--green); border-color: var(--green-br); }
        .s-PAUSED, .s-PLANNED, .s-QUEUED, .s-IN_PROGRESS { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-br); }
        .s-NOT_STARTED, .s-NOT_PLANNED, .s-IDLE { background: var(--grey-bg); color: var(--ink2); border-color: var(--line); }
        .s-LATE { background: var(--red-bg); color: var(--red); border-color: var(--red-br); }
        .track { height: 8px; background: #e9eef5; border-radius: 99px; overflow: hidden; }
        .track > i { display: block; height: 100%; border-radius: 99px; background: var(--blue); transition: width .5s; }
        .track.g > i { background: var(--green); }
        .track.a > i { background: var(--amber); }
        .track.thin { height: 5px; }
        .mc { display: inline-block; background: var(--grey-bg); border: 1px solid var(--line); border-radius: 7px; padding: 2px 8px; font-size: 11px; font-weight: 700; color: var(--ink2); margin: 2px 4px 2px 0; white-space: nowrap; }
        .otc { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
        .empty { padding: 48px 20px; text-align: center; color: var(--mute); }
        .empty i { font-size: 30px; display: block; margin-bottom: 8px; color: var(--faint); }
        a.lnk { color: var(--blue); font-weight: 700; text-decoration: none; cursor: pointer; }
        a.lnk:hover { text-decoration: underline; }

        /* ---------- order list ---------- */
        .olist { display: flex; flex-direction: column; gap: 10px; }
        .orow { display: grid; grid-template-columns: minmax(200px, 1.1fr) minmax(260px, 1.6fr) minmax(210px, 1fr) 120px; gap: 18px; align-items: center; padding: 14px 18px; cursor: pointer; transition: border-color .15s, box-shadow .15s; border-left: 4px solid var(--line); }
        .orow:hover { border-color: var(--blue-br); box-shadow: 0 4px 14px rgba(15,23,42,.06); }
        .orow.RUNNING { border-left-color: var(--blue); }
        .orow.COMPLETE { border-left-color: var(--green); }
        .orow.PAUSED { border-left-color: var(--amber); }
        .orow.late { border-left-color: var(--red); }
        .orow .no { font-weight: 800; font-size: 15px; }
        .orow .prod { font-weight: 600; color: var(--ink2); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sets { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
        .sets .big { font-size: 16px; font-weight: 800; }
        .mbars { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px 10px; margin-top: 9px; }
        .mbar .nm { font-size: 11px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; justify-content: space-between; gap: 4px; }
        .mbar.neck .nm { color: var(--amber); font-weight: 700; }
        .dates { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .dates .l { font-size: 10px; text-transform: uppercase; letter-spacing: .4px; color: var(--faint); font-weight: 700; }
        .dates .v { font-weight: 700; font-size: 13px; margin-top: 2px; }
        .dates .v.late { color: var(--red); }
        .orow .right { text-align: right; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }

        /* ---------- order detail page ---------- */
        .crumb { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .dhero { display: grid; grid-template-columns: 260px 1fr; gap: 16px; margin-bottom: 16px; }
        .ringc { padding: 18px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .ringc svg { width: 160px; height: 160px; }
        .facts { padding: 18px 20px; }
        .facts h2 { margin: 0; font-size: 22px; font-weight: 800; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .fgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 18px; margin-top: 16px; }
        .fgrid .l { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--faint); font-weight: 700; }
        .fgrid .v { font-weight: 700; margin-top: 3px; }
        .note { display: flex; gap: 10px; align-items: flex-start; border-radius: 11px; padding: 10px 13px; font-size: 13px; margin-top: 12px; border: 1px solid; }
        .note.a { background: var(--amber-bg); border-color: var(--amber-br); color: #92400e; }
        .note.r { background: var(--red-bg); border-color: var(--red-br); color: #991b1b; }
        .note.i { background: var(--blue-bg); border-color: var(--blue-br); color: #1e3a8a; }
        .sec { margin-top: 22px; }
        .sech { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
        .sech h3 { margin: 0; font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }

        /* start plan */
        .seqn { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; background: var(--ink); color: #fff; }
        .seqn.done { background: var(--green); }
        .seqn.run { background: var(--blue); }
        .st { display: inline-flex; flex-direction: column; gap: 2px; }
        .st .t { font-weight: 800; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
        .st .d { font-size: 11px; color: var(--mute); }
        .st.good .t { color: var(--green); }
        .st.run .t { color: var(--blue); }
        .st.warn .t { color: var(--amber); }
        .st.bad .t { color: var(--red); }
        .st.grey .t { color: var(--mute); }
        .flow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line2); font-size: 12px; }
        .flow .stp { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px 4px 4px; font-weight: 700; background: #fff; }
        .flow .stp .seqn { width: 20px; height: 20px; font-size: 11px; }
        .flow .stp.bad { border-color: var(--red-br); background: var(--red-bg); }
        .flow .stp.warn { border-color: var(--amber-br); background: var(--amber-bg); }
        .flow .arr { color: var(--faint); }
        .gmust { position: absolute; top: 3px; width: 11px; height: 11px; margin-left: -5px; transform: rotate(45deg); background: #fff; border: 2px solid var(--red); border-radius: 2px; z-index: 1; }
        .vrow { grid-column: 1 / -1; margin-top: 6px; }
        .vrow:empty { display: none; }
        .nextl { grid-column: 1 / -1; margin-top: 8px; font-size: 12px; display: flex; gap: 6px; align-items: baseline; }
        .nextl.bad { color: var(--red); } .nextl.warn { color: var(--amber); } .nextl.good { color: var(--green); } .nextl.run, .nextl.grey { color: var(--mute); }

        /* gantt */
        .gantt { padding: 16px 18px 12px; }
        .grow { display: grid; grid-template-columns: 220px 1fr; gap: 14px; align-items: center; min-height: 34px; }
        .grow .gl { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .gtrack { position: relative; height: 22px; background: repeating-linear-gradient(90deg, transparent 0, transparent calc(var(--d) - 1px), var(--line2) calc(var(--d) - 1px), var(--line2) var(--d)); border-radius: 6px; }
        .gbar { position: absolute; top: 3px; height: 16px; border-radius: 5px; background: var(--blue); min-width: 4px; }
        .gbar.g { background: var(--green); }
        .gbar.f { background: repeating-linear-gradient(135deg, #bfdbfe 0 6px, #dbeafe 6px 12px); border: 1px dashed var(--blue); }
        .gbar.fa { background: repeating-linear-gradient(135deg, #fde68a 0 6px, #fef3c7 6px 12px); border: 1px dashed var(--amber); }
        .gline { position: absolute; top: -4px; bottom: -4px; width: 2px; }
        .gline.today { background: var(--ink); }
        .gline.target { background: var(--red); }
        .gaxis { display: grid; grid-template-columns: 220px 1fr; gap: 14px; margin-top: 6px; }
        .gaxis .ticks { position: relative; height: 16px; font-size: 10px; color: var(--faint); }
        .gaxis .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
        .glegend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11px; color: var(--mute); margin-top: 10px; }
        .glegend b { display: inline-block; width: 14px; height: 8px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }

        /* tables */
        .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
        .tbl th { background: #f8fafc; color: var(--mute); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
        .tbl td { padding: 12px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
        .tbl tr:last-child td { border-bottom: 0; }
        .tbl .r { text-align: right; }
        .tbl tr.neck td { background: #fffdf5; }
        .tbl tr.neck td:first-child { box-shadow: inset 3px 0 0 var(--amber); }
        .scroll { overflow-x: auto; }

        /* job cards */
        .jcs { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; }
        .jc { padding: 16px; }
        .jc .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
        .jc .no { font-weight: 800; }
        .jc .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; font-size: 12px; }
        .jc .meta .v { font-weight: 700; font-size: 13px; }
        .jcm { display: grid; grid-template-columns: 1fr 90px 110px; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line2); font-size: 12px; }
        .jcm .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }

        /* ---------- machine wise ---------- */
        .lineh { display: flex; align-items: center; gap: 10px; margin: 22px 0 10px; }
        .lineh h4 { margin: 0; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--ink2); }
        .lineh .cnt { font-size: 12px; color: var(--mute); }
        .lineh hr { flex: 1; border: 0; border-top: 1px solid var(--line); margin: 0; }
        .macs { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
        .mac { padding: 14px 16px; border-top: 4px solid var(--line); display: flex; flex-direction: column; }
        .mac.RUNNING { border-top-color: var(--blue); }
        .mac.QUEUED { border-top-color: var(--amber); }
        .mac .mh { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .mac .mn { font-weight: 800; font-size: 15px; }
        .job { margin-top: 12px; }
        .job .ord { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
        .job .mould { font-weight: 700; margin: 4px 0 8px; }
        .job .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; font-size: 11px; color: var(--mute); }
        .job .nums b { display: block; color: var(--ink); font-size: 13px; }
        .queue { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
        .queue .qh { font-size: 11px; font-weight: 800; color: var(--mute); letter-spacing: .4px; margin-bottom: 6px; }
        .queue .qi { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; font-size: 12px; padding: 4px 0; align-items: center; }
        .queue .qi .k { width: 18px; height: 18px; border-radius: 50%; background: var(--grey-bg); font-size: 10px; font-weight: 800; display: grid; place-items: center; color: var(--mute); }
        .mac .free { margin-top: auto; padding-top: 10px; font-size: 12px; color: var(--mute); }

        /* ---------- detail: hero band with the order journey ---------- */
        .hero { background: linear-gradient(135deg, #0b1b36 0%, #12305e 60%, #1d4ed8 140%); color: #fff; border-radius: 18px; padding: 22px 26px 14px; margin-bottom: 14px; box-shadow: 0 10px 30px rgba(15,23,42,.18); }
        .hero.late { background: linear-gradient(135deg, #2a0f14 0%, #5b1720 60%, #b91c1c 150%); }
        .hero.done { background: linear-gradient(135deg, #062a1f 0%, #0b4a35 60%, #059669 150%); }
        .htop { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
        .hno { font-size: 24px; font-weight: 800; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; letter-spacing: -.3px; }
        .hsub { color: rgba(255,255,255,.72); margin-top: 5px; }
        .hsets { min-width: 260px; text-align: right; }
        .hsets .big { font-size: 34px; font-weight: 800; line-height: 1; }
        .hsets .of { color: rgba(255,255,255,.7); font-weight: 600; }
        .hsets .small { color: rgba(255,255,255,.7); margin-top: 6px; }
        .hbar { height: 8px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; margin-top: 10px; }
        .hbar i { display: block; height: 100%; background: #fff; border-radius: 99px; }
        .hero .pill { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.25); }
        .journey { position: relative; height: 92px; margin: 18px 6px 0; }
        .jline { position: absolute; left: 0; right: 0; top: 46px; height: 2px; background: rgba(255,255,255,.22); }
        .jprog { position: absolute; top: 45px; height: 4px; background: #93c5fd; border-radius: 4px; }
        .jlate { position: absolute; top: 44px; height: 6px; background: repeating-linear-gradient(135deg, #f87171 0 5px, #fca5a5 5px 10px); border-radius: 4px; }
        .jm { position: absolute; top: 0; height: 92px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
        .jm .pin { position: absolute; top: 41px; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 3px solid #fff; }
        .jm .lab { position: absolute; white-space: nowrap; font-size: 12px; text-align: center; color: rgba(255,255,255,.85); line-height: 1.25; }
        .jm .lab b { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: rgba(255,255,255,.55); font-weight: 700; }
        .jm.up .lab { bottom: 58px; }
        /* near the ends, anchor the label inwards so it is never cut off */
        .jm.edgeL .lab { left: -6px; text-align: left; }
        .jm.edgeR .lab { right: -6px; text-align: right; }
        .jm.dn .lab { top: 58px; }
        .jm.plan .pin { background: transparent; border-color: rgba(255,255,255,.6); }
        .jm.act .pin { background: #60a5fa; border-color: #fff; }
        .jm.exp .pin { background: #0b1b36; border-color: #93c5fd; }
        .jm.late .pin { background: #fff; border-color: #f87171; }
        .jm.target .pin { background: #f87171; border-color: #fff; border-radius: 3px; transform: rotate(45deg); }
        .jm.today .pin { width: 4px; height: 26px; top: 34px; border-radius: 2px; border: 0; background: #fff; }
        .jm.today .lab, .jm.target .lab, .jm.exp .lab, .jm.late .lab { color: #fff; font-weight: 700; }

        .dtiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 4px; }
        .dtile { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
        .dtile .l { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--faint); font-weight: 800; }
        .dtile .v { font-size: 17px; font-weight: 800; margin-top: 4px; }
        .dtile .s { font-size: 11px; color: var(--mute); margin-top: 2px; }

        /* dates: actual = solid dot, expected = hollow dot, planned = plain */
        .dt { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; white-space: nowrap; }
        .dt i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
        .dt.act i { background: var(--ink); }
        .dt.exp { color: var(--blue); }
        .dt.exp i { border: 2px solid var(--blue); width: 9px; height: 9px; }
        .dt.plan { font-weight: 500; color: var(--ink2); }
        .must { color: var(--red); white-space: nowrap; }
        .var { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: 12px; white-space: nowrap; padding: 2px 8px; border-radius: 6px; }
        .var.late { color: var(--red); background: var(--red-bg); }
        .var.early { color: var(--green); background: var(--green-bg); }
        .var.ok { color: var(--green); }
        .dtile .var { font-size: 15px; padding: 0; background: none; }

        .dates-t td { padding: 10px 12px; white-space: nowrap; }
        .dates-t td.nm { white-space: normal; min-width: 240px; }
