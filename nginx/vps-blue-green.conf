# Enterprise VPS Nginx Configuration — JMS Enterprise
# Handles: API, WebSockets, static HTML pages, file uploads, sync endpoints.
# PM2 cluster runs N workers all listening on port 3000 via SO_REUSEPORT.

# map lets us set Connection: "upgrade" for WebSocket requests and "" for regular
# HTTP requests. The "" value is REQUIRED for Nginx upstream keepalive to work.
map $http_upgrade $connection_upgrade {
    default   upgrade;
    ''        "";
}

upstream jms_backend {
    # PM2 cluster (one worker per CPU core) all listen on port 3000.
    # least_conn is better than round-robin for long-lived sync/WebSocket connections.
    least_conn;
    server 127.0.0.1:3000;

    # Persistent connections to the Node workers — avoids TCP handshake per request.
    keepalive 32;
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name vps.jms-system.com;

    # SSL (Managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/vps.jms-system.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps.jms-system.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # GZip — compress text responses for faster delivery on mobile/WiFi.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json text/plain text/html text/css application/javascript;
    gzip_min_length 1024;
    gzip_static on; # Serve pre-compressed .gz files directly

    # --- Client body size ---
    # Allow up to 12 MB uploads (machine icons, operator photos, bulk imports).
    client_max_body_size 12m;

    # --- Common proxy headers (applied to all locations via include trick) ---
    # Forward real client IP so Express rate-limiter and logs see the right address.
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host            $host;

    # -----------------------------------------------------------------------
    # All traffic goes to the Node.js backend.
    # The app serves HTML pages, API routes, uploads, and WebSockets from
    # the same Express process — no separate frontend server needed.
    # -----------------------------------------------------------------------
    # ── General app traffic (HTML, API, uploads) ──────────────────────────
    # proxy_buffering ON (nginx default) — buffers the Node response and
    # delivers it efficiently to slow clients (mobile, factory WiFi).
    location / {
        proxy_pass         http://jms_backend;
        proxy_http_version 1.1;

        # WebSocket support (Scanner Bridge, real-time dashboard)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout    120s;
        proxy_send_timeout     60s;
        proxy_connect_timeout  10s;

        # Default proxy timeouts
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout  10s;

        # Enable buffering (industry standard default)
        proxy_buffering on;
    }

    # Sync-specific location block: proxy_buffering must be off for streaming
    location ~ ^/(api/sync|sync)/ {
        proxy_pass         http://jms_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
