# JMS Enterprise VERSION 1 — Hostinger "Compose from URL" (YAML only on disk).
#
# Needs public GHCR image from GitHub Actions. To skip Actions entirely: run
# scripts/make-vps-upload-bundle.ps1, upload dist/jms-v1-upload.zip to the VPS, unzip, then
# docker compose -f docker-compose.vps-v1-upload-only.yml up -d --build
#
# URL for hPanel → Compose from URL:
# https://raw.githubusercontent.com/malisanjay475/jms_enterprise/main/docker-compose.vps-v1-hostinger.yml
#
# Firewall: inbound TCP 9091 (or V1_HTTP_PORT). App: http://YOUR_VPS_IP:9091

services:
  db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-jms_v1}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-JmsV1DbAuto9x4k2m7n1q5w8r}
      POSTGRES_DB: ${DB_NAME:-jms_v1}
    # WAL archiving — archives a segment every 5 minutes at most.
    # Combined with the app's pg_dump backup service, this gives
    # a ≤5-minute recovery point (RPO) in the worst case.
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='cp %p /backups/wal/%f'
      -c archive_timeout=300
    volumes:
      - jms_v1_pg_data:/var/lib/postgresql/data
      - jms_v1_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [jms_v1_net]

  app:
    image: ${APP_IMAGE:-ghcr.io/malisanjay475/jms-v1-app:latest}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${V1_HTTP_PORT:-9091}:3000"
    volumes:
      - ./seed:/seed:ro
      # Persist uploaded files (machine icons, operator photos, etc.) across Docker deploys.
      # Without this volume, every deploy wipes PUBLIC/uploads/ and all icons are lost.
      - jms_v1_uploads:/app/PUBLIC/uploads
      # App-side pg_dump backups (every 5 min, kept for 4 hours)
      - jms_v1_backups:/app/backups
    environment:
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-jms_v1}
      DB_PASSWORD: ${DB_PASSWORD:-JmsV1DbAuto9x4k2m7n1q5w8r}
      DB_NAME: ${DB_NAME:-jms_v1}
      AUTO_IMPORT_DB_PATH: ${AUTO_IMPORT_DB_PATH:-}
      AUTO_IMPORT_DB_FORCE: ${AUTO_IMPORT_DB_FORCE:-0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # ERP (Joyo) API auth username used to mint the Bearer JWT. Set in the
      # VPS .env so it is not hardcoded in source; falls back to Sanjay.
      ERP_API_USERNAME: ${ERP_API_USERNAME:-Sanjay}
      APP_GIT_SHA: ${APP_GIT_SHA:-}
      SERVER_TYPE: ${SERVER_TYPE:-MAIN}
      MAIN_SERVER_URL: ${MAIN_SERVER_URL:-}
      LOCAL_FACTORY_ID: ${LOCAL_FACTORY_ID:-}
      SYNC_API_KEY: ${SYNC_API_KEY:-}
      LOCAL_SERVER_AGENT_ENABLED: ${LOCAL_SERVER_AGENT_ENABLED:-}
      LOCAL_SERVER_NODE_ID: ${LOCAL_SERVER_NODE_ID:-}
      LOCAL_SERVER_NODE_KEY: ${LOCAL_SERVER_NODE_KEY:-}
      LOCAL_SERVER_PUBLIC_IP: ${LOCAL_SERVER_PUBLIC_IP:-}
      LOCAL_SERVER_HEARTBEAT_INTERVAL_MS: ${LOCAL_SERVER_HEARTBEAT_INTERVAL_MS:-}
      NODE_ENV: production
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks: [jms_v1_net]

networks:
  jms_v1_net:

volumes:
  jms_v1_pg_data:
  jms_v1_uploads:
  # Shared backup volume — pg_dump files from app + WAL archives from db
  jms_v1_backups:
