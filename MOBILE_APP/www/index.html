<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>JMS Ocean</title>
  <style>
    :root {
      --ocean-night: #071b2a;
      --ocean-deep: #072450;
      --ocean-bright: #01a8dd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at top, #0d3868 0%, var(--ocean-deep) 100%);
      color: #ffffff;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: calc(24px + env(safe-area-inset-top));
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      text-align: center;
    }
    .brand-container { margin-bottom: 28px; }
    .logo-badge {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
    }
    .logo-badge span {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -1px;
      color: #ffffff;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    p.subtitle {
      font-size: 0.92rem;
      color: #a0c4e2;
      margin-bottom: 24px;
    }
    .status-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--ocean-bright);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.92rem;
      border: none;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #01a8dd, #0284c7);
      color: white;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
    }
    .server-select-box {
      margin-top: 16px;
      text-align: left;
    }
    .server-select-box label {
      font-size: 0.78rem;
      color: #a0c4e2;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: block;
    }
    .server-select-box input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.25);
      color: white;
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 8px;
    }
    .hint {
      margin-top: 12px;
      font-size: 0.75rem;
      color: #8eb4d4;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="brand-container">
    <div class="logo-badge">
      <span>JMS</span>
    </div>
    <h1>JMS OCEAN</h1>
    <p class="subtitle">Enterprise Production &amp; Planning Portal</p>
  </div>

  <div class="status-card">
    <div id="loaderArea">
      <div class="spinner"></div>
      <p id="statusMsg" style="font-size:0.9rem; font-weight:600;">Connecting to server…</p>
    </div>

    <div id="serverConfigArea" style="display:none; margin-top:14px;">
      <div class="server-select-box">
        <label>Server Environment</label>
        <input type="text" id="targetServerUrl" value="https://jmsocean.cloud/" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <button type="button" class="btn btn-primary" onclick="connectToServer()">Connect Now</button>
      <button type="button" class="btn btn-outline" onclick="setLocalFactory()">Use Local Factory IP (192.168.1.173)</button>
      <button type="button" class="btn btn-outline" onclick="useMainCloud()">Use MAIN Cloud</button>
      <p class="hint">Release builds load the cloud ERP directly (Capacitor bridge). Use this screen when <code>server.url</code> is unset, or call <code>JMS_NATIVE.setServerUrl(...)</code> from the signed-in app to switch LOCAL/MAIN.</p>
    </div>

    <button type="button" id="switchBtn" class="btn btn-outline" style="margin-top:16px; font-size:0.8rem; opacity:0.8;" onclick="toggleConfig()">
      Configure Server
    </button>
  </div>

  <script>
    const DEFAULT_SERVER = 'https://jmsocean.cloud/';
    const LOCAL_FACTORY = 'http://192.168.1.173:3001/';

    function getSavedServer() {
      try {
        return localStorage.getItem('jms_target_server') || DEFAULT_SERVER;
      } catch (e) {
        return DEFAULT_SERVER;
      }
    }

    function saveServer(url) {
      try {
        localStorage.setItem('jms_target_server', url);
      } catch (e) {}
    }

    function toggleConfig() {
      const area = document.getElementById('serverConfigArea');
      const btn = document.getElementById('switchBtn');
      if (area.style.display === 'none') {
        area.style.display = 'block';
        btn.textContent = 'Hide Configuration';
      } else {
        area.style.display = 'none';
        btn.textContent = 'Configure Server';
      }
    }

    function setLocalFactory() {
      document.getElementById('targetServerUrl').value = LOCAL_FACTORY;
      connectToServer();
    }

    function useMainCloud() {
      document.getElementById('targetServerUrl').value = DEFAULT_SERVER;
      connectToServer();
    }

    function connectToServer() {
      let url = document.getElementById('targetServerUrl').value.trim();
      if (!url) url = DEFAULT_SERVER;
      // Only real web addresses: a typed or saved "javascript:" URL would run as script.
      if (!/^https?:\/\//i.test(url)) {
        document.getElementById('statusMsg').textContent = 'Server address must start with http:// or https://';
        return;
      }
      if (!url.endsWith('/')) url += '/';
      saveServer(url);

      // Prefer the native SharedPreferences override so Capacitor reinjects the bridge
      // on the chosen host (window.location alone leaves the Capacitor origin).
      try {
        if (window.JmsOceanNative && typeof window.JmsOceanNative.setServerUrl === 'function') {
          document.getElementById('statusMsg').textContent = 'Switching native shell to ' + url + '…';
          window.JmsOceanNative.setServerUrl(url);
          return;
        }
      } catch (e) {}

      document.getElementById('statusMsg').textContent = 'Connecting to ' + url + '…';
      window.location.href = url;
    }

    const serverUrl = getSavedServer();
    document.getElementById('targetServerUrl').value = serverUrl;

    // When Capacitor loads with server.url, this page is not shown. It remains the
    // offline / no-server.url launcher and dual-server entry point for local builds.
    setTimeout(() => {
      if (document.getElementById('serverConfigArea').style.display === 'none' && /^https?:\/\//i.test(serverUrl)) {
        try {
          if (window.JmsOceanNative && typeof window.JmsOceanNative.setServerUrl === 'function') {
            window.JmsOceanNative.setServerUrl(serverUrl);
            return;
          }
        } catch (e) {}
        window.location.href = serverUrl;
      }
    }, 1200);
  </script>
</body>
</html>
